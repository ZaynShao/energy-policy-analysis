# ============= 资源估算(Tavily 配额,47min 后跑) =============
estimates:
  national_queries: 13     # 13 主题 × 1 query(国家级)
  province_queries: 403    # 13 主题 × 31 省 = 403,但 P2 主题×P2 省可压缩到 200
  city_queries: 80         # ~80 unique 重点地市,每市跨主题汇总 1 query
  candidate_promotion: 90  # 30 省候选发改委站点 × 3 主题 = 90 site:filter query
  total_tavily_calls: 583  # 实际可压到 ~400 通过 P0/P1/P2 阶梯
  total_firecrawl_calls: ~600  # 假设矩阵命中 ~600 篇候选
  estimated_runtime: 4-6h  # 全跑,与 5h limit 持平 — 必须分两批
