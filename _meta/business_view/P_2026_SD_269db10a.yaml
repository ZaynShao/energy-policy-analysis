影响分析:
  加油: 未直接涉及。政策聚焦电力市场体系建设与新型经营主体参与市场，未涉及油品零售、加油站网络或成品油市场机制改革。
  充电: 间接影响。政策明确除保障性用户外的电力用户全部直接参与电力市场，意味着新能源汽车充电负荷作为用户侧主体理论上具备入市条件；但政策正文未明确写出充电负荷作为市场主体的具体准入路径、参与方式或交易机制，仅以"除保障性用户外的电力用户"概括表述，充电运营商的市场化参与尚待具体细则落地。
  电力_储能_V2G_交易: 直接涉及。政策明确将分布式电源、新型储能、虚拟电厂等新型经营主体纳入市场交易，并部署健全现货市场、中长期市场、辅助服务市场、绿色电力市场、容量市场、零售市场等多层次市场体系，强调电能量、调节、环境、容量等多维价值全面由市场反映，为储能资源通过辅助服务市场、容量市场实现价值变现提供制度框架，为虚拟电厂参与系统调节提供市场通道。
行动建议:
- 趁早研究储能参与多层次电力市场的路径，结合辅助服务市场和容量市场机制设计，提前布局储能资源的商业化运营模式
- 趁早评估虚拟电厂参与电力市场的技术准备与合规条件，包括系统调节能力认证、交易系统接入等准入要求
- 趁早跟踪跨省跨区联合交易机制的落地进程，评估新能源参与省间交易对电力交易结构和价格的影响
- 趁早研究分布式电源入市对电源结构的影响，关注其与充电、储能等业务的协同机会
didi_impact_one_liner: 政策为储能、虚拟电厂、新型储能参与多层次电力市场打开制度空间，新能源及充电负荷入市路径初步明确，但充电侧具体参与机制待细则落地。
