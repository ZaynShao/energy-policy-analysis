影响分析:
  加油: 未直接涉及。该政策聚焦电力市场体系建设，虽提及能源市场概念，但正文未涉及加油、加油站、燃油或成品油相关业务，电力市场建设对传统加油业务无直接政策影响。
  充电: 直接涉及。《意见》明确各类型电源和除保障性用户外的电力用户全部直接参与电力市场，充电运营商有望直接参与电力批发购电，跨省跨区交易机制为充电基础设施跨区域购电提供便利；零售市场完善或为充电运营商提供更灵活的用电采购渠道。影响待配套政策落地后释放。
  电力_储能_V2G_交易: 多项直接涉及：(1) 新型储能、虚拟电厂明确纳入市场交易主体；(2) 辅助服务市场、容量市场健全为储能调节价值和容量价值变现提供渠道；(3)
    电力资源的电能量、调节、环境、容量等多维价值全面由市场反映，储能多元价值获得市场定价机制支撑；(4) 跨省跨区交易推进有助于储能资源全国优化配置。V2G和电力交易主体资格未在正文明确提及。
行动建议:
- 趁早研究充电业务参与电力批发市场的路径，评估作为用户侧主体直接购电的可行性和成本优势
- 趁早研究储能资产参与辅助服务市场和容量市场的准入条件、交易机制和收益模型
- 趁早研究虚拟电厂聚合商角色定位，提前储备负荷聚合和资源调度能力
- 趁早研究跨省跨区交易机制，评估充电和储能资源参与更大范围电力资源优化配置的商业机会
didi_impact_one_liner: 全国统一电力市场体系建设为充电和储能业务带来直接参与电力交易、多元价值变现的市场机遇，虚拟电厂定位获政策明确，V2G领域待后续政策跟进。
