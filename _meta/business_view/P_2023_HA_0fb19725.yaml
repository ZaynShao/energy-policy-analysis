影响分析:
  加油: 未直接涉及。购车补贴、汽车下乡属于消费刺激政策，不直接作用于加油业务；豫酒促销中的“购酒送加油卡”属商业促销行为，非政策直接规定。
  充电: 直接利好。明确对充电基础设施建设给予省级财政补贴——公交/环卫/通勤等公共服务领域及高速公路沿线充电设施补贴40%，其他公用充电设施补贴30%；明确2030年前对集中式充换电设施免收需量（容量）电费；鼓励出台新能源汽车停车优惠和充电期间停车费减免政策。
  电力_储能_V2G_交易: 未直接涉及。政策仅涉及充换电设施的电费成本减免（免收需量/容量电费），未涉及储能配置要求、V2G机制、电力交易或虚拟电厂等业务领域。
行动建议:
- 趁早把握充电基础设施补贴窗口期，优先在高速公路服务区及公交/环卫/通勤等公共服务领域布局投资
- 趁早研究高速公路沿线充电设施建设用地成本降低的申请路径，争取地方政策叠加支持
- 趁早对接省级财政补贴申报流程，提前准备主要充电设备投资相关材料
