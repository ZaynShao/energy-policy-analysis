影响分析:
  加油: 正文仅提化石能源清洁高效利用，未涉及加油站业务、汽柴油销售或传统燃料供应链调整，直接影响有限（间接：随能源结构优化和淘汰落后产能政策推进，高耗能油品炼化端或受传导影响）。
  充电: 明确部署'扩大绿电应用'和'发展新型储能'，虽未专述充电桩或充换电网络，但绿电应用扩大将为充电侧供电结构优化提供政策依据；结合新型储能装机目标，储充协同场景具备间接政策土壤。
  电力_储能_V2G_交易: '直接利好密集：

    1. 新型储能装机目标''超1.3亿千瓦''，新型电力系统构建明确提出，储能进入硬性建设阶段；

    2. ''进一步扩大碳排放权交易市场覆盖范围''，碳市场扩容路径清晰；

    3. ''设立国家低碳转型基金''，氢能/绿色燃料培育纳入国家资本支持；

    4. ''制定能源强国建设规划纲要''，顶层规划将系统重塑电力市场规则。V2G/虚拟电厂未在正文中出现，不构成直接依据。'
行动建议:
- A 趁早对接各省市新型储能项目申报通道，确保在1.3亿千瓦装机目标分解中占据项目份额；储能集成商趁早锁定上游设备供应链，提前布局并网调度能力
- B 趁早研究碳排放权交易市场扩容行业名单，梳理自身碳排放家底，为进入CCER/碳配额交易体系做好数据核算准备
- C 趁早与国家低碳转型基金建立联系渠道，跟踪氢能与绿色燃料赛道投资偏好，评估集团内部绿色低碳业务与该基金的嫁接空间
- D 趁早部署内部碳足迹管理体系，对接正文中'碳足迹管理体系'建设要求，为未来可能纳入碳市场的行业或产品线预备合规数据基础
didi_impact_one_liner: 能源转型与新型电力系统建设为集团储能和绿电业务打开确定性强赛道，1.3亿千瓦储能装机目标和碳市场扩容是核心政策红利，需趁早在项目申报和碳资产布局上抢位。
