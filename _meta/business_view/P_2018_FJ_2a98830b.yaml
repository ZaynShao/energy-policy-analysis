影响分析:
  加油: 未直接涉及。该政策聚焦电动汽车充电基础设施，未提及传统燃油加油站业务或油品供应。
  充电: 直接利好。（1）明确下达年度建设硬指标：公共充电桩3560个以上，年度投资5亿元；（2）覆盖范围广：城市公共充电网络（含交通枢纽、公共停车场、4A级景区、商业中心）、国省道沿线、公共服务场所配建停车场；（3）鼓励移动储能充电车运营示范，探索新模式；（4）建设省级充电设施公共服务平台，推动互联互通；（5）简化电网接入流程，产权分界点至电网配套工程不收费；（6）加大用地支持，独立占地的集中式充换电站纳入公用设施网点用地，优先安排用地指标。
  电力_储能_V2G_交易: 未直接涉及。虽提及移动储能充电车运营示范和电网配套保障，但未明确储能独立项目、V2G机制、电力交易或虚拟电厂等内容。
行动建议:
- A 趁早:在政策明确的公共服务场所、交通枢纽、景区、国省道沿线等优先区域，提前与地方政府或省电力公司对接充电桩建设项目资源
- A 趁早:深入研究移动储能充电车运营示范的商业模式，评估参与或跟进该试点的可行性
- B 研究:关注省级充电设施公共服务平台的互联互通标准要求，提前布局平台接入或数据共享合作
- B 研究:跟踪省财政厅2018年省级财政奖补政策及省物价局充换电服务分类指导价格的修订进展，争取政策资金支持
didi_impact_one_liner: 福建省级充电基础设施专项工程包落地，3560个公共充电桩硬指标+5亿元投资+移动储能示范+平台互联互通，为充电业务在闽布局提供明确政策窗口和配套保障。
