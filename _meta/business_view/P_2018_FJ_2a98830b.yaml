影响分析:
  加油: 未直接涉及。该政策聚焦电动汽车充电基础设施，与传统加油业务无直接关联。
  充电: 直接利好。政策明确2018年年度任务：投资5亿元、建设公共充电桩3560个以上，实施内容包括城市公共充电网络建设（交通枢纽、公共停车场、4A级景区等）、移动储能充电车运营示范、省级充电智能服务平台建设。配套保障涵盖财政奖补政策、充换电服务分类指导价格、电网配套保障、用地支持及建设标准规范修订，为充电运营企业提供了明确的政策支持和市场机遇。
  电力_储能_V2G_交易: 未直接涉及。政策提及"移动储能充电车运营示范"，但属于充电基础设施运营示范范畴，未涉及储能电站、V2G、双向充放电桩、虚拟电厂(VPP)或电力交易等机制。
行动建议:
- A 趁早:抢占公共充电桩建设市场，依托政策明确的城市公共充电网络布局（交通枢纽、停车场、景区等场景），参与3560个公共充电桩的建设和运营
- B 研究:跟踪省级充电设施公共服务平台建设进展，评估与平台数据互联互通对充电运营业务的影响及准入机会
- C 趁早:关注移动储能充电车运营示范动态，探索移动充电服务模式作为充电基础设施的补充
- D 趁早:对接财政奖补政策和电网配套保障，降低充电设施建设投资成本和接电门槛
- E 研究:跟踪《福建省城市规划管理技术规定》《福建省物业管理条例》等建设标准规范修订，提前布局配建充电设施要求
didi_impact_one_liner: 充电基础设施获政策直接支持，3560个公共充电桩年度建设任务明确，省级充电服务平台启动，充电运营企业应趁早布局公共充电网络建设
