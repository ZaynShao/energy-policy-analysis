影响分析:
  加油: 正文明确提出“积极推动高速公路服务区、加油站升级改造，发展‘服务区+’多场景平台生态”，直接要求加油站向综合服务转型，充电设施建设成为升级方向之一。
  充电: 正文多处直接涉及充电领域，包括“加快推动充换电老旧设施改造升级”、建筑领域“电动自行车及汽车充电设施”配套更新、交通领域“支持老旧新能源公交车及电池更新换代”，以及城镇老旧小区配电设施升级改造为充电设施提供条件，构成直接业务影响。
  电力_储能_V2G_交易: 正文涉及城镇老旧小区和城中村配电设施升级改造、农村电网巩固提升工程，虽未明确提及储能/V2G/电力交易机制，但配电设施改造升级为这些业务发展提供了基础条件支撑（间接）。
行动建议:
- A 趁早:对照加油站“升级改造”和“服务区+”要求，制定现有站点增设充电位的分阶段改造方案
- B 趁早:主动对接地方政府和电网部门，参与城镇老旧小区、城中村配电设施升级项目
- C 研究:老旧新能源公交车及电池更新换代政策，评估公交/客运充电服务合作机会
- D 趁早:利用政策窗口期，推动充电场站纳入老旧小区改造和新建小区配套设施
- E 研究:关注高速公路服务区升级中的充电基础设施建设资格申请
didi_impact_one_liner: 政策要求加油站向“服务区+”转型、加快充换电设施改造，多处明确充电基础设施更新升级目标，加油业务面临转型压力，充电业务迎来政策推动的设施改造和需求增长机遇。
