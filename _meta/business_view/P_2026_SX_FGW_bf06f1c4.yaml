影响分析:
  加油: 未直接涉及。正文规范对象为电煤、电力、天然气保供中长期合同，未涉及原油、成品油批发或炼厂装车价，也未涉及加油站商户合规与 KA 合作口径。间接观察（间接）：天然气与电煤纳入统一合同制度，只反映能源保供制度化的整体方向，不改变加油业务的任何在做的动作。
  充电: 未直接涉及。正文未出现充电设施、充电服务费、场站电价、超充标准等内容，建桩节奏、选址、服务费定价空间与电价结构均不受本文件约束。间接观察（间接）：电力保供合同制度完善可能间接影响场站侧电价与电力供应的稳定性预期，但正文未写充电相关机制，因此不构成直接业务影响。
  电力_储能_V2G_交易: 直接相关。文件自2026年12月1日起施行，把电力与电煤、天然气保供中长期合同纳入统一制度规范，明确了适用范围、保供责任、签约履约、监督管理等内容。这直接触及电力业务最看重的'火电长协的签约与履约规则'：中长期合同的签约义务、履约责任及监管要求由分散做法转为统一制度约束，因而改变持仓结构中的中长期与现货比例安排及偏差风险管理口径。储能、V2G、虚拟电厂、分布式新能源入市与聚合商准入在正文中未出现，本文件不构成对这些方向的直接影响。
行动建议:
- A 趁早：以2026年12月1日施行日为节点，梳理目标省电力中长期合同（含火电长协）的签约与履约台账，逐份核对保供责任、履约义务与监管报送要求，明确需要补齐的合同条款与内部流程。
- B 研究：调取《办法》全文，研究适用范围、保供责任划分、签约履约与监督管理的具体条款，评估其对中长期与现货比例、偏差与反向考核上限的约束，再决定是否调整目标省持仓结构。
- C 跟踪：指定专人跟踪山西等目标省发改委的落地细则与本省实施细则，判断'这个省进不进'及进入节奏，暂不据此启动正文未涉及的储能、V2G、聚合商类新业务。
didi_impact_one_liner: 能源保供中长期合同首次统一制度规范，直接收紧电力业务的电力和火电长协签约履约规则，是电力条线持仓结构的必跟项；加油与充电未直接涉及。
