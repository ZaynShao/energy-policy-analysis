- 'A 趁早: 研究将充电桩/充换电站接入省级智慧能源平台，布局参与需求响应市场的技术方案和商业模式'
- 'B 趁早: 对接省/冀北电力公司，提前介入需求响应市场建设，探索充换电站作为可调节负荷资源的运营路径'
- 'C 研究: 关注虚拟电厂培育政策动向，探索充电运营商向负荷聚合商转型的可行性'
- 'D 研究: 跟踪储能配置容量要求，明确充电基础设施项目配套储能的政策边界和建设时序'
