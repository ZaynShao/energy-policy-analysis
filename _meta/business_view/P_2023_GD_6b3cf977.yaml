影响分析:
  加油: 未直接涉及。该方案聚焦电力现货市场建设，建立“中长期+现货+辅助服务”体系，核心规范电能量市场交易机制与市场主体参与规则，不涉及成品油定价、加油站在电力市场中的角色或加油业务相关的市场准入、交易机制设计。
  充电: 未直接涉及。方案虽明确负荷聚合商可作为新型经营主体参与电力批发市场，但未专门提及充电桩、充换电设施或新能源汽车充电服务的具体市场规则、参与路径或交易机制。充电设施参与市场需依赖负荷聚合商间接实现，正文未明确该路径的具体安排。
  电力_储能_V2G_交易: 直接涉及。（1）储能作为新型经营主体明确纳入电力批发市场，与发电企业、电力用户、售电公司、负荷聚合商并列，需符合准入要求；（2）方案明确建立储能参与市场交易和容量补偿机制；（3）虚拟电厂与分布式发电、负荷聚合商同列为新型经营主体，纳入市场成员框架；（4）电力交易本身即为方案核心功能，建立现货电能量市场（中长期+日前+实时）形成节点边际电价机制；（5）辅助服务市场涵盖调频、备用等交易品种。V2G作为具体机制未在正文出现。
行动建议:
- 趁早对接准入要求：储能、虚拟电厂等新型经营主体应趁早研究广东省新型经营主体参与电力现货市场的准入条件和技术标准，确保满足市场参与资质。
- 趁早布局交易能力：储能投资方应趁早构建参与现货电能量市场（中长期+日前+实时）和辅助服务市场的报价策略与运营能力，提前布局容量补偿机制的申报准备。
- 趁早研究聚合路径：负荷聚合商应趁早研究聚合分布式资源（含充电桩、分布式光伏等）的技术方案与合规路径，为新型经营主体参与批发侧市场提供聚合服务。
- 趁早参与规则讨论：各业务单元应趁早参与零售市场规则制定，研究售电公司与电力用户之间的零售合同设计与市场份额限制对业务模式的影响。
didi_impact_one_liner: 电力现货市场方案将储能、虚拟电厂、负荷聚合商纳入市场主体，但未直接涉及加油和充电业务的具体机制安排。
