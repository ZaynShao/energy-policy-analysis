- B 研究绿电采购策略，探索充电站与绿证绿电市场的对接路径，提前锁定清洁能源供应成本
- C 关注'两重'建设中的能源基础设施项目配套机会，跟踪后续项目清单和申报要求
- D 研究新能源车高增长对油品需求的长期替代影响，评估加油站转型充电的可行性
