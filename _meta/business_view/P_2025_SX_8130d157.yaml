影响分析:
  加油: 设备更新政策（'两新'工作）可能推动加油站设备升级改造需求，3000亿元超长期特别国债支持设备更新，但政策未明确提及加油站具体改造要求或补贴，属于间接影响。新能源汽车销量增长35.5%显示能源消费结构变化趋势。
  充电: 新能源汽车销量达1287万辆、增长35.5%，直接扩大充电市场增量空间。'两新'政策支持设备更新，充电基础设施更新改造有望受益。绿证绿电市场建设推进为充电站采购绿电提供市场渠道，但未明确充电与绿电交易的直接联动机制。
  电力_储能_V2G_交易: 绿证绿电市场建设获政策明确推进，电力交易市场化改革持续深化。设备更新政策可能涉及电力行业相关设施。全文未直接出现储能、V2G、虚拟电厂(VPP)、聚合商或电力辅助服务等具体机制或量化指标，相关业务未直接涉及。
