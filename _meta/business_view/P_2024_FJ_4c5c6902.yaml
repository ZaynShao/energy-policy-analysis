影响分析:
  加油: 未直接涉及。该政策聚焦电力需求侧管理，针对电力用户、负荷聚合商、虚拟电厂运营商等主体设计响应机制，未涉及加油站或燃油销售业务。
  充电: 直接涉及。政策明确鼓励拥有充换电设施的电力用户主动参与需求响应，可直接或通过负荷聚合商/虚拟电厂运营商代理方式接入新型电力负荷管理系统参与日前/日内响应，充换电设施作为弹性负荷资源具备响应获利机会。
  电力_储能_V2G_交易: 直接涉及储能及虚拟电厂。政策将储能设施列为鼓励参与需求响应的负荷资源，虚拟电厂运营商作为明确的市场主体被纳入（需聚合资源≥2500千瓦、具备监测调控能力并接入负荷管理系统）。V2G作为充换电设施的一部分被提及但未设专项机制；电力交易方面未直接涉及。
行动建议:
- A 趁早对接电网企业：充电运营主体（含换电站）应趁早与属地电网企业沟通，确认接入新型电力负荷管理系统的技术要求和申报流程，在年度申报窗口期（每年5月底前）完成需求响应协议签订。
- A 趁早评估响应能力：拥有较大规模充电桩资产的运营商应趁早评估自身可调负荷容量，若聚合资源达到2500千瓦门槛，可考虑申请负荷聚合商或虚拟电厂运营商资质。
- B 研究聚合路径：储能资产规模未达独立参与门槛的企业可趁早研究通过负荷聚合商或虚拟电厂模式间接参与需求响应的商业路径和分成机制。
- B 关注V2G专项规则：鉴于政策仅将充换电设施整体列为鼓励对象且V2G未设专项机制，建议持续关注后续填谷响应及V2G相关专项规则的出台。
didi_impact_one_liner: 充电及储能业务获明确参与需求响应政策通道，聚合资源达2500千瓦可获负荷聚合商/虚拟电厂运营商准入资格；V2G被纳入鼓励范围但未设专项机制。
