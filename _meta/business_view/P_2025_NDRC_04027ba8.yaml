  加油: 未直接涉及。政策聚焦于设备更新和消费品以旧换新，虽提及汽车产销数据但核心是消费补贴激励，未涉及燃油消费、加油站运营或成品油监管等内容。
  充电: 直接涉及。政策显示1-2月充电桩产量同比增长32.2%，新能源汽车产量增长47.7%，受益于汽车以旧换新（107万辆）和数码产品补贴扩围政策，充电基础设施建设需求显著提升，充电设备制造企业订单预期向好。
  电力_储能_V2G_交易: 未直接涉及。政策重点在设备更新和消费品以旧换新的成效统计，虽间接反映新能源汽车和充电桩市场增长，但未明确涉及储能建设、虚拟电厂、V2G机制、电力交易或相关补贴政策。
