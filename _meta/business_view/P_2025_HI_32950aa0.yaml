影响分析:
  加油: 未直接涉及。本通知聚焦增量配电网配电价格机制、报送和结算规范，针对配电侧定价与结算，加油业务属于油气领域，不在政策调整范围内。
  充电: 未直接涉及。政策规范的是增量配电网配电价格定价方法和与省级电网结算机制，虽提及工商业用户电价构成（含系统运行费、线损费用等），但未直接针对充电桩建设、充电服务定价或新能源汽车专属电价机制。充电运营商作为工商业用户可能受配电价格变动间接影响，但政策本身未对充电业务做出专项安排。
  电力_储能_V2G_交易: 未直接涉及。政策针对增量配电网配电价格制定定价方法和结算规则，未直接涉及储能装置、V2G机制、虚拟电厂或电力交易平台。虽涉及两部制电价、系统运行费、线损费用等概念，但这些是对增量配电网与省级电网间结算的规范，不构成对储能/V2G/电力交易的具体业务影响或准入规定。
行动建议:
- A 趁早:关注增量配电网配电价格定价方法和结算规则，了解两部制电价（容量电价+电度电价）构成，为未来接入增量配电网区域开展充电业务或综合能源服务预判成本结构。
- B 研究:若业务布局涉及增量配电网供电区域，趁早研究分类结算电价与综合结算电价两种模式对工商业用户（含潜在充电运营商）的影响差异，评估配电成本传导机制。
- C 趁早:持续跟踪国家层面增量配电业务改革试点进展及后续省级电网输配电价核定动态，为业务决策预留政策窗口期。
didi_impact_one_liner: 政策聚焦增量配电网配电价格定价与结算机制，对加油、充电、电力储能/V2G/交易业务均未构成直接影响，但充电运营商作为工商业用户可能间接受配电价格调整影响，需关注成本传导。
