  加油: 未直接涉及。该文件为电力市场信息披露通用规则，加油业务不在其调整范围内。
  充电: 未直接涉及。文件针对电力市场整体信息披露机制，虽涉及市场经营主体，但未单独规定充电基础设施行业的信息披露要求。
  电力_储能_V2G_交易: 间接。本规则统一了全国电力市场信息披露机制，为储能、虚拟电厂、分布式能源等新型市场经营主体参与电力交易提供了信息公开的基础框架，有助于提升市场透明度，但具体信息披露细则需待各电力交易中心另行制定。
