影响分析:
  加油: 未直接涉及。正文仅就电力现货市场规则修订公开征求意见，未写入成品油批发价、炼厂装车价、商户合规成本或 KA 支付接口等任何内容，不改变加油业务现有决策变量。间接观察（仅作提示）：全国统一电力市场规则成形若压低工商企业用电成本，可能间接影响部分下沉城市商户的用能成本结构，但这一链条正文完全没有提到，因此不能作为决策依据。
  充电: 未直接涉及。正文没有提到充电设施、建桩选址、服务费定价、场站侧电价结构、大功率或超充等内容，也没有提到充电运营商参与现货市场。间接观察（仅作提示）：现货规则决定场站购电成本与峰谷价差的形成机制，但正文节选没有披露任何具体条款，因此不能据此判断充电场站的成本或收益变化。
  电力_储能_V2G_交易: 直接相关，但只涉及规则框架这一层面。正文明确写到：为推进全国统一电力市场建设、统一基础制度规则，对《电力现货市场基本规则（试行）》（发改能源规〔2023〕1217号）进行修订，形成公开征求意见稿，意见征集期为
    2026 年 10 月 19 日至 11 月 18 日。这直接落在电力业务的核心决策变量上，即目标省的现货规则与结算机制将随之上位规则统一。但节选正文只有公告文字，具体条款在附件
    doc 中，因此中长期与现货的比例、偏差、反向考核上限、售电公司利润上限与让利退还、火电长协签约履约规则、分布式新能源入市与聚合商门槛等具体数值是否改变，均需人工裁定；储能、V2G、虚拟电厂、双向充电桩等正文没有出现，因此判为未直接涉及。
行动建议:
- A 趁早：趁早在 11 月 18 日意见征集截止前，对附件《电力现货市场基本规则（公开征求意见稿）》逐条形成书面反馈，并按公告指定的网络渠道提交。建议重点围绕售电公司结算与让利、偏差考核、分布式新能源入市门槛等与公司持仓直接相关的条款提出具体意见。
- B 趁早：趁早组织对附件全文与 2023 年 1217 号试行规则的逐条差异比对，输出受影响的省份清单与持仓结构测算，作为各省‘是否进入、如何配置中长期与现货比例’的判断依据。目前公告正文没有披露任何具体条款，差异尚未可知，形式化结论须等待全文比对结果。
- C 研究：研究修订后统一规则对火电长协签约与履约、售电公司收益分成口径的潜在影响；因正文未涉及这些条款，这一研究仅作为预案，不作执行承诺。
- D 研究：研究现货价格形成机制变化对充电场站购电成本与峰谷价差的间接传导路径。正文没有涉及充电业务，因此只作观察项，不立项、不新增投入。
didi_impact_one_liner: 电力现货市场基本规则启动修订并公开征求意见，直接改变电力业务进入目标省份的上位规则与结算框架；但公告正文没有披露具体条款，实际影响幅度待全文比对裁定；加油、充电业务均未直接涉及。
