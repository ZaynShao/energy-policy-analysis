- A 趁早对接:趁早与北京市发展改革委对接充电设施建设任务清单，承接区域充电网络互联互通项目
- B 研究:深入研究天津市车网互动核心技术成果及智慧能源小镇示范经验，评估在京津冀区域复制推广的可行性
- B 跟踪:持续跟踪三地绿电交易机制动态，趁早锁定域外绿电基地消纳配额，参与区域绿电交易平台
- B 布局:趁早对接河北抽水蓄能项目前期工作，探索抽水蓄能参与区域电力调峰辅助服务市场
