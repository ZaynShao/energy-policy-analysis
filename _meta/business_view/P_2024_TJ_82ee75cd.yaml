  加油: 河北省制定《河北省车用综合能源站建设指导意见》，明确加快推进加氢、加油、加气、充电综合能源站布局建设，为传统加油站向综合能源补给站转型提供政策依据。
  充电: 北京市印发《北京市加快新能源汽车推广应用2024年工作任务清单》，明确加快充电设施建设；天津市建成津门湖新能源车综合服务中心作为示范；河北省推进充电纳入综合能源站布局，区域充电基础设施网络化建设获政策支撑。
  电力_储能_V2G_交易: 电力交易方面，三地绿电消纳与交易机制明确，北京绿电调入消纳、天津51.79亿千瓦时绿电交易合同已落地；储能方面，河北新增可再生能源并网装机430万千瓦，三地均有抽水蓄能项目推进；V2G方面，天津市攻克车网互动核心技术，区域车网互动技术应用具备试点基础。
