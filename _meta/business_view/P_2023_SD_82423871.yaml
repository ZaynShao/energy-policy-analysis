影响分析:
  加油: 未直接涉及。正文仅提及碳市场后续将在“十四五”期间扩容至石化等高耗能行业，但未明确加油/加油站相关业务。该扩容计划属于远期安排，不构成当前直接影响。
  充电: 未直接涉及。正文提及金融机构、做市商等参与碳市场可提高活跃度，但属泛指金融服务功能，未具体涉及充电桩、新能源汽车充电业务或相关基础设施。
  电力_储能_V2G_交易: 未直接涉及。正文聚焦碳排放配额（CEA）交易，提及仅2000多家火电厂参与碳市场、碳排放基准值收紧等，均为碳市场机制层面内容，未涉及储能、V2G、电力现货交易、虚拟电厂或双向充电桩等具体业务。
行动建议:
- 趁早研究碳市场扩容对高耗能业务的潜在影响，密切关注石化、化工等行业纳入时间表及相关合规要求。
- 趁早建立碳资产基础认知，在主营业务中前瞻性评估碳排放核算边界，为未来可能的碳履约义务做准备。
- 趁早对接碳金融领域专业机构，了解碳市场金融服务功能（如碳质押、碳资产管理）的应用场景。
- 趁早监测山东省碳排放基准值收紧趋势，跟踪火电行业配额收紧对电力供应侧的影响传导。
didi_impact_one_liner: 该政策聚焦碳市场配额收紧与扩容趋势，与三业务暂无直接关联，但须前瞻性关注高耗能行业纳入碳市场的远期影响。
