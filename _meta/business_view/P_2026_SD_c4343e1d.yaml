- A 趁早对接:密切跟踪山东省新能源就近消纳价格政策正式落地情况,主动对接地方能源主管部门,获取发改价格〔2025〕1192号文件原文及山东细则,评估对分布式新能源并网电价和就近消纳机制的影响
