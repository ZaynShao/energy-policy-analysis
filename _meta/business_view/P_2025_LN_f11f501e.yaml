影响分析:
  加油: 未直接涉及。该政策聚焦新能源（风电、太阳能发电）上网电价市场化改革，属电力批发侧机制，目标是建立新能源可持续发展的价格结算机制，不涉及成品油零售或加油业务运营。
  充电: 未直接涉及。该政策核心是新能源发电侧上网电价机制改革，未直接触及充电服务费、充电桩建设或运营、V2G等终端消费侧事项。间接观察：新能源全面入市和现货市场限价放宽或通过批发侧价格传导间接影响工商业用户电价（含充电运营商用电成本），但正文未写明具体传导路径和量化影响。
  电力_储能_V2G_交易: 未直接涉及。该政策明确针对风电和太阳能发电项目的上网电价市场化，建立差价结算的可持续发展价格结算机制，以煤电基准价为存量项目机制电价上限。正文仅将新能源发电项目列为市场主体，未出现储能、V2G、虚拟电厂、电力辅助服务或现货调频/调峰等具体机制，不构成直接业务影响。
行动建议:
- A 趁早研究差价结算机制对我省新能源项目的适配方案，梳理存量项目机制电价申报口径
- B 趁早对接省级价格主管部门和电力交易机构，提前锁定首批新机制电量规模和执行规则
- C 趁早与电力用户、售电公司开展多年期购电协议（PPA）预谈，锁定绿电价格和绿证收益
- D 研究现货市场限价调整后的报价策略，优化存量项目的报量报价组合
didi_impact_one_liner: 该政策将新能源上网电价全面推向市场，建立差价结算兜底机制，主要影响风电/光伏发电侧收益模式，对滴滴的充电能源采购成本和新能源聚合调度存在间接潜在影响。
