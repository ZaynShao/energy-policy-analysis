影响分析:
  加油: 未直接涉及。本实施意见聚焦于电动汽车充电基础设施建设，与传统燃油加油业务无直接关联。
  充电: 直接影响。政策明确提出多项充电业务推进措施：一是推进居住社区充电设施建设，既有社区配建公共充电车位、建立分时共享机制，新建居住社区固定车位100%建设或预留充电设施；二是提升公共充电网络，优先建设快充桩并逐步提高快充桩占比；三是加快县城、乡镇充电站/桩全覆盖；四是鼓励统建统营、临近车位共享、多车一桩等新商业模式；五是明确到'十四五'末满足超2000万辆电动汽车充电需求的目标。
  电力_储能_V2G_交易: 未直接涉及。政策虽提及'推动构建新型电力系统'和'提高绿电消费比例'，但未明确提及储能、V2G、电力交易、虚拟电厂(VPP)或聚合商等具体机制，也未涉及反向充电、双向充电桩等具体技术要求或建设目标。
行动建议:
- A 趁早布局:抓住新建居住社区100%配建充电设施政策窗口，与开发商/物业建立统建统营合作，锁定社区充电运营权
- B 趁早谋划:优先在县城、乡镇、高速公路服务区等政策明确覆盖区域选址建站，争取'县县全覆盖、乡乡全覆盖'的市场先机
- C 趁早转型:升级充电桩技术配置，提升快充桩占比，响应政策'逐步提高快充桩占比'的导向
- D 趁早试点:探索'临近车位共享''多车一桩'等创新模式，提升充电设施利用率和服务灵活性
didi_impact_one_liner: 充电基础设施获得国家层面强力推进，居住社区、高速公路、县乡区域充电桩建设提速，统建统营模式受鼓励，快充桩建设成重点方向。
