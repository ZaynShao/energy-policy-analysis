  充电: 未直接涉及。标题事项为2027年新能源增量项目的机制电价竞价，属发电侧电价形成机制，正文节选中未出现充电桩建设节奏、选址、服务费定价、场站侧电价结构、超充升级门槛或行业标准评级等内容，不能据此推断对充电业务的直接约束或机会。（间接观察：若后续全文明确机制电价与充电场站购电成本或绿电采购挂钩，才可能间接影响场站侧电价结构，此点目前无正文依据，仅作提示。）
