影响分析:
  加油: 未直接涉及。该政策聚焦电力市场交易规则，明确对象为发电企业（煤电、核电、背压式热电联产机组、新能源）、电力用户、电网企业和电力交易中心，未涉及成品油零售或加油业务。
  充电: 未直接涉及。政策围绕2026年电力市场中长期交易机制设计，虽包含绿电交易条款，但未提及充电桩、充换电设施或新能源汽车充放电业务。
  电力_储能_V2G_交易: 直接涉及电力市场交易整体框架：①虚拟电厂明确纳入交易上限管理（与集中式新能源并列，其年度/月度电量上限在可用发电能力基础上剔除机制电量执行）；②绿色电力交易规则明确（存量集中式新能源暂按比例纳入机制电量、增量项目竞价结果发布前不参与绿电交易）；③新能源超额结算机制（超出月度实际上网电量70%部分按差价回收，差额费用由全体用户按用电量比例分享）；④核电年度交易采用挂牌方式。V2G和储能业务未在正文中出现。
行动建议:
- 趁早研究虚拟电厂注册条件与交易方式：对照第三条款中虚拟电厂发电交易单元的年度/月度可用发电能力和机制电量剔除规则，提前测算交易上限，提前完成系统对接准备。
- 趁早研究绿电交易时序安排：第五条明确增量新能源项目竞价结果发布前不参与绿电交易，需关注竞价政策进展，合理安排2026年度绿电交易申报节奏。
- 趁早研究新能源超额回收风险对冲：第四条的70%月度上限和差价回收机制将直接影响新能源收益，需提前建立量价预测和风险对冲能力。
- 趁早关注背压式热电联产机组市场注册截止要求：第二条设定的年度交易组织完成前注册截止期限较早，相关企业须提前完成市场注册和交易方式选择。
