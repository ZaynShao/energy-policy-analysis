影响分析:
  加油: 未直接涉及。该文件聚焦于电力批发市场中长期交易规则，覆盖对象为发电企业（煤电、热电联产、新能源、核电）、电力用户和电网企业，不涉及油气销售业务。
  充电: 未直接涉及。虽然文件涉及新能源项目交易，但针对的是集中式和分布式新能源发电项目（光伏、风电）的上网交易，不涉及充电桩建设、运营或电动汽车充电服务。
  电力_储能_V2G_交易: 直接涉及有限，但有间接影响。虚拟电厂作为发电交易单元被纳入交易上限管理（第三条），需在其年度/月度可用发电能力基础上剔除机制电量计算交易上限。增量新能源项目竞价结果发布前暂不参与绿色电力交易（第五条），可能影响绿电交易时序。但文件未明确涉及储能调用、V2G双向互动或电力现货市场出清机制。
行动建议:
- A 趁早梳理虚拟电厂交易单元2024-2025年实际发电数据，结合可用发电能力×70%规则测算2026年度、月度交易上限，预留机制电量执行空间，避免交易申报超限。
- B 趁早对接广西电力交易中心，确认虚拟电厂作为发电交易单元的注册容量、调度厂站关联关系及机制电量核定口径，确保年度交易申报合规。
- C 趁早研究增量新能源项目竞价结果发布后的绿电交易接入时序，提前准备绿电交易资质材料及交易策略。
- D 研究:持续跟踪广西深化新能源上网电价市场化改革实施方案（桂能电力〔2025〕513号）的正式印发进展，关注机制电量比例、交易上限计算规则的后续调整。
didi_impact_one_liner: 虚拟电厂交易单元需适应70%交易上限及机制电量剔除规则，绿电交易须待增量新能源竞价结果发布后方可参与，建议趁早测算交易上限并对接注册信息。
