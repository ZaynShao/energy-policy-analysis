  电力_储能_V2G_交易: 直接涉及。政策明确推动新型储能多元化、产业化、市场化高质量发展，支持建设新型能源体系，组织新型储能试点示范项目申报，为储能项目提供政策支持与发展机遇。同一技术路线项目设区市级范围内原则上不超过1个，形成区域竞争格局。申报截止2023年7月13日，时间窗口明确。
