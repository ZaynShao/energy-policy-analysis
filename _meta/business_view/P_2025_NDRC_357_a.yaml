影响分析:
  加油: 未直接涉及。该政策聚焦虚拟电厂定义、发展目标、市场机制和主体培育，未涉及传统加油站或燃油业务。
  充电: 未直接涉及。政策明确虚拟电厂聚合对象为分布式电源、可调节负荷、储能等，充电桩负荷可作为可调节负荷被聚合，但政策未直接针对充电基础设施建设、运营或商业模式作出规定。
  电力_储能_V2G_交易: 直接涉及。政策核心即推进虚拟电厂发展，明确储能是虚拟电厂聚合的核心资源类型之一，虚拟电厂可作为新型经营主体参与电力市场交易，提供调峰、调频、备用等服务。政策设定2027年调节能力2000万千瓦、2030年5000万千瓦目标，为储能资源通过虚拟电厂参与电力市场提供机制保障。V2G虽未明确提及，但储能参与调频调峰服务的功能定位为V2G预留了政策空间。
行动建议:
- 趁早布局储能资源聚合：将自有储能资源纳入虚拟电厂聚合体系，对接省级主管部门建设运行管理办法，获取上线运行资质，参与电力市场和辅助服务交易。
- 趁早研究虚拟电厂参与路径：分析政策明确的调峰、调频、备用等服务品种，对照收益机制设计参与方案，探索虚拟电厂作为新型经营主体的市场准入条件。
- 趁早对接地方发展方案：关注各省级虚拟电厂发展方案出台动态，结合地方电力调节需求特点，在省级或地市级层面布局差异化虚拟电厂业务。
didi_impact_one_liner: 政策直接利好储能与虚拟电厂融合发展，明确储能作为聚合资源和虚拟电厂参与电力交易机制，需趁早布局储能聚合和参与路径。
