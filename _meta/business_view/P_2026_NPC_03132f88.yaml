summary: 《十五五规划纲要》是 2026-2030 年中国国家级 5 年战略大纲,共 18 篇。**纲要将"加快经济社会发展全面绿色转型 建设美丽中国"列为单独一篇(第十三篇)**,在第四十七章"积极稳妥推进和实现碳达峰"中给出能源转型路径。**与本届政府工作报告联动**:能源相关量化目标(非化石能源占比
  21.7% / 新型储能装机 1.3 亿千瓦 / 单位 GDP 碳强度累计降 17%)是十五五承诺的开局年指标。**纲要为新能源汽车、充电基建、新型储能、电力市场化、加油站综合能源转型五条业务线给出顶层政策授权**,后续各部委
  / 省市级实施细则陆续出台。
