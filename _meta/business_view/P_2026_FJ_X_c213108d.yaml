  充电: 直接涉及。福州市范围内直接面向社会提供电动汽车充电服务的贸易结算用充电桩（含交流充电桩和非车载充电机）须实施强制检定，新安装充电桩投入运营前须完成首次强制检定，合格后方可对外服务；在用充电桩应在检定周期（三年，免征费用）届满前主动申请周期检定；运营单位须通过福建省强检计量器具智慧监管系统（企业端）进行备案报检。未按规定检定仍对外营业的，将面临市场监管部门依法查处。
  电力_储能_V2G_交易: 未直接涉及
行动建议:
- 趁早梳理福州辖区内直接面向社会运营的充电桩资产清单，逐台核对是否属于强制检定范围，区分贸易结算用与内部非经营用，避免遗漏。
- 趁早通过福建省强检计量器具智慧监管系统（企业端）完成充电桩强制检定备案报检，确保新装桩首检合格后投运、在用桩在三年周期届满前申请周期检定。
- 趁早建立充电桩计量检定台账和到期提醒机制，将合规要求纳入运营SOP，避免因检定超期或拒不配合而被查处。
