  加油: 未直接涉及
  充电: 直接涉及。政策明确要求到2027年底建成205万个充电设施、1700万千瓦公共充电容量，满足400万辆电动汽车充电需求；新增47000个直流充电枪（含超2500个大功率充电枪）；高速公路服务区新建改建1100个60千瓦以上充电枪。首批车网互动规模化应用试点项目建设涉及城配物流、重卡环卫、出租网约、公交等电动车辆场景，将带动相关领域充电设施建设需求增长。
  电力_储能_V2G_交易: 直接涉及。政策明确要求到2027年底新增双向充放电（V2G）设施超750个，年度反向放电量超50万千瓦时，并要求完善充换电场站对电网放电的价格机制。结合四川电力市场化改革进程，探索兼顾多方利益的车网互动商业模式，涉及削峰填谷、聚合交易等应用场景。明确组织电网企业、虚拟电厂（负荷聚合商）开展省级、城市级车网互动应用场景实测，为相关主体参与电力辅助服务和需求响应创造条件。
