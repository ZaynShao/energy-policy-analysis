影响分析:
  加油: 未直接涉及。文件针对电动汽车充电设施建设，聚焦205万个充电设施、1700万千瓦公共充电容量目标，未涉及燃油补给或加油站业务调整。
  充电: 直接利好。明确2027年建成205万个充电设施、1700万千瓦公共充电容量，新增47000个直流充电枪（含2500个大功率充电枪）；新增V2G设施超750个、年度反向放电量超50万千瓦时；推动智能有序充电、双向充放电应用场景；要求蓉、绵、宜等城市打造大功率充电示范场景；要求高速公路服务区新建改建1100个60千瓦以上充电枪。
  电力_储能_V2G_交易: 直接涉及V2G和聚合商参与。明确要求组织电网企业、虚拟电厂（负荷聚合商）开展省级和城市级车网互动实测；探索V2G商业模式和完善放电价格机制；2027年目标新增V2G设施超750个、年度反向放电量超50万千瓦时；鼓励聚合交易、削峰填谷等应用场景。
