- 'B 趁早: 接入四川首批车网互动规模化应用试点，与电网企业、虚拟电厂聚合商建立V2G实测合作关系'
- 'C 研究: 跟踪四川V2G放电价格机制和车网互动商业模式探索进展，评估双向充放电设施投资回报模型'
- 'D 研究: 关注四川电力市场化改革进程中充电设施参与需求响应和聚合交易的规则演进'
