影响分析:
  加油: 直接相关且需当日跟价。正文改变了两个在用的价格参数:一是四川三个价区汽、柴油最高零售价随国家发改委同步下调;二是批发环节实行最高批发价格,零售企业可在不超过最高零售价、批发企业可在不超过最高批发价的前提下自主协商定价。公司利润来自批发折扣空间,因此需按新上限重算各价区批零价差:在零售挂牌价上限下移后,能够争取的折扣空间会被压薄,需判断哪些站点、哪些KA客户仍有毛利。第四条明确对符合资质的民营批发企业供应价按最高零售价扣减400元、差价不小于400元,这直接影响四川区域批发端竞争格局和我方供方议价参照。第五条明确2026年11月12日24时执行,存在调价窗口前后的库存跌价与抢单风险。第八条要求加强价格监管、严厉打击价格违法行为,促销与挂牌合规成本上升。
  充电: 未直接涉及。正文只讲汽柴油最高零售价、最高批发价和民营批发供应价,没有出现充电、建桩、服务费、场站电价等内容,不改变充电业务任何决策变量。间接观察(需谨慎):成品油零售价下调会小幅改变燃油车与电动车每公里成本的对比,但对私家车充电需求的传导很弱、方向不确定,不作为运营调整依据;也不涉及大功率、超充、选址或服务费定价。
  电力_储能_V2G_交易: 未直接涉及。正文未出现电力交易、现货、中长期、售电、储能、虚拟电厂、聚合商、V2G、双向充电等任何机制或表述,因此不能据此判断任何省份的市场准入或持仓结构变化。唯一可标注的间接点是:成品油价格与批发价由省级发改部门发文、并配套价格监测与异常情况上报机制,这与电力价格监管同属一个部门口径,但该文本身不改变电力业务的任何规则参数,仅作信息面记录。
行动建议:
- A 趁早:以11月12日24时执行时点为界,按新公布的三个价区最高零售价和最高批发价重算各站、各KA客户的批零价差与毛利底线,列出折扣空间被压薄、需要重新谈价的门店清单。
- B 趁早:按正文第三条核对与供方的配送条款,把“合同约定由供方配送”与“未约定配送费按现行规定”两种情形分别落到合同与结算口径上,避免调价窗口期配送费争议。
- C 趁早:依据第八条价格监管要求,排查四川在营站点的挂牌价、促销、优惠券与会员价表达,确认均在不超过最高零售价范围内且不构成价格违法行为。
- D 研究:跟踪四川三价区调价后,民营批发企业“最高零售价扣减400元、差价不小于400元”在实际成交中的执行情况,作为我方批发议价与区域竞争判断的参照。
didi_impact_one_liner: 四川成品油最高零售价与最高批发价同步下调并于11月12日24时执行,直接压薄加油业务批零价差与折扣空间,充电与电力业务未直接涉及。
