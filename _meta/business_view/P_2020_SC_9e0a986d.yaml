影响分析:
  加油: 未直接涉及。政策为四川省输配电价和销售电价调整通知，虽涉及工商业及其他用电类别电价，但正文未提加油业务或相关试点、补贴或市场准入安排。
  充电: 未直接涉及。充电桩用电归属工商业及其他用电范畴，政策仅规定一般性目录销售电价标准，未针对充电业务设置专项电价机制、补贴或运营准入条款。
  电力_储能_V2G_交易: 未直接涉及。第八条明确推进发电侧和销售侧市场化交易，但仅作原则性表述，正文未明确阐述储能、虚拟电厂、V2G或电力交易的具体准入规则、交易机制或运营义务；市场化交易条款为通用性框架，无专项针对性条款。
行动建议:
- A 趁早:梳理工商业及其他用电成本变化，监测目录销售电价表调整对业务运营成本的间接传导
- B 趁早:对接四川电网趸售用户，跟踪趸售电价调整后的代征代缴义务变化和丰枯峰谷浮动政策适用情况
- C 趁早:关注四川省2022年前实现同价地区的电价结构调整，提前评估对成本核算的影响范围
didi_impact_one_liner: 该政策为四川省2020-2022年输配电价和销售电价调整通知，系电网侧价格机制文件，对加油、充电、储能、V2G、电力交易等业务均未设置专项条款或直接规定，实际业务影响有限。
