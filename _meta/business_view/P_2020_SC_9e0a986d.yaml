影响分析:
  加油: 未直接涉及。该政策聚焦于四川电网输配电价和销售电价调整，供区范围界定，以及趸售电价改革，未涉及石油石化或成品油定价机制。
  充电: 未直接涉及。正文主要规范输配电价、目录销售电价和市场化交易电价框架，虽涉及工商业用电电价和峰谷浮动机制，但未对充电桩、充电服务费或电动汽车充电领域作出专门规定或价格调整。
  电力_储能_V2G_交易: 直接涉及输配电价改革和市场化交易推进。（1）取消存量电量、富余电量输配电价政策，藏区留存电量等按现行政策执行，改变了部分市场主体的输配电价适用规则；（2）趸售电价简化为单一制综合电价，取消峰谷浮动，明确工商业电量占比确定原则，重塑趸售结算关系；（3）明确市场化交易电价由用户或售电主体与发电企业自主协商确定，推进发电侧和销售侧市场化改革；（4）辅助服务费用纳入市场交易用户电价构成。储能、V2G、虚拟电厂未在正文中出现。
行动建议:
- A 趁早:梳理存量电量、富余电量交易合同条款，评估取消专用输配电价政策后对成本的影响，提前规划2020-2022年电量消纳策略
- B 趁早:对接入四川电网的趸售用户，重新核算工商业电量占比，适配新的单一制趸售电价标准，防范趸售结算风险
- C 研究:深度分析市场化交易电价自主协商机制对购电成本的影响，提前布局用户侧议价能力和交易策略
- D 研究:跟踪2022年底前同网同价推进进程，关注低价区阿坝州、凉山州、雅安市分步实施方案对区域用电成本的影响
didi_impact_one_liner: 四川电网新一轮输配电价周期取消富余电量专项政策、简化趸售电价为单一制，趸售用户需重新适配工商业电量占比并核算结算成本，同时市场化交易电价自主协商机制为用户侧购电策略调整创造空间。
