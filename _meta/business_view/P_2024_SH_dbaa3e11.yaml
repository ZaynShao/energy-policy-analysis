影响分析:
  加油: 政策明确加速淘汰国Ⅲ/国Ⅳ排放标准柴油货车，限行管控范围逐年扩大并配套财政补贴鼓励提前报废。计划累计更新或新增货车5万辆，年均更新约1.3万辆。政策直接推动货运领域新能源替代，长期将减少柴油消费需求，但短期更新周期内仍保持一定柴油消费规模。
  充电: 政策直接要求扩大新能源车辆更新规模，包括公交车年均1550辆、出租汽车年均2800辆、货车年均1.3万辆，并明确加快重货充换电站布局建设。电动船舶在苏州河、黄浦江流域推广应用，新增船舶配套充电设施需求增加。充电基础设施需求覆盖面从公交、出租扩展至重型货车领域。
  电力_储能_V2G_交易: 政策主要聚焦交通设备更新替换，未直接涉及储能设施建设、V2G机制、电力交易或虚拟电厂等新型电力系统建设内容。重货充换电站建设属于充电基础设施，不等同于储能站或电力交易平台。电动船舶补贴政策提及优先靠泊、靠泊费减免，属于交通领域激励措施，非电力市场机制。
行动建议:
- A 趁早与物流企业、重卡运营方对接重货充换电站选址需求，提前锁定优质站点资源。
- B 研究公交、出租电池批量替换带来的电池梯次利用机会，探索与电池维修保养体系的合作模式。
- B 研究氢燃料电池货运车辆推广对加氢站布局的影响，提前评估油气氢综合能源站转型可行性。
- B 趁早建立政策跟踪机制，关注各阶段限行实施节点对柴油车业务的冲击评估与客户结构调整预案。
- B 研究电动船舶在苏州河、黄浦江应用带来的岸电设施建设需求，探索内河码头供能合作机会。
didi_impact_one_liner: 政策驱动上海交通能源加速电动化，充电需求从公交、出租扩展至重卡领域，加油业务面临柴油货车加速淘汰的长期压力。
