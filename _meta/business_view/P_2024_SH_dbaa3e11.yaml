影响分析:
  加油: 政策明确推动公交车、出租汽车、货运车辆全面新能源化，加快淘汰国Ⅲ/国Ⅳ柴油货车。虽未直接限制加油站运营，但长期来看柴油货车替代将减少柴油消费市场；限行管控和补贴政策加速高排放车辆退出，对油品零售形成结构性收缩压力。
  充电: 政策直接驱动充电需求爆发：公交车年均更新1550辆、出租汽车年均更新2800辆、货车年均更新1.3万辆均全面新能源化，重货充换电站被明确要求布局建设，苏州河、黄浦江流域电动船舶应用将带来岸电充电需求。充换电基础设施成为政策落实的关键支撑环节。
  电力_储能_V2G_交易: 政策涉及公交电池维修保养（电池衰减超20%需更换，鼓励提前替换），但未涉及储能设施建设、V2G机制或电力交易机制。电动船舶充电属于岸电设施，未明确涉及储能或虚拟电厂。电池更新主要聚焦维修更换而非梯次利用或储能应用。
行动建议:
- 'A 趁早: 在重货充换电站选址和建设上抢占节点，与货车更新补贴政策联动，提前锁定高频补能需求场景'
- 'B 趁早: 评估现有加油站网点的转型可行性，在港口、机场、物流枢纽等货车聚集区域提前布局充换电混合站'
- 'C 研究: 跟踪公交电池大规模更新周期（年均500套），探索动力电池梯次利用或回收网络合作模式'
- 'D 研究: 关注洋山智能重卡试点扩大带来的充换电配套机会及氢燃料电池重卡示范的政策走向'
didi_impact_one_liner: 政策推动公交、出租、重货全面新能源化，充电补能基础设施成为刚需，重货充换电站是重点布局方向；柴油消费市场面临结构性收缩。
