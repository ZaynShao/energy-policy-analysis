影响分析:
  加油: 未直接涉及。通报的五起问题全部落在供电企业业扩报装、受电工程设计施工、接入方案评审等配电环节，与加油站关心的批发价/炼厂装车价、商户安全财税法合规成本、KA
    总部支付接口口径、下沉城市展业均无正文层面关联，不改变加油业务任何决策变量。
  充电: 间接相关（正文未提充电，以下为间接观察）。通报点名的“授意关联施工/设计企业提前介入用电报装”“违规办理低压免费接入”“关联企业以分包方式收取管理费”均发生在高压用户受电工程报装链条上；充电场站属典型高压报装用户，若监管持续收紧，建桩接电环节的关联方垄断与隐性收费空间收窄，对建桩周期与单站接电成本的稳定性偏正向，但正文未给出任何量化指标、时限或针对充电的具体要求，不改变选址节奏与服务费定价的决策变量。
  电力_储能_V2G_交易: 未直接涉及。正文未出现现货规则与结算机制、中长期与现货比例、偏差考核、售电公司利润上限与让利退还、火电长协签约履约、分布式新能源入市与聚合商准入，也未出现储能、V2G、虚拟电厂、双向充电等机制，均不改变电力业务的决策变量。仅有间接观察一处：第五起问题涉及“电源接入系统方案评审”与市场化设计业务“两块牌子、一套人马”，指向接入评审环节的公平性，可能间接影响分布式电源/自建配电资产的接入评审秩序，但通报未提出新规则、新准入或新义务。
行动建议:
- A 趁早:把“报装接电合规红线”写进充电场站建设 SOP——明确不得借助供电企业关联设计/施工企业提前介入申请受理、供电方案答复等环节获取便利，报装全流程留痕备查。
- B 趁早:对在建与待报装的充电场站（含高压报装超 160 千瓦项目）做一次接入方式自查，确认容量与供电方式匹配、未走不合规的低压免费接入，避免事后整改影响投运节奏。
- C 研究:跟踪本通报之后自然垄断环节监管与“竞争性环节市场化放开”的后续细则口径，评估对场站接电成本、工期与合作方选择的中期影响，暂不据此调整建桩节奏与定价假设。
- D 研究:就“电源接入系统方案评审与市场化设计业务分离”对分布式电源、自建配电资产接入评审流程的间接影响做小范围摸排，仅作观察项上报，不新增项目或商业模式。
didi_impact_one_liner: 国家能源局通报供电企业利用自然垄断优势在报装、设计施工、接入评审环节输送给关联企业的五起典型问题，直接指向业扩报装公平性；对加油与电力交易/储能/V2G
  未直接涉及，对充电仅为间接正向（建桩接电环节寻租空间收窄），不改变三业务现有决策变量。
