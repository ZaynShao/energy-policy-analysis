影响分析:
  加油: 未直接涉及。条例规范对象为全国碳排放权交易市场参与主体，加油站属于油品零售业务，不属于碳排放权交易市场的交易产品或重点排放单位范畴。油气行业若后续被纳入碳市场覆盖行业，加油业务可能面临上游成本传导的间接影响，但条例正文未明确油气零售行业纳入安排。
  充电: 未直接涉及。条例规范碳排放权交易及相关活动，充电基础设施/充电运营未在正文中出现。条例虽提及新能源行业发展有利于碳减排目标，但未规定充电业务须参与碳市场或承担碳排放义务，充电行业的市场准入、交易资格或合规要求均无直接依据。
  电力_储能_V2G_交易: 未直接涉及。条例明确碳排放权交易产品为碳排放配额和经国务院批准的其他现货交易产品，电力行业作为重点排放单位参与碳市场。储能、V2G、虚拟电厂、电力交易等新型业态及其聚合商机制未在条例正文中出现，虽可能因电力行业参与碳市场产生间接关联，但具体参与方式、权利义务或交易机制均无明确规定。
行动建议:
- 'A 趁早: 趁早梳理现有业务链碳排放边界，评估若油气行业纳入碳市场覆盖范围时对加油业务成本结构的潜在传导影响，做好供应链碳成本预判。'
- 'B 研究: 研究碳市场机制设计逻辑，为后续可能接入碳排放权交易市场或参与碳减排量交易储备政策理解和合规能力。'
didi_impact_one_liner: 条例建立全国碳排放权交易基础制度框架，三大主营业务暂无直接义务，但需关注碳市场覆盖行业范围扩展带来的成本传导风险和新兴碳金融机会。
