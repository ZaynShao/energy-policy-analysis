影响分析:
  加油: 未直接涉及。本规则聚焦可再生能源绿色电力证书的核发和交易机制，属于电力市场领域，不涉及燃油/油气业务。
  充电: 直接涉及。规则正文明确了绿色电力证书的核发和交易机制，覆盖全部可再生能源电量；用电侧通过购买绿证实现绿色电力消费，属于规则直接规范的对象，可参与绿证交易完成消费凭证获取。
  电力_储能_V2G_交易: 直接涉及。规则建立了可再生能源绿色电力证书从核发到交易的全链路规范，直接影响可再生能源发电企业的绿证资产化路径，同时明确交易主体、交易方式和证书管理要求，为电力企业参与绿证市场提供制度依据。
行动建议:
- A 趁早摸清本规则对绿证核发范围、交易主体的具体要求，梳理存量可再生能源项目对应的潜在绿证规模。
- B 研究绿证交易与现有电力交易、碳市场的衔接关系，评估绿证资产对电力业务组合的价值贡献。
- C 趁早建立内部绿证台账和交易流程，为后续参与绿证市场做好合规准备。
- D 关注各省级绿证交易平台建设进展及配套细则，及时对接属地化交易安排。
didi_impact_one_liner: 规则确立绿证核发和交易的全国统一框架，加油业务不受影响，充电业务可直接采购绿证完成绿色电力消费，电力业务可通过绿证实现可再生能源的环境价值变现。
