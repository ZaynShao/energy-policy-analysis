影响分析:
  加油: 未直接涉及。该政策聚焦新能源汽车与电网融合互动,不涉及传统燃油加油业务。
  充电: 直接涉及。政策明确要求加快布局超快充、双向充放电设施网络,推动充、储、配协同发展,全面推广智能有序充电,丰富车网互动应用场景,旨在培育车网融合互动新型产业生态。
  电力_储能_V2G_交易: 直接涉及。政策核心即为扩大双向充放电(V2G)项目规模,探索可复制推广的商业模式,以市场化机制引导车网互动规模化发展,支撑新型电力系统构建。具体涵盖:V2G设施网络建设、储能与电网协同、车网融合互动产业生态培育、新型能源体系构建。政策明确参考发改能源〔2023〕1721号和发改办能源〔2024〕718号等上位文件。V2G聚合商、车网互动资源参与电力市场交易属于政策直接覆盖范围。
行动建议:
- A 趁早:充电运营企业结合超充行动计划,提前布局双向充放电(V2G)桩体,抢占车网互动基础设施先机。
- B 趁早:V2G聚合商/虚拟电厂运营商趁早对接电网企业,参与规模化车网互动试点,锁定市场准入窗口。
- C 趁早:储能企业趁早切入充储配协同场景,与充电运营商、电网侧形成联动,探索盈利模式。
- D 研究:密切跟踪2025年目标分解指标及配套细则,研究V2G参与电力辅助服务市场的准入条件和结算机制。
didi_impact_one_liner: 政策直接利好充电基础设施双向化升级和V2G规模化应用,为聚合商、储能、虚拟电厂参与电网互动创造明确政策通道,需在2025年前完成关键布局。
