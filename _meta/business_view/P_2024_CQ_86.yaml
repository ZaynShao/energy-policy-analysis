影响分析:
  加油: 未直接涉及。该方案聚焦新能源汽车与电网融合互动，明确针对新能源汽车充放电基础设施和车网互动业务，不涉及传统加油业务。
  充电: 直接涉及。方案明确提出全面推广智能有序充电，扩大超快充、双向充放电设施网络规模，推动充、储、配协同发展，提及《重庆市新能源汽车便捷超充行动计划（2024—2025年）》，属于充电基础设施领域的直接政策指引。
  电力_储能_V2G_交易: 直接涉及。方案标题即明确'新能源汽车与电网融合互动'，正文明确使用'双向充放电（V2G）'术语，以V2G项目为主体探索商业模式，目标是'支撑新型能源体系和新型电力系统构建'，涉及储能与电力交易机制创新。
行动建议:
- A 趁早对接:紧跟政策窗口，梳理本地充电运营商或车企资源，优先布局智能有序充电和V2G双向充放电示范项目
- B 趁早储备:提前研究V2G项目的技术标准和商业模式，为参与车网互动规模化应用试点做好技术储备
- C 研究:密切跟踪政策全文正式发布后的实施细则、试点名额分配及补贴标准，明确参与路径和合规要求
didi_impact_one_liner: 方案明确推进V2G和智能充电基础设施，充电业务需趁早布局V2G示范和车网互动项目
