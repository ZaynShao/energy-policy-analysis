影响分析:
  加油: 未直接涉及
  充电: 未直接涉及。本政策聚焦独立储能参与电力系统调峰调频，虽独立储能与充电基础设施均属新型储能范畴，但政策未明确涉及充电桩、充换电站或新能源汽车充电业务的市场准入、补贴或运营机制。
  电力_储能_V2G_交易: 直接涉及多项核心机制。1)市场主体认定：独立储能正式纳入江西电力市场主体，可参与中长期市场、现货市场和辅助服务市场；2)成本疏导：独立储能充电电量免缴输配电价及政府性基金及附加，降低运营成本；3)调度保障：明确独立储能年调用充放电次数不低于350次，保障基本利用率；4)收益机制：按'谁服务谁获利，谁受益谁承担'原则获取辅助服务收益；5)示范机遇：省级独立储能示范项目清单为新项目布局提供通道。V2G和虚拟电厂未在正文中直接涉及。间接观察：政策强调'移峰填谷和顶峰发电'功能，长期或为充电负荷聚合参与电网调节提供参考框架，但需另行政策支持。
行动建议:
- 趁早:抓住省级独立储能示范项目清单窗口期，若具备条件，趁早申报纳入清单，获取市场先发优势和政策背书
- 趁早:趁早研究独立储能参与现货市场和辅助服务市场的交易规则与报价策略，储备电力市场运营能力
- 研究:深入分析'充电电量免输配电价'政策的适用边界和申报流程，评估对储能项目经济性的影响
- 研究:持续跟踪国家层面新型储能并网调度政策动态（国能发科技规〔2024〕26号），为后续业务拓展预留政策接口
didi_impact_one_liner: 政策为独立储能打开江西电力市场准入大门，明确调用频次和成本优惠，是布局储能业务的战略窗口期。
