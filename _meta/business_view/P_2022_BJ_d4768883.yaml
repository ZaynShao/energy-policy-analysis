影响分析:
  加油: 未直接涉及。该政策针对居民住宅小区内电动自行车充电设施收费规范，不涉及加油站或燃油业务。
  充电: 直接涉及。北京市发改委发布《关于规范本市居民住宅小区电动自行车充电设施收费标准等有关事项的通知》，要求充电设施经营单位向用户收取充电电费和充电服务费时分别计价、分别收取，不得打包混合收取；严格执行明码标价规定，不得收取任何未予标明的费用；同时将居民住宅小区内设置的电动自行车充电设施用电纳入居民用电范畴，降低接电电费成本，预计用户总花费降至原来的三分之一左右。该政策将规范电动自行车充电收费，提升居民使用公共充电设施的意愿。
  电力_储能_V2G_交易: 未直接涉及。该政策仅涉及电动自行车（两轮车）充电设施的电费计价规范和费用降低，未提及储能、虚拟电厂(VPP)、V2G、双向充电桩或电力交易机制。
行动建议:
- 趁早研究北京市电动自行车充电设施收费新规的执行细则，对照分项计价和明码标价要求，调整充电运营收费模式和产品定价结构；
- 趁早评估新规对电动自行车充电桩使用率的影响，把握居民小区充电收费降低带来的市场增长机会；
- 趁早排查现有充电设施收费公示情况，确保符合不得打包混合收取、不得收取未予标明费用的监管要求。
didi_impact_one_liner: 该政策针对电动自行车充电收费规范，电费和服务费须分项收取并明码标价，用户充电总花费预计降低约三分之二，将提升居民使用公共充电设施意愿，利好社区充电桩运营合规化。
