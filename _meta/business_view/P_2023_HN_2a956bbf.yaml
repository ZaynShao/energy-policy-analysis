影响分析:
  加油: 未直接涉及。该政策聚焦新型电力系统建设，涉及特高压输电、抽水蓄能、新型储能、可再生能源消纳和电力体制改革等内容，未涉及加油/加油站业务规划。
  充电: 未直接涉及。政策主要涉及电源侧调节能力和电力系统整体规划，虽提及新能源装机增长、新型储能发展和需求侧管理，但未明确部署充电基础设施或新能源汽车充换电网络建设。间接方面，可再生能源电力消纳比重超50%（全国第5）和电力系统调节能力提升，为充电业务绿色电力供应和成本优化提供了潜在基础条件。
  电力_储能_V2G_交易: 储能领域直接受益。湖南省新型储能并网规模达266万千瓦，占电力总装机比例5%，占比居全国第1；13个抽水蓄能项目纳入国家"十四五"重点实施计划，总装机1780万千瓦，居全国第二。政策明确将持续推进储能建设，电化学储能容量交易已创新开展，市场机制不断完善。V2G和虚拟电厂未直接涉及。政策虽提到形成最大负荷5%左右的需求侧响应能力和构建灵活智能系统，但未明确V2G机制、虚拟电厂具体建设方案或聚合商市场准入。电力交易方面已有容量交易创新，但未明确电力现货市场或绿电交易具体推进内容。
行动建议:
- 趁早研究储能容量交易机制：湖南已创新开展电化学储能容量交易，建议研究该交易模式的设计逻辑和参与路径，为后续参与储能商业模式创新积累经验。
- 趁早跟进抽蓄和新型储能项目机会：湖南省13个抽水蓄能项目和新型储能建设规模领先全国，建议跟进项目布局节奏，探索投资或合作机会。
- 趁早布局需求侧响应资源：湖南最大峰谷差率多年居全国第1，政策强调供需协同和灵活智能，建议整合充电负荷等需求侧资源，为参与电力调节市场做准备。
didi_impact_one_liner: 湖南新型电力系统规划储能领先全国，充电业务可借力绿色电力供应优化和系统调节能力提升拓展市场，但V2G和虚拟电厂领域尚无明确政策机会，需持续跟踪需求侧响应机制落地情况。
