影响分析:
  加油: 正向影响。政策明确支持在加油站以及具备停车条件的可利用场地建设以快充为主的公用充电设施和专用换电设施，并鼓励在城市新区、开发区和国省干道等探索建设集油、气、电、氢等多种能源供给于一体的综合能源服务站，为加油站向综合能源站转型提供了政策依据和发展方向。
  充电: 直接利好。政策对新建居住区要求100%建设充电设施或预留安装条件，对新建公共建筑要求按不低于35%配建充电基础设施，并要求与主体工程同步规划、设计、施工、验收。同时明确推进旧区改造、停车位改建中建设充换电基础设施，支持统建统营、临近车位共享、多车一桩等新模式，为充电运营企业提供了大规模增量市场和存量改造机会。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦充换电基础设施的布局规划和建设运营管理，未涉及储能装置、V2G机制、电力交易或虚拟电厂等电力系统调节内容。支持开展智能有序充电试点属于充电管理范畴，不等同于电力交易或需求响应机制。
行动建议:
- A 趁早:研究省级及所在市县充换电基础设施规划编制动态，主动对接地方政府，争取纳入新建居住区和公共建筑充电设施建设市场
- B 趁早:对接省市发展改革委（能源局），摸排综合能源服务站试点机会，提前储备加油站转型方案
- C 趁早:关注居住社区统建统营政策导向，尽早布局充电设施建设运营服务能力
- D 研究:跟踪国家充电基础设施标准体系建设进展，确保充电服务运营符合统一标准要求
didi_impact_one_liner: 省级充电基础设施管理办法为新建住宅和公建强制配建充电桩、综合能源站探索提供明确政策支撑，加油业务迎来向综合能源站转型的窗口期，充电运营业务迎来大规模增量市场机遇。
