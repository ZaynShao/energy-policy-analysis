影响分析:
  加油: 未直接涉及。该通知聚焦于新型储能项目的容量补偿资金发放，加油业务不在政策覆盖范围内。
  充电: 未直接涉及。该通知针对新型储能容量补偿，未直接涉及充电桩、充换电基础设施或新能源汽车充电服务。
  电力_储能_V2G_交易: 直接涉及。文件明确针对新型储能容量补偿资金发放：(1)清单内项目可获容量补偿费用，以按月足额抵扣应缴电费形式发放，直至补偿完毕；(2)需满足后续2年年利用小时数不低于600小时的达标要求，经设区市初审、部门复核后方可继续领取补偿；(3)省电力公司负责资金拨付，部门联合监管。注：正文未提及V2G、电力交易或虚拟电厂机制。
行动建议:
- A 趁早核对项目清单:确认储能项目是否已列入容量补偿清单，如在列则及时对接省电力公司落实资金抵扣电费事宜。
- B 趁早建立运行台账:按600小时/年利用小时数要求建立储能设施运行监测台账，确保后续2年审核可顺利通过。
- C 研究政策衔接:趁早研究容量补偿与现行储能商业模式（如峰谷套利、辅助服务）的协同空间，优化储能收益结构。
- D 关注申报动态:关注后续年度新项目申报窗口，提前准备申报材料以争取纳入补偿范围。
didi_impact_one_liner: 浙江新型储能项目可获容量补偿资金抵扣电费，但需年利用小时数达标方可续领。
