影响分析:
  加油: 未直接涉及。该文件聚焦电动汽车充电基础设施建设，未涉及传统加油业务或加油站转型、综合能源站等内容。
  充电: 直接受益。（1）高速公路服务区充电基础设施须实现全覆盖，带来公共场站建设机会；（2）海口、三亚、儋州、琼海各须优选不少于5个示范小区推进‘充电桩进小区’，打开居住区充电市场；（3）政府机关及事业单位须超前建设并鼓励向社会开放，增加可用公共桩源；（4）须接入省级平台方可获财政补贴，平台接入率目标为2020年底超90%；（5）企业须减少故障桩、消灭‘僵尸桩’，对运维质量提出明确要求。
  电力_储能_V2G_交易: 未直接涉及。正文提到换电站建设及省级平台监管，但未明确涉及储能系统、V2G机制、电力交易或虚拟电厂等业务。
行动建议:
- A 趁早:对接省级充电基础设施信息管理平台，满足2020年底前接入率超90%的要求，确保补贴申领资格
- B 趁早:申报参与海口、三亚、儋州、琼海的‘充电桩进小区’示范项目，提前布局居住区充电运营
- C 趁早:对接高速服务区充电桩建设需求，争取高速公路公共场站建设或托管运营机会
- D 趁早:优化充电桩运维体系，响应政府‘减少故障桩、消灭僵尸桩’要求，提升场站可用率
- E 研究:关注平台数据接入后的监管规则变化，提前适应政府实时监测和APP信息公示要求
- F 研究:跟踪换电站纳入平台监管的后续政策，评估对充换电整体布局的影响
didi_impact_one_liner: 海南充电基础设施政策为充电运营商带来高速场站建设、居住区示范项目及政府单位开放充电三重增量机会，但须以接入省级平台为前提获取补贴资格
