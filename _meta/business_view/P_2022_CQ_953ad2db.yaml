影响分析:
  加油: 未直接涉及。本通知执行范围为10千伏及以上且受电变压器容量100KVA及以上的大工业用户及普非工业用户动力用电，加油站不在明确界定范围内。
  充电: 未直接涉及。正文仅明确大工业用户及普非工业用户动力用电的分时电价，未专门提及充电桩、电动汽车充换电设施或新能源汽车充电场景的分时电价安排。但分时电价时段划分（低谷00:00-08:00、高峰11:00-17:00/20:00-22:00）及4.2:1的峰谷价差，对充电运营商的定价策略和用户引导存在间接影响。
  电力_储能_V2G_交易: 直接涉及储能。本通知明确"鼓励用户通过配置储能、开展综合能源利用等方式降低高峰时段用电负荷、增加低谷用电量"，政策导向支持储能配置。4.2:1的峰谷价差（高峰上浮60%、低谷下浮62%）及尖峰电价机制为储能套利提供明确价格信号。V2G、电力交易未在正文中出现。
行动建议:
- A 趁早研判储能峰谷套利空间，基于4.2:1价差和尖峰时段（12:00-14:00）设计充放电策略
- B 研究低谷时段（00:00-08:00）充电成本优势，向用户推广低谷充电引导方案
- C 趁早建立储能资产运营能力，为用户提供"储能+分时电价"综合能源解决方案
- D 监测分时电价动态调整机制，跟踪每季度执行情况报告中的负荷曲线变化
didi_impact_one_liner: 分时电价4.2:1峰谷价差和低谷62%下浮直接利好储能峰谷套利，充电运营商可借低谷时段降本，但加油和V2G/电力交易未涉及。
