影响分析:
  加油: 未直接涉及。加油站用电属于一般工商业用电，不在本通知明确的执行范围内（执行范围为10千伏及以上、100KVA及以上的大工业用户和普非工业用户动力用电）。
  充电: 直接涉及。若充电运营场站受电变压器容量达100KVA及以上且为10千伏及以上供电，将纳入分时电价执行范围，面临显著的分时电价成本结构变化：(1)高峰时段(11:00-17:00、20:00-22:00)电费上浮60%，尖峰时段(夏冬部分月份12:00-14:00)再上浮20%；(2)低谷时段(00:00-08:00)电费下浮62%；(3)需签订分时段带价中长期交易合同，峰谷价差不低于4.2:1。
  电力_储能_V2G_交易: 部分涉及。储能方面，政策明确鼓励用户配置储能开展综合能源利用以降低高峰负荷、增加低谷用电量，峰谷价差扩大(4.2:1)理论上改善储能峰谷套利经济性，但正文未明确储能建设的直接支持政策或市场准入。V2G未直接提及。电力交易方面，参与市场交易的发、售、用电企业须签订分时段、带量带价的中长期交易合同，明确峰谷电价价差不低于4.2:1，对电力中长期交易提出明确的分时交易要求。
行动建议:
- A 趁早:摸排存量充电场站的用电性质和变压器容量，评估是否纳入分时电价执行范围及成本影响。
- B 趁早:调整充电场站运营策略，利用低谷时段(00:00-08:00)电费下浮62%的优势，引导用户夜间充电。
- C 趁早:研究峰谷套利储能项目的经济性测算，利用扩大的峰谷价差评估储能配置的商业可行性。
- D 趁早:梳理大工业用电客户资源，为其提供分时电价下的用能优化和储能配置综合能源服务方案。
- E 趁早:参与电力中长期交易时，按要求签订分时段带价合同，满足峰谷价差不低于4.2:1的合规要求。
didi_impact_one_liner: 分时电价扩峰谷价差至4.2:1，充电运营面临显著成本波动，储能套利空间改善，电力交易须签分时段合同。
