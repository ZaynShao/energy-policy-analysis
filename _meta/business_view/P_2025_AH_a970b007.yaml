影响分析:
  加油: 未直接涉及。政策针对的是充电场站电费收取问题，与加油站业务无关联。
  充电: 直接相关。政策明确到2030年前对实行两部制电价的集中式充换电设施免收需量（容量）电费，充电场站属于核心适用对象，直接降低充电运营成本。
  电力_储能_V2G_交易: 间接相关（谨慎评估）。场站配套储能后变压器计费方式存在不确定性——若储能装置导致变压器不再纯粹服务充换电功能，可能影响免收政策的适用，存在政策边界争议风险。
行动建议:
- A 趁早摸清家底：排查现有光储充场站的变压器用途构成，明确储能装置用电与充换电设施用电的变压器容量分配比例，评估是否满足纯充换电设施的认定条件。
- B 趁早沟通确认：主动联系当地价格主管部门或电网企业，就光储充一体场站的变压器基本电费政策适用问题获取书面确认，避免政策执行歧义。
- C 研究备案管理：关注发改综合〔2023〕545号文的具体执行细则和地方配套政策，防范未来政策收紧时储能装置占比扩大导致场站失去免收资格。
- D 研究成本测算：将储能设施与充换电设施变压器分离配置的可行性纳入投资测算，分析通过分立变压器申请基本电费减免的合规路径。
didi_impact_one_liner: 充电场站享基本电费免征至2030年的政策明确，但光储一体场站因储能装置配套存在政策边界模糊风险，建议趁早与主管部门和电网确认变压器计费适用性。
