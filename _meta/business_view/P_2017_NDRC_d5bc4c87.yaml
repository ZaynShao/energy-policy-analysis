影响分析:
  加油: 未直接涉及。政策聚焦风电、光伏发电企业的绿证核发与自愿认购，核心是完善可再生能源补贴机制，加油业务无关联。
  充电: 未直接涉及。政策明确绿证核发对象为陆上风电、光伏发电企业（不含分布式光伏），虽提到个人和机构可自愿认购绿证作为消费绿色电力证明，但未涉及充电服务、充电运营商或充电网络。谨慎补充：绿证制度为未来充电运营商采购绿色电力提供凭证支持的可能性存在（间接）。
  电力_储能_V2G_交易: 未直接涉及。绿证是发电量确认和消费凭证，不属于电力现货、期货或辅助服务市场交易机制；政策未涉及储能、虚拟电厂(VPP)、V2G或双向充放电等机制；明确2018年起才“适时启动”强制约束交易，当前仅自愿认购阶段。
行动建议:
- A 趁早:跟踪绿证制度与未来可再生能源电力配额考核的衔接机制，为采购绿色电力凭证做好业务准备。
- B 研究:关注分布式光伏绿证豁免范围后续是否调整，提前布局分布式光储项目的合规路径。
- C 研究:搜集绿证认购平台运营规则，评估向终端用户销售附带绿证的电力的商业可行性。
didi_impact_one_liner: 政策建立绿证制度旨在完善风电光伏补贴机制，对加油、充电、电力交易业务未直接涉及，但需关注绿证制度对电力消费凭证体系的长期布局影响。
