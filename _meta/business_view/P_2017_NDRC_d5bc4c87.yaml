影响分析:
  加油: 未直接涉及。该政策针对可再生能源发电（陆上风电、光伏发电）的绿色电力证书核发与认购，石油或加油站业务不在政策规范范围内。
  充电: 未直接涉及。该政策明确核发对象为陆上风电、光伏发电企业，分布式光伏发电暂不纳入，且政策未提及充电基础设施或新能源汽车充电领域。间接观察：充电运营企业理论上可通过认购绿证作为消费绿色电力的证明，但属自愿行为而非强制约束。
  电力_储能_V2G_交易: 未直接涉及。该政策建立的是风电、光伏发电企业绿色电力证书的核发与认购机制，虽涉及电力交易制度，但政策未明确提及储能、虚拟电厂、V2G或双向充电桩等机制，政策中的"可再生能源电力配额考核和绿色电力证书强制约束交易"将于2018年起适时启动，具体范围仍待明确。
行动建议:
- A 趁早研究:关注2018年适时启动的可再生能源电力配额考核和绿色电力证书强制约束交易的政策细化，明确配额考核对象和强制约束范围，判断是否涉及自身业务。
- B 趁早关注:跟踪全国绿色电力证书核发和认购平台的建设进展及认购规则完善情况，为未来可能的绿证交易需求做好准备。
- C 研究:密切跟进分布式光伏发电何时纳入绿色电力证书核发范围的政策调整，因其与充电场站分布式光伏自发自用场景存在潜在关联。
didi_impact_one_liner: 政策核心规范风电光伏绿证核发与自愿认购，三大能源业务均未直接涉及，需关注2018年配额考核与强制约束交易的政策细化方向。
