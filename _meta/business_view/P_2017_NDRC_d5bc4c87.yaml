影响分析:
  加油: 未直接涉及。该政策聚焦于陆上风电和光伏发电企业的绿色电力证书核发与认购机制，是发电侧的可再生能源补贴机制创新，不涉及加油站或成品油业务。
  充电: 未直接涉及。绿证制度针对风电、光伏发电企业的发电量认证，充电业务（充电桩/充电站运营）不在核发对象范围内。个人或机构可自愿认购绿证作为消费绿色电力的证明，但此自愿认购机制对充电运营业务模式无直接约束或机会创设。
  电力_储能_V2G_交易: 未直接涉及。该政策明确核发对象为陆上风电、光伏发电企业（不含分布式光伏），绿证是风电/光伏上网电量的属性证明。V2G、储能、虚拟电厂(VPP)、电力交易等机制均未在正文中出现，政策亦未涉及电力辅助服务市场或需求侧响应机制。
行动建议:
- A 趁早研究:密切跟踪2018年起"适时启动可再生能源电力配额考核和绿色电力证书强制约束交易"的政策演进,评估充电运营商参与绿证市场的合规路径和成本收益。
- B 趁早研究:梳理公司现有风电或光伏发电项目,评估绿证核发申请的材料准备周期,提前布局绿证资产变现通道。
didi_impact_one_liner: 该绿证政策直接针对风电光伏发电侧,对加油/充电/储能业务暂无直接约束或机会,但强制约束交易预告需提前布局应对。
