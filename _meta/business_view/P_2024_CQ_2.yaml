影响分析:
  加油: 直接利好合规加油站。专项行动严查黑加油站(点)、打击劣质油品销售、查处偷逃税款，清理非法竞争者后合规经营者的市场份额有望提升；但需注意专项行动期间合规加油站也面临更严格的经营资质、库存台账、油品质量抽检等监管审查。
  充电: 未直接涉及。政策聚焦于成品油的非法生产、储存、经营、运输、销售，文件通篇未提及充电桩、新能源汽车或充换电业务。
  电力_储能_V2G_交易: 未直接涉及。政策针对成品油气油柴油领域，未涉及电力交易、虚拟电厂、储能调峰、V2G反向充电或电力系统辅助服务等业务。
行动建议:
- 趁早梳理加油站经营资质、证照台账、油品进货渠道凭证，确保符合专项行动的资质合规与来源可追溯要求，规避被误作非法经营查处的风险
- 趁早与区商务委、联席办建立合规沟通渠道，了解专项行动对合规加油站的配套支持政策，及时申报相关证明材料
- 趁早建立内部油品质量内控与台账留痕机制，为专项行动期间可能进行的油品质量抽检做好预备
didi_impact_one_liner: 专项行动清理非法加油站，利好合规油站扩大市场份额，但需强化合规经营迎接更严格监管审查
