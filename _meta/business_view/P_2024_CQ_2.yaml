影响分析:
  加油: 直接涉及。方案明确以消除安全隐患、严查黑加油站（点）、打击劣质油品销售、查处偷逃税款为重点，对全区加油站（点）的合规经营资质、油品质量、税务合规等方面形成高压监管态势。合法加油站面临更严格的检查频率和合规要求，同时非法加油点将被清退，正规加油站市场空间有望得到净化。
  充电: 未直接涉及。方案聚焦于成品油（汽油、柴油等传统燃油）的非法经营打击，未提及充电桩、新能源汽车充电基础设施或相关监管要求。
  电力_储能_V2G_交易: 未直接涉及。方案针对的是石油类成品油的流通监管，文件通篇未出现储能、虚拟电厂(VPP)、V2G、电力交易、聚合商等机制或领域，不构成直接业务影响。
行动建议:
- A 趁早:对照方案列举的非法经营形态（非法生产、储存、经营、运输、销售），对本企业加油站运营全链条进行合规自查，重点排查油品来源证明、质量检测报告及税务凭证等关键合规要素。
- B 研究:主动对接区商务委及联席会议成员单位，提前了解专项检查的时间节点和重点区域分布，为可能到来的现场检查做好资料备查和应急预案准备。
didi_impact_one_liner: 方案对加油业务形成直接合规压力，合法加油站需趁早完成全链条合规自查以应对高压监管，对充电和电力储能等业务无直接政策影响。
