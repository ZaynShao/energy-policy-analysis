影响分析:
  加油: 未直接涉及。政策聚焦电力市场建设与新型储能容量市场化交易，未涉及油气/加油业务领域。
  充电: 未直接涉及。虽提到绿电、新型储能交易品种丰富及辅助服务市场优化促进“源网荷储互动”升级，但属于平台机制层面，未直接规定充电桩建设、充电服务费或充电运营商市场准入等具体业务事项。
  电力_储能_V2G_交易: 直接涉及。政策正式发布新型储能容量市场化交易品种，为全国首创；要求建立健全电力现货市场体系（11月底前具备结算试运行条件）；优化辅助服务市场促进“源网荷储互动”升级；探索开展新型储能容量市场交易；争取3月中旬组织首场交易。
行动建议:
- A 趁早:对接新型储能容量市场化交易，3月中旬首场交易前完成准入准备及交易方案设计
- B 趁早:跟进630新型储能第二批试点工作进展，提前布局容量市场后续交易机会
- C 研究:电力现货市场规则，11月底结算试运行条件明确后评估储能项目参与策略
- D 研究:辅助服务市场优化方向，评估储能资源参与调频调峰等辅助服务的可行性
