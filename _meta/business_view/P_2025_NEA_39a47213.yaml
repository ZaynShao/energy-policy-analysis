影响分析:
  加油: 未直接涉及。政策聚焦电动汽车充电和V2G双向互动，不涉及传统燃油车或加油站业务。
  充电: 直接利好。30个试点项目覆盖居民社区、工业园区、公共充换电场站等多元场景；试点城市充电桩建设规模持续扩大（深圳151座V2G车网互动站、重庆80个V2G项目等）；试点地区全面执行充电峰谷分时电价，年度充电电量60%以上须集中在低谷时段，私人桩80%以上须在低谷时段充电，居民充电峰谷价差将进一步扩大；充储一体化站成为建设重点（重庆已建成201个充储一体化站）。
  电力_储能_V2G_交易: 直接利好。V2G车网互动规模化应用正式启动，9城30项目进入落地阶段；动力电池作为可控负荷和移动储能将支撑新型电力系统运行，具备削峰填谷和消纳可再生能源功能；电力市场参与路径明确（低谷消纳电力交易每千瓦时0.6元收益，收益率可提高3%-5%）；VPP聚合商模式已有实践（常州聚合1.5万千瓦可调负荷）；充储一体化（储）成为重要建设方向。
行动建议:
- A 趁早在试点城市布局V2G双向充电桩产能，抓住首批规模化应用窗口期
- B 趁早对接试点地区电网公司，承接低谷时段充电调度需求
- C 趁早参与充储一体化站投资建设，绑定储能资源与充电场景
- D 趁早对接电力交易中心，获取低谷消纳电力交易资格并设计定价策略
- E 趁早开展聚合商业务，将分散充电桩资源打包为可控负荷参与电网调节
didi_impact_one_liner: 首批车网互动规模化应用试点启动，充电业务面临V2G化、峰谷电价市场化、充储一体化三重机遇，电力交易和VPP聚合商业务空间正式打开。
