影响分析:
  加油: 未直接涉及。本办法聚焦电力需求侧管理，主要规范用电环节的节约用电、需求响应、绿色用电等行为，未涉及成品油供给或传统加油业务。
  充电: 直接涉及。第十三条明确鼓励推广电动汽车参与需求响应，第九条要求完善新型用电基础设施的能效管理，第十条支持综合能源服务商开展电力交易、绿证交易等多元化能源服务。电动汽车作为分布式灵活性资源被纳入需求响应体系。
  电力_储能_V2G_交易: 直接涉及。第六条明确将虚拟电厂运营商、负荷聚合商、综合能源服务商列为重要实施主体；第十条支持开展电力交易、绿证交易、碳交易；第十三条鼓励新型储能参与需求响应并明确电动汽车可作为需求响应主体，隐含V2G机制；第十四条提出2025年需求响应能力达最大负荷3%-5%、2030年形成规模化实时需求响应能力并实现区域内需求侧资源共享互济。VPP、储能、聚合商、绿电交易均获明确政策支撑。
行动建议:
- 趁早研究参与需求响应市场的准入条件与技术标准，对接省级电力运行主管部门，提前布局负荷聚合商或虚拟电厂运营资质；
- 趁早评估充电场站参与需求响应的技术方案（V2G双向充放电能力），将充电桩作为可调负荷资源接入需求响应体系；
- 趁早与综合能源服务商建立合作，探索绿证交易、碳交易与充电服务的联动商业模式。
didi_impact_one_liner: 充电业务获需求响应主体资格认可，新型储能、V2G、虚拟电厂、绿电/碳交易均被纳入政策体系，2025/2030年需求响应能力目标明确释放市场化机遇。
