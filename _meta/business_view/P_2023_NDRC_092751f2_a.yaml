影响分析:
  加油: 未直接涉及。该办法主要聚焦用电环节的节约用电、需求响应等管理活动,加油业务(加油站)不属于办法直接调整范围,但交通运输领域作为重点行业之一,其用能效率提升要求可能间接影响相关配套需求。
  充电: 直接涉及。第十三条明确鼓励推广电动汽车参与需求响应,第十条鼓励开展绿证交易,第九条要求完善新型用电基础设施的能效管理。充电基础设施作为重要负荷侧资源,被纳入需求响应主体范围,充电负荷调度参与度有望提升。
  电力_储能_V2G_交易: 直接涉及。第十三条明确将新型储能列为需求响应参与主体;第六条将虚拟电厂运营商列为重要实施主体;第十条鼓励开展绿证交易、碳交易和电力交易服务;第十四条设定2025年需求响应能力达到最大负荷3%-5%,2030年形成规模化实时需求响应。虚拟电厂、储能资源聚合参与市场通道进一步明确。
行动建议:
- A 趁早对接省级电网需求响应平台,申报成为合格需求响应资源
- B 趁早布局储能资源接入虚拟电厂运营体系,整合分布式储能资源
- C 研究充电负荷参与调峰的需求响应商业模式,探索充电站作为可调节负荷的商业价值
- D 研究绿证交易服务资质,拓展绿色电力营销服务能力
