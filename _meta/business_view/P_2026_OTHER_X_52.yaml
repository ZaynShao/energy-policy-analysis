影响分析:
  加油: 未直接涉及。本政策聚焦新能源重卡，加油业务不在其促进范围内。
  充电: 直接影响。政策明确要求到2030年引导建设重卡充换电站约3000个，并在零碳公路运输通道中同步规划充换电设施，将显著推动重卡专用充电基础设施的规模化布局。
  电力_储能_V2G_交易: 未直接涉及。正文仅提到零碳公路通道建设时可配套‘必要的储能设施’，但未明确提及V2G、虚拟电厂或电力交易机制，因此无直接业务影响。
行动建议:
- 'A 趁早: 趁政策窗口期，联合重卡运营方与地方交通部门，申报并投资物流枢纽、高速公路服务区的重卡充换电站项目，抢占3000个站点布局中的先机。'
- 'B 研究: 研究零碳公路通道建设中‘储能设施’的配套机会，评估在重点充换电站节点部署储能系统的可行性，为未来可能的V2G或需求响应储备能力（间接观察）。'
didi_impact_one_liner: 重卡充换电网络建设进入量化推进阶段，利好充电基础设施企业；储能提及但机制未明确，需持续跟踪后续细则。
