影响分析:
  加油: 未直接涉及。该计划聚焦电动汽车充电基础设施建设，未涉及传统加油站或燃油车相关业务。
  充电: 直接利好。计划明确2023年确保建成3万个、力争6万个充电桩，覆盖城市公共停车场（10%-15%车位比例）、公交环卫专用场站、居民社区（新建100%配建或预留）、开发区（现有9%、新建15%）、公共机构（15%车位比例）等场景。私家车明确要求配建自用充电桩。政策为充电基础设施建设提供明确量化目标和时间节点。
  电力_储能_V2G_交易: 未直接涉及。该计划仅涉及充电基础设施建设，无储能配置、V2G机制、电力交易或虚拟电厂相关表述。
行动建议:
- 趁早:与地方政府及住建、发改部门建立对接机制，锁定老旧小区改造中充电设施建设优先合作位置。
- 趁早:针对新建住宅100%配建或预留充电设施要求，提前与开发商建立预装或配套合作渠道。
- 趁早:布局公交、环卫、物流等公共服务领域专用充电桩市场，抓住定点定线运营车辆充电需求。
- 趁早:研究园区、开发区9%-15%车位配建比例要求下的公共充电桩建设运营机会。
- 研究:评估与相邻车位共享、多车一桩等合作模式在居民区的可行性和盈利模型。
didi_impact_one_liner: 计划明确3年内新增3-6万充电桩目标，覆盖公共、社区、专用等多场景，为出行平台新能源车充电保障和充电业务合作提供政策窗口期。
