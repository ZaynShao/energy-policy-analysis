影响分析:
  加油: 未直接涉及。政策聚焦电动汽车充电基础设施建设，未提及加油站改造、油气电合建站或传统能源补给业务。
  充电: 直接利好。政策明确三年内建成96-190座充电站、3-6万个充电桩，并细化到城市公共停车场按10%-15%车位比例配建、新建住宅100%配建或预留充电设施安装条件、老旧小区推进多车一桩共享模式、公交环卫等公共服务领域优先配建、开发区车位9%-15%配建比例、公共机构不低于15%配建比例等具体任务。
  电力_储能_V2G_交易: 未直接涉及。政策仅聚焦充电基础设施建设与运营，未涉及储能配置、V2G双向充放电、虚拟电厂调度或电力市场化交易机制。
行动建议:
- A 趁早对接自然资源、住建部门，锁定城市综合体、商超、文体场馆、交通枢纽等公共停车场的充电车位资源，优先布局快充站点
- B 趁早与国网江西电力及小区物业建立合作通道，重点关注老旧小区改造中的共享充电桩建设机会，提前介入多车一桩合作模式
- C 趁早对接公交、环卫、物流等公共服务用车单位，锁定专(公)用充电设施建设需求，制定定向建设方案
