影响分析:
  加油: 未直接涉及。该政策聚焦设备更新与消费品以旧换新，重点覆盖工业设备、交通运输设备（不含燃油车）、家电等品类；正文未提及加油站设施更新或燃油相关补贴，加油业务不在本次政策覆盖范围。
  充电: 间接涉及。正文未明确列出充电桩或新能源汽车补贴条款，但"消费品以旧换新"范围可能涵盖家用新能源汽车置换，该政策对新能源车消费有撬动效应（间接带动充电需求增长）。建议持续跟踪后续配套细则中是否将充电基础设施纳入支持范围。
  电力_储能_V2G_交易: 未直接涉及。该政策主题为通用设备更新与消费品以旧换新，正文未出现储能装置、虚拟电厂、V2G、双向充电桩、电力交易或能源聚合商等相关表述，不涉及此类业务的直接政策调整。加油/充电/电力（储能·VPP·V2G·电力交易）
行动建议:
- A 趁早摸底内部设备资产，排查是否存在可纳入后续地方配套清单的高效节能设备更新需求，提前准备更新计划以对接可能释放的补贴窗口。
- B 趁早建立与北京市商务局、发改委等部门的政策跟踪渠道，密切关注后续发布的"以旧换新"补贴产品目录细则，识别充电桩或新能源汽车相关配套政策的介入时点。
- C 趁早研判政策对新能源车主的消费刺激效应，预估本地新能源汽车增量对充电网络的承载压力变化，为后续充电网络扩容规划提供数据支撑。
- D 研究政策在工业领域设备更新的撬动逻辑，评估公司现有加油站点是否有升级为综合能源补给站（加油+充电）的改造空间（需等后续细化文件支撑）。
didi_impact_one_liner: 该政策对加油业务无直接利好，对充电业务有间接需求撬动效应，对电力/储能/V2G/交易业务暂无影响；建议趁早跟踪地方配套细则并预研综合能源站升级可能性。
