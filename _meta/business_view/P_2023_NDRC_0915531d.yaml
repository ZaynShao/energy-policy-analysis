影响分析:
  加油: 未直接涉及。办法主要针对电力系统负荷管理，加油业务属于油品供应领域，不在电力负荷管理范围内。如加油站在当地有序用电方案中被列为重要保障用户，可能间接受益于优先供电安排，但正文未明确列出加油站作为保障对象。
  充电: 直接涉及。充电桩/换电站作为可调节负荷，是需求响应的潜在参与主体。办法第九条明确负荷聚合商可参与需求响应资格审查和邀约，第十条鼓励参与电能量市场、辅助服务市场、容量市场获取收益，第十一条推动需求侧资源进入电力市场。充电运营商作为负荷聚合商参与方有望获得市场化收益机会。有序用电方案实施时，充电负荷可能被列入调控对象。
  电力_储能_V2G_交易: 直接涉及。办法第九条明确虚拟电厂作为需求响应执行主体接受监管和偏差考核，第十条确立“谁提供、谁获利，谁受益、谁承担”原则，第十一条推动需求侧资源进入电力市场参与交易，第十一条明确逐步将需求响应作为电网经济运行常态化调节措施。储能资源和虚拟电厂可通过参与需求响应、电能量市场、辅助服务市场等获取经济收益。办法主要规范需求响应机制，但未明确涉及V2G或反向充电具体操作细则。
行动建议:
- A 趁早:研究充电桩接入新型电力负荷管理系统的技术要求和准入流程，为参与需求响应做好准备
- B 趁早:评估充电运营负荷聚合商角色定位，测算需求响应收益模式并纳入业务规划
- C 趁早:对接各地电力负荷管理中心，了解经营主体资格审核标准和偏差考核规则
- D 研究:储能业务与需求响应机制的协同模式，探索储能资源参与电能量市场和辅助服务市场的路径
- E 研究:虚拟电厂业务与需求响应的衔接机制，评估作为需求响应主体参与电力市场的合规要求
- F 研究:关注需求响应价格机制和尖峰电价政策变化，量化分析对充电和储能业务的经济影响
didi_impact_one_liner: 充电运营业务迎来直接利好，可作为负荷聚合商参与需求响应获取市场收益；虚拟电厂和储能业务可通过需求侧资源进入电力市场获得盈利渠道；加油业务暂无直接关联。
