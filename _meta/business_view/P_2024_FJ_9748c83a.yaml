影响分析:
  加油: 未直接涉及。本方案聚焦电力现货市场机制建设，未涉及油品销售、加油站运营或成品油相关业务。
  充电: 间接涉及。方案明确将负荷聚合商列为新型经营主体，可参与现货市场交易；充电桩运营商具备成为负荷聚合商的天然条件，有望通过聚合充电资源参与市场。方案提出用户侧由价格接受者逐步向报量报价方式转变，充电侧若形成聚合商模式，将面临出清机制变化的潜在影响。
  电力_储能_V2G_交易: 直接涉及。方案明确将新型储能、虚拟电厂列为新型市场经营主体，参与现货市场交易；现货市场采用系统边际电价机制，日清月结/月清月结的结算模式，偏差电量按现货市场价格结算，V2G作为虚拟电厂的潜在实现形式具备参与条件；方案还推动辅助服务市场与现货市场融合，为储能参与调频/调峰提供市场衔接路径。
行动建议:
- A 趁早:研究将充电桩资产接入负荷聚合商运营模式的可行性，评估参与电力现货市场的技术条件和合规要求
- B 趁早:结合虚拟电厂参与机制，探索充电桩与V2G功能的融合路径，提前布局分布式充电资源的聚合调度能力
- C 研究:密切跟踪用户侧逐步向报量报价方式转变的政策节奏，评估对充电运营峰谷套利模式的影响
didi_impact_one_liner: 充电业务获间接市场准入机会，虚拟电厂/储能直接入局现货，聚合充电资源参与出清和分时结算成为潜在新赛道
