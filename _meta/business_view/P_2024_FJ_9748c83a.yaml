影响分析:
  加油: 未直接涉及。该政策聚焦电力现货市场建设方案，加油站经营主体未被纳入经营主体范围，正文未涉及燃油销售或加油站与电力市场的衔接机制。
  充电: 未直接涉及，但存在间接关联。正文明确电力用户（含电网企业代理购电用户）可作为现货市场参与主体，用户侧暂为价格接受者；充电运营商如以负荷聚合商形式参与，可归入新型经营主体范畴参与现货市场。正文未单独提及充电桩或新能源汽车充电。
  电力_储能_V2G_交易: 直接涉及储能及虚拟电厂参与电力现货市场。正文明确'有序推动新型储能、负荷聚合商、虚拟电厂等新型市场经营主体参与现货市场交易'，储能可参与日前市场及实时市场出清、辅助服务市场；虚拟电厂作为新型经营主体纳入现货市场框架。V2G未在正文中出现。
行动建议:
- 趁早研判储能参与现货市场的峰谷价差套利空间，重点分析安全约束经济调度出清机制下储能收益模型变化。
- 趁早布局虚拟电厂聚合运营能力，储备负荷聚合商资质以对接新型经营主体准入要求。
didi_impact_one_liner: 储能及虚拟电厂获得正式市场主体地位参与福建电力现货交易，充电业务可通过负荷聚合商路径间接切入。
