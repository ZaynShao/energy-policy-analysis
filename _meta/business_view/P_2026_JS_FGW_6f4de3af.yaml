影响分析:
  加油: 常规省级调价公告，仅公布江苏省汽、柴油最高零售价与最高批发价（例如92#汽油零售11072元/吨、批发10772元/吨；0#柴油零售9370元/吨、批发9070元/吨），批零吨价差固定为300元/吨，自11月12日24时起执行。公司加油利润来自炼厂装车价与批发成交价之间的折扣空间，而本文发布的只是最高限价，并不等于成交价，因此不改变采购折扣、商户合规成本、KA总部合作与支付接口、下沉城市展业中的任何一个决策变量，所以按判断标准属于不相关，只能作为区域价格基准参考。另外，备注中“98号汽油由生产经营企业自主定价”这一项落在画像的空白维度“油品品种”上，需要人工裁定。
  充电: 未直接涉及。正文只列汽柴油最高零售、批发价格，没有建桩、选址、服务费、场站电价或超充标准内容，对建桩节奏、服务费定价空间、场站侧电价结构、大功率升级门槛均无影响；油价水平变化对燃油车使用成本的边际传导只是间接观察，不构成本文事项。
  电力_储能_V2G_交易: 未直接涉及。正文未出现售电、现货规则、中长期持仓、火电长协、分布式新能源入市、聚合商、储能、V2G或虚拟电厂等任何机制或表述，不影响目标省进入判断与持仓结构。
