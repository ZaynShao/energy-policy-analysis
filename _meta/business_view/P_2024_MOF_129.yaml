影响分析:
  加油: 间接影响（推断）。汽车以旧换新补贴促进老旧车辆淘汰更新，若带动新能源汽车置换比例提升，长期可能分流加油站客流。正文未区分燃油车与新能源车的补贴差异，无法确定具体影响方向和幅度。
  充电: 间接影响（推断）。以旧换新若带动新能源车销售增长，将扩大充电桩使用需求和建桩动力。但正文仅明确补贴用于汽车以旧换新，未限定新车类型为电动汽车，充电业务的实际增量取决于消费端换购选择。
  电力_储能_V2G_交易: 未直接涉及。正文为汽车以旧换新补贴资金预拨通知，资金用途明确为汽车消费补贴，不涉及储能、虚拟电厂、V2G、电力交易等机制或市场准入事项。
行动建议:
- A 趁早监测:关注后续地方执行细则中是否对新能源车置换比例有倾斜，若有则顺势加大充电业务布局
- B 趁早对接:主动对接地方商务/财政部门，了解本省以旧换新补贴分配机制，争取在车主服务平台嵌入补贴申领通道
didi_impact_one_liner: 以旧换新补贴预拨64.4亿促汽车消费复苏，间接利好新能源车及充电桩需求扩张，但政策未直接绑定新能源替代目标，实际影响待消费端验证。
