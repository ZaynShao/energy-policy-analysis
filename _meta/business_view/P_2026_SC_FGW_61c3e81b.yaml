影响分析:
  加油: 直接相关。本通知调整四川三个价区汽、柴油最高零售价与最高批发价（含供方配送到零售企业的最高批发价），自2026年9月11日24时执行，直接改变我方在川加油业务的批发价与折扣空间测算口径：批发企业只能在不超过最高批发价的前提下与零售企业协商具体批发价，零售企业只能在不超过最高零售价前提下自主定价，价格上限成为挂牌与批发的硬约束。同时规定对符合资质的民营批发企业最高供应价按最高零售价扣减400元确定，且零售价下调时供应价要相应下调、差价不小于400元，这直接压缩我方对民营批发客户的供价弹性与批发议价空间。第八条要求各级发改部门加强价格监管、会同市场监管部门严厉打击价格违法行为并加强价格监测与异常上报，商户端价格合规与台账要求趋严。未涉及炼厂装车价、安全与财税法层面新增义务。
  充电: 未直接涉及。本通知仅调整汽、柴油最高零售价与最高批发价，未涉及建桩节奏与选址、充电服务费定价、场站侧电价结构、大功率与超充合规门槛或行业标准评级。（间接：成品油价格变动可能影响油电使用成本比价的公众感知，但本通知未给出任何充电侧可执行事项，不改变我方充电业务任何决策变量。）
  电力_储能_V2G_交易: 未直接涉及。正文未出现售电、电力交易、现货规则、中长期与现货比例、偏差考核、分布式新能源入市、聚合商准入、储能、虚拟电厂、V2G或双向充电等任何机制或要求，不影响目标省进入判断与持仓结构。
行动建议:
- A 趁早:按四川三个价区新公布的汽柴油最高零售价、最高批发价（区分合同约定配送到站与未约定配送费两种口径）逐站逐客户重算批发—零售折扣空间与收益，把挂牌价与对零售企业的批发价逐条卡在上限之内。
- B 趁早:复核对符合资质民营批发企业的供价执行口径，确认按最高零售价扣减400元且零售价下调时同步下调、差价不小于400元，重估该客户群的批发议价空间与客户结构。
- C 研究:针对第八条价格监管与价格违法行为打击、市场动态与价格监测上报要求，梳理我方在川价格合规台账、调价留痕与异常情况报告流程，形成调价当日的执行与合规检查清单。
didi_impact_one_liner: 四川自9月11日24时调整汽柴油最高零售价与最高批发价、并对民营批发企业设'零售价扣减400元'的供价上限，直接改写我方在川加油业务的批发折扣空间与价格合规红线，充电与电力业务未直接涉及。
