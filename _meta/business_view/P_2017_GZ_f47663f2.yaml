影响分析:
  加油: 未直接涉及。该文件聚焦于电力体制改革中的发用电计划放开，核心对象为燃煤发电企业、水电核电等发电侧主体及跨省跨区输电安排，不涉及加油站或燃油零售业务。
  充电: 未直接涉及。虽然文件涉及市场化交易电量规模扩大、新机组参与市场交易等内容，但仅作为一般性电力市场改革措施，未针对充电基础设施、充电服务或新能源汽车充电领域出台专门安排。
  电力_储能_V2G_交易: 未直接涉及。文件虽有市场化交易价格调整机制、跨省跨区送受电计划放开等内容，但未明确涉及储能装置、虚拟电厂(VPP)、V2G机制或电力交易的具体规则设计。
行动建议:
- A 趁早建立电力市场跟踪机制:指定专人持续关注各省级市场化交易电量规模扩大节奏及跨省区送受电计划改革进展，提前预判电力市场结构演变趋势。
- B 研究售电侧机会:文件要求组织发电企业与售电企业、用户及电网企业签订发购电协议，可趁早研究作为售电企业或用户代理参与市场化交易的准入条件与商务模式。
- C 关注价格联动机制:文件鼓励燃煤发电协议价格与电煤中长期合同挂钩、建立价格调整机制，趁早建立煤炭成本-电价传导的分析模型以支撑交易决策。
didi_impact_one_liner: 未直接涉及充电或能源零售业务；文件聚焦发电侧计划电量放开与跨省区送受电改革，可趁早布局售电侧市场参与能力和电煤价格联动分析。
