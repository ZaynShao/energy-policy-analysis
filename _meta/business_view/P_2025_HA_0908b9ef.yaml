影响分析:
  加油: 政策明确鼓励在具备条件的加油、加气、加氢站建设快充为主的公用充电基础设施，为加油站向综合能源服务站转型提供政策依据。加油站可在现有场地基础上叠加充电功能，形成加油+充电双业务模式，提升客户粘性和服务覆盖。
  充电: 政策全面规范充电基础设施建设运营三类场景：新建住宅项目须直接装表接电满足充电桩安装条件；居民区以慢充为主（单桩不宜超8千瓦）搭配快充；高速公路服务区、公共停车场等公共场所以快充为主。同时建立省级充电智能服务平台统一接入管理，推动充电桩规模化和智能化发展。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦充电基础设施的物理建设与运营管理，未涉及储能系统、虚拟电厂、V2G双向互动或电力交易机制等内容。充电桩作为电能消耗设施，其配电网接入要求在正文中未展开具体规定。
行动建议:
- 'A 趁早: 趁早研判加油站网点的转型可行性，优先在与高速公路衔接或城区核心位置的站点试点叠加充电功能。'
- 'B 研究: 趁早研究充电运营服务商的合作模式或自营方案，提前布局公用充电基础设施市场。'
- 'C 趁早: 趁早对接省级充电智能服务平台，了解数据接入标准，为后续运营监测和信息发布做准备。'
- 'D 趁早: 趁早跟进新建住宅项目固定车位直接装表接电的政策要求，评估居民区自用充电桩市场的业务机会。'
didi_impact_one_liner: 河南政策为加油+充电综合能源站提供明确支持，同时全面规范新建住宅和公共场所充电桩建设标准，并建立省级平台统一监管，对加油业务转型和充电基础设施规模化发展形成直接利好。
