影响分析:
  加油: 未直接涉及。正文仅涉及新能源建设、煤电改造、储能推广和电力市场，未提及任何加油业务、油品供应或油气基础设施相关内容。
  充电: 正文明确将电动汽车充电网络列为系统调节资源之一（系统调节能力提升行动），要求引导其参与电力系统调节，构建源网荷储协同消纳新能源格局。充电运营网络可作为需求侧灵活资源参与系统调峰，具备参与电力市场的潜在路径，但具体参与机制、商业模式和准入规则尚未在正文中明确，属于初步提及阶段。
  电力_储能_V2G_交易: 储能方面，正文明确提出到2030年新型储能装机规模达到2500万千瓦的目标（新型储能推广应用行动），并将推动新型储能技术在电力系统多场景应用、创新商业模式。电力市场方面，提出加快建设蒙西电力市场、充分发挥市场作用保障新能源高效消纳（蒙西电力市场建设行动）。V2G未在正文中出现；虚拟电厂（VPP）未在正文中出现；具体储能参与电力交易机制、虚拟电厂聚合商准入规则尚未在正文中明确，属于目标导向和机制建设方向阶段。
行动建议:
- A 趁早:将充电运营网络纳入系统调节资源库，对接蒙西电网调度机构，提前布局充电负荷参与需求侧响应和系统调峰的接入标准与协议，为充电网络转化为电网调节资产做好准备。
- B 趁早:对接内蒙古自治区新型储能推广应用行动要求，结合2500万千瓦储能装机目标，提前锁定储能项目资源与并网接口，布局电源侧或电网侧储能项目的开发合作机会。
- C 研究:持续跟踪蒙西电力市场建设进展，重点关注充电负荷、储能等灵活性资源参与市场的规则设计进展，研判充电运营商作为负荷聚合商参与电力交易的可行性路径。
didi_impact_one_liner: 蒙西新型电力系统方案将充电网络纳入系统调节资源，储能装机目标锁定2500万千瓦，充电运营和储能业务迎来参与电网调节的政策框架入口，但V2G和虚拟电厂机制尚未在正文中出现，需持续跟踪蒙西电力市场规则设计进展。
