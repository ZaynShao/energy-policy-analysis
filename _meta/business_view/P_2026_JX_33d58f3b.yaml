影响分析:
  加油: 未直接涉及。该政策聚焦电动汽车充电设施建设与运营，未涉及传统燃油车加油业务。充电基础设施的完善可能间接影响燃油车使用场景，但属长期间接影响，且加油业务非政策规范对象。
  充电: 直接利好。该政策明确部署五大专项行动，提出到2027年建成2800万个充电设施、提供超3亿千瓦公共充电容量、满足超8000万辆电动汽车充电需求的具体目标。重点任务包括：公共充电设施提质升级（快充为主、大功率充电为补充）；居住区充电条件优化（新建居住区100%配建充电设施，既有居住区因地制宜补充，推广'统建统服'模式）；简化居民充电桩报装申请，落实'三零''三省'服务；供电能力改善（配电网规划、台区增容）；运营服务质量提升（老旧设备升级、场站环境规范、收费标准完善）。
  电力_储能_V2G_交易: 车网互动及V2G直接涉及。政策明确'车网互动'为新模式新业态，将充换电设施与供电网络相连，通过智能有序充电和双向充放电实现新能源汽车作为灵活性储能资源的调节潜力。具体部署：推进首批车网互动试点建设，构建协同推进和跟踪评价机制，探索市场化车网互动响应模式，持续扩大试点范围。储能和电力交易未在正文中直接出现具体机制或指标，但车网互动规模化应用已为相关业务发展提供政策通道。
行动建议:
- 'A 趁早: 依托政策目标窗口期，在重点城市、高速公路服务区、农村地区加密充电设施点位布局，抢占2800万个充电设施的增量市场空间'
- 'A 趁早: 积极参与居住区''统建统服''模式试点，获取''一小区一证明''等新型报装场景的先发运营权'
- 'A 趁早: 接入电网企业报装接电''三零''''三省''服务通道，简化内部审批流程，降低居住区充电设施接入成本'
- 'A 趁早: 投入大功率充电设施（目标优化设施功能结构）和老旧设备升级改造，提升充电站服务能力和能效水平'
- 'B 研究: 密切跟踪车网互动试点动态，研究双向充放电和市场化响应模式的合规要求和商业路径，为V2G规模化应用储备能力'
- 'B 研究: 关注车网互动中新能源汽车作为灵活性储能资源的调节潜力，探索与虚拟电厂、需求侧响应的协同机会'
didi_impact_one_liner: 充电业务获明确政策红利（2800万设施目标+居住区100%配建+简化报装），车网互动V2G试点扩围为储能和电力交易创新提供通道，加油业务未直接涉及。
