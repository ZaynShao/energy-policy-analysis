影响分析:
  加油: 未直接涉及。该政策聚焦电动汽车充电设施建设与优化，未涉及加油站业务调整、准入门槛或监管要求变化。
  充电: 直接利好。政策明确提出建设2800万个充电设施、满足超8000万辆电动汽车充电需求的目标，并部署五大专项行动：①公共充电设施提质升级（快充为主、大功率充电为补充）；②居住区充电条件优化（推广统建统服新模式，新建居住区固定车位100%建设充电设施或预留安装条件）；③充电运营服务质量提升（老旧设备升级改造、规范收费、完善监测平台）。政策还要求简化居民充电桩报装申请资料，落实三零三省服务举措。
  电力_储能_V2G_交易: 直接涉及V2G和配电网环节。政策明确提出推进车网互动规模化应用推广行动，扩大车网互动试点范围，探索市场化车网互动响应模式，构建协同推进和跟踪评价机制。供电改善行动要求将充电设施接入需求纳入配电网规划，开展配电网架优化和台区增容建设改造。但未明确涉及储能具体项目、电力交易机制或虚拟电厂直接准入机会。
行动建议:
- A 趁早对接试点城市车网互动项目，研究V2G参与电网调节的商业模式和收益结算机制
- B 趁早布局居住区统建统服充电建设运营资质，争取纳入地方政府试点名单
- C 研究:关注配电网改造投资机会，探索与电网企业合作参与台区增容项目的可行路径
- D 研究:跟踪大功率充电设施标准制定进展，提前储备相关技术和运营能力
didi_impact_one_liner: 充电业务获明确政策红利，需趁早布局车网互动试点和居住区统建统服模式以抢占先机
