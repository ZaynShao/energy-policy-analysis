  加油: 直接涉及。本文件设定了上海市各标号汽油（89/92/95号）和柴油（0/-10号）最高零售价格，明确零售企业可在不超过最高限价范围内自主定价，并向物价局备案；价格自2023年5月30日24时起执行。
  充电: 未直接涉及。文件仅针对车用汽柴油定价，未涉及充电服务电价或新能源汽车相关内容。
  电力_储能_V2G_交易: 未直接涉及。文件系汽柴油零售价格通知，不涉及储能、虚拟电厂、V2G或电力交易机制。
行动建议:
- A 趁早核查站点定价系统：对照本文件最高限价检查内部定价逻辑，确保不超过文件附件所列各油品最高零售价
- A 趁早完成价格备案材料：如尚未完成自主定价备案，准备好定价备案材料并按规定向物价部门提交
- B 研究定价策略空间：在最高限价框架下，结合本企业成本与竞争态势，研究差异化定价空间以提升竞争力
- B 关注后续调价窗口：建立油价变动跟踪机制，为下一轮调价提前做好执行准备
didi_impact_one_liner: 上海加油站需在不超过文件所列各标号汽柴油最高零售价范围内合规定价并备案，价格执行节点为5月30日24时。
