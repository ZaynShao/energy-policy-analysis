影响分析:
  加油: 直接涉及。报废国三及以下排放标准燃油乘用车并购买2.0升及以下排量燃油乘用车可获补贴1.5万元，将加速淘汰高排放老旧燃油乘用车，同时刺激2.0升及以下燃油车置换需求，短期内对加油业务量产生正向置换效应。
  充电: 直接涉及。报废旧车并购买新能源乘用车补贴提高至2万元（较此前标准翻倍），直接刺激新能源汽车消费，将扩大新能源乘用车保有量并带动充电服务需求增长。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦于汽车购置端的以旧换新补贴，未涉及储能建设、V2G机制、虚拟电厂参与或电力交易规则等具体安排。
行动建议:
- 趁早对接地方政府补贴申请审核系统，提前梳理报废车辆车主信息库，主动为客户提供报废引导和新车购置衔接服务，承接置换流量。
- 趁早与新能源汽车品牌经销商或充电运营平台建立合作，共享补贴换购客源，联合推出充电优惠套餐，将补贴换车红利转化为充电用户增量。
didi_impact_one_liner: 汽车以旧换新补贴翻倍至2万元，新能源乘用车置换潮将直接扩大充电需求基盘，加油业务需关注存量高排放车辆加速淘汰带来的结构性变化。
