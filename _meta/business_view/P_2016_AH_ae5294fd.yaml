  电力_储能_V2G_交易: 直接涉及售电侧放开。文件明确了售电公司的市场准入资格、权利义务及配电区域内电费收取结算职责，确立售电公司作为独立市场主体参与电力直接交易的合法地位；同时电力用户被赋予直接参与电力市场的准入资格，可通过双边协商或集中竞价方式购电，为需求侧资源参与市场交易奠定制度基础。
行动建议:
- A 趁早研究:评估公司是否满足售电公司准入条件，包括资产、专业人员和场所要求，尽早完成省电力交易中心注册程序
- B 趁早研究:梳理现有工商业电力用户资源，研究作为代理购电方参与双边协商交易或集中竞价交易的市场策略
