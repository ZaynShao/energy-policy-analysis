影响分析:
  加油: 未直接涉及。该通知聚焦省级电网输配电价改革，用户价格归并及两部制/单一制电价调整均属电力销售侧定价机制，与燃油零售业务无直接关联。
  充电: 充电运营商用电成本结构将受直接调整。315kVA及以上大型充电站须执行两部制电价，充电场站建设运营的容量选择策略面临约束；需量电价按实际用电量实施阶梯优惠（月用电量≥260kWh/kVA时按90%执行），充电负荷曲线优化可降低单位电费，实质上形成高利用率激励；工商业用户价格构成明确列示系统运行费用，充电服务商的定价成本归集口径需相应调整（间接）。
  电力_储能_V2G_交易: 系统运行费用项下明确包含抽水蓄能容量电费，反映辅助服务和调节性资源成本疏导机制正逐步建立；但政策正文未涉及储能项目具体支持、虚拟电厂(VPP)准入、V2G或双向充放电交易机制，不构成直接业务影响。工商业用户电价结构化调整或为后续辅助服务市场化定价的隐含铺垫（间接）。
行动建议:
- 趁早摸排存量及规划充电场站的报装容量分布，识别315kVA及以上站点的容量计费切换策略，避免被动适用两部制电价造成成本突增
- 趁早评估充电负荷调度优化空间，对照需量电价阶梯优惠阈值（月260kWh/kVA），将高利用率运营转化为电价节支
- 趁早与电网企业确认系统运行费用分摊规则在充电计费端的归集方式，提前调整充电服务费定价模型
didi_impact_one_liner: 充电运营的容量计费模式切换和需量电价阶梯优惠落地，直接影响大型充电场站成本结构，高利用率策略获得电价经济性支撑。
