影响分析:
  加油: 未直接涉及。正文通篇为山西2027年增量新能源（集中式/分布式风光）机制电价竞价的规模、上下限、执行期限与保函安排，未提及成品油批发价、炼厂装车价、加油站商户合规成本、KA总部合作或支付接口口径，也未触及下沉城市展业。无间接观察可写。
  充电: 未直接涉及。正文未出现充电设施、充电服务费、场站电价结构、大功率/超充或行业标准评级。仅有的一条边界是：竞价主体范围明确排除“大型工商业分布式光伏”及“新能源就近消纳项目（含绿电直连、零碳园区、源网荷储一体化、绿电园区）”；这只是划定本次竞价的排除清单，正文并未说明这些项目与充电场站、光储充的任何关系，不能据此推断充电业务的建桩节奏、服务费空间或电价结构发生变化。
  电力_储能_V2G_交易: 直接涉及，且是我方电力交易业务在山西的一个明确准入型变化。正文写明：分散式风电、分布式光伏可自主参与竞价，也可委托代理商代理参与，且“本次竞价代理商需具备售电资质”，代理商须为每个代理项目单独填报——这把分布式新能源入市的聚合/代理门槛第一次落成了可执行条件（售电资质+逐项目填报+委托书模板），直接回答我方在乎的“分布式新能源入市与聚合商准入门槛”，并给出持牌售电公司可承接的代理业务入口。其次，竞价参数（机制电量总规模69.43亿千瓦时，风电42.55/光伏26.88；风电上限0.30、光伏上限0.32、下限0.20元/千瓦时；执行期12年；申报充足率120%；单体申报上限=装机×地区利用小时×(1-厂用电率)×70%）加上“新能源可持续发展价格结算机制差价协议”于2027年1月31日前签订，等于为山西2027年新投产风光设定了12年期的收益锚和差价结算安排，会改变这批机组在现货中的报价行为与价格分布，进而影响我方对山西现货价格曲线、中长期与现货配比及偏差考核上限的假设——这是决定“这个省进不进、怎么持仓”的输入变量，需要重算。储能、V2G、虚拟电厂、双向充电桩在正文中未出现，未直接涉及。另需注意：履约保函（电子保函、上限300万元、有效期不短于承诺投产日后18个月）是项目方的义务，正文未给我方设定新的合规义务。
行动建议:
- A 趁早:用现有售电资质在山西落地分布式光伏/分散式风电竞价代理——正文明确代理商须具备售电资质、可为每个代理项目单独填报，并附《竞价代理委托书》模板；趁早在2027年1月31日差价协议签订节点之前，把代理商资格、委托书签署与逐项目代报流程跑通，抢在竞价公告发布（通知印发3个工作日内）后的窗口期进场。
- B 趁早:把本次竞价参数（69.43亿千瓦时总规模、风电上限0.30/光伏上限0.32、下限0.20元/千瓦时、12年执行期、120%申报充足率、单体申报上限70%上限比例）灌入山西现货价格曲线与中长期持仓模型，重估该省“进不进”的结论与持仓结构、偏差考核假设。
- C 研究:在120%申报充足率与70%申报上限比例约束下，推演风电、光伏的分开出清价分布落在0.20—0.32元/千瓦时区间的哪一端，量化中标机制电量与现货裸露电量的比例，对售电公司现货采购成本与套利空间的影响。
- D 研究:正文明确排除在竞价之外的大型工商业分布式光伏、绿电直连、零碳园区、源网荷储一体化、绿电园区项目，其收益与入市路径另循何规，研判这部分增量是否构成售电/聚合服务的第二个入口。
didi_impact_one_liner: 山西2027年增量风光机制电价竞价首次把“具备售电资质的代理商”写进分布式新能源入市的通道，为我方电力交易业务开了一个可执行、有时限的代理入口，同时给出重算山西现货与中长期持仓的价格锚；加油与充电两条线本文未直接涉及。
