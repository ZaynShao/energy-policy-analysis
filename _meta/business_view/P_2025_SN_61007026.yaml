影响分析:
  加油: 未直接涉及
  充电: 直接涉及两类充电设施电价政策:1)居民住宅小区内的经营性集中式电动汽车公共充换电设施,按居民价格非居民用户标准执行,峰谷时段及电价按陕发改价格〔2023〕1487号执行;2)党政机关/企事业单位/公共停车场电动汽车充换电设施,按容量(100kVA/315kVA)划分执行工商业单一制或两部制电价,且2030年前两部制用户免收需量(容量)电费;3)居民住宅小区电动自行车充换电设施,向运营单位和用户均按居民价格非居民用户标准,直抄用户可选峰谷分时;4)工商业电价充换电设施须执行工商业峰谷分时,单一制不可选平段加4分政策
  电力_储能_V2G_交易: 未直接涉及
行动建议:
- A 趁早:梳理居民小区内电动汽车充电桩项目,对照陕发改价格〔2023〕1487号峰谷时段标准,优化运营时段定价策略
- B 趁早:公共停车场充电设施容量配置时,评估100kVA临界点两侧电价差异,315kVA以上项目在2030年前可享免容量电费优惠
- C 研究:电动自行车充换电设施运营商测算选择峰谷分时电价的成本效益,电网直抄用户原则上一年内仅可调整一次
- D 趁早:工商业单一制充电设施项目重新审视平段电价+4分政策不可选的约束,调整峰谷套利预期
- E 趁早:梳理现有及在谈的党政机关/企事业充电服务合同,确认电价执行类别是否与设备容量匹配,规避价格风险
