影响分析:
  加油: 未直接涉及。该文件针对省间电力现货交易规则修订，主要规范跨省电力资源配置机制，加油业务属于传统油气零售领域，不涉及电力现货市场交易机制设计。
  充电: 未直接涉及。正文仅原则性提到“加快研究论证用户侧直接参与省间电力现货市场的可行路径”，处于研究阶段而非已明确的准入政策。充电运营商作为用户侧参与省间现货市场尚无具体机制或时间表。
  电力_储能_V2G_交易: 未直接涉及。省间电力现货交易规则核心在于跨省电力资源调配机制，虽涉及电力交易但未明确储能、V2G、虚拟电厂等新型主体参与条款，附件规则全文未提供故无法确认具体影响范围。
行动建议:
- A 趁早:趁早梳理现有电力采购合同结构，评估若用户侧参与省间现货市场后对购电成本波动的影响边界，提前准备价格风险管理预案。
- B 研究:研究省间与省内现货市场衔接规则对分布式储能出清路径的潜在影响，尚未形成具体参与策略但需保持规则敏感度。
didi_impact_one_liner: 省间现货交易扩围方向明确但储能/V2G/充电侧参与路径待附件规则明确，当前宜做成本敏感性预研而非新业务布局。
