影响分析:
  加油: 未直接涉及。文件聚焦燃煤发电上网电价市场化改革和工商业用户全部进入电力市场，加油站作为工商业用电户将面临购电价格随市场波动的风险，但文件未对加油业务本身作出具体规定。
  充电: 直接涉及。工商业用户全部进入电力市场意味着充电桩运营企业须按市场价格购电，且文件明确建立电网代理购电机制，充电运营商面临电价波动成本管理需求。
  电力_储能_V2G_交易: 部分涉及。燃煤发电电量全部进入电力市场、工商业用户全面参与电力市场交易，建立市场化电价机制；但文件未明确提及储能、V2G、虚拟电厂或聚合商参与市场的具体机制，代理购电对象为暂未直接购电的工商业用户，不等同于储能/VPP参与机制。
行动建议:
- A 趁早:评估充电场站用电成本结构，制定电力市场化购电策略
- B 研究:持续跟踪广西后续出台的工商业用户进入电力市场交易规则和代理购电机制细则
- C 趁早:提前对接广西电网或广西电力交易中心，了解充电行业参与市场化购电的准入条件和操作路径
- D 研究:建立电价波动成本监测机制，将电力市场行情纳入充电服务定价模型
didi_impact_one_liner: 充电运营须尽快适应工商业电力全面市场化，充电桩企业用电成本将由市场定价，需提前制定购电策略和成本管控机制。
