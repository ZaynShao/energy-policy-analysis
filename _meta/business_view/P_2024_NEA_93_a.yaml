影响分析:
  加油: 未直接涉及。该指导意见聚焦电力领域新型经营主体，主要涉及配电环节的分布式电源、储能、虚拟电厂和智能微电网等。文件未提及加油站、燃油业务或交通能源领域。
  充电: 未直接涉及。正文将可调节负荷列为新型经营主体类型之一，充电桩（作为负荷）理论上可被虚拟电厂聚合参与系统调节，但文件未明确将充电基础设施列为直接支持对象或赋予其独立的新型经营主体资格。间接观察：充电负荷若满足5兆瓦及以上调节容量要求，可通过虚拟电厂间接获得参与电能量和辅助服务市场的机会。
  电力_储能_V2G_交易: 直接利好。储能明确定义为单一技术类新型经营主体，虚拟电厂（含负荷聚合商）明确定义为资源聚合类新型经营主体，两者均可豁免电力业务许可证；调节容量5兆瓦及以上的经营主体可参与电能量和辅助服务市场；探索新能源直连增加绿电供给机制；文件明确支持虚拟电厂聚合新型储能参与系统运行。V2G未在正文中出现等价明确机制，暂列"未直接涉及"。
行动建议:
- 'A 趁早: 储能业务趁早对接电网企业，按照文件明确的"可观、可测、可调、可控"技术要求完成系统接入准备，争取纳入新型经营主体目录。'
- 'B 趁早: 充电运营业务趁早评估自身调节容量规模，若具备5兆瓦及以上调节能力，趁早研究通过虚拟电厂聚合模式参与电力市场和辅助服务的路径。'
- 'C 研究: 电网企业趁早梳理可接入容量信息和服务流程，为新型经营主体并（联）网和平台接入提供标准化服务方案。'
- 'D 趁早: 具备条件的工业企业或园区趁早开展智能微电网建设方案论证，探索新能源直连绿电供给机制的可行性。'
didi_impact_one_liner: 储能获得明确的经营主体地位，虚拟电厂聚合路径清晰，充电负荷可间接参与市场，但V2G机制尚待明确。
