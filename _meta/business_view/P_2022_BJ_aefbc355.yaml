影响分析:
  加油: 未直接涉及。正文虽提到构建低碳交通体系和淘汰高耗能、高排放项目，但未明确提及燃油供应、加油站布局或汽柴油相关管控措施。
  充电: 正文明确提出构建低碳交通体系，结合北京市能源结构优化方向（电力消费占比27.8%），充电基础设施作为交通电气化的支撑具备间接发展空间，但未直接出台充电桩建设或运营政策。
  电力_储能_V2G_交易: 未直接涉及。正文虽涉及能源结构低碳转型（煤炭削减至1.5%、天然气和电力占比提升）、市场机制作用及碳排放权交易等宏观方向，但未明确提及储能、V2G、双向充电桩或虚拟电厂等具体机制和业务影响。
行动建议:
- A 趁早研究:密切跟踪北京市低碳交通体系中新能源汽车推广政策走向，评估充电服务需求增长空间，提前布局充电网络规划。
- B 趁早对接:主动对接北京市碳排放权交易市场建设进程，了解市场机制对企业碳排放管理的新要求，为参与碳市场交易做准备。
didi_impact_one_liner: 北京市十四五应对气候变化规划虽聚焦宏观能源结构和碳排放控制，对加油、充电、电力交易及储能等业务暂无直接政策约束或激励，但需关注交通领域低碳化转型对新能源业务的潜在拉动效应。
