影响分析:
  加油: 未直接涉及。该政策聚焦于新能源发电就近消纳项目的价格机制与电网服务规范，与传统加油业务无关联。
  充电: 未直接涉及。该政策规范对象为新能源发电侧就近消纳项目，充电业务（用电侧）作为负荷可消费就近消纳电量，但政策未对充电场站运营设定直接准入、补贴或强制义务。
  电力_储能_V2G_交易: 政策明确将储能列为就近消纳项目的组成部分之一（"电源、负荷、储能等作为整体"），储能关口需分表计量并承担相关费用，为储能参与就近消纳提供了计价依据，但V2G、双向充放电等机制未在正文中出现；新能源上网电量不纳入可持续发展价格结算机制，该机制与绿电交易规则的衔接尚待明确。
行动建议:
- 'A 趁早: 盘点现有充电场站布局，评估与就近消纳项目的潜在协同空间，重点关注新能源发电自发自用比例（≥60%）和总用电量比例（≥30%）能否为充电负荷创造价格优势。'
- 'B 研究: 密切跟踪储能作为就近消纳项目组分时的分表计量标准、输配电费容（需）量计费规则及系统运行费过渡安排，为后续储能与充电协同业务模式预研做好准备。'
didi_impact_one_liner: 该政策为储能与充电业务在就近消纳框架下的协同提供了计价基础，但未设定充电场站直接准入或补贴机制，需进一步评估充电负荷能否受益于就近消纳项目的电价传导。
