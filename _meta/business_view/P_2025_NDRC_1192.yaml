影响分析:
  加油: 未直接涉及。该政策聚焦新能源发电就近消纳机制，与传统化石能源加油业务无直接关联。
  充电: 间接涉及。充电设施作为工商业负荷，其用电成本结构将受就近消纳项目输配电费按容量（需）量计费机制影响；系统运行费暂按下网电量缴纳、逐步向占用容量方式过渡的安排，将影响充电运营的度电成本核算路径。充电桩/充电站具备作为负荷接入就近消纳项目的条件，但未被直接点名。
  电力_储能_V2G_交易: 储能间接涉及。政策将储能列为就近消纳项目'电源、负荷、储能'整体的一部分，但其参与方式依附于项目整体框架，文件未对储能单独设置建设激励或市场准入条款。输配电费按接入容量计量的机制适用于含储能的该项目整体。V2G、电力交易、虚拟电厂未在正文中出现，未直接涉及。
行动建议:
- A 趁早:研究就近消纳项目容量计费模式对工商业用电成本的影响，对照自发自用比例等准入条件，评估充电场站作为负荷接入该机制的综合效益
- B 研究:关注储能参与就近消纳项目的集成路径，跟踪输配电费容量计量机制对含储能项目整体运营成本的具体影响
- C 研究:密切跟踪各省级价格主管部门发布的平均负荷率测算结果及容量电费计算参数，确保及时获取地方执行细则
didi_impact_one_liner: 新能源就近消纳机制确立容量计费路径，充电场站可探索作为负荷接入获取新能源电力，储能集成于项目整体框架但需关注输配电费机制影响。
