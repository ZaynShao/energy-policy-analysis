影响分析:
  加油: 未直接涉及。碳市场当前覆盖发电、钢铁、水泥、铝冶炼行业，虽远期规划到2027年覆盖工业领域主要排放行业，但石油炼制/加油站未在正文中明确提及。
  充电: 未直接涉及。碳市场覆盖行业为发电及工业制造领域，新能源汽车充电服务未在正文明确涉及。
  电力_储能_V2G_交易: 发电行业已纳入碳市场，直接影响火电企业的碳排放成本和配额清缴义务。碳价将传导至电力交易成本。储能技术提及于"低碳、零碳、负碳技术"中，但未明确碳市场对储能、V2G或虚拟电厂有直接交易机制或准入要求。
行动建议:
- 趁早摸清自身碳排放底数，建立碳资产管理基础能力，核算碳成本对电力业务的影响
- 趁早研究碳价传导机制，评估碳市场扩围对电力交易成本和定价策略的潜在影响
- 趁早跟踪化工、石化、民航、造纸等行业的扩围前期准备进展，预判未来纳入时间节点
