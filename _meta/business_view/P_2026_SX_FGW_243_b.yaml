影响分析:
  加油: 未直接涉及。正文为山西2027年增量新能源项目机制电价竞价，不涉及成品油批发价/炼厂装车价、商户安全财税法合规成本、KA总部支付接口开放口径或下沉城市展业，不改变加油业务决策变量。
  充电: 未直接涉及。正文未出现充电场站、充电服务费、场站电价结构、大功率/超充升级或行业标准评级；仅可作间接观察：新能源机制电价竞价可能影响山西分布式光伏项目收益，但文件明确排除大型工商业分布式光伏和新能源就近消纳项目，不能据此推导出充电业务动作。
  电力_储能_V2G_交易: 电力交易直接相关：正文明确分散式风电、分布式光伏可自主参与竞价，也可委托具备售电资质的代理商代理参与，代理商须为每个代理项目单独填报，形成分布式新能源代理参与的操作门槛。储能、VPP、V2G未直接涉及；现货规则与结算、中长期与现货比例、偏差/反向考核、售电利润上限、火电长协未直接涉及。公司是否具备山西售电资质属画像空白，需人工裁定。
行动建议:
- A 趁早：由电力交易/售电团队核对公司在山西是否具备售电资质及代理填报能力；若具备，按正文附件模板评估承接分散式风电/分布式光伏竞价代理的可行性与内部流程，若不具资质则列入需人工裁定事项，不预设可参与。
- B 研究：以正文参数（机制电量总规模69.43亿千瓦时、风电/光伏申报充足率120%、风电/光伏竞价上限0.30/0.32元/千瓦时、下限0.20元/千瓦时、执行期12年、电子履约保函上限300万元）测算山西增量新能源机制电价对代理服务收益和新能源价格预期的影响，决定是否投入代理资源。
- C 跟踪：加油与充电条线本文件不新增动作；仅跟踪正文后续是否扩展到充电场站、储能、VPP/V2G或就近消纳，未明确前不立项、不新增合规义务。
didi_impact_one_liner: 对滴滴业务：本文件对加油/充电无直接动作，电力侧只直接打开山西分布式新能源竞价代理（需售电资质）的观察窗口；公司是否持牌、是否进入山西需人工裁定。
