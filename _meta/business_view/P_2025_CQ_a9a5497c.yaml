影响分析:
  加油: 未直接涉及。本方案聚焦新能源项目（风电、光伏）上网电价市场化改革，加油业务与新能源上网电价机制无直接关联。
  充电: 未直接涉及。本方案明确新能源项目上网电量全部进入电力市场，充电运营商作为用户侧可参与市场交易，但正文仅规定用户侧在报装容量范围内自主决策日前市场申报购买量，未对充电场站、充电桩运营商制定具体参与规则或电价机制。
  电力_储能_V2G_交易: 未直接涉及。本方案虽完善辅助服务市场机制（调频、备用费用由用户用电量和未参与电能量市场交易的上网电量共同分担），但未明确储能、虚拟电厂、V2G、双向充电桩等主体的市场准入、交易资格或运营义务。
行动建议:
- 趁早梳理:充电场站作为用户侧参与电力现货市场、辅助服务市场的潜在合规路径,提前研究报装容量范围内自主申报的决策机制
- 趁早研究:分布式新能源项目聚合参与市场的机制设计,关注其与充电负荷、储能资源的协同调度可能性
didi_impact_one_liner: 本方案核心针对新能源项目上网电价全面市场化,与加油业务无直接关联;充电、电力储能业务虽受电力市场机制间接影响,但未在本方案中明确具体参与规则或电价安排。
