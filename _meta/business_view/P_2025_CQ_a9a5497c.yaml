影响分析:
  加油: 未直接涉及。该政策聚焦于新能源（风电、光伏）上网电价市场化改革，全部内容围绕发电侧电力市场机制设计，不涉及石油、燃气或传统加油站业务。
  充电: 未直接涉及。该政策主要规范新能源发电侧上网电价形成机制，虽涉及用户侧参与现货市场申报购买量，但正文未明确提及充电桩、充换电设施、V2G（车辆到电网）或分布式充电聚合商参与机制。充电运营主体作为电力用户参与市场交易属于间接观察（电价由市场形成可能影响充电运营商购电成本），但正文未对此作出具体规定或影响描述。
  电力_储能_V2G_交易: 未直接涉及。该政策核心对象为新能源发电项目（集中式风电、集中式光伏、分散式风电、分布式光伏），虽提出完善辅助服务市场机制（调频、备用费用分摊），且现货市场交易机制适用于电能量市场，但正文未明确出现储能设施、虚拟电厂（VPP）、V2G机制或电力交易（除绿电交易机制有具体规定外）的具体业务规则、准入条件或交易安排。储能等灵活性调节资源虽与新能源发展存在系统协同关系，但政策正文未将其列为直接规制或交易主体。
行动建议:
- A 趁早研究用户侧电价市场化影响：密切跟踪2026年新能源全面入市后分时电价机制演变，提前评估充电场站购电成本结构变化风险。
- B 趁早对接绿电绿证交易规则：学习理解机制电量与绿证收益衔接规则（当月合同电量、扣除机制电量后剩余上网电量、用电量三者取小原则），评估新能源项目绿证收益管理策略。
- C 趁早监测辅助服务费用分摊规则：关注调频、备用费用由用户用电量和未参与电能量市场交易的上网电量共同分担的动态，后续可能影响用户侧购电综合成本。
