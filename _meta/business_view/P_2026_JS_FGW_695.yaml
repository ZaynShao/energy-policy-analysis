  电力_储能_V2G_交易: 直接影响储能、虚拟电厂与电力交易。正文明确要求分布式光伏同步配套建设储能设施，鼓励园区配套建设虚拟电厂聚合平台并统一参与省内需求响应、电力现货市场；支持绿电直连、绿电直供及以荷定源方式满足用户绿电需求，涉及绿电物理溯源与降碳价值。未直接涉及V2G、双向充电或车网互动机制。
