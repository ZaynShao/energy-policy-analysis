- 趁早布局园区分布式光伏配套储能项目，结合“同步配套建设电网和储能设施”要求，储备园区级储能资源。
- 趁早研究虚拟电厂聚合平台参与需求响应和电力现货市场的业务模式，对应“鼓励园区配套建设虚拟电厂聚合平台”政策方向。
