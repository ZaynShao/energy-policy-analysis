- B 趁早：按正文“严查不执行国家价格政策、12315可举报”的监管口径，对贵州各站点开展价格合规自查，包括明码标价、不得突破最高批发价和零售价、调价时点（10月29日24时）执行到位，并明确商户价格合规责任。
