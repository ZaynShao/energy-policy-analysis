影响分析:
  加油: 直接相关。四川三个价区汽、柴油最高零售价格调整，零售企业可在不超过最高零售价的前提下自主定价；批发实行最高批发价，供方配送合同价受上限约束；对民营批发企业最高供应价按最高零售价扣减400元确定，并在零售价下调时同步下调。直接影响各价区挂牌价上限、批零价差与折扣空间、到站/到库成本及价格合规监测，执行时点为2026年10月29日24时。炼厂装车价未在本通知出现；KA总部支付接口开放口径未直接涉及。
  充电: 未直接涉及。正文仅调整成品油最高零售价和最高批发价，没有充电建桩、选址、服务费定价、场站电价结构、大功率/超充合规门槛或行业标准评级内容。间接观察（仅间接）：成品油调价会改变燃油车用能成本，可能影响油电相对成本，但不改变充电业务任何建设、定价或合规决策变量。
  电力_储能_V2G_交易: 未直接涉及。正文没有售电、电力交易、现货规则、中长期与现货比例、偏差考核、售电利润或分成、火电长协、储能、虚拟电厂（VPP）、V2G、分布式新能源入市或聚合商准入门槛等内容，不改变电力业务相关决策变量。
行动建议:
- 'A 趁早: 以2026年10月29日24时执行时点为界，按三个价区最高零售价和最高批发价重算各站挂牌价、批零价差与折扣空间，更新价格系统及合同价格，确保不突破上限。'
- 'B 趁早: 逐站核对供方配送合同是否约定配送费用；未约定的按现行规定执行，把配送费并入到站成本，修正单站毛利测算与报价底线。'
- 'C 研究: 跟踪零售价下调时民营批发企业最高供应价按最高零售价扣减400元同步下调的传导机制，评估采购渠道、批发合作价差及合同条款影响。'
- 'D 研究: 对照价格监管、市场动态监测和异常情况报告要求，梳理加油站价格执行留痕与异常上报接口。'
- 'E 研究: 本文件未涉及充电、储能、VPP、V2G、电力交易，不据此启动相关业务动作或新增合规义务。'
