影响分析:
  加油: 直接涉及燃油乘用车报废更新和置换更新补贴。报废2013年6月30日前汽油乘用车、2015年6月30日前柴油及其他燃料乘用车可申请补贴；换购2.0升及以下排量燃油乘用车按车价6%-10%补贴最高1.5万元。政策刺激燃油车新车销售，间接增加燃油消费需求。
  充电: 直接涉及新能源乘用车报废更新和置换更新补贴。报废2019年12月31日前新能源乘用车可申请补贴；换购新能源乘用车按车价8%-12%补贴最高2万元。政策显著刺激新能源汽车新车销售，直接扩大充电需求规模。
  电力_储能_V2G_交易: 未直接涉及。正文仅明确报废更新和置换更新补贴机制，未提及V2G、虚拟电厂、储能、电力交易或双向充电桩等相关内容。
行动建议:
- 趁早研判燃油车报废高峰期的油品需求波动,提前调整区域油品供应链和库存策略
- 趁早对接地方置换更新信息平台,探索将补贴申请与油品/充电会员权益联动营销
- 趁早布局报废车辆回收拆解资质合作,抢占旧车报废源头渠道
- 趁早规划充电场站扩容,匹配新能源汽车补贴带动的增量充电需求
- 趁早研究报废旧电池回收溯源机制,为后续电池梯次利用或回收业务储备资源
didi_impact_one_liner: 新能源汽车报废更新最高补贴2万元、置换更新最高1.5万元,直接刺激新能源车销量带动充电需求,燃油车报废和置换补贴间接利好油品消费,同时旧车报废催生回收拆解和电池回收产业链机会
