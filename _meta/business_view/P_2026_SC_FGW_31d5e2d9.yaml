影响分析:
  加油: 直接涉及。四川省三个价区汽、柴油最高零售价格和最高批发价格随国家调整同步下调；成品油零售企业可在不超最高零售价前提下自主定价，批发企业与零售企业可协商定价；对符合资质的民营批发企业执行最高供应价格并按最高零售价扣减400元的差价规则。属于价格类行政调整，不涉及经营资质、市场准入或企业数量变化。
  充电: 未直接涉及。该通知仅调整成品油价格，未涉及充电服务费、充电设施或新能源汽车用电价格。
  电力_储能_V2G_交易: 未直接涉及。正文未提及储能、V2G、虚拟电厂、电力交易、反向充电或双向充电桩等内容。
行动建议:
- 趁早：加油站对照四川三个价区最新最高零售价和批发价，在允许范围内复核并调整挂牌价与批发合同条款，同步更新系统价格参数，确保执行新价。
- 趁早：成品油批发部门按新价格传导规则核查对民营批发企业的供应价格，确保差价不小于400元，避免合同执行和价格合规风险。
- 研究：本次为价格调整而非监管框架变化，可研究油价下调窗口期内油品与非油品、油与电的短期比价对客户消费结构的影响，仅作经营参考，不据此新增业务。
didi_impact_one_liner: 油价下调，加油业务需及时合规调价；充电、储能及电力交易业务不受该文件直接影响。
