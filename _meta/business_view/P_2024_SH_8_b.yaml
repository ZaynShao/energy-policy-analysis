影响分析:
  加油: 公共领域车辆电动化加速推进。到2025年,公交、巡游出租车基本实现电动化;党政机关、国有企事业单位、环卫、邮政等公共领域新增或更新车辆原则上使用新能源车辆。核心区域燃油消费替代压力上升。
  充电: 公共领域全面电动化带来充电基础设施规模化需求。政策目标2025年公交、巡游出租车基本实现电动化,公共领域新增车辆原则上新能源化,充电桩建设运维需求进入政策加速期。
  电力_储能_V2G_交易: 政策明确推动新型储能规模化应用、V2G技术发展、虚拟电厂建设和区域源网荷储一体化示范,需求侧尖峰负荷响应能力2025年目标不低于5%。储能、V2G、虚拟电厂参与电力交易机制获政策支撑,需求侧响应资源进入电力市场具备制度基础。
行动建议:
- A 趁早研究:公交/出租车电动化替代对核心区加油站网络的结构性影响,评估油品销量下降趋势下的资产优化路径
- B 趁早布局:公共领域车辆电动化带来的充电桩建设运维市场机会,加强与公交、环卫等公共领域用车单位的充电服务合作
- C 研究:储能规模化应用、V2G技术发展与虚拟电厂建设中的参与模式,探索充电运营商向能源服务商的转型路径
- D 趁早跟进:需求侧响应及虚拟电厂参与电力交易的政策细则和试点项目,储备相关技术能力和资质条件
didi_impact_one_liner: 上海明确推动储能/V2G/虚拟电厂规模化发展和公共领域车辆电动化,充电业务迎政策红利,储能V2G参与电力交易具备制度基础,但油品业务面临结构性替代压力。
