影响分析:
  加油: 未直接涉及。方案聚焦能源绿色低碳转型和交通电动化，未对传统加油业务提出直接改造或替代要求。但需关注公共领域车辆电动化加速带来的潜在用油需求结构性下降。
  充电: 政策明确推动公共领域用车全面电动化：2025年公交、巡游出租车基本实现电动化；党政机关、国有企事业单位、公共领域新增或更新车辆原则上使用新能源车辆；鼓励社会乘用车电动化。直接驱动新能源汽车保有量增长，带动充电需求扩大。
  电力_储能_V2G_交易: 方案明确：加快新型储能规模化应用、需求侧响应及V2G技术发展；开展虚拟电厂建设和区域源网荷储一体化示范；到2025年需求侧尖峰负荷响应能力不低于5%。直接为储能、V2G、虚拟电厂业务创造政策支撑和发展空间。V2G技术发展和虚拟电厂建设获政策明确推动。需求侧响应能力指标(5%)为聚合商和负荷管理业务提供量化目标。
行动建议:
- A 趁早布局充电网络：结合公共领域电动化目标，提前规划公交场站、出租车服务区、政府机关等场景的充电设施建设方案，匹配政策驱动的充电需求增长。
- B 研究V2G商业模式：基于政策明确的V2G技术发展方向，趁早研究车网互动盈利路径，探索储能调度和电力交易结合的业务模型。
- C 争取虚拟电厂参与资格：趁早对接区域源网荷储一体化示范项目，参与需求侧响应市场，储备聚合商运营能力。
- D 关注储能成本优化：趁早评估新型储能规模化应用趋势下的成本竞争力，探索峰谷套利和辅助服务收益机会。
didi_impact_one_liner: 上海明确推动V2G、虚拟电厂、新型储能发展并设定需求侧响应目标，公共领域电动化加速为充电业务带来确定性增长机遇。
