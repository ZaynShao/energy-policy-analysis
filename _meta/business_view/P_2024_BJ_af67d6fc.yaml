影响分析:
  加油: 直接涉及。报废旧燃油车(2.0升及以下排量)购买新车补贴从7000元提至1.5万元，政策加力将加速存量高排放燃油车淘汰更新，短期内释放一批换车需求，为加油站带来存量客户更新机遇。
  充电: 直接涉及。报废旧车购买新能源乘用车补贴从1万元翻倍至2万元，政策激励力度大幅提升;同时明确将出台个人乘用车置换更新为新能源车的支持政策，双重利好将显著扩大新能源汽车市场规模，带动充电需求增长。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦消费端补贴，未涉及储能建设、虚拟电厂、V2G、双向充放电或电力交易机制。家电以旧换新补贴针对8类家电的能效标准提升，属于终端用能效率改善，非新型电力系统建设范畴。
行动建议:
- 'A 趁早: 趁政策加力窗口期，提前布局报废更新客户引流合作，锁定燃油车淘汰带来的增量市场。'
- 'B 趁早: 趁新能源车补贴翻倍和新置换政策出台前，加快与新能源品牌、充电运营商的引流合作，提前占位充电生态。'
- 'C 研究: 跟踪老旧货车更新补贴政策研究进展，判断商用车领域能源替代节奏。'
- 'D 研究: 监测政策对二手车市场的影响，评估老旧燃油车流入二级市场对加油业务的滞后效应。'
didi_impact_one_liner: 报废更新补贴翻倍加速油车淘汰和电车普及，短期内利好油品更新需求和中长期充电市场扩容，但未涉及储能/V2G/电力交易机制。
