影响分析:
  加油: 未直接涉及。该文件为省级虚拟电厂参与电力市场交易的实施方案，未涉及成品油批发价/炼厂装车价、油站安全与财税法合规成本、KA总部合作与支付接口口径，也未涉及下沉城市展业条件，不改变加油业务任何决策变量。间接观察：若VPP后续降低湖南本地工商业用电成本，对油电替代的边际格局有极弱间接影响，但不构成加油侧动作依据。
  充电: 未直接涉及（就可见正文而言）。可见内容仅为网页框架与标题，未写明充电桩、充电场站可参与VPP聚合，也未涉及建桩节奏与选址、充电服务费定价空间、场站侧峰谷/需量电价结构或大功率超充的合规门槛。间接观察（须标明间接）：VPP方案通常以可调负荷为聚合对象，充电场站理论上具备成为聚合资源的可能，但本文件未写明开放与否、以何门槛开放，不得据此推演充电业务收益模型或建桩计划变化。
  电力_储能_V2G_交易: 直接相关，但仅到“通道开放”层面，细则需人工裁定。标题确认湖南省出台《虚拟电厂参与电力市场交易实施方案（试行）》，即湖南在省级层面为虚拟电厂参与电力市场交易建立规则通道，直接落在“分布式新能源入市与聚合商准入门槛”“目标省现货规则与结算机制”这两个决策变量上——公司电力业务对湖南“进不进”的判断需要重估。但正文节选只有标题与网站导航，准入条件、可聚合资源类型（是否包含储能、充电桩、V2G/车网互动）、结算与偏差考核机制、与中长期/现货市场的衔接方式均未在可见内容中出现，属画像空白维度上的政策，具体是否改变任何一个数值应标为“需人工裁定”，不得自动判低相关，也不得据标题推演具体门槛或交易机会。
行动建议:
- A 趁早:由电力业务团队下载省发改委原文附件（方案.docx），逐条提取准入条件、可聚合资源类型、结算与考核口径，对照本文件 decision_variables
  判定湖南是否需要进入电力业务目标省清单。
- B 研究:若公司在湖南持有充电场站或储能资产，在原文确认充电桩/储能/V2G是否被列为可聚合资源之前，仅做资源台账梳理与规则比对，不做投资、合作或业务承诺。
- C 研究:建立省级VPP与聚合商政策跟踪模板（准入资质/可聚合资源/结算机制/考核上限四栏），用于后续同类省级方案横向比较与优先级排序。
didi_impact_one_liner: 湖南首度为虚拟电厂入市立规，直接触碰电力业务的“聚合商准入门槛+目标省进入判断”两个决策变量，但细则全在未展开的附件中，须先取原文由人工裁定，才能决定是否布局湖南。
