影响分析:
  加油: 未直接涉及。该政策聚焦于充电和换电基础设施补贴，加油业务不在补贴范围内。
  充电: 直接利好。公（专）用充电场站按星级享受100/70/40元/千瓦补贴，单站最高20万元；"智慧小区"充电项目按星级享受3000/2100/1200元/车位补贴，单小区最高6万元。政策要求接入成都市监测平台并通过考核考评，补贴重点领域为乡乡全覆盖、高速服务区、景区等。申报企业须通过居民小区充电基础设施运营单位能力符合性评审。
  电力_储能_V2G_交易: 未直接涉及。政策补贴范围仅限于充电基础设施和换电设施，虽提及接入监测平台但未涉及储能、V2G、双向充电桩或电力交易机制，政策亦未覆盖虚拟电厂、聚合商或需求响应。
行动建议:
- A 趁早:对照三星/二星/一星等级标准，评估现有公（专）用充电场站设施条件与考核要求差距，制定升级改造计划以获取更高补贴档次
- B 趁早:梳理在蓉住宅小区项目资源，编制"智慧小区"充电基础设施申报方案，把握单小区最高6万元的补贴窗口
- C 趁早:完成成都市新能源汽车及充电基础设施监测监管平台接入对接，满足申报条件中的强制检定和验收报告要求
- D 趁早:启动居民小区充电基础设施建设运营单位能力符合性评审准备工作，确保申报资质合规
- E 研究:关注换电模式应用试点范围动态，若具备条件可布局服务≥3个品牌的换电站获取300元/千瓦建设补贴
didi_impact_one_liner: 成都充电基础设施补贴政策明确，公用/专用场站和住宅小区充电项目可获分级补贴，需接入市级监测平台并通过考核，建议尽快评估现有场站条件匹配补贴标准
