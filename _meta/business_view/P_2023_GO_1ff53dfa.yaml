影响分析:
  加油: 未直接涉及。本政策聚焦电动汽车充（换）电基础设施补贴，不涉及燃油补给业务。
  充电: 直接利好。公（专）用充电基础设施享分层补贴（三星100元/千瓦至一星40元/千瓦，单站最高20万）；换电设施享300元/千瓦建设补贴（单站最高100万）及每年0.2元/千瓦时运营补贴（单站最高20万/年）；"智慧小区"充电项目享3000元/车位至1200元/车位分级补贴（单小区最高6万）。申报须接入成都市监测平台并取得星级考核。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦充电/换电设施建设运营补贴，未提及储能、V2G、双向充放电、虚拟电厂或电力交易机制。
行动建议:
- 趁早对照补贴标准布局公（专）用充电场站，重点向高速公路服务区、景区及乡乡全覆盖领域倾斜，优先争创三星评级以获取最高100元/千瓦补贴。
- 趁早接入成都市新能源汽车及充电基础设施监测监管平台、四川省监管平台及"川逸充"APP，确保满足申报前置条件。
- 趁早对接换电模式应用试点资格，锁定300元/千瓦建设补贴及年度运营补贴窗口，服务3个及以上品牌以满足申报门槛。
- 研究：跟进"智慧小区"项目申报要求，提前与小区管理单位签订合作协议，布局居民区充电运营。
- 研究：关注场站考核考评星级标准的具体细则，建立长效运维机制以维系星级资格。
didi_impact_one_liner: 成都充电基础设施补贴政策明确，公（专）用充电/换电/智慧小区充电均享分层补贴，需趁早接入监管平台并布局高速服务区、景区等场景。
