  加油: 未直接涉及。公告仅规定湖北省2026年汽车以旧换新（含报废更新、置换更新）补贴申请截止时间及材料取得期间，未涉及批发价/炼厂装车价、商户合规成本、KA对外合作或下沉城市展业；间接看或影响个人换车节奏，但不改变加油业务任何决策变量。
  充电: 未直接涉及。正文未提充电设施、建桩选址、服务费定价、场站电价结构、大功率/超充或标准评级；仅可作间接观察：以旧换新可能影响私家车置换节奏，从而间接影响2C充电需求，但公告未给出任何充电业务要求或量化指标。
  电力_储能_V2G_交易: 未直接涉及。正文未出现电力交易、现货规则、售电公司、火电长协、分布式新能源入市、储能、VPP、V2G或聚合商机制；不改变电力业务进入省份、持仓结构或收益分成等决策变量。
