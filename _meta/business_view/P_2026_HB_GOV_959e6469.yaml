- 'A 趁早: 将补贴申请截止时间（2027年1月10日24时，材料补正至2027年1月20日24时）及发票/登记须在2026年内取得的要求，纳入加油/充电场站面向车主的政策提示口径，避免客户因错过节点产生客诉。'
