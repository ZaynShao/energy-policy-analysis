影响分析:
  加油: 贵州89#汽油(国VIB)、0#柴油最高批发、零售限价每吨分别上调395元、385元,直接改变省内各价区站点的挂牌价上限与可售价格区间,是必须执行的合规硬约束(不得超最高批发/零售价)。公司利润核心(炼厂装车价、批发折扣空间)不由此文件决定,价差模型与KA总部合作口径不变。正文同时要求经营企业切实承担省内成品油市场供应责任、督促分支机构严格执行国家价格政策,并配套市场监管查处与12315举报机制,贵州站点的价格执行与合规成本上升。
  充电: 未直接涉及。正文仅针对贵州成品油(89#汽油、0#柴油)限价调整,未提及充电桩建设、服务费定价、场站电价或超充标准。间接看,汽油终端价格上调在边际上抬升燃油车使用成本、相对改善电动车经济性对比,但属间接观察,不改变任何在做的充电动作。
  电力_储能_V2G_交易: 未直接涉及。正文未出现售电、电力交易、现货规则、中长期比例、分布式新能源入市、储能、虚拟电厂或V2G/反向充电等任何机制表述,对电力业务的目标省进入判断与持仓结构无影响。
行动建议:
- A 趁早:按新限价更新贵州各价区89#汽油(国VIB)、0#柴油的挂牌价与批发报价上限口径,确保各站点不超最高批发、零售价格,规避“不执行国家价格政策”查处及12315举报风险。
- B 研究:结合本次上调测算贵州站点批零价差与促销空间的实际变化,评估区域促销与供应保障安排是否需跟进(正文明确要求经营企业承担省内市场供应责任)。
didi_impact_one_liner: 贵州成品油最高批发/零售限价每吨上调395/385元,仅改变加油业务的挂牌价上限与合规执行口径,充电与电力业务不受影响。
