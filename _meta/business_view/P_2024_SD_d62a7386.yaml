影响分析:
  加油: 未直接涉及。正文明确碳市场目前只纳入发电行业，扩围行业为电力、钢铁、建材、有色、石化、化工、造纸、航空，不包括加油/加油站业务。
  充电: 未直接涉及。正文碳市场扩围的8个行业为电力、钢铁、建材、有色、石化、化工、造纸、航空，不包括充电基础设施建设或运营。
  电力_储能_V2G_交易: 直接涉及。山东省碳市场以发电行业为核心，300余家发电行业重点排放单位参与碳配额交易与履约。《碳排放权交易管理暂行条例》5月1日施行后碳市场将首次扩围，电力行业配额分配方法、核算报告方法正由省厅配合研究，配额收紧趋势明确，发电企业碳资产管理能力已成核心竞争要素。
行动建议:
- 趁早:趁早梳理存量燃煤发电机组的碳排放强度和配额盈缺情况，对照扩围后加严的配额基准值预判履约缺口，提前在碳市场买入配额或部署CCER抵销。
- 趁早:趁早升级碳排放数据监测体系，确保燃煤含碳量实际检测比例维持99%以上的高标准，避免因数据质量问题产生额外配额缺口。
- 趁早:趁早参与省厅配合生态环境部开展的扩围专项研究，在配额分配方法、核算要求指南等政策形成阶段主动反馈意见，争取有利条款。
- 趁早:趁早将碳成本纳入电力交易报价模型，履约周期内的碳价波动与电力现货价格联动管理将成为常态化运营逻辑。
didi_impact_one_liner: 碳市场扩围压力下电力交易侧碳成本将刚性上升，发电企业碳资产管理能力成为履约竞争力的关键变量。
