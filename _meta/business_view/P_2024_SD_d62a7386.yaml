影响分析:
  加油: 未直接涉及。正文仅明确提及全国碳排放权交易市场目前只纳入发电行业，未来扩围方向为钢铁、建材、有色等工业行业，加油业务未在正文出现。
  充电: 未直接涉及。碳市场直接约束对象为发电行业重点排放单位，充电业务（新能源汽车充电桩/运营商）未在正文提及。
  电力_储能_V2G_交易: 直接涉及：1）发电企业为碳市场核心约束对象，山东省配额盈余企业由146家增至186家、缺口企业由174家减至128家，碳排放管理能力成为电力行业核心竞争力；2）碳市场扩围准备工作涵盖电力行业，8个行业700余家重点排放单位开展年度碳排放核算报告核查；3）《碳排放权交易管理暂行条例》5月1日施行，碳市场监管将趋严；4）近零碳示范创建涉及20个县市区、20个园区、30个社区，将推动区域用能结构优化和清洁能源消纳。
行动建议:
- '趁早建立碳资产管理能力: 碳市场扩围在即，电力行业直接承压，建议提前布局碳排放监测、配额交易和履约策略，避免配额缺口导致成本激增'
- '趁早对接区域近零碳示范: 山东省正在推进20个县市区/园区/社区的近零碳示范创建，电力企业可主动参与用能侧合作，拓展园区级综合能源服务'
- '研究扩围行业溢出效应: 电解铝等工业行业纳入碳市场将影响高载能产品供需格局，电力交易策略需同步关注工业端碳成本传导'
didi_impact_one_liner: 山东碳市场两周期100%履约率彰显区域碳管理能力，电力企业直接承压于碳配额收紧和5月新规，未来扩围至8行业将重塑能源成本结构。
