影响分析:
  加油: 加油站增设充电设施可免申领建设工程规划许可证（需满足消防、安全、市容环境等要求），间接利好加油站业务延伸充电服务。加油业务本身未在正文中直接涉及。
  充电: 政策核心对象。直接影响包括：充电设施产品须取得CMA/CNAS合格报告及强制认证；建设前须到区工信部门办理登记手续；须按广州市充电设施智能管理平台通讯规约录入实时数据；运营企业须纳入平台信息录入管理并满足总功率不少于2000kW方可申请财政补贴；须履行安全生产主体责任。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦充电基础设施建设运营的行政管理与安全监管，储能、V2G、虚拟电厂、电力交易等机制未在正文中出现。
行动建议:
- 趁早核查现有充电设施产品是否符合CMA/CNAS标准及强制认证要求，提前完成产品合规整改
- 趁早对接广州市充电设施智能管理平台，按平台通讯规约完成系统对接和数据录入准备
- 趁早评估总功率达到2000kW所需的场站数量和建设计划，以具备财政补贴申请资格
- 趁早建立充电设施运行维护管理制度及安全生产主体责任体系，提前满足运营安全监管要求
- 趁早准备建设登记材料，明确场地属性（既有停车位/新建独立占 地），分类办理相应手续
didi_impact_one_liner: 广州充电市场进入规范化监管期，运营企业须加快平台接入、产品合规和功率门槛建设以获取补贴资质，加油站增设充电设施路径明确但仍须满足安全和市容要求。
