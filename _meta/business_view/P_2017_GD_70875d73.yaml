影响分析:
  加油: 政策明确在既有加油加气站增加安装充电设施可免于申领建设工程规划许可证，为加油站拓展充电业务提供规划便利。但文件未直接涉及加油业务本身，也未提及针对加油+充电站融合项目的额外补贴或准入优惠。
  充电: 直接影响明确：产品须取得CMA/CNAS标识合格报告及强制性认证；新建独立占地的充换电站须符合专项规划并按公用设施用地模式办理手续；公用/专用充电设施实行开工前登记管理；所有公用专用充电设施须按平台通讯规约录入实时数据；财政补贴须满足管理平台信息录入、平台出具录入报告、已建成正常营运总功率≥2000kW等条件；运营企业须承担安全生产主体责任。
  电力_储能_V2G_交易: 未直接涉及。文件聚焦充电基础设施的规划建设、运营管理和财政补贴，未出现储能、电力交易、V2G、虚拟电厂等机制或业务表述。
行动建议:
- A 趁早:梳理现有充电设施产品清单，对照CMA/CNAS认证和强制性产品认证要求启动合规改造或采购替代，确保产品符合验收规范。
- B 趁早:在项目开工建设前，到所在区工业和信息化部门完成公用/专用充电设施建设登记手续，避免违规风险。
- C 趁早:将企业信息及所有公用、专用充电设施实时数据接入广州市充电设施智能管理平台，为后续申请财政补贴打通数据通道。
- D 趁早:对照财政补贴申请条件（如已建成正常营运总功率≥2000kW），评估现有设施规模与补贴门槛的差距，提前规划功率达标路径。
- E 研究:在穗工信规字〔2017〕2号明确框架内，评估利用既有加油加气站场地增设充电设施的可行性，充分利用免规划许可的政策空间。
didi_impact_one_liner: 广州充电设施监管全面收紧，产品合规、平台数据接入、财政补贴门槛（总功率≥2000kW）三维度直接影响现有及新增充电运营业务，配套加油加气站增设充电设施获规划豁免。
