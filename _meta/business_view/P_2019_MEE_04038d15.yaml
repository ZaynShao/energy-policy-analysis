  加油: 未直接涉及。加油业务本身不属于碳排放权交易的管理对象。但碳市场若覆盖交通燃料领域，燃油供应链成本可能受到碳价传导影响，属于间接关联（需待行业范围扩展后确认）。
  充电: 未直接涉及。充电业务未被列入碳排放权交易的管理范围。新能源汽车减碳效益主要通过豁免配额义务体现，不构成碳市场直接交易机会。
  电力_储能_V2G_交易: 未直接涉及。条例规范的是碳排放权交易机制，明确的交易主体为"重点排放单位"和"自愿参与碳排放权交易的单位和个人"。未提及储能、V2G、虚拟电厂或电力交易与碳市场的联动机制。
