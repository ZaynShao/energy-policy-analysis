影响分析:
  加油: 未直接涉及。条例主要针对重点排放单位建立碳排放权交易管理框架，涉及行业范围另行公布，燃料零售未在正文明确提及或直接纳入。
  充电: 未直接涉及。条例明确覆盖范围由行业目录另行确定，电动车充换电设施未被正文直接点名，主要约束对象为纳入名录的重点排放单位及其上游排放源。
  电力_储能_V2G_交易: 直接涉及。条例明确适用于电力等温室气体排放行业(第五条)，确立配额分配、清缴(第十一条)及碳减排指标可用于履行清缴义务(第十一条第三款)的交易机制；重点排放单位须定期提交排放报告并接受核查(第八条)，超配额排放须在12月31日前通过购买方式补足(第十一条)。
行动建议:
- A 趁早研判自身是否将被纳入重点排放单位名录,提前建立内部碳排放监测与核算体系,对接MRV合规要求;
- B 趁早建立碳资产台账与交易能力,储备配额余量并关注碳减排指标的合规抵销路径,提前布局碳市场交易策略;
- C 研究本条例与后续行业覆盖名单的衔接时序,评估电力相关业务的碳成本敞口,制定配额买卖与履约时点的财务预案;
- D 研究条例框架下的核查机构资质要求,评估是否具备参与碳核查服务或碳资产管理服务的市场机会;
didi_impact_one_liner: 条例为电力行业碳排放权交易奠定法律框架,配额清缴与碳减排指标抵销机制直接影响电力业务碳成本与交易策略,加油与充电业务暂未直接纳入。
