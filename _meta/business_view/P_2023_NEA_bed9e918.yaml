  加油: 直接涉及。政策明确支持有加油站经营资质的企业在所经营的加油站开展生物柴油加注，并鼓励以高速公路沿线加油站为主体推广，还提出组织石油销售企业参与'定向销售、产需衔接'。
  充电: 未直接涉及。政策聚焦生物柴油在车用、船用等场景的推广应用，未涉及充电桩、电动车充换电设施或相关业务。
  电力_储能_V2G_交易: 未直接涉及。政策针对废弃油脂生产的生物柴油推广，不涉及储能、V2G、虚拟电厂、电力交易或双向充电桩等机制。
行动建议:
- A 趁早对接石油销售企业，参与生物柴油'定向销售、产需衔接'的供应链协同
- B 研究加油站生物柴油加注的技术改造可行性及合规要求
