影响分析:
  加油: 规划明确以纯电驱动为战略取向，新能源汽车产业发展将成为汽车强国战略核心，传统燃油车面临长期替代压力。加油业务虽未直接受监管，但作为存量市场将承受结构性萎缩风险。
  充电: 规划将充电基础设施建设滞后列为待解决问题，明确作为产业发展重点任务，充电网络完善将获国家层面持续推动。充电服务作为新能源汽车核心配套，迎来规模化扩张机遇期。
  电力_储能_V2G_交易: 规划明确新能源汽车将向'储能单元'和'数字空间'转变，为车网互动预留技术融合空间。但规划为顶层设计文件，V2G具体电价机制、电网调度规则、市场准入条件等实操细节尚未明确，当前仍处战略方向阶段。
行动建议:
- A 趁早:研判充电桩建设运营的市场容量与区域布局策略，对接规划明确的基础设施发展方向
- B 研究:跟踪后续配套政策中V2G、储能参与电力市场的实施细则，待技术标准明确后评估业务切入时机
- C 趁早:评估加油业务资产组合的战略定位，前瞻布局油电混合服务区或充电换电一体化站点转型路径
didi_impact_one_liner: 充电基础设施迎国家战略加持，V2G储能方向已定但落地规则待明，加油业务面临长期替代压力需提前谋划转型。
