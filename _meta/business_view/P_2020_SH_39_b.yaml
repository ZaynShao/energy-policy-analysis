影响分析:
  加油: 未直接涉及。该规划聚焦新能源汽车产业，核心是电动化路径，对传统燃油车业务无直接政策影响。
  充电: 直接涉及。规划明确要求科学规划布局充换电基础设施建设，加强与城乡建设规划、电网规划及物业管理、城市停车等的统筹协调。充换电基础设施成为产业发展重点任务，为充电运营企业提供明确政策支持和发展空间。
  电力_储能_V2G_交易: 直接涉及V2G。规划将新能源汽车定位为“储能单元”，明确推动新能源汽车与可再生能源高效协同，鼓励新能源汽车充放电、换电等基础设施与能源系统融合互动，V2G成为能源系统协同的关键机制，充放电（双向）基础设施具备政策依据。储能单元定位为后续参与电网互动奠定基础，但具体交易机制和参与方式需进一步研究。
行动建议:
- A 研究:趁早研究充放电双向充电桩的合规建设标准与电网接入要求，布局V2G基础设施能力
- B 趁早:趁早与地方电网企业建立充放电基础设施协同机制，对接能源系统融合的政策要求
- C 趁早:趁早将充电网络规划纳入地方城乡建设规划协调范畴，争取基础设施布局主动权
didi_impact_one_liner: 规划明确V2G机制和储能单元定位，要求科学布局充换电基础设施，充电运营面临规模化发展窗口期，需趁早布局双向充放电基础设施并对接电网协同机制
