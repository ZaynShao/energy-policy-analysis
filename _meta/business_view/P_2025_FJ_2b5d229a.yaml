影响分析:
  加油: 未直接涉及。该方案聚焦电力市场中长期交易规则，加油业务（油气）不在本方案调整范围内。
  充电: 未直接涉及。方案虽覆盖工商业用户和市场主体，但未直接提及充电桩、充换电设施或新能源汽车充电相关内容。10千伏及以上工商业用户直接参与市场的规定属于通用市场准入规则，不特指充电业务。
  电力_储能_V2G_交易: 直接涉及。方案明确将独立新型储能、虚拟电厂运营商列为新型经营主体，具备条件后可参与市场交易；绿电交易在年度、月度、月内各周期均有专门交易品种安排，包括年度（多年）绿电双边协商交易、环境价值约定等机制。
行动建议:
- '趁早: 若具备独立储能或虚拟电厂运营能力，尽快对照交易规则完善技术接入和资质准备，在年度批发市场开市前完成准入条件确认'
- '趁早: 研究绿电交易机制中的环境价值定价模式和多年期双边协商交易机会，提前与新能源发电侧建立合作意向'
- '趁早: 评估作为批发用户或零售用户直接参与市场的最优路径，特别是新增10千伏及以上工商业用户的6个月全电量入市时限要求'
- '研究: 关注滚动撮合交易（D-2日组织D日交易）的操作流程和风险管控要求，评估短期市场波动中的交易策略'
didi_impact_one_liner: 新型储能/虚拟电厂准入规则明确，绿电交易周期机制细化，为综合能源服务商提供市场参与路径。
