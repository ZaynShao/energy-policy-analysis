影响分析:
  加油: 未直接涉及。该政策聚焦于燃煤发电上网电价市场化改革，旨在疏导煤电企业成本倒挂问题，与加油站燃油销售业务无直接关联。
  充电: 未直接涉及。正文仅涉及燃煤发电企业上网电价改革，未涉及充电基础设施、充电桩运营或新能源汽车充电市场。电价浮动范围(上限20%)虽与充电运营成本相关，但非正文明确事项。
  电力_储能_V2G_交易: 未直接涉及。正文仅针对燃煤发电企业上网电价市场化，虽属电力市场范畴，但未涉及储能、V2G、虚拟电厂或新型电力交易机制。电力交易主体为燃煤发电企业，非其他市场主体。
行动建议:
- 'A 趁早: 跟踪后续省级电力交易规则细化，关注煤电价格波动向其他电源类型传导的可能性，为充电及综合能源业务成本测算积累电价数据。'
- 'B 研究: 梳理公司现有电力采购合约结构，结合20%浮动上限评估存量燃煤电量价格变动对经营成本的影响边界。'
didi_impact_one_liner: 江苏煤电上网电价市场化首笔交易落地，价格浮动上限20%，未直接涉及充电/储能/V2G业务，但需跟踪电价改革传导效应。
