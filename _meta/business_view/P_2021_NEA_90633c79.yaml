影响分析:
  加油: 未直接涉及。该政策聚焦燃煤发电上网电价市场化改革，旨在疏导煤电企业因煤炭价格上涨带来的成本压力，与加油业务无直接关联。
  充电: 未直接涉及。政策内容为煤电上网电价市场化改革及燃煤发电企业成本疏导，未直接涉及新能源汽车充电服务、充电桩运营或充换电业务。电价浮动机制主要针对燃煤发电侧，充电业务领域不在本次改革直接范围内。
  电力_储能_V2G_交易: 未直接涉及。该政策核心目标是疏导燃煤发电企业成本压力，虽涉及电力市场交易和电价浮动机制，但正文未明确提及储能、虚拟电厂(VPP)、V2G、电力交易新机制或相关市场准入、运营义务等事项。
行动建议:
- A 趁早:跟踪各地煤电上网电价市场化改革落地进展，关注浮动范围扩大对区域电力市场交易格局的潜在影响
- B 研究:梳理煤电电价浮动机制与后续可能延伸至其他电源类型的市场化改革之间的传导路径，为电力业务中长期定价策略做准备
didi_impact_one_liner: 本次江苏煤电上网电价市场化改革首次交易落地，聚焦疏导煤电企业成本压力，充电及加油业务未受直接波及，但电力侧电价浮动机制扩大可能为后续能源市场结构性变化埋下伏笔。
