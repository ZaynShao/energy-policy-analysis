影响分析:
  加油: 未直接涉及。该政策聚焦新能源（风电、光伏）就近消纳，涉及电源侧（新能源）、电网侧（增量配电网）、用户侧（工商业负荷），不涉及传统加油业务。
  充电: 直接涉及。政策明确鼓励国家级零碳园区内存量负荷开展新能源就近消纳，充电桩/充电站作为可控负荷可纳入绿电直连体系，获得新能源直供电；同时政策鼓励深挖负荷灵活调节潜力，充电运营商可探索将充电设施作为需求响应资源参与电力市场。
  电力_储能_V2G_交易: 部分直接涉及。政策要求新能源就近消纳项目按产权分界点与公共电网结算，鼓励配置储能提升消纳能力，支持探索虚拟电厂新技术；但V2G（反向充电）未在正文中出现，电力交易（除绿证/绿电交易外）机制仍待新疆电力现货市场正式运行后明确。
行动建议:
- 'A 趁早: 研究零碳园区内充电基础设施申请参与绿电直连的路径，评估将充电负荷纳入就近消纳体系的可行性'
- 'B 趁早: 对接新疆增量配电网主体，探索充电运营商与增量配电网合作的新能源消纳商业模式'
- 'C 研究: 关注新疆电力现货市场建设进度，提前布局充电负荷作为灵活调节资源参与需求响应的技术方案'
- 'D 研究: 梳理公司现有充电场站地理位置，若位于国家级零碳园区范围内，趁早研究负荷聚合参与绿电交易的资质条件'
didi_impact_one_liner: 充电业务可直接受益于新疆绿电直连政策，在零碳园区内的新能源充电场站可纳入就近消纳体系，获得低成本绿电供给，同时充电负荷可作为灵活调节资源参与虚拟电厂和需求响应。
