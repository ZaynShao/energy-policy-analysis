影响分析:
  加油: 未直接涉及。该文件聚焦电力市场交易规则，规范发电企业、售电公司、电力用户之间的电力交易，不涉及燃油或加油站业务。
  充电: 未直接涉及。政策虽涉及电力用户参与市场交易，但正文未直接提及充电设施、充电桩或新能源汽车充电服务等具体业务场景。
  电力_储能_V2G_交易: 直接涉及。（1）售电公司被明确列为市场主体，纳入注册制管理体系；（2）独立辅助服务提供者被列为市场成员；（3）电力批发市场和零售市场的双层架构为售电业务提供规则框架；（4）偏差考核机制（预考核期2019年1-3月）影响市场主体的电量管理要求；（5）市场退出用户由电网企业承担保底供电责任的机制明确。
行动建议:
- A 趁早:研究售电公司注册流程及准入条件，评估作为市场主体参与河南电力批发/零售市场的合规路径
- B 趁早:对照偏差考核规则（预考核期通知但不收费），提前建立内部电量预测和偏差管控能力
- C 研究:关注政策动态，特别是2021年及之后的偏差考核正式执行时间及费用征收规则
- D 研究:跟踪河南电力市场管理委员会的行业建议，研判市场模式从单一电量向分时电量过渡的政策走向
didi_impact_one_liner: 河南电力市场交易规则（试行）正式落地，售电业务获明确规则框架，偏差考核机制（2019Q1预考核）倒逼市场主体强化电量精细化管理能力。
