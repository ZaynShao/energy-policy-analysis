影响分析:
  加油: 直接涉及。政策明确对购买国六b排放标准燃油小客车的消费者给予1.3万元定额补贴，条件为置换本人名下在上海市登记的国五及以下排放标准旧燃油车。该补贴将刺激燃油车置换需求，对燃油车销售业务形成直接利好。
  充电: 间接涉及。新能源小客车（含纯电动、插电混动、增程式）可获1.5万元定额补贴，客观上将带动新能源汽车消费并间接增加充电需求。但政策聚焦于购置补贴，未涉及充电基础设施建设或运营补贴。
  电力_储能_V2G_交易: 未直接涉及。政策仅针对个人消费者购买新车的购置补贴，不涉及储能设施、V2G技术、虚拟电厂、电力交易等能源系统层面的业务领域。
行动建议:
- '趁早: 抓住置换补贴窗口期，针对国五及以下旧燃油车车主开展定向营销，锁定燃油车换购需求'
- '趁早: 优化燃油车库存结构，优先保障国六b排放标准车型供应，与置换补贴政策形成销售协同'
- '趁早: 配合消费者申领流程，做好二手车转让、新车购置发票等材料衔接服务，提升客户体验'
- '趁早: 将新能源车1.5万元补贴作为促销亮点，加大新能源车型推广力度'
- '趁早: 梳理名下国五及以下排放标准旧车客户资源，通过以旧换新服务包增强客户粘性'
didi_impact_one_liner: 上海国六b燃油车获1.3万、新能源车获1.5万元置换补贴，直接利好油品零售及新能源渗透，间接带动充电需求增长。
