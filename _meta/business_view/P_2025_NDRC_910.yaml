影响分析:
  加油: 未直接涉及。正文强调园区用能结构转向非化石能源、探索氢能替代化石燃料，但未提及加油/加气站新建或改造计划，亦未涉及传统加油站业务模式转型要求。
  充电: 直接利好。文件要求"完善园区绿色交通基础设施，加快运输工具低碳零碳替代"，为充电基础设施建设提供了政策背书。同时支持"新能源就近接入增量配电网"的绿电直供模式，园区内充电运营商可探索源网协调的供电方案。
  电力_储能_V2G_交易: 多重直接利好。①储能：正文明确"科学配置储能等调节性资源"，支持多能互补项目建设。②虚拟电厂：正文明确"鼓励有条件的园区以虚拟电厂（负荷聚合商）等形式参与电力市场，提高资源配置效率"，VPP获得国家层面的场景准入支持。③绿电交易：正文多次强调"绿证绿电交易""绿色电力直接供应模式"，园区内企业可作为绿电消纳主体参与市场。
行动建议:
- A 趁早:布局园区充电网，与园区管理方探索"绿电直连+充电"耦合模式，提前锁定优质场址资源。
- B 研究:对接园区能碳管理平台建设方，争取成为平台负荷侧数据接入和调控执行节点，为参与虚拟电厂聚合积累资质。
- C 趁早:梳理现有或拟建储能项目，争取纳入地方零碳园区储能配置规划，享受专项债券和政策性银行信贷支持。
- D 研究:跟踪各省市零碳园区申报动态，评估作为绿电消费主体参与绿证交易的合规路径和产品设计。
didi_impact_one_liner: 零碳园区政策为充电业务场址扩张和绿电直供提供了窗口，虚拟电厂获国家层面场景确认，储能配置要求明确，建议充电运营趁早锁定园区合作、储能项目趁早纳入规划、虚拟电厂聚合趁早对接园区管理平台。
