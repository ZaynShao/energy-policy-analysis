影响分析:
  加油: 未直接涉及。该政策聚焦新能源体系建设，虽提及燃料电池汽车氢能领域，但正文未涉及传统加油业务调整、替代或转型要求。
  充电: 直接涉及。简化充电设施建设审批流程，明确高压充电站报装要求（营业执照需含充电运营类项目、符合规划）；充换电设施执行工商业两部制电价（315kVA及以上2025年底前免基本电费）；停车首小时免费、后续九折；峰谷分时电价引导低谷充电。
  电力_储能_V2G_交易: 储能方面直接涉及：鼓励共享型储能电站、支持新能源电站配置储能；电价方面：提升工业用电峰谷价差以降低储能购电成本。虚拟电厂、V2G、电力交易均未直接涉及。
行动建议:
- 趁早布局充电运营资质：根据高压报装要求，对外运营充电站营业执照经营范围须包含充电设施运营类项目，建议尚未完成经营范围变更的企业尽快完成工商登记调整。
- 趁早研究峰谷套利策略：政策明确提升工业峰谷价差并鼓励低谷充电，充电运营商宜研究储能配合充电的峰谷套利商业模式。
- 趁早对接共享储能政策：鼓励新能源发电企业购买或租赁共享储能服务，建议有配储需求的企业研究共享储能合作模式。
didi_impact_one_liner: 唐山充电基础设施获审批松绑和电价优惠，但虚拟电厂/V2G/电力交易未在政策范围内。
