影响分析:
  加油: 未直接涉及。该政策聚焦于风电、太阳能发电、生物质发电等新能源通过直连线路向电力用户供给绿电，属于新能源电力供应模式，与传统加油业务无直接关联。
  充电: 未直接涉及。绿电直连是针对单一电力用户的新能源直连供给模式，明确多用户绿色电力直接供应的具体办法另行规定。政策未直接涉及充电桩建设或运营，也未提及V2G、分布式储能等与充电业务相关的机制。
  电力_储能_V2G_交易: 未直接涉及。该政策定义绿电直连为新能源向单一电力用户供给绿电的模式，明确上网电量比例上限一般不超过20%，不允许现货市场未连续运行地区向公共电网反送。政策未直接涉及储能配置、虚拟电厂、V2G机制或电力交易市场的具体规则设计。直连线路作为专用电力线路，其规划管理主要针对电源与用户侧的物理连接，与电力交易平台、储能调度或V2G互动无直接关联。
行动建议:
- A 趁早研究:跟踪多用户绿电直连配套政策进展,评估分布式光伏直连充电场站或工商业储能聚合参与绿电直连的潜在路径
- B 研究:关注现货市场连续运行地区余电上网规则的细化,结合充电场站负荷特性分析参与绿电直连的可行性
- C 趁早布局:对接省级能源主管部门,摸清所在区域绿电直连项目规划和准入条件,储备符合条件的项目储备
didi_impact_one_liner: 该政策为绿电直连建立规范框架,对加油、充电、电力储能交易暂无直接业务影响,但多用户绿电直连配套政策及现货市场规则细化可能创造新机遇,需持续跟踪政策演进。
