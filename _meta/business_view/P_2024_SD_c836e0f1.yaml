影响分析:
  加油: 政策目标到2025年新能源汽车保有量达30万辆以上，国三及以下非营运柴油货车基本淘汰，充换电站达1000座、充换电基础设施超10万个。汽车能源消费替代趋势加速，传统燃油车市场份额面临挤压，加油业务面临间接但持续的结构性影响。
  充电: 直接利好。政策明确建设充换电站1000座、充换电基础设施超10万个目标，回收网点建设可获最高20万元补贴，产业园创建可获30万元一次性奖励，金融机构提供再贷款支持，充电基础设施迎规模化扩张窗口期。
  电力_储能_V2G_交易: 政策提出发展'源网荷储一体化'智慧能源系统和微电网、加快新型储能设施建设，但未涉及V2G、双向充电桩或虚拟电厂机制。储能属间接涉及，受益于多能互补系统建设；电力交易未直接提及。
行动建议:
- A 趁早:研究加油站点向充换电综合能源站转型的技术方案与投资回报模型，布局充电业务作为增量赛道
- B 趁早:对接工业技改补贴政策，争取企业技术改造投资10%-20%奖补，升级油品储运设施能效
- C 趁早:布局废旧汽车回收拆解和报废机动车回收网络建设，抓住政策培育二手车出口市场机遇
- D 研究:跟踪183个储备设备更新项目清单（总投资705.99亿元），挖掘工业客户设备更新带来的润滑油、化学品等配套服务需求
- E 研究:关注'工赋泉城'行动每年培育30家工业互联网标杆工厂、5G工厂契机，探索工业企业用能管理服务合作模式
didi_impact_one_liner: 政策加速汽车能源替代与充换电网络规模化扩张，传统油品业务面临结构性挤压，充电基础设施与回收循环体系获直接政策红利。
