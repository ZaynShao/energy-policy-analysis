影响分析:
  加油: 未直接涉及。政策聚焦设备更新和消费品以旧换新，虽涉及国三柴油货车淘汰和新能源汽车推广（目标30万辆），但非针对加油站本身业务。间接影响：新能源车替代将长期抑制燃油消费增长。
  充电: 直接涉及。政策明确量化目标：2025年全市建成充换电站1000座、充换电基础设施超10万个；新能源汽车保有量达30万辆。同步推进充电设施关键技术标准建设，为充电网络扩张提供明确政策支撑。
  电力_储能_V2G_交易: 储能直接涉及：政策明确'加快新型储能设施建设'，并推进多能互补'源网荷储一体化'智慧能源系统和微电网发展。V2G和电力交易未直接涉及。
行动建议:
- A 趁早:布局充换电基础设施网络，对接政策量化目标窗口期，锁定优质点位资源
- B 趁早:将充电场站纳入'源网荷储一体化'场景，探索光储充一体化商业模式
- C 研究:跟进储能设施建设支持政策，评估工商业储能、应急备用电源等设备更新需求
- D 趁早:对接废旧设备回收处置渠道，为既有业务配套设备更新置换做准备
didi_impact_one_liner: 充电基础设施和储能获得明确政策量化支持，充换电站1000座、充电设施10万个目标锁定需求；加油业务面临新能源替代间接压力。
