影响分析:
  加油: 未直接涉及。本政策聚焦电力市场体系建设，未涉及油气销售、加油站运营或燃油相关业务，加油业务不在本政策调整范围内。
  充电: 直接涉及。政策明确要加快建设支撑电力系统灵活调节的辅助服务市场和完善绿色电力市场，用户侧经营主体将平等参与电力市场，这为充电运营商参与辅助服务、购买绿电证书提供制度基础；跨省跨区电力交易制度完善可能影响充电网络的电力采购成本和区域布局；零售市场规范有序建设将重塑充电服务的市场交易模式。
  电力_储能_V2G_交易: 直接涉及。政策提出健全辅助服务市场（支撑系统灵活调节）和容量市场（支撑调节电源建设），储能是这两类市场的核心资源；绿色电力市场的完善直接利好储能项目通过绿电交易实现价值；全国统一市场制度体系建设将为储能在全国范围内的资源优化配置和市场参与提供制度保障。
行动建议:
- A 趁早:研究充电业务接入辅助服务市场的技术方案和商业模式，评估参与调频、调峰等辅助服务的市场潜力，储备相关技术能力和资质
- B 趁早:研判跨省跨区绿电交易规则演变趋势，提前布局充电网络的绿色电力采购策略，探索绿电采购成本优化路径
- C 趁早:结合容量市场和辅助服务市场建设方向，趁早评估储能项目的多元收益模型，优化储能投资决策和运营策略
- D 研究:密切跟踪全国统一电力市场信用制度和市场规则完善进展，提前做好合规准备和风险防控预案
didi_impact_one_liner: 全国统一电力市场体系建设为充电和储能业务打开辅助服务、绿电交易、跨区资源配置等多元市场空间，需趁早布局市场参与能力和商业模式储备。
