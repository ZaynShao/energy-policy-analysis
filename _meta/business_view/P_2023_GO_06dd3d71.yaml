影响分析:
  加油: 未直接涉及。正文未提及任何与加油/加油站/成品油相关的业务、主体或机制。
  充电: 充电设施被明确列为可接入虚拟电厂管理平台参与需求响应的资源类型之一。拥有电动车充电设施的用户被鼓励接入平台参与需求响应，可通过削峰获得补偿补贴（补偿基准价格4元/千瓦时，按响应量和系数计算补贴）。
  电力_储能_V2G_交易: 储能、V2G均被明确列为可参与需求响应的资源。具备并网反向送电能力的储能/V2G用户，其响应负荷允许大于基线负荷，评估时应叠加反向电量，这一机制直接利好储能双向调节和V2G放电特性。负荷聚合商可聚合储能、充电设施等资源，门槛为聚合1000千瓦及以上响应负荷能力。
行动建议:
- A 趁早:充电运营商/拥有充电设施的企业接入厦门市虚拟电厂管理平台，申报充电负荷资源成为需求响应参与主体。
- B 趁早:储能资产持有方（含V2G桩）接入虚拟电厂管理平台，完成协议签订进入储备库，享受响应期间反向放电大于基线负荷的差异化规则。
- C 研究:负荷聚合商趁早研究聚合1000千瓦门槛及代理协议流程，布局聚合分散储能/V2G/充电资源的虚拟电厂业务。
- D 研究:关注补偿基准价格4元/千瓦时的补贴力度及价格系数/速度系数（0~1、1~3）的计算规则，评估经济性。
didi_impact_one_liner: 充电设施和储能/V2G可接入厦门虚拟电厂平台参与需求响应，享受差异化基线规则和4元/千瓦时基准补贴，利好充电资产聚合和双向储能商业化。
