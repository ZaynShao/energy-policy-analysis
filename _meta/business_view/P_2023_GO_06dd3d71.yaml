影响分析:
  加油: 未直接涉及。该方案聚焦电力需求响应机制，加油站业务不在政策调整范围内。
  充电: 直接涉及。政策明确鼓励拥有电动车充电设施的用户接入厦门市虚拟电厂管理平台参与需求响应；充电桩运营商可通过聚合商身份或直接参与（响应负荷≥200千瓦时）获得补贴，补偿基准价格4元/千瓦时。
  电力_储能_V2G_交易: 直接涉及。政策多维度覆盖：（1）储能：明确鼓励储能资源接入虚拟电厂管理平台参与需求响应；（2）V2G：明确拥有V2G资源的用户可并网反向送电，响应负荷允许大于基线负荷，评估时叠加反向电量；（3）虚拟电厂：政策本身就是依托厦门市虚拟电厂管理平台实施需求响应；（4）负荷聚合商：明确准入门槛为聚合≥1000千瓦响应负荷能力，直接参与用户门槛为响应负荷≥200千瓦；（5）交易机制：补贴公式为实际响应负荷量×响应时间×补贴价格系数（0~1）×响应速度系数（1~3）×补偿基准价格（4元/千瓦时）。
行动建议:
- 'A 趁早: 充电桩运营商趁早对接厦门市虚拟电厂管理平台，完成接入测试，争取作为直接需求用户或聚合商参与首批需求响应补贴发放。'
- 'B 趁早: 储能投资运营商趁早研究将储能项目接入虚拟电厂平台的可行性，锁定需求响应补贴收入这一新的盈利来源。'
- 'C 趁早: V2G运营商趁早确认并网点计量装置已具备反向电量核算功能，确保响应负荷可大于基线负荷的规则能被实际执行。'
- 'D 研究: 有条件的聚合商趁早评估聚合1000千瓦门槛的达标路径，以及聚合充电设施、储能、数据中心等多类资源的商业模式。'
didi_impact_one_liner: 厦门储能/V2G/充电设施可通过虚拟电厂平台直接参与需求响应获补贴，聚合商门槛1000千瓦、直接用户门槛200千瓦，V2G用户响应负荷允许超出基线负荷。
