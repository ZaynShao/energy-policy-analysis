影响分析:
  加油: 未直接涉及。该政策聚焦电力现货市场体系建设、交易机制设计与经营主体参与，与加油站业务无关联。
  充电: 未直接涉及。正文虽明确鼓励“储能、虚拟电厂、负荷聚合商”参与市场，但充电服务/充电桩运营本身未被直接提及。充电运营商若转型为负荷聚合商，可间接获得参与需求响应和电力市场的机会，但属市场主体主动适配行为，非政策直接作用。
  电力_储能_V2G_交易: 电力交易和储能为直接涉及，虚拟电厂为直接涉及，V2G未直接涉及。正文第七条明确鼓励储能、虚拟电厂、负荷聚合商参与电力市场，探索“新能源+储能”等新方式；多条条款推进省间/区域现货市场连续结算试运行和正式运行。V2G（车辆到电网/反向放电）机制未在正文中出现。
行动建议:
- 'A 趁早: 研究将充电桩网络聚合为负荷聚合商参与电力现货市场的路径，匹配政策明确的用户侧参与和新型主体参与机制'
- 'B 趁早: 对接区域电力市场建设进程（尤其长三角、南方区域），布局储能项目参与“新能源+储能”等市场化模式'
- 'C 研究: 密切跟踪虚拟电厂参与电力市场的规则制定和调度运行机制，为后续整合充电侧资源奠定基础'
- 'D 研究: 关注用户侧参与省间现货交易的相关问题研究进展，提前评估充电服务作为需求侧资源的商业化空间'
didi_impact_one_liner: 政策加速电力现货市场全覆盖和新型主体参与，充电业务需主动转型负荷聚合商才能获得参与电力市场的间接机会，储能、虚拟电厂获得直接支持，V2G尚未进入政策视野
