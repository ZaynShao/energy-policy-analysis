影响分析:
  加油: 未直接涉及。该政策聚焦燃煤发电上网电价市场化改革，核心对象为燃煤发电企业、工商业用户及电网企业，完全不涉及任何石油或燃油相关业务。
  充电: 未直接涉及。政策虽涉及工商业用户全部进入电力市场及代理购电机制，但未明确提及充电桩、充电设施或新能源汽车充电服务等具体业务领域。
  电力_储能_V2G_交易: 未直接涉及。该政策核心是燃煤发电上网电价市场化，虽提及“推动构建新型电力系统”和“全面推进电力市场建设”，但未明确涉及储能、V2G、虚拟电厂或电力交易等具体机制。工商业用户入市对小微企业和个体工商户有阶段性代理购电优惠，未直接指向储能或V2G业务。
行动建议:
- 'A 趁早: 研究政策对工商业用户全面入市后电力采购成本的影响，为加油站内充电设施运营的电力成本管理做好准备'
- 'B 研究: 关注后续“全面推进电力市场建设”配套政策中是否涉及储能、V2G或虚拟电厂相关市场准入机制'
- 'C 研究: 跟踪“加强燃煤发电上网电价市场化改革政策与分时电价政策衔接”的具体实施方案，评估对储能项目的分时电价套利空间影响'
didi_impact_one_liner: 该政策核心聚焦燃煤发电侧电价市场化，充电业务和储能/V2G/电力交易领域均未直接涉及，加油业务完全无关。
