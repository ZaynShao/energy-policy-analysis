影响分析:
  加油: 未直接涉及。该指南聚焦虚拟电厂的聚合商准入、平台建设、运营管理和市场交易规范，加油业务属于化石能源零售领域，不在虚拟电厂资源聚合和电力市场交易范畴内。
  充电: 直接涉及。充电运营商可作为虚拟电厂运营商建设运营商平台，聚合充电桩资源参与需求响应和电力市场；充电设施可作为可调节负荷资源接入虚拟电厂终端；文件明确支持各类社会资本投资建设运营虚拟电厂，为充电企业提供了新的业务切入路径。
  电力_储能_V2G_交易: 直接涉及。文件明确虚拟电厂可参与电力现货交易、辅助服务交易和需求响应市场，储能资源可作为聚合对象参与；文件强调完善电力市场体系，为储能项目参与市场化运营提供了规范框架；但V2G机制在正文中未明确出现。
行动建议:
- A 趁早:充电运营企业结合自身充电桩资源规模，趁早评估作为虚拟电厂聚合商准入的条件与路径，研究运营商平台建设或接入省运管平台的业务流程。
- B 趁早:储能投资与运营主体趁早对接省负荷管理中心，了解储能资源接入测试和能力认证要求，储备参与电力现货与辅助服务市场的技术条件。
- C 研究:密切跟踪国家层面虚拟电厂发展指导意见在江西的落地细则，提前布局负荷聚合商资质和平台能力建设。
didi_impact_one_liner: 充电业务获直接政策支撑，储能参与电力市场路径明确，加油业务暂不受该指南直接影响。
