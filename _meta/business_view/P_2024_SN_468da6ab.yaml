影响分析:
  加油: 政策明确鼓励加油（气）站增建充电基础设施，但为倡导性表述而非强制要求。间接影响：随着充电基础设施覆盖扩大，加油站面临向综合能源站转型的竞争压力，但短期内加油业务运营模式未受直接约束。
  充电: 直接受益领域。（1）规划层面：新建居住区个人固定车位100%预留充电基础设施安装条件，公共停车场建成充电车位不低于10%，高速公路服务区不低于小型客车停车位10%，县乡实现充电站'县县全覆盖'、充电桩'乡乡全覆盖'；（2）建设层面：自用充电设施无需备案，专用无新增用地项目无需备案，降低建设门槛；（3）平台层面：陕西智慧车联网平台全面接入公共充电设施运营数据，提供监管和服务支撑。
  电力_储能_V2G_交易: 未直接涉及。政策仅提及陕西智慧车联网平台提供'车网互动支撑'服务，但未明确V2G、储能、电力交易的具体机制、准入条件或市场机会。智慧车联网平台的数据接入要求属于运营监测范畴，不等同于交易参与资格。
行动建议:
- 'A 趁早: 研究居住区有序慢充+应急快充的运营模式，匹配新建居住区100%预留安装条件的增量市场，提前布局个人充电服务产品'
- 'B 研究: 评估加油（气）站增建充电基础设施的可行性，结合加油站地理分布和客群特征，探索综合能源站转型路径'
- 'C 趁早: 关注县乡充电桩''乡乡全覆盖''的政策机遇，评估下沉市场投资布局机会'
- 'D 趁早: 对接陕西智慧车联网平台，按要求接入公用充电设施运营数据，满足监管合规要求'
didi_impact_one_liner: 陕西充电基础设施全面纳入规范管理，居住区100%预留安装条件叠加县乡全覆盖目标释放大量充电建设需求，加油站面临转型综合能源站机遇，充电运营需接入省级监管平台合规运营。
