影响分析:
  加油: 政策明确鼓励加油（气）站增建充电基础设施，属于正文明确写到的配置场景，加油站可据此拓展充电业务。
  充电: 政策对居住区、公共停车场、高速公路服务区、县乡农村地区等各类场景的充电设施配置提出明确比例要求，新建居住区个人固定车位100%预留安装条件，属于直接业务影响。
  电力_储能_V2G_交易: 正文提到陕西智慧车联网平台提供"车网互动支撑"服务，但未明确V2G机制、反向充电或电力交易具体要求，未直接涉及储能、电力交易或V2G具体业务机制。
行动建议:
- A 趁早研究在现有加油站点增建充电基础设施的可行性，探索油气电综合能源站模式
- A 趁早对接陕西智慧车联网平台，了解公共充电设施接入要求和数据标准
- B 研究居住区有序慢充模式下的交流充电设施投资运营机会
- B 研究公用充电设施在公共停车场、高速公路服务区的建设布局策略
didi_impact_one_liner: 政策对充电基础设施建设提出明确配置比例要求，鼓励加油站增建充电桩，为充电业务拓展提供明确指引，但未涉及V2G、储能或电力交易机制。
