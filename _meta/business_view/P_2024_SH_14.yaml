影响分析:
  加油: 直接涉及。本政策针对燃油小客车以旧换新，给予报废或转让国五及以下排放标准燃油车并购买国六b燃油新车的消费者1.2万元补贴，明确鼓励燃油车消费升级，对燃油车销售和加油站客户流量有直接影响。
  充电: 未直接涉及。本实施细则专针对燃油车，不涉及新能源汽车购置补贴或充电基础设施支持。
  电力_储能_V2G_交易: 未直接涉及。本政策聚焦燃油小客车以旧换新补贴，未涉及储能设施建设、虚拟电厂、车网互动(V2G)、电力交易或充电桩运营等业务领域。
行动建议:
- A 趁早:与燃油车销售商建立联动机制，针对享受以旧换新补贴的客户群体开展精准营销，承接政策带来的增量客流。
- B 趁早:研判政策对燃油车消费周期的影响，评估补贴退出后的市场波动风险，提前储备客户运营策略。
- C 研究:关注国六b标准实施对油品品质要求的潜在变化，确保加油站油品供给符合新排放标准车辆的适配需求。
didi_impact_one_liner: 本政策仅针对燃油车以旧换新加油场景有直接促进效应，与充电及电力业务无直接关联。
