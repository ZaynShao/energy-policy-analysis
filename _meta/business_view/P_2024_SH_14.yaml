影响分析:
  加油: 未直接涉及。政策仅针对燃油车以旧换新，正文未涉及加油站运营或油品销售。该政策加速淘汰国五及以下排放标准老旧燃油车（间接），可能影响未来加油站目标客群规模，但具体幅度未在正文中量化。
  充电: 未直接涉及。政策明确针对燃油小客车以旧换新，购买标的为国六b排放标准燃油新车，正文未提及新能源汽车、充电桩或充换电基础设施。
  电力_储能_V2G_交易: 未直接涉及。政策全文聚焦燃油车报废/转让及购买燃油新车的补贴流程与条件，未涉及储能、虚拟电厂、V2G、电力交易或任何双向充放电机制。
行动建议:
- 趁早研究国六b新车能效提升对单车油耗的长期变化,预判区域加油站车流量可能出现的结构性调整
- 趁早跟踪同期新能源汽车补贴政策走向,评估充电业务是否面临替代竞争格局的变化
- 趁早建立客户车辆排放台账,识别名下国五及以下车辆占比,为后续差异化营销或服务转型做准备
didi_impact_one_liner: 政策仅惠及燃油车以旧换新，对充电、储能、电力交易业务无直接关联，但加速国五及以下老旧燃油车淘汰或间接影响能源消费结构演变节奏。
