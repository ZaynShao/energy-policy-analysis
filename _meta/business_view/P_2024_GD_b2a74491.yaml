影响分析:
  加油: 未直接涉及
  充电: 未直接涉及。正文是虚拟电厂参与电力市场交易专项方案，虽引用了《关于加强新能源汽车与电网融合互动的实施意见》作为政策依据，但正文未对充电聚合、充电桩参与市场机制作具体规定，充电业务具体如何纳入VPP参与交易尚需后续细则明确。
  电力_储能_V2G_交易: 直接涉及。政策明确建立虚拟电厂参与电力市场交易机制，VPP运营商可作为市场主体参与交易；文件引用了新能源汽车与电网融合互动、V2G相关的实施意见，为后续VPP聚合电动汽车等资源预留了政策接口；储能资源作为分布式资源可纳入VPP参与市场，具体参与方式和准入条件待配套文件细化。
行动建议:
- A 趁早:研究VPP聚合商资质准入条件，提前准备电力市场注册材料，争取成为首批VPP市场参与主体。
- B 趁早:梳理现有分布式资源（储能、充电桩、可调负荷等）规模与调节能力，建立资源聚合管理基础。
- C 研究:关注后续VPP准入、交易品种、结算规则等配套细则发布，提前布局聚合商能力建设。
- D 研究:跟踪V2G、电动汽车聚合参与市场的政策细化，结合自身业务探索车网互动商业模式。
didi_impact_one_liner: 广东VPP进入电力市场正式开闸，聚合商需趁早布局市场准入和资源聚合能力，充电和储能业务可作为VPP资源池参与交易，但具体机制待配套细则明确。
