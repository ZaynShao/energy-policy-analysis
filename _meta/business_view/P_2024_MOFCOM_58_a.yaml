影响分析:
  加油: 未直接涉及。政策聚焦于汽车以旧换新的新车、二手车交易和报废环节，以及家电以旧换新，未直接涉及加油站业务。但淘汰老旧汽车（国三及以下排放标准）可能影响高排放车辆的燃油消费规模，间接影响油品需求结构。
  充电: 未直接涉及。政策提及支持新能源二手车动力电池检测，但未明确部署充电桩建设、充电服务费调整或新能源汽车专属补能支持。充电基础设施未在正文中被列为直接受益对象。
  电力_储能_V2G_交易: 未直接涉及。政策以汽车、家电以旧换新和家装厨卫焕新为主线，虽涉及新能源二手车动力电池检测，但未明确提及储能项目、V2G机制、虚拟电厂、电力交易或废旧电池储能再利用等业务领域。
行动建议:
- 趁早对接地方商务部门，掌握本地区汽车以旧换新补贴申领入口和小程序上线时间，提前布局以旧换新服务场景
- 趁早梳理现有高排放车辆客户群体（国三及以下），研判淘汰时间节点对油品销量可能的影响区间
- 研究报废机动车回用件流通和零部件再制造标准，评估汽车后市场延伸机会
- 跟踪新能源二手车动力电池检测相关配套政策，研判动力电池后市场服务潜力
didi_impact_one_liner: 汽车以旧换新行动方案主要驱动新车消费和报废回收体系，充电和储能业务暂未直接受益，但需关注新能源二手车动力电池检测后续配套政策。
