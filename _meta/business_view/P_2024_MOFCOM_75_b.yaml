影响分析:
  加油: 直接利好。政策对报废国三及以下排放标准燃油乘用车（2011年6月30日前注册汽油车等）并购买2.0升及以下排量燃油乘用车的消费者补贴7000元，将刺激存量高排放燃油车用户加速换车，带动加油站客户结构优化和服务需求增加。报废旧车须由有资质报废机动车回收拆解企业开具证明，加油站可探索与报废拆解企业的客户引流合作。
  充电: 直接利好。政策对报废旧车并购买新能源乘用车的补贴达1万元（高于燃油车7000元），叠加工信部《减免车辆购置税的新能源汽车车型目录》的新能源车购置税减免，形成双重重磅激励，将显著提升新能源汽车购买需求，扩大充电市场基本面。新能源汽车保有量增加将带动充电桩利用率提升和充电服务收入增长。
  电力_储能_V2G_交易: 未直接涉及。该细则是针对个人消费者报废旧车、购买新车的补贴政策，补贴对象为个人消费者，不涉及储能设施建设、V2G技术应用或电力交易机制。新能源乘用车虽可能被用作分布式储能资源，但本政策未涉及相关聚合商参与、车网互动或虚拟电厂机制。
行动建议:
- 'A 趁早: 加油站运营方可与报废机动车回收拆解企业建立合作机制，锁定换车客户流向本品牌加油站加油的优惠协议。'
- 'A 趁早: 充电运营方应把握政策窗口期加速优质充电场站布局，趁早与纳入减免车购税目录的新能源汽车品牌建立场站导流合作，共享补贴带来的新能源汽车增量红利。'
- 'B 研究: 深入研判报废旧车补贴与购置税减免政策的叠加效应，评估对新能源汽车和燃油车市场结构的影响周期，据此优化中长期油/充电业务布局比例。'
didi_impact_one_liner: 报废旧车换新能源补1万、换燃油补7千，叠加购置税减免，将显著刺激新能源汽车和燃油车消费结构优化，直接扩大充电市场基本面并为加油站带来换车客户流量机遇。
