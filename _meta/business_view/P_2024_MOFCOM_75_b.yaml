影响分析:
  加油: 直接涉及。政策激励报废国三及以下燃油乘用车并购买2.0升及以下燃油乘用车(补贴7000元)或新能源车(补贴1万元)。短期看报废换新将带来一波加油车辆更新,但长期燃油车市场将进一步萎缩。
  充电: 直接涉及。报废旧新能源车或燃油车并购买新能源乘用车均补贴1万元,政策明确鼓励个人消费者置换新能源车,将直接拉动新能源汽车零售,带动充电需求增长。补贴车型须在工信部《减免车辆购置税的新能源汽车车型目录》内。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦报废旧车与购买新车的补贴,未涉及储能、V2G、虚拟电厂、电力交易等机制。虽新能源车保有量增加可能间接扩大储能市场,但正文未明确此类关联机制。
行动建议:
- A 趁早:监测本政策对油品销量影响,统计报废换新客户占比,评估高补贴窗口期内的油品业务波动风险,提前调整库存与营销策略。
- B 趁早:对接符合目录的新能源车企,了解报废换新客户的新车购买意向,在充电网络覆盖的新能源车销售热点区域提前布局快充站点,抓住补贴驱动的增量充电需求。
- C 研究:关注后续是否出台配套的充换电基础设施支持政策,评估本政策带动的充电增量市场空间,提前规划场站扩建方案。
- D 研究:建立报废换新客户信息追踪机制,分析燃油车报废客户中转向新能源的比例,为中长期油品业务收缩节奏提供数据支撑。
didi_impact_one_liner: 政策对加油业务短期正向、长期负向;对充电业务直接正向拉动新能源汽车零售及充电需求;对储能/V2G/电力交易未直接涉及。
