影响分析:
  加油: 未直接涉及。该规划专门针对电动汽车充换电基础设施，不涉及燃油车、加油站业务或成品油供应体系。
  充电: 直接利好。规划明确了2021-2025年充换电基础设施建设目标与重点任务:一是优化充换电设施体系,推进公共服务专用充电换电、城市公共充换电网络、乡镇城际出行充换电网络、有序充电网络建设;二是推进单位与居民区充电基础设施建设;三是加快车联网平台建设,包括充换电设施运维、网络服务、技术创新与标准支撑;四是简化办电程序、加快配套电网接入服务,并落实国家财政扶持政策引入社会资本,为充电运营企业提供政策支持和市场空间。
  电力_储能_V2G_交易: 未直接涉及。规划聚焦充换电基础设施网络布局和建设,虽提到配套电网接入服务,但未明确涉及储能、V2G有序充放电、电力交易、虚拟电厂(VPP)或聚合商等电力系统调节机制和市场化交易内容。
行动建议:
- 趁早研判布局:趁早研判居民区充电设施建设、有序充电网络建设带来的充电桩安装服务、运维服务、车联网平台合作等业务机会,主动对接地方政府规划,争取进入配套供应商名单。
- 趁早对接资源:趁早对接电网接入服务流程和土地支持政策,优化充电基础设施建设条件;关注国家财政扶持政策和社会资本引入机制,探索多元化合作模式。
- 趁早参与标准:趁早在充换电技术创新与标准支撑环节进行布局,参与地方标准制定,提升在区域充电网络建设中的技术话语权。
didi_impact_one_liner: 吉林省明确推进2021-2025年充换电基础设施网络建设,居民区有序充电和公共充换电网络为重点方向,充电运营企业可趁早对接政策支持和电网接入资源,布局区域充电服务市场。
