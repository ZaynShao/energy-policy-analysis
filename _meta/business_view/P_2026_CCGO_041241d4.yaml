影响分析:
  加油: 直接影响。考核控制指标明确列入石油消费总量，并要求十五五时期实现石油消费总量达峰。石油消费总量控制将对加油业务规模形成硬性约束，省级行动方案和两高项目碳排放减量置换要求将传导至市场端，加油站运营面临需求总量管控压力。
  充电: 间接涉及。考核指标中非化石能源消费占比提升(2030年达25%)和清洁能源电量覆盖全社会新增用电量目标，客观上为充电业务提供了清洁电力供给基础和环境政策支持，但充电基础设施和运营未在正文中直接出现。
  电力_储能_V2G_交易: 碳排放权交易被列为支撑指标之一，考核机制将推动地方政府重视碳市场运行，为电力企业参与碳排放权交易提供政策驱动力，但具体交易机制和准入规则未在正文中展开。
行动建议:
- A 趁早研究省级碳达峰行动方案中石油消费达峰路径与地方两高项目置换要求，提前评估对区域加油市场的需求影响并谋划业务调整。
- B 研究非化石能源消费占比提升目标下的清洁电力供给趋势，跟踪电力行业碳排放权交易支撑指标变化对电力业务的影响。
didi_impact_one_liner: 石油消费总量达峰考核将约束加油业务规模，碳排放权交易列入支撑指标驱动电力业务碳市场参与，充电业务获清洁能源目标间接支持。
