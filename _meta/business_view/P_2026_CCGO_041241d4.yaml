影响分析:
  加油: 直接涉及。石油消费总量已明确列为控制指标，且"十五五"时期明确提出石油消费总量达峰目标。这对加油业务的化石燃料需求规模形成直接约束，各省份执行达峰行动方案时可能逐步压减石油消费基数，加油站销量增长空间将受限。
  充电: 间接涉及。非化石能源消费占比提升目标（2030年达25%）和"力争年度新增清洁能源电量逐步覆盖全社会新增用电量"的政策导向，客观上有利于清洁能源电力替代，进而支撑充电需求增长。但充电基础设施、充电运营商资质或运营义务未在正文中明确提及，不构成直接市场机会。
  电力_储能_V2G_交易: 未直接涉及。尽管碳排放权交易被列为支撑指标之一，但仅作为评价考核的代表性指标，不等于赋予市场准入或交易机会。虚拟电厂、储能、V2G、电力交易等机制在正文中未出现，无法从本考核办法中推导相关业务影响。
行动建议:
- A 趁早:跟踪各省份石油消费总量达峰方案的编制进展，摸清重点区域压减节奏，提前优化区域油站布局
- A 趁早:梳理非化石能源消费占比提升路径中与充电需求增长的正相关区域，识别充电业务增量潜力区域
- B 研究:分析评价考核指标体系对地方能源结构转型力度的激励约束机制，判断对加油业务的影响边界
- B 研究:节能和交通运输支撑指标是否可能向充电基础设施或新能源汽车推广方向延伸，提前布局应对策略
didi_impact_one_liner: 石油消费达峰目标直接约束油品业务增长空间，充电受益于清洁能源替代趋势但未获直接政策红利，储能/V2G/电力交易业务暂不受本考核办法直接影响
