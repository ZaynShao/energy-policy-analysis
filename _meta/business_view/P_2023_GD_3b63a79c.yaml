影响分析:
  加油: 未直接涉及。政策聚焦电力现货市场机制建设和运行经验，与燃油零售业务无关联。
  充电: 未直接涉及。正文虽涉及电力市场交易主体（大用户、售电公司），但未明确提及充电桩、充电服务运营商或新能源汽车充电作为市场主体参与现货交易的具体机制。
  电力_储能_V2G_交易: 直接涉及。广东已建立全国首个集中式现货市场机制（2023年12月转入正式运行），市场体系支持交易品种齐全，规则体系已覆盖中长期、现货、注册、信息披露、结算等8项细则，2023年市场直接交易电量3141亿千瓦时，经营主体7.9万家。这些机制为储能、灵活调节资源参与电力现货市场提供了制度基础和环境。但需注意：正文未明确提及储能、虚拟电厂、V2G或聚合商的具体准入规则、交易机制或义务。
行动建议:
- 趁早研究广东电力现货市场规则体系：广东已形成'1+8'现货市场交易规则且正式运行，对有意参与电力市场交易的储能、负荷聚合商等主体，需趁早深入研读规则中的注册条件、交易品种、结算机制，为后续进入市场做好准备。
- 趁早跟踪新型主体准入政策：广东作为全国首批现货市场试点省份，规则体系具有示范效应，建议趁早关注其后续对储能、虚拟电厂等新型主体参与市场规则的扩展动态。
didi_impact_one_liner: 广东电力现货市场正式运行并形成完整规则体系，为储能等灵活调节资源参与市场提供了制度环境，但储能/V2G具体参与机制尚待观察。
