影响分析:
  加油: 未直接涉及。该政策聚焦虚拟电厂建设与运营,未提及加油站或油品销售业务。
  充电: 直接涉及。政策明确负荷型虚拟电厂聚合对象为具备可调节能力的电力用户,充电桩(尤其是具备有序充电能力的充电桩)属于可调负荷范畴;混合型虚拟电厂聚合资源包括储能,充电场站配储场景可纳入;申报条件要求聚合资源具有电网独立营销户号并完成电力交易平台注册,具备一定规模的充电运营商可直接申报或作为负荷聚合商参与试点。
  电力_储能_V2G_交易: 直接涉及。政策明确混合型虚拟电厂聚合资源包括未纳入调度直调的分布式发电、储能和可调负荷资源,并根据资源特性建立电源、负荷和双向调节不同类型交易单元参与市场交易;虚拟电厂须对接省级负荷管理中心按流程接入;参与电能量市场须在电力交易平台注册。V2G因正文未明确出现且无等价机制描述,属间接观察:充电桩作为储能载体参与虚拟电厂聚合时,V2G机制在技术上存在潜在应用空间,但需以试点项目明确要求为前提。
行动建议:
- 趁早摸排自有充电场站的可调负荷容量规模及配储情况,评估作为负荷型或混合型虚拟电厂申报主体的可行性,2026年1月30日申报截止前形成初步方案。
- 趁早对接冀北/河北省电力交易平台,完成聚合资源营销户号梳理和注册资质准备,满足虚拟电厂接入的前置条件。
- 趁早研究《河北省虚拟电厂建设运营管理办法(暂行)》中关于负荷聚合商、混合型交易单元的具体规则,提前布局参与需求响应和电能量市场的业务路径。
- 趁早对标文件网络安全要求(等级保护2级、HTTPS、国密算法),评估自有平台技术合规差距,补齐认证资质以满足虚拟电厂运营商准入条件。
- 研究混合型虚拟电厂中储能资源聚合的商业模式,探索充电场站配储参与双向调节交易单元的机会。
didi_impact_one_liner: 河北虚拟电厂首批试点申报启动,充电运营商可直接作为负荷型或混合型聚合商申报,配储充电场站具备参与电力市场和需求响应的制度通道,2026年1月30日为申报截止节点。
