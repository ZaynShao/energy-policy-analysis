影响分析:
  加油: 未直接涉及。正文强调汽车绿色消费和新能源汽车以旧换新(占比近60%)，对燃油车市场的替代趋势有待观察，但未直接涉及加油站业态的政策安排。
  充电: 间接。正文强调新能源汽车以旧换新带动绿色消费市场扩大，新能源汽车占比提升将驱动充电需求增长，但未明确充电桩建设、运营或V2G等具体机制。
  电力_储能_V2G_交易: 未直接涉及。正文仅提及'优化使用绿色电力'和'培育绿色流通主体'等宏观表述，未涉及储能设施建设、V2G机制、虚拟电厂(VPP)、电力交易或聚合商准入等具体业务场景。
行动建议:
- A 趁早研究:跟踪新能源汽车替代率对加油业务的影响周期,评估加油站向充(换)电站转型的可行性阈值
- B 趁早对接:对接地方以旧换新补贴申报通道,扩大绿色家电(一、二级能效)销售规模
- C 研究:关注绿色消费积分线上线下通兑通用政策落地,探索积分兑换与能源消费的联动场景
- D 趁早布局:监测绿色农产品供应链标准完善动向,为农业用能替代和清洁能源采购做预案
didi_impact_one_liner: 以旧换新政策成效显著(汽车1830万辆/新能源占60%),绿色消费全链条20项举措将加速新能源渗透,但加油/充电/储能业务均未获直接政策杠杆,需关注绿色积分通兑和能效标准升级的间接传导。
