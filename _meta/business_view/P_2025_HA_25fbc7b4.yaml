影响分析:
  加油: 未直接涉及。该政策聚焦于电力市场统一规则体系建设，加油业务属于成品油零售范畴，与电力市场改革无直接关联。正文未提及加油站在市场准入、交易机制或监管规则方面的任何调整。
  充电: 间接涉及。政策明确提到计量结算规则解决"用了多少电，谁该付多少钱"的问题，以及辅助服务市场规则规范电网安全稳定运行服务，这些通用性规则适用于所有电力用户包括充电运营商。统一规则降低了跨省做生意成本，充电企业跨省运营的合规成本有望降低。但正文未专门针对充电业务设计具体机制，故属间接影响。
  电力_储能_V2G_交易: 间接涉及。辅助服务市场规则规范了保障电网安全稳定运行的服务，理论上为储能参与调频调峰提供了制度基础；绿证交易量激增364%、绿电交易电量增长235.2%表明绿色电力市场活跃度大幅提升。但正文未明确出现储能建设、V2G、双向充电桩或虚拟电厂等具体机制，故相关影响属谨慎推断的间接观察。
行动建议:
- A 趁早研判跨省充电业务扩张的合规路径：政策明确推动各地在基本规则要求下统一规范开展市场交易，跨省运营的合规成本将显著降低，可提前布局充电网络跨省布局。
- B 研究辅助服务市场参与机会：辅助服务市场规则已出台，储能作为电力用户参与调峰辅助服务具备制度基础，建议趁早评估储能项目参与辅助服务市场的可行性和收益模型。
- C 跟踪绿电绿证交易机制完善：政策提及绿证交易量激增、计划实现中长期/现货/辅助服务/绿电绿证高效协同，趁早研究将充电运营与绿电采购或绿证绑定的市场机会。
didi_impact_one_liner: 统一计量结算和辅助服务规则间接利好充电跨省运营和储能参与调峰市场，但具体V2G/虚拟电厂机制未在正文明确。
