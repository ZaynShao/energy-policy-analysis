影响分析:
  加油: 未直接涉及。加油业务为传统燃油零售，与电力市场规则体系建设无关联。正文未提及任何与加油业务相关的市场机制、交易品种或运营要求。
  充电: 规则统一降低跨省做生意成本，充电运营商作为电力用户可受益于市场化交易电量规模增长(2024年6.18万亿千瓦时、占比62.7%)和跨省区交易扩大(每4度电有1度通过跨省区交易实现)。计量结算规则统一解决‘用了多少电谁该付钱’问题，有望改善充电运营结算效率。注：间接，基于正文电力用户参与市场化交易的通用机制推导，非充电专项政策。
  电力_储能_V2G_交易: 直接涉及。正文明确覆盖中长期交易、现货市场、辅助服务市场、计量结算等核心规则，为储能/虚拟电厂参与市场交易提供统一制度基础。辅助服务市场规则规范保障电网安全稳定运行的服务，储能等灵活性资源具备参与辅助服务的制度通道。绿证交易量同比增长364%、绿电交易电量增长235.2%，电力交易主体规模和活跃度持续提升。计量结算规则解决市场交易‘最后一公里’，为储能/VPP的计量收益提供统一标准。
行动建议:
- A 趁早研究跨省区售电资质：利用‘一次注册、全国通行’机制，提前布局充电网络跨省区电力采购与结算，降低多省份运营的合规成本
- B 趁早对接辅助服务市场：储能/VPP运营商趁早研究辅助服务市场规则，明确服务品种、准入条件和结算机制，布局灵活性资源参与电网调节服务
- C 趁早开展绿电绿证交易：利用绿电绿证交易量激增趋势(绿证+364%、绿电+235.2%)，提前锁定绿色电力资源并参与市场化交易
didi_impact_one_liner: 全国电力市场‘1+6’规则体系统一计量结算和跨省区交易机制，为充电跨省运营和储能参与辅助服务市场扫清制度障碍，计量结算‘最后一公里’改善运营收益确定性。
