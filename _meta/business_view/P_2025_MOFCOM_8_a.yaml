影响分析:
  加油: 直接涉及。政策对报废旧燃油车并购买2.0升及以下排量燃油乘用车给予1.5万元补贴，补贴力度高于燃油车置换燃油车，有助促进燃油车更新消费。但补贴总额度低于新能源车置换，政策引导仍偏向新能源车转型。
  充电: 直接涉及。政策对报废旧车并购买新能源乘用车给予2万元补贴，力度高于燃油车（1.5万元），明确促进新能源汽车消费。新能源乘用车销量增长将直接带动充电需求提升，利好充电场站运营。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦报废更新补贴和审核流程，未涉及储能、虚拟电厂、V2G、电力交易等机制。虽然新能源汽车被列为补贴对象，但未提及反向充电、储能或电力交易相关机制。
行动建议:
- A 趁早:跟踪报废旧车补贴审核流程，配合各地商务平台对接，提前锁定潜在客户车辆信息以便精准推送加油/充电服务
- B 趁早:结合新能源车补贴力度优势，在站点布局上加大充电桩建设投入，把握新车购买后的充电需求释放窗口
- C 研究:监测政策执行中旧车报废量和新车销售结构变化，为后续能源补给网络规划提供数据支撑
didi_impact_one_liner: 政策明显倾斜新能源车（2万>1.5万），将直接拉升新能源乘用车销售和充电需求，间接影响能源补给网络布局节奏。
