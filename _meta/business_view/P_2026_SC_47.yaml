影响分析:
  加油: 政策明确支持老旧营运货车报废更新（报废国四及以下排放标准），优先更新为电动货车，间接压缩传统燃油货车市场空间，对加油站油品销量长期存在替代压力。
  充电: 政策加力推动城市公交车电动化替代和支持电动货车更新，扩大新能源汽车保有量，充电补能需求同步扩大，充电运营市场获增量空间。
  电力_储能_V2G_交易: 政策支持能源电力领域设备更新及工业企业节能环保降碳类项目（最高15%投资额补贴），支持省级零碳工业园区建设，间接利好储能消纳和能效改造需求；但未直接涉及V2G、电力交易或虚拟电厂机制。
行动建议:
- A 趁早对接省级零碳园区建设方，争取将综合能源站（含充电）纳入园区基础设施更新方案；
- A 趁早研究电动货车替代政策对油品销量的影响周期，评估网点布局优化或增设快充桩的可行性；
- B 研究储能及节能改造补贴申报路径，帮助高耗能客户对接设备更新资金支持。
didi_impact_one_liner: 电动化替代政策加速，新能源汽车增量扩大充电需求，储能和节能改造获资金支持空间，油品业务面临替代压力需提前布局综合能源。
