影响分析:
  加油: 未直接涉及。该规则聚焦电力辅助服务市场机制，与燃油零售业务无直接关联。
  充电: 未直接涉及。文件核心是辅助服务市场的基本规则框架，虽与电力系统相关，但未明确涉及充电基础设施运营。间接观察：辅助服务市场机制完善可能为充电负荷参与电网调节提供参考，但本文件未规定充电桩、V2G或相关机制。
  电力_储能_V2G_交易: 间接涉及。文件为电力辅助服务市场基本规则，已判主题包含VPP和聚合商准入，表明虚拟电厂和聚合商在辅助服务市场中具有准入地位，可参与电力辅助服务市场。V2G未在正文中出现。电力交易属于电力市场范畴，但本文件专项针对辅助服务市场，具体交易品种和准入条件需参照附件细则。
行动建议:
- 趁早研究：虚拟电厂和聚合商准入机制，对照本规则及后续实施细则评估市场准入条件，做好资质准备
- 趁早对接：主动联系电力辅助服务市场运营机构，了解聚合商注册、交易品种、参与流程等具体要求
- 趁早评估：梳理现有储能资源，评估参与调峰、调频等辅助服务的能力和合规性
- 趁早布局：关注各省市辅助服务市场实施细则出台进度，结合属地化要求提前规划业务切入路径
didi_impact_one_liner: 规则确立电力辅助服务市场框架，虚拟电厂和聚合商在辅助服务市场中的准入地位获明确，为综合能源服务商参与电力辅助服务创造政策基础，需持续跟踪实施细则落地。
