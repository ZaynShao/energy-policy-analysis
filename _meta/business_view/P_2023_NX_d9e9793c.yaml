  加油: 未直接涉及。该方案聚焦新型储能(电化学储能等)发展，加油业务(燃油零售)不属于新型储能范畴，正文未提及加油站或燃油相关业务。
  充电: 未直接涉及。虽然储能可与充电基础设施协同(如平抑充电负荷波动),但正文仅明确提及"新型储能"的科学布局与配套机制,未具体阐述充电基础设施、充电桩或新能源汽车充电服务。
  电力_储能_V2G_交易: 直接涉及。正文明确以"新型储能"为核心对象,提出建立健全配套政策机制、加快推动高质量规模化发展,将对储能项目投资布局、技术路线选择及商业模式构建形成直接指导。具体建设规模、盈利机制等需待附件全文明确。
行动建议:
- A 趁早:研究自治区新型储能实施方案附件全文,梳理新型储能"十四五"期间的发展目标、布局区域及重点任务,评估储能业务在本地区的拓展空间。
- B 趁早:对接国网宁夏电力有限公司,了解新型储能在电网侧的应用需求及参与电力市场的机制设计,探索储能项目与电网调度、削峰填谷的协同模式。
- C 研究:关注自治区后续出台的配套电价政策、储能参与电力辅助服务市场规则,判断储能项目经济性及盈利路径。
