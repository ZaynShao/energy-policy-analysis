影响分析:
  加油: 未直接涉及。正文未出现成品油批发价、炼厂装车价、商户合规成本或KA支付接口等事项；仅可作间接观察：能源行业信用体系建设可能影响企业合规信息归集，但通报未写具体加油业务要求。
  充电: 未直接涉及。正文未写建桩节奏、选址、充电服务费、场站电价、超充标准或充电运营义务；智能微电网许可豁免不等同于充电场站运营规则变化。
  电力_储能_V2G_交易: 直接相关点在许可准入：通报明确将新型储能、智能微电网、虚拟电厂等新型主体纳入电力业务许可豁免范围，影响聚合商/VPP主体的许可门槛判断。绿证方面，正文明确制发《可再生能源绿色电力证书管理实施细则（试行）》、在浙江/河南/广东探索分布式可再生能源绿证核发、存量常规水电绿证划转及核销，影响绿证全生命周期管理；但对电力现货规则、结算机制、中长期比例、偏差考核、售电利润上限、火电长协等未直接涉及，V2G/反向充电未直接涉及。
行动建议:
- A 趁早:对照通报所列“新型储能、智能微电网、虚拟电厂纳入电力业务许可豁免范围”，仅就豁免适用范围梳理公司相关主体与项目，更新准入合规清单，不推定其他新增义务。
- B 研究:跟踪《可再生能源绿色电力证书管理实施细则（试行）》及浙江、河南、广东分布式绿证核发、存量水电绿证划转核销的执行口径，评估对绿证/绿电环境权益管理和售电业务合同的潜在影响，不据此推定新增交易机会。
- C 趁早:对加油、充电业务不做本文件项下的新增合规动作；仅将能源行业信用信息归集要求纳入既有合规台账跟踪。
didi_impact_one_liner: 资质中心巡视整改通报对加油、充电无直接业务影响；电力侧需关注新型储能/智能微电网/虚拟电厂许可豁免和绿证核发核销规则，未涉及现货交易规则变化。
