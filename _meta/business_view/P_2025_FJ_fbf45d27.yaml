影响分析:
  加油: 未直接涉及。该方案聚焦电力中长期市场交易,经营主体为发电企业、电力用户(工商业)、售电公司及新型储能/虚拟电厂,未涉及油品经营或加油业务。
  充电: 未直接涉及。该方案主要规范电力中长期市场交易机制,虽提及新能源发电参与市场,但未对充电桩建设、充电服务费、电动汽车用户参与市场等作出具体规定。正文中新能源汽车、充电基础设施未出现。
  电力_储能_V2G_交易: 直接涉及。方案明确将独立新型储能、虚拟电厂运营商列为新型经营主体,'具备条件后可根据交易规则参与市场交易',为其进入市场提供了制度通道。同时,新能源发电(包含可能的新能源汽车相关充放电)可参与年度/月度绿电双边协商交易。但V2G机制本身未在正文中出现,储能具体参与条件待后续规则明确。
行动建议:
- A 趁早研究独立储能和虚拟电厂参与福建电力市场的准入条件和交易规则,对接交易机构,储备资质申报材料
- B 研究本方案中工商业用户直接参与市场的时限要求(新增10千伏及以上用户并网6个月内全电量入市),评估对自身用电成本和结算模式的影响
- C 研究售电公司保底服务资质优选机制,评估作为保底售电公司参与市场的可行性和风险
- D 研究绿电年度(多年)双边协商交易机制,评估锁定长期绿电供应的可能性及环境价值
didi_impact_one_liner: 福建明确储能/虚拟电厂可入场电力交易,但需待规则落地;工商业用户入市时限收紧,新能源交易机制明确,V2G未直接涉及。
