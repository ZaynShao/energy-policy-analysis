影响分析:
  加油: 未直接涉及。该政策聚焦燃煤发电上网电价形成机制改革，不涉及成品油定价或加油业务相关机制。
  充电: 未直接涉及。政策核心是燃煤发电侧上网电价机制改革，通过“基准价+上下浮动”市场化方式定价。充电桩运营商作为工商业用电户，其购电价格虽与电力市场间接相关，但政策正文未明确充电或新能源汽车充换电价格形成机制。
  电力_储能_V2G_交易: 未直接涉及。政策明确健全销售电价形成机制，电力交易通过辽宁电力交易中心开展，现货交易可不受“基准价+上下浮动”限制，但正文未提及储能、虚拟电厂(VPP)、V2G、电力辅助服务市场或聚合商等机制。燃气发电、核电、跨省跨区送电仅涉及价格参考基准价调整，不涉及新型电力市场主体准入。
行动建议:
- 'A 趁早: 充电业务研究电力市场化交易机制演变，关注工商业用户销售电价形成机制调整对充电运营商购电成本的影响路径。'
- 'B 研究: 电力业务跟踪辽宁电力交易中心现货交易规则演进，理解市场化价格机制对电力批发侧的影响，为后续参与电力市场做准备。'
didi_impact_one_liner: 该政策为辽宁省燃煤发电上网电价由标杆价改为基准价±浮动机制，主要影响发电侧价格形成，充电、电力等业务未直接涉及，间接影响有待市场机制进一步传导。
