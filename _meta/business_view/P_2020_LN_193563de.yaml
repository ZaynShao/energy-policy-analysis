影响分析:
  加油: 未直接涉及。该政策聚焦燃煤发电上网电价形成机制改革，核心是燃煤电厂上网电价的定价方式转变（从标杆电价改为基准价+浮动机制），与加油站燃油零售业务无直接关联。
  充电: 未直接涉及。政策虽属电力市场改革范畴，但核心调整对象为燃煤发电企业的上网电价形成机制，未明确涉及充电服务价格、充换电设施电价或新能源汽车充电成本传导机制（间接：市场化上网电价可能通过输配电价传导至充电运营企业的购电成本，但正文未明确表述此传导路径）。
  电力_储能_V2G_交易: 未直接涉及。正文虽涉及电力市场交易机制（双边协商、集中竞价、现货交易）及价格形成机制改革，但政策对象为燃煤发电上网电价。可再生能源价补机制和核电、燃气发电参考基准价属于配套稳定措施，正文未明确涉及储能、虚拟电厂、V2G或独立电力交易新业务机会。
行动建议:
- A 趁早跟踪辽宁省后续电力市场化交易规则和输配电价调整，尤其是市场化用户购电成本变动趋势，为充电业务采购电力成本管理做预判
- B 研究:关注辽宁省电力现货市场建设推进情况（政策明确现货交易可不受基准价+浮动限制），评估对电力采购策略的潜在影响
- C 研究:关注交叉补贴调整进程（政策要求逐步减少工商业用户交叉补贴），评估对充电等工商业用户用电成本的间接影响
didi_impact_one_liner: 该政策为辽宁燃煤发电上网电价市场化改革实施方案，聚焦燃煤电价定价机制从标杆制转为基准价+浮动制，虽属电力市场基础性改革，但对充电业务直接影响有限，加油和储能/V2G/交易业务未直接涉及。
