  加油: 未直接涉及。本文件为青海省2023年6月电力市场化交易电量情况报告，属于电力市场数据发布，与传统加油业务无关联。
  充电: 未直接涉及。正文仅发布电力用户注册数量和交易结算电量数据，未涉及充电基础设施、充电桩运营或新能源汽车充电相关内容。
  电力_储能_V2G_交易: 直接涉及电力交易领域。青海电力交易平台注册主体1525家中包含发电企业805家、售电公司214家、电力用户506家；6月省内市场化交易结算电量71.2亿千瓦时，跨省外送14.7亿千瓦时，外购10.7亿千瓦时。但正文未涉及储能装置、V2G机制、虚拟电厂或电力辅助服务市场具体内容。
