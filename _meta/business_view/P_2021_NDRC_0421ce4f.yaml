影响分析:
  加油: 未直接涉及。该指导意见聚焦新型电力储能（除抽水蓄能外），完全属于电力系统范畴，无燃油相关业务内容。
  充电: 直接涉及。政策明确鼓励充电设施与储能融合发展，探索分布式新能源、微电网、充电设施等终端用户的储能融合新场景；明确支持聚合利用不间断电源、电动汽车、用户侧储能等分散式储能设施，结合大数据、人工智能、区块链技术探索智慧能源、虚拟电厂等商业模式，为充电业务与储能协同提供政策依据。
  电力_储能_V2G_交易: 直接涉及。政策设定到2025年新型储能装机规模达3000万千瓦以上，到2030年实现全面市场化发展；明确推动用户侧储能多元化发展，探索虚拟电厂等多种商业模式；鼓励聚合分散式储能设施参与系统调节；强调储能技术成本下降和市场机制成熟，为储能规模化应用、VPP商业化及储能参与电力市场交易奠定政策基础。V2G机制虽未明文展开，但电动汽车已被列为可聚合的分散式储能资源。
行动建议:
- 'A 趁早: 布局充电场站+储能一体化方案，对接分布式储能融合政策机遇，在重点城市园区开展充电设施与储能协同项目试点'
- 'A 趁早: 接入电网调度系统，蓄力成为可聚合储能资源，整合充电桩储能、电池储能构建VPP参与能力'
- 'B 研究: 充电场站储能融合的商业模式，包括峰谷套利、需求响应、辅助服务等收益路径及可行性'
didi_impact_one_liner: 政策强力驱动储能规模化，千瓦级装机目标与VPP商业模式开放为充电业务带来储充协同、聚合调度新机遇。
