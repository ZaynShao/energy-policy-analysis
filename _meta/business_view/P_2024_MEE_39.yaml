影响分析:
  加油: 未直接涉及。文件聚焦碳排放双控制度体系建设，明确到2025年完善碳排放统计核算体系、出台行业碳排放核算标准，但未具体提及加油站或燃油领域的碳排放核算、减排目标或管理要求。间接影响：碳排放双控考核机制可能通过影响地区能源结构优化目标，间接传导至成品油价差管理和加油业务扩张决策。
  充电: 未直接涉及。文件提出构建产品碳足迹管理体系和碳标识认证制度，重点针对重点领域和行业碳排放核算能力建设，未直接涉及充电基础设施或新能源汽车充电服务的碳排放核算方法、补贴或准入机制。间接影响：产品碳足迹标准体系建设可能为未来充电服务的碳减排量化提供基础。
  电力_储能_V2G_交易: 未直接涉及。文件强调碳排放双控与全国碳排放权交易市场的有效衔接，提出地方碳排放预算管理制度和重点用能单位碳排放管理，但未明确提及虚拟电厂(VPP)、储能、V2G、双向充电桩、电力交易或聚合商等具体机制。间接影响：碳排放双控考核可能激发企业通过电力清洁化降低碳排放强度，间接利好绿电消费和新能源发电消纳。
行动建议:
- 'A 趁早: 摸排公司各业务板块碳排放家底，建立内部碳排放核算台账，为后续接入全国碳市场或应对碳考核提前准备。'
- 'B 研究: 跟踪''十五五''规划碳排放双控指标分解方案，研判区域碳排放目标对公司能源供给结构的合规影响和调整空间。'
- 'C 研究: 关注能耗双控向碳排放双控转型的制度衔接节点，提前评估公司参与碳排放权交易市场的资质条件和合规成本。'
didi_impact_one_liner: 碳排放双控制度体系构建将倒逼能源企业强化碳排放核算与管理能力，虽未直接触及加油/充电/储能业务，但碳市场衔接和碳考核机制将间接影响公司能源供给结构和绿电消费布局。
