影响分析:
  加油: 政策建立碳排放双控制度体系，将推动能源结构向清洁低碳转型。交通领域作为重点排放领域，加油业务面临长期碳减排约束压力。政策要求完善碳排放统计核算、纳入重点用能单位管理，加码企业碳排放管理义务。未直接涉及燃油加油站市场准入调整或淘汰机制，属于通过宏观能源转型目标实现的间接影响。
  充电: 政策以碳排放强度控制为主（十五五时期），不再将能耗强度作为约束性指标，客观上为电力消费增长提供了一定空间。政策要求构建产品碳足迹管理体系和产品碳标识认证制度，充电设施及相关产品的全生命周期碳排放核算需求将逐步显现。充电业务本身未被政策直接规范，属于通过电力清洁化、产品碳足迹核算要求实现的间接影响。
  电力_储能_V2G_交易: 政策明确提出与全国碳排放权交易市场有效衔接，碳排放核算体系完善和国家温室气体排放因子数据库建设，将为参与碳市场的电力企业碳排放数据管理提供基础支撑。政策推动能源结构优化和清洁能源发展，客观上利好可再生能源发电。储能、V2G、虚拟电厂等具体形态未在正文中直接出现，相关直接业务影响待后续配套政策明确。
行动建议:
- 趁早建立内部碳排放核算能力，匹配重点用能单位碳排放管理制度要求，为进入碳排放权交易市场做好准备
- 趁早研究产品碳足迹管理体系建设路径，跟踪产品碳标识认证制度进展，提前布局充电及相关产品的碳足迹核算准备
- 研究关注省市两级碳排放预算管理制度试点，评估对电力业务碳排放管理的影响边界和合规要求
didi_impact_one_liner: 碳排放双控制度加速构建，加油业务面临碳减排长期压力，充电业务获间接空间，碳市场有效衔接为电力业务碳排放管理提供新框架。
