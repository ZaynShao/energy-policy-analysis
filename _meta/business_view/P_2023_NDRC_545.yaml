影响分析:
  加油: 未直接涉及。文件聚焦充电基础设施建设，虽提及在加油站等场所建设充电桩，但属于充电基础设施向加油站的延伸布局，不涉及燃油业务本身。
  充电: 直接利好。政策明确推动县乡充电网络'县县全覆盖''乡乡全覆盖'，支持社区充电共享、智能有序充电、V2G等新模式，提出优化配电网支撑、落实峰谷分时电价、免收需量电费等具体支持措施，为充电运营业务在农村地区拓展提供政策依据。
  电力_储能_V2G_交易: 明确涉及V2G和储能。政策鼓励开展V2G（电动汽车与电网双向互动）研究，提出在利用率较低农村地区探索'光伏发电、储能、充电一体化'设施建设，落实峰谷分时电价政策。但电力交易、虚拟电厂未直接涉及。
行动建议:
- A 趁早:布局县乡充电网络。政策明确'县县全覆盖''乡乡全覆盖'目标时间窗口，建议公司结合乡村自驾游、公路沿线、易地搬迁安置区等政策重点区域，趁早规划充电场站选址和建设时序。
- A 趁早:研究V2G商业模式。政策明确鼓励V2G研究和技术攻关，农村地区电网支撑保障能力将增强，建议趁早研究车网互动商业模式，参与相关标准制定。
- A 趁早:参与储能充电一体化试点。政策提出在农村地区探索光储充一体化设施，具备条件的地区可申请专项债支持，建议趁早对接地方政府，探索投资运营模式。
- B 研究:社区充电共享模式。政策推广'临近车位共享''社区分时共享''多车一桩'等共享模式，建议研究与物业、街道办的协作机制，探索平台接入和运营分成模式。
- B 研究:峰谷分时电价策略。政策落实峰谷分时电价鼓励低谷时段充电，建议研究调整充电定价策略，引导用户错峰充电，提升场站运营效率。
didi_impact_one_liner: 政策全面利好充电业务在农村地区拓展，明确V2G和储能充电一体化方向，县乡充电网络覆盖提速为公司充电业务下沉提供政策窗口期。
