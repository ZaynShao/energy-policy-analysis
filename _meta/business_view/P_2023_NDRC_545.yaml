影响分析:
  加油: 未直接涉及。文件虽提及“具备条件的加油站等场所”配置充电桩，但仅涉及充电桩选址场景，非加油业务本身的运营、准入或补贴机制调整。
  充电: 直接利好。政策明确要求充电站“县县全覆盖”、充电桩“乡乡全覆盖”；鼓励地方政府出台专项支持政策，利用专项债券支持充换电建设；对集中式充换电设施用电免收需量（容量）电费至2030年前；推广“临近车位共享”“社区分时共享”等共享模式；推动公共充换电网络运营商平台互联互通。
  电力_储能_V2G_交易: 部分直接涉及。V2G方面：明确“鼓励开展电动汽车与电网双向互动（V2G）关键技术研究”，但仍处研究阶段未规模化落地。储能方面：鼓励探索“光伏发电、储能、充电一体化”充电基础设施，但明确限定于“充电桩利用率较低的农村地区”。电力交易方面：落实峰谷分时电价政策鼓励低谷时段充电；到2030年前对集中式充换电设施用电免收需量（容量）电费，全额纳入输配电价回收。配电网方面：要求增强农村电网支撑保障能力，开展配套电网建设改造。
行动建议:
- A 趁早对接地方政府的充电基础设施专项支持政策，布局县乡公共充电网络
- B 趁早设计适合农村地区经济实用的充电服务产品，响应“差异化策略”要求
- C 趁早接入公共充换电网络运营商平台，达成互联互通
- D 研究：跟进V2G关键技术研究成果，储备技术能力
- E 研究：关注峰谷分时电价政策对充电服务定价策略的影响
didi_impact_one_liner: 充电业务迎最强政策春风，县乡充电基础设施将加速覆盖；V2G和储能仅有研究层面的政策支持，尚未形成规模化商业机会；农村电网支撑能力提升为后续充电业务扩张奠定基础。
