影响分析:
  加油: 直接涉及。政策明确开放全部工商业电力用户直接参与市场交易，加油站作为工商业用户可选择直接参与电力市场交易形成用电价格，或由电网企业代理购电。10千伏及以上工商业用户原则上须直接参与市场交易，年用电量50万千瓦时及以上两部制工商业用户应直接参与市场交易。代理购电用户电价构成明确包含容量电价衔接机制，对两部制用户存在影响。
  充电: 直接涉及。充电桩运营商属于工商业用户范畴，适用工商业用户直接参与市场交易或电网企业代理购电的机制。政策明确10千伏及以上且报装容量大于1000千伏安及以上的新投产工商业用户应直接参与市场交易，充电场站若达到规模门槛需直接参与电力市场交易。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦于电网企业代理购电机制和工商业用户入市场景，未明确涉及储能、V2G、虚拟电厂或电力交易的具体机制设计。虽提及市场化交易方式和系统运行费用构成，但未明确展开新型储能参与市场或聚合商相关内容。
行动建议:
- A 趁早摸排本省业务范围内的工商业用户用电规模，梳理10千伏及以上、年用电量50万千瓦时及以上两部制用户的数量和用电特征，评估直接参与市场交易的必要性
- B 趁早研判代理购电用户电价构成的各要素，尤其是容量电价衔接、代理购电偏差电费折价和系统运行费用等对综合用电成本的影响，建立成本预测模型
- C 趁早对接海南电力市场化交易方案，明确年度/月度/多日/现货交易的代理购电方式及跨省购电路径，为用户提供购电策略建议
didi_impact_one_liner: 海南工商业用户全面进入电力市场，代理购电机制规范透明，加油/充电业务需评估直接入市必要性，关注容量电价衔接和偏差电费对用能成本的影响
