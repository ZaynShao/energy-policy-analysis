影响分析:
  加油: 未直接涉及。正文仅在拓展供给场所中列举了加油站作为可建设充电设施的公共场所之一，并非对加油站业务的直接政策要求或影响。
  充电: 直接涉及。政策明确推出居住区新能源汽车充电"统建统服"试点模式，2年内打造一批实现"三个5"（找桩≤500米、服务费≤0.5元、排队≤5分钟）的服务试点；聚焦私人自用桩配建比不足40%且500米内公共充电桩不足的区域；采取"社会征集、企业申报、区级核对、市级评价"方式确定项目承担方；国网北京电力对符合条件的项目提供"三零"接电服务。
  电力_储能_V2G_交易: 未直接涉及。正文聚焦于居住区公共充电设施的"统建统服"建设运营服务模式，虽提到电力"三零"接电服务以提高报装效率，但未涉及储能设施、V2G机制、电力交易或虚拟电厂等业务领域。
行动建议:
- 趁早对接市/区城市管理部门，了解"统建统服"试点项目征集通知的具体要求和申报时间节点
- 趁早研究社区充电需求缺口评估方法，梳理目标区域（居住区外周边500米范围）的充电服务供给现状
- 趁早与场地方、产权方洽谈合作意向，提前锁定符合选址原则的优质场景资源
- 趁早对接国网北京市电力公司，确认项目是否符合"三零"服务条件以优化接电成本
- 研究"统建统服"统一建设标准和统一服务标准的具体要求，提前准备合规方案
didi_impact_one_liner: 居住区充电"统建统服"试点启动，充电运营企业可通过市场化申报参与社区公共充电服务网络建设，需满足"三个5"服务标准和统一建设运营规范。
