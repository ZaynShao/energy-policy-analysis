影响分析:
  加油: 未直接涉及。该政策聚焦电动汽车充换电设施扶持，与传统燃油加油业务无关联。
  充电: 直接利好。政策覆盖居民自用、专用、公用三类充电设施，明确示范小区充电设备按投资30%补贴（直流上限600元/千瓦、交流上限300元/千瓦），业主大会按新建充电车位获一次性补贴，出租车充电示范站补贴另有标准，设施须接入市级平台并接受服务质量评价。
  电力_储能_V2G_交易: 未直接涉及。政策核心为充电设施建设运营补贴扶持，未涉及储能配置、V2G反向充电、电力交易或虚拟电厂机制，换电站补贴仅针对特定公共服务领域运营车辆的换电服务。
行动建议:
- 'A 趁早: 把握示范小区建设窗口期，对照补贴标准（直流600元/千瓦、交流300元/千瓦）提前测算投资回报，申报享受设备投资30%补贴。'
- 'B 研究: 尽快梳理现有充电站点接入市级平台的服务质量评价要求，对标''三星''''二星''''一星''等级标准，制定设施升级或运维优化方案以维持补贴资格。'
- 'C 趁早: 关注出租车充电示范站和高水平换电站的认定标准发布动态，结合上海出租车电动化替代政策拓展B端客户合作机会。'
- 'D 研究: 跟踪业主大会充电车位一次性补贴的申领流程，储备与居民小区业主委员会合作共建共享充电桩的商务模式方案。'
didi_impact_one_liner: 政策补贴力度大且覆盖全类型充电设施建设运营，建议优先布局示范小区共享充电桩和出租车专用充电站，同时确保设施接入市级平台并达到评价等级要求以维持补贴资格。
