影响分析:
  加油: 未直接涉及。政策聚焦用户侧储能、虚拟电厂、电力交易和V2G领域，未提及加油站业务或燃油相关场景。
  充电: 直接受益。（1）政策明确鼓励充换电站建设用户侧储能电站，向场区提供综合能源管理服务；（2）分布式台区储能将提升充换电设施的电能质量和供电保障能力；（3）试点建设直流双向充电桩，探索规模化车网互动，为充换电运营商提供了向V2G方向延伸的政策窗口。
  电力_储能_V2G_交易: 全面深度涉及。（1）分时电价机制明确，用户侧储能可执行峰谷分时电价，低谷时段电价下浮55%，推动每天两充两放，显著提升储能经济性；（2）明确支持用户侧储能参与电能量市场、需求响应市场和辅助服务市场；（3）支持组建虚拟电厂聚合商参与市场化交易；（4）探索分布式台区储能建设；（5）建立新型储能项目监测平台，强化全寿命周期监管；（6）简化并网流程，30个工作日内完成验收。
行动建议:
- 趁早研究用户侧储能投资：抓住低谷时段电价下浮55%的峰谷套利机会，结合两充两放机制测算投资回报周期，优先在工业负荷稳定、峰谷价差大的区域布局。
- 趁早对接虚拟电厂聚合商：政策明确支持用户侧储能参与虚拟电厂形式的市场化需求响应和辅助服务交易，趁早研究聚合参与路径和准入条件。
- 趁早布局V2G试点跟踪：政策明确试点建设直流双向充电桩和探索规模化车网互动，趁早跟踪吉林省V2G试点具体落地安排和补贴政策，评估充电场站改造机会。
didi_impact_one_liner: 吉林省用户侧储能获分时电价（低谷下浮55%）和多市场交易明确支持，充换电站储能建设获政策鼓励，V2G车网互动试点启动，但需适应全寿命周期监测平台监管要求。
