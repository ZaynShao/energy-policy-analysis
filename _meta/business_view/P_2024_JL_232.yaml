影响分析:
  加油: 未直接涉及。政策聚焦用户侧储能建设，虽将充换电站列为储能应用场景，但未对传统加油业务形成直接政策影响。
  充电: 直接受益。政策明确支持充换电站建设用户侧储能，并给予低谷时段电价下浮55%、每天两充两放等经济激励，为充电场站提供降低运营成本、提升盈利能力的政策窗口。同时支持充电场站参与虚拟电厂聚合商形式和需求响应市场交易。
  电力_储能_V2G_交易: 直接涉及储能核心领域。政策系统部署用户侧储能建设，从应用场景拓展(分布式台区储能)、电价机制(分时电价+55%低谷下浮)、市场参与(电能量市场+辅助服务+虚拟电厂聚合)三个维度构建储能商业模式。同时明确提出试点建设直流双向充电桩并探索规模化车网互动，政策已触及V2G领域但仍处于探索阶段。
行动建议:
- A 趁早在充换电场站规划中嵌入储能配置方案，同步设计参与分时电价套利和需求响应的运营策略
- B 趁早研究虚拟电厂聚合商模式下的用户侧储能参与路径，提前储备相关技术能力和运营资质
- C 研究直流双向充电桩试点政策动向，评估V2G业务布局的技术可行性和市场价值
- D 研究分布式台区储能参与电力市场的合规要求和收益模型，为后续扩展业务边界做准备
didi_impact_one_liner: 吉林省出台用户侧储能专项支持政策，为充电运营提供储能配置机遇和电价套利空间，同时政策明确触及V2G领域但仍处探索阶段，需关注后续配套细则。
