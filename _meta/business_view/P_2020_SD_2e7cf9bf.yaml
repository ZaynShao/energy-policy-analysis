影响分析:
  加油: 未直接涉及。正文聚焦于国家电网和南方电网的充电桩投资计划，提及充电桩支持公交、物流、出租等专用车辆电动化革新及促进电动汽车下乡，虽涉及出行能源替代趋势，但未直接涉及加油站业务。
  充电: 直接受益。国家电网宣布2020年计划投资27亿元、新增充电桩7.8万个（同比增逾10倍），明确新增居住区充电桩5.3万个、公共充电桩1.8万个、专用充电桩0.7万个；国家电网将补齐居民区充电难、平台互联互通不足等短板，推广"互联网+"打造充电一张网，开展县、乡充电桩试点促进电动汽车下乡。
  电力_储能_V2G_交易: 未直接涉及。正文虽提及充电桩或成为能源互联网入口、涉及5G/大数据/工业互联网等新基建领域，并提到配套电网规划建设与运维，但未明确出现储能、V2G、电力交易或虚拟电厂等机制或具体影响。
行动建议:
- A 趁早:对接国家电网充电桩建设计划，摸排山东省适宜布局公共充电桩的场所（如商超、写字楼停车场），抢占先机争取纳入国网合作共建或运营商互联互通体系
- B 研究:密切跟踪国网充电桩招标动态，重点关注已通过两网招标认证的设备商及核心功率模块供应商资质要求，评估公司现有业务是否具备投标资质或合作条件
- C 研究:关注山东电网是否会响应国家电网投资计划出台配套措施，提前布局居住区充电桩、乡镇充电桩试点等细分领域的市场机会
didi_impact_one_liner: 国网南网联手271亿元砸向充电桩，居住区/公共/专用/岸电全覆盖，山东充电市场规模化加速，运营商互联互通机遇窗口打开
