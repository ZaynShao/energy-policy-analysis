  充电: 未直接涉及。正文未提及充电设施、场站侧电价结构、服务费定价或建桩节奏，充电业务相关决策变量均未改变。不做延伸推断。
  电力_储能_V2G_交易: 需人工裁定（材料空白）。标题和发文主体（国家发改委第50号令，2026/10/23发布、2026/12/1施行）指向能源保供中长期合同管理制度，属于电力业务的核心关切范围：中长期与现货比例、火电长协签约与履约规则都在该制度的覆盖范围内，可能改变相关决策变量。但正文节选只有发布公告和附件链接（PDF、OFD未提供），没有中长期合同签约主体、履约要求、与现货的衔接、考核与违约处理等任何实质条款，因此无法判断具体改变了哪个数值，也无法判断影响方向与量级，须人工裁定。
行动建议:
- A 趁早:趁早调取《能源保供中长期合同管理办法(试行)》附件PDF和OFD全文，在2026年12月1日施行前完成条款逐条比对，重点核对中长期合同签约履约要求和与现货市场的衔接口径。
- B 研究:以全文为依据，研究该办法对电力业务目标省中长期与现货持仓结构、火电长协签约履约规则的实质影响；在细则落地前不调整持仓，不新增业务动作。
didi_impact_one_liner: 第50号令只发布了能源保供中长期合同管理办法的公告，实质条款在未提供的附件中，因此对加油和充电都未直接涉及；对电力业务则需要拿到全文后裁定，因为它可能直接改变中长期与现货的比例以及长协规则。
