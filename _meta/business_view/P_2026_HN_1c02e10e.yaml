影响分析:
  加油: 文件明确要求构建重点公路LNG补能体系，国高网LNG加注站按每100公里一对、省高网按每200公里一对布局，重卡车流量大的路段可加密，并要求修编燃气规划。政策驱动LNG替代传统燃油成为干线公路货运的主要补能形式，传统加油站面临向综合能源站转型的规划压力。
  充电: 文件要求持续优化完善公路水路充（换）电设施布局，同一国省干线充换电场站建设间隔宜大于30公里，干线交叉区域通勤距离宜大于5公里；新建交通枢纽场站屋顶预留光伏建设条件并按需规划综合补能站。政策直接推动充电基础设施网络化布局和枢纽节点覆盖。
  电力_储能_V2G_交易: 文件明确要求新建和改扩建交通枢纽场区预留储能设施及装配式变电站建设条件，适度超前规划电网设施和储能设施，聚焦交通领域中远期能源需求。因文件未明确涉及V2G机制、电力交易或虚拟电厂聚合商资质，储能影响仅限于基础设施规划预留层面，未涉及市场化运营机制。
行动建议:
- A 趁早对接省级交通与能源主管部门，掌握LNG加注站选址规划修编时间节点，提前锁定重点路段布点资源
- A 趁早布局充换电场站选址，重点覆盖国省干线间隔30公里节点及枢纽场站屋顶光伏区域，形成网络化服务能力
- B 研究交通枢纽储能设施建设模式，探索与电网公司合作共建装配式变电站的可行性路径
- B 研究传统加油站向油+LNG+充电综合能源站转型的技术方案和投资测算
didi_impact_one_liner: 政策驱动湖南省干线公路充换电网络加密和LNG补能体系完善，为平台布局公路货运综合能源补给服务提供基础设施窗口期。
