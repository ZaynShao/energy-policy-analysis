影响分析:
  加油: 政策明确将「交通运输」行业纳入碳排放核算标准研制重点领域，并提出制定产品碳足迹碳标识标准。随着碳核算体系建立，加油业务作为交通能源供应环节将面临上游油品碳足迹核算要求，可能被纳入企业碳排放核算和碳标识管理范围，需提前关注碳核算标准对供应链管理的影响。
  充电: 政策直接部署研制「新能源汽车」产品碳足迹国家标准，并将充电基础设施所服务的新能源汽车纳入碳足迹量化与评价体系；同时要求加快「光伏」利用等关键碳减排技术标准研制，充电+光伏模式将纳入碳减排量核算标准范围。充电业务所涉及的新能源汽车充换电设施和分布式光伏，将面临碳足迹核算与标识的标准化管理要求。
  电力_储能_V2G_交易: 政策明确将「电力」行业列为首批碳排放核算标准研制重点领域，要求基本实现重点行业企业碳排放核算标准全覆盖。同时部署构建二氧化碳捕集、运输、地质封存全链条标准体系，开展储能相关的碳减排量核算标准研制，并提出支撑全国温室气体自愿减排交易市场建设。电力行业的碳计量能力建设、碳核算标准、碳减排量核算方法学均将直接受政策约束和指导。V2G未直接涉及。
行动建议:
- A 趁早研究交通运输行业碳排放核算标准对油品供应链的合规要求，评估加油业务碳核算边界和碳足迹管理需求
- A 趁早跟进新能源汽车碳足迹国家标准研制进展，对照充电运营环节梳理碳排放因子和核算边界
- B 研究充电+光伏模式的碳减排量核算标准适用性，储备碳减排项目方法学对接能力
- B 趁早研究电力行业碳排放核算标准框架，跟踪碳计量技术规范制定动态，提前布局碳排放数据管理和计量器具配备
didi_impact_one_liner: 碳排放核算标准体系2024-2025年加速建立，电力、充电所服务的新能源汽车及加油站均被纳入覆盖范围，能源补给业务需提前布局碳核算合规和碳足迹管理能力。
