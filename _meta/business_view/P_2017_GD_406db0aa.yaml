影响分析:
  加油: 未直接涉及。正文明确覆盖的六个行业为电力、水泥、钢铁、石化、造纸和民航，且明确界定为年排放2万吨二氧化碳（或年综合能源消费量1万吨标准煤）及以上的企业，加油零售业务未在列举范围内。
  充电: 未直接涉及。正文仅覆盖电力行业燃煤燃气发电机组（含热电联产）的碳排放配额管理，虽涉及发电侧碳成本，但未提及充电基础设施、充换电运营商或电动车碳减排量的抵消机制。
  电力_储能_V2G_交易: 未直接涉及。正文将电力行业配额分配限定于发电机组（燃煤燃气发电、资源综合利用机组），且明确采用基准线法和历史强度下降法核算至发电企业，未涉及储能、V2G、虚拟电厂或电力交易等机制（间接影响：电力企业碳成本上升或对电网电价产生传导，但正文未量化或明确该传导机制，故不写）。
行动建议:
- A 趁早:研判碳配额成本在电力企业端的上升趋势,评估对网供电价及自发自用场景的潜在传导,提前与电力供应商确认价格调整机制。
- B 研究:跟踪广东省碳市场扩容信号,关注六个行业范围未来是否扩展至其他高排放领域,以及基准线法是否会细化至热电联产以外的其他机组类型。
- C 研究:对照全国碳市场建设进度,梳理公司现有业务的直接和间接碳排放边界,为未来可能纳入区域碳市场做好数据台账和核算能力准备。
didi_impact_one_liner: 广东省2017年碳配额方案仅覆盖火电/水泥/钢铁/石化/造纸/民航六大行业的大型排放企业,加油、充电、储能/V2G/电力交易等业务未直接涉及,但电力行业95%免费配额机制对未来电价传导存在间接观察价值。
