影响分析:
  加油: 未直接涉及。政策针对的是电力、水泥、钢铁、石化、造纸、民航六个行业的排放管控,石化行业指炼化生产端企业,并非加油站零售环节。加油站年排放量通常达不到2万吨CO2的纳入门槛,碳配额机制不直接约束燃油零售业务。
  充电: 未直接涉及。政策虽涵盖电力行业,但正文明确针对燃煤燃气发电机组(含供热、热电联产机组)及资源综合利用发电机组,属于发电侧排放管控。新能源汽车充电服务、充电桩运营未在正文中出现,不属于直接监管对象。
  电力_储能_V2G_交易: 未直接涉及。政策正文仅涉及六个行业排放企业的碳配额分配与管理,采用基准线法/历史强度下降法/历史排放法三种分配方法。储能、虚拟电厂(VPP)、V2G、电力交易、聚合商等机制在正文中未出现,不属于本方案直接约束或影响的范围。
行动建议:
- A 研究:趁早研究发电企业碳成本传导路径,评估配额成本上涨对购电价格可能产生的影响,提前布局电力采购策略以规避碳成本波动风险
- B 跟踪:趁早跟踪全国碳市场建设动态,该方案明确提及将根据全国碳市场启动运行情况对企业名单实行动态管理,需关注2023年是否纳入新行业或扩大覆盖范围
didi_impact_one_liner: 本方案为省级2017年度碳配额分配细化规则,聚焦六个高排放行业的碳配额分配方法与发放机制,对加油/充电/储能V2G交易业务均无直接业务影响,但需关注碳市场机制优化对电力采购成本的潜在传导效应。
