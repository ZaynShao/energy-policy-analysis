影响分析:
  加油: 直接涉及。正规加油站须确保同时持有成品油零售经营许可和营业执照；文件明确将查处「有固定场所并已取得零售许可但未取得营业执照」的站点。政府将加强港区、停车场、物流园区等区域巡查，对占用道路非法销售、生产销售不合格油品、非法运输等行为从严查处。正规加油站合规成本可能上升，但市场秩序将优化。文件同时提出「疏堵结合」，有序推动企业自备加油站点设立及升级改造，或为合规企业带来新增市场空间。
  充电: 未直接涉及。本文件聚焦打击非法加油点及规范成品油零售市场，不涉及充电基础设施建设、运营或监管。
  电力_储能_V2G_交易: 未直接涉及。本文件属石油零售合规专项整改，不涉及储能、虚拟电厂、V2G、电力交易等电力业务机制。
行动建议:
- A 趁早:排查自身证照完备性，确保同时持有《成品油零售经营许可》和《营业执照》，堵塞被查处的合规漏洞
- A 趁早:对物流园区、港区周边等排查重点区域内的合规站点，加强日常巡查和台账管理，防范被周边非法加油点牵连
- B 研究:跟踪「疏堵结合」政策落地节奏，关注企业自备加油站点设立及升级改造的资质条件和审批流程变化，寻找合规扩张机会
- B 研究:研判文件对非法油品来源追溯的执法力度，评估市场供给侧调整对区域油品价格和竞争格局的影响
didi_impact_one_liner: 文件强化打击非法加油点力度，正规加油站需趁早确保双证齐全并关注「疏堵结合」带来的合规扩张机会，与充电和电力业务无关。
