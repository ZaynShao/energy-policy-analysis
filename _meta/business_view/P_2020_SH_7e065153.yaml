影响分析:
  加油: 直接涉及。政策核心就是打击非法加油点、规范成品油零售经营。明确要求从严查处：未取得零售许可的加油站、未取得营业执照的经营行为、占用道路非法销售、生产销售不合格成品油、使用无证运输工具运输成品油等行为。浦东新区、宝山区等柴油货运车辆集中区域被列为重点整治区域。正规加油站迎来清理非法竞争对手的市场空间，但同时面临更严格的合规监管。疏堵结合政策导向：有序推动企业自备加油站点设立及升级改造，扩大市场用油供给。
  充电: 未直接涉及。政策聚焦传统燃油零售的非法加油点整治，提及重点区域包括停车场、物流园区等，但仅针对柴油车加油，未涉及电动汽车充电设施或充电运营业务。
  电力_储能_V2G_交易: 未直接涉及。政策针对非法加油点和成品油流通监管，未涉及储能、虚拟电厂(VPP)、V2G或电力交易等新型电力业务。
行动建议:
- 趁早：对照方案列出的九类违法行为开展合规自查，重点排查经营资质（零售许可、营业执照）和油品质量
- 趁早：配合浦东新区、宝山区等重点区域整治行动，调整物流车队供油合作模式，优先选择合规加油站
- 趁早：关注企业自备油站点设立及升级改造的政策口子，提前研究布局合规自用加油设施
- 趁早：梳理企业内部加油点（如有），确保符合安全、消防、油品质量等监管要求
didi_impact_one_liner: 政策强化打击非法加油点，利好合规加油站扩大市场份额，但平台需确保合作加油站资质齐全、物流车队供油渠道合规，重点防范浦东、宝山等区域合规风险。
