影响分析:
  加油: 未直接涉及。该文件为分时电价政策，核心对象为工商业用电用户，加油业务不属于电力用户范畴，不涉及加油价格或运营机制调整。间接影响方面，分时电价引导用户优先选择低谷时段充电，可能在长期内影响新能源汽车渗透率，进而对油品需求产生潜在影响，但该影响不在本政策正文明确范围内。
  充电: 直接相关。分时电价机制直接重塑充电业务成本结构：低谷时段（0:00-6:00）电价下浮60%，深谷时段（12:00-14:00）扩大至下浮70%，尖峰时段（按季节分别为18:00-20:00或20:30-22:30）上浮80%。充电运营商可据此优化定价策略，引导用户向深谷时段充电，降低购电成本；尖峰时段充电需求可能向低谷时段转移，影响充电桩利用率分布。政策明确鼓励配置储能、开展综合能源利用以降低高峰负荷、增加低谷用电量，为充电+储能组合模式提供政策支撑。
  电力_储能_V2G_交易: 储能直接相关，V2G和电力交易部分涉及。储能方面：深谷时段扩大至下浮70%、尖峰维持上浮80%，峰谷价差进一步拉大，储能充放电套利空间显著提升；政策明确鼓励配置储能，为储能投资提供直接政策信号。V2G方面：政策未直接提及V2G或反向充电机制，但分时电价机制为V2G参与电网调节提供了经济基础（低谷储电、高峰放电的经济性），该影响为间接推断。电力交易方面：政策要求2025年中长期合同须申报用电曲线、反映分时价格，浮动比例原则上不低于规定，为电力交易合同签订增加了分时约束。虚拟电厂和聚合商未在正文中明确出现，相关业务未直接涉及。
行动建议:
- 'A 趁早: 充电运营业务利用深谷时段下浮70%政策红利，设计谷时充电优惠套餐，引导私家车用户在12:00-14:00深谷时段充电，提升充电桩低谷时段利用率。'
- 'B 趁早: 储能投资与运营方重新测算峰谷套利模型，以深谷下浮70%、尖峰上浮80%的新价差为基准，评估储能项目经济性，重点布局可覆盖午间深谷和夜间低谷双时段的储能项目。'
- 'C 趁早: 工商业用户（含充电场站）评估储能配置方案，响应政策第三（二）条鼓励，通过储能实现低谷储电、高峰自用，降低尖峰时段用电成本。'
- 'D 研究: 电力交易相关主体（售电公司、电力用户）关注中长期合同调整要求，尽快在年度合同中嵌入分时价格条款，避免合同不符合政策要求而产生合规风险。'
- 'E 趁早: 充电运营商评估尖峰时段定价策略，尖峰时段上浮80%可能导致用户需求下降，需提前设计平谷时段引流或配套增值服务以维持用户黏性。'
didi_impact_one_liner: 新分时电价拉大峰谷价差（深谷下浮70%、尖峰上浮80%），充电业务可获显著谷时成本优势，储能套利空间扩大，电力交易合同需嵌入分时价格条款。
