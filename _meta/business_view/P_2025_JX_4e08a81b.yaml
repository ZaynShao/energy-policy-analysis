影响分析:
  加油: 未直接涉及。该文件为电力分时电价政策，不涉及成品油定价或加油业务。
  充电: 直接涉及。分时电价时段设置直接影响充电桩运营商的购电成本：(1)午间深谷时段(12:00-14:00)扩大为必设时段，充电成本可较平段下浮70%；(2)各季节高峰时段差异显著，如1/12月晚间高峰至21:00、7-9月高峰至23:00，尖峰时段额外上浮80%；(3)工商业用户全面恢复执行分时电价，充电运营商作为工商业用户需承担分时电价成本波动。
  电力_储能_V2G_交易: '直接涉及储能。政策明确鼓励工商业用户配置储能以利用峰谷价差套利，深谷浮动比例从下浮60%扩大至70%，储能峰谷套利空间进一步扩大。


    未直接涉及V2G。文件未出现V2G、双向充电或反向充电相关机制。


    间接涉及电力交易：(1)现货市场连续结算试运行后，参与现货交易用户原则上不再执行分时电价，对中长期合同申报用电曲线提出要求；(2)分时电价损益纳入系统运行费用按月分摊。'
行动建议:
- A 趁早:针对充电场站运营，利用午间深谷时段(12:00-14:00)推出低谷充电优惠，引导私家车和运营车辆调整充电时段，降低用户充电成本感知。
- B 趁早:针对充电定价策略，重构充电服务费与分时电价的联动机制，将高峰/尖峰时段成本显性化传导至用户侧。
- C 研究:针对储能项目，结合深谷下浮70%的新幅度，重新测算工商业储能峰谷套利经济性模型。
- D 研究:关注江西省电力现货市场连续结算试运行推进节奏，提前评估对储能运营模式和分时电价执行范围的叠加影响。
- E 趁早:针对中长期合同管理，工商业储能运营商或聚合商在签订2025年下半年及后续合同时，务必申报用电曲线并反映各时段价格。
didi_impact_one_liner: 江西省分时电价深谷下浮扩至70%且午间深谷常态化，直接扩大充电低谷成本优势和储能套利空间，工商业用户全面恢复执行分时电价将重构充电运营成本结构。
