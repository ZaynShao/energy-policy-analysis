影响分析:
  加油: 未直接涉及。正文未提及加油业务。
  充电: 直接提出到2027年底建成205万个充电设施、1700万千瓦公共充电容量、满足400万辆电动汽车充电需求等量化目标，明确城市、城际、农村、旅游四大场景充电网络建设要求，包括大功率充电设施部署、老旧设施更新改造、居住区100%配建或预留充电条件、统建统营试点推广等，对充电设施建设、运营、更新改造形成直接利好。
  电力_储能_V2G_交易: 未直接涉及。正文未提及V2G、虚拟电厂、储能、电力交易等具体机制或要求。间接观察：大规模充电设施建设可能增加可调节负荷资源，但本政策未建立相应参与规则或市场准入。
行动建议:
- 趁早：梳理四川省内城市、高速、农村、旅游区充电设施建设机会，尤其是大功率充电枪（超2500个）和农村直流充电枪（至少1200个）的招标或合作窗口，对接地方政府规划。
- 趁早：针对居住区充电“统建统营”试点，提前与物业管理机构、老旧小区改造单位洽谈合作模式，储备统建统营项目方案。
- 研究：评估现有充电设施服役年限（8年以上）及电压平台（800伏以下），规划更新改造方案，争取更新改造补贴或政策支持。
