影响分析:
  加油: 直接影响。四川三个价区汽、柴油最高零售价随国家调控同步调整，自2026年9月24日24时执行；批发实行最高批发价、由供需双方在不超上限内协商，民营批发企业供应价按最高零售价扣减400元且价差不得小于400元。这直接改变公司在川加油业务的批发/装车价上限与折扣空间测算：进价上限随零售价下调而压缩，同时民营批发价差被锁在≥400元，会挤压公司在川的批发议价与KA客户报价空间；零售端可在最高价下自主定价，意味着零售挂牌价不是利润来源，利润仍取决于批发折扣空间。
  充电: 未直接涉及。正文仅调整成品油最高零售价与最高批发价，未提及充电桩、充电服务费、场站电价结构或超充标准；任何将成品油价格下调推导为充电业务机会的结论均无正文依据。
  电力_储能_V2G_交易: 未直接涉及。正文未出现电力交易、现货、储能、虚拟电厂、V2G或分布式新能源入市等任何机制安排，仅含成品油价格与价格监管条款。
行动建议:
- A 趁早:由川内加油业务按9月24日24时新价区上限重算批发/装车折扣空间与KA报价底价，锁定不影响毛利的报价区间。
- B 研究:跟踪四川价格监管与市场监测动态，评估对川内民营批发渠道价差（≥400元）及下沉城市展业报价的传导。
didi_impact_one_liner: 四川成品油价随国家调控同步调整且批发价差被锁死，直接压缩加油业务在川的批发折扣空间，充电与电力业务本次未涉及。
