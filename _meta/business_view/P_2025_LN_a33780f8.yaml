  充电: 间接。绿电交易规模127.83亿千瓦时稳居国网系统第二，为充电运营提供绿色电力供给基础；电力现货市场和辅助服务市场建设完善充电场站参与电网互动的市场条件。
  电力_储能_V2G_交易: 直接涉及。1)沈阳新型储能产业集群已初具规模，省级层面明确支持新型储能技术攻关及成果转化；2)已构建「辽宁省先进储能和绿色氢能创新联合体」，组织实施低成本高效率新型储能氢能关键技术重大专项；3)绿电交易规模127.83亿千瓦时居国网第二，绿证市场培育将影响储能项目环境价值变现；4)统筹电力现货市场和辅助服务市场建设，推动新能源有序参与市场交易，为储能参与电力市场创造条件。
行动建议:
- A 趁早对接沈阳新型储能产业集群，跟进储能技术攻关及成果转化项目清单，寻找技术合作或项目落地机会
- B 研究绿电交易机制和绿证市场规则，探索储能项目通过绿色电力证书实现环境价值变现的路径
- C 关注电力现货市场和辅助服务市场建设进展，提前布局储能资源参与调峰调频辅助服务的市场准入准备
- D 研究辽宁省科技支撑碳达峰碳中和实施方案的技术攻关方向，评估新型储能技术在辽宁落地的政策支持力度
