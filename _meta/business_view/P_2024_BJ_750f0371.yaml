影响分析:
  加油: 政策加码新能源乘用车补贴（报废更新2万、置换更新），并明确推动国四及以下老旧货车客车报废更新为新能源车，直接压缩燃油车市场份额。虽未直接限制燃油车加油业务，但替代效应加速，长期需求收缩压力加大。
  充电: 直接利好。新能源乘用车报废更新补贴翻倍至2万元、置换更新给予补贴、新能源冷链货车新增购置支持、新能源公交车平均补贴8万元（电池更新4.2万元），多维度刺激新能源汽车购置，带动充电需求增长。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦设备更新补贴和消费品以旧换新，未提及储能项目、V2G机制、虚拟电厂建设或电力交易。农村地区"煤改电"设备更新仅属研究阶段，不构成当前直接影响。
行动建议:
- A 趁早:研判加油站转型充电站的空间与审批路径，应对燃油车需求收缩趋势
- B 趁早:对接置换更新补贴申请入口，争取成为新能源车销售合作服务点
- C 趁早:布局新能源商用车充电桩（含冷链货车、公交），匹配政策带动的增量需求
- D 研究:农村地区"煤改电"设备更新补贴政策的落地进展，择机介入相关能效设备市场
didi_impact_one_liner: 北京加力以旧换新补贴翻倍刺激新能源车购置，充电需求将显著增长，加油业务面临长期替代压力，需趁早布局转型。
