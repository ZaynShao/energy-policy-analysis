影响分析:
  加油: 未直接涉及。政策补贴重点是报废旧车并购买新能源乘用车(补贴2万元)或2.0升及以下排量燃油乘用车(补贴1.5万元)，直接目的是推动车辆更新而非加油服务。传统加油站业务未在补贴或支持措施中明确涉及。
  充电: 直接受益。政策明确支持个人乘用车报废更新购买新能源乘用车(补贴从1万元提至2万元)及乘用车置换更新购买新能源车，给予补贴激励。政策还鼓励绿色智能消费品以旧换新，将带动新能源汽车消费增量，进而扩大充电需求。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦设备更新和消费品以旧换新，虽提到能源电力、老旧电梯领域设备更新及数据中心绿色低碳改造，但属于基础设施更新范畴，非储能、V2G、电力交易等市场化机制。家电以旧换新补贴对象为冰箱、洗衣机等8类家电产品，未涉及储能或V2G设备。
行动建议:
- A 趁早研判新能源车增量对充电桩布局的影响:政策补贴力度加大将加速北京新能源乘用车普及,建议提前评估现有充电网络承载能力与增量需求匹配度,优化公共充电桩选址和规模计划
- A 趁早对接置换更新补贴政策入口:政策明确支持乘用车置换更新购买新能源车,建议主动对接市商务局或汽车销售平台,争取成为政策执行中的合作加电站点或增值服务提供方,提升用户粘性
- B 研究燃油车存量变化趋势:2.0升以下燃油车报废更新补贴1.5万元,虽力度低于新能源车,但仍会推动部分燃油车置换,建议监测区域燃油车存量变化,为后续业务调整预做规划
didi_impact_one_liner: 北京加力以旧换新政策直接利好新能源充电业务扩容,补贴翻倍和置换补贴将加速新能源乘用车普及,带动充电需求增长;传统加油业务影响有限;储能/V2G/电力交易未直接涉及。
