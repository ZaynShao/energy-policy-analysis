影响分析:
  加油: 未直接涉及。正文设备更新实施方案针对工业、建筑市政、交通、农业、教育、文旅、医疗七大领域，核心是机械设备和电器更新，未明确提及加油设备更新或加油站设施改造。间接观察：交通领域设备更新可能涉及运输车辆更新，消费品以旧换新中新能源汽车销量占比超60%或对燃油车市场份额有长期影响，但均属间接关联。
  充电: 直接涉及。明确提到消费品以旧换新活动中新能源汽车销量占比超过60%，直接受益于以旧换新政策对新能源汽车的拉动，充电需求增长有政策支撑。3000亿元超长期特别国债加力支持两新工作，新能源汽车作为重点消费品直接获益，充电基础设施建设市场随新能源汽车保有量增长而扩大。
  电力_储能_V2G_交易: 未直接涉及。正文两新行动方案聚焦设备更新和消费品以旧换新，一级能效家电销售额占比超90%体现能效升级导向，但未明确提及储能设施、V2G、双向充电桩或虚拟电厂建设内容，电力交易机制亦未涉及。
行动建议:
- A 趁早布局充电服务网络：抓住两新政策对新能源汽车消费的直接拉动效应，提前规划充电站点布局和运营能力建设
- A 趁早跟进交通领域设备更新：主动对接地方两新行动实施方案，摸排区域内运输车辆更新需求和加油设备升级改造机会
- B 研究新能源转型策略：鉴于新能源汽车销量占比已超60%，趁早研究加油站向综合能源站转型的可行路径
- B 监测能效标准提升影响：关注一级能效家电占比超90%背后的能效升级政策导向，研究对能源消费结构可能产生的长期影响
didi_impact_one_liner: 两新政策直接利好充电业务（新能源汽车以旧换新销量占比60%+），加油业务未直接涉及但需关注新能源转型长期趋势。
