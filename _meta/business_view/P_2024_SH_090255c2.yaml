影响分析:
  加油: 直接刺激2.0升及以下排量燃油乘用车以旧换新需求（补贴1.5万元/1.2万元），可带动燃油车新增及存量消费；但未直接涉及加油站零售运营改善或油品价格机制，对加油站业务影响属间接观察。
  充电: 直接补贴纯电动乘用车以旧换新（上海补贴1.5万元/国家补贴2万元），政策覆盖《减免车辆购置税的新能源汽车车型目录》车型，将直接提振新能源乘用车消费；新能源公交车动力电池更新提标或带动公交充电需求；但未直接涉及充电桩建设或充电运营商运营补贴。
  电力_储能_V2G_交易: 未直接涉及。正文仅在'促进智能家居消费'方向下提及鼓励老旧住房配置家用储能设备，但未写入具体补贴标准、产品目录或执行机制。虚拟电厂、V2G、电力交易均未出现。储能业务须待目录明确后方可确认是否受益。
行动建议:
- 趁早研究:燃油车补贴窗口对油品消费的结构性影响，评估高补贴地区油站是否面临客流分流压力
- 趁早对接:摸排纯电动乘用车补贴覆盖车型范围，提前与整车经销商或出行平台建立置换客群引流合作
- 趁早跟踪:上海市商务委将发布的家电·家装·家居·适老化产品具体目录，关注家用储能设备是否纳入以便配套布局智能家居用能服务
didi_impact_one_liner: 上海以旧换新方案补贴力度显著加码，纯电动乘用车最高享2万元补贴，将加速私家车电动化进程，间接扩大充电需求；家用储能待目录明确后或释放智能家居用能服务机会。
