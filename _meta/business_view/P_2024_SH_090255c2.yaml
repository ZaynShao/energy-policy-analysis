影响分析:
  加油: 直接涉及燃油乘用车以旧换新补贴。报废国三及以下排放标准燃油乘用车并购买2.0升及以下排量燃油乘用车可获1.5万元补贴；购买国六b燃油小客车补贴1.2万元。报废更新政策将加速高排放老旧车辆淘汰，可能带来置换加油消费增量，但需关注上海沪牌牌照政策与补贴的协同效应。
  充电: 直接涉及纯电动乘用车以旧换新补贴。报废旧车并购买纯电动小客车可获1.5万元补贴（叠加国家报废更新2万元），合计补贴力度较大。政策将显著提升新能源乘用车消费意愿，间接带动家用充电桩安装和公共充电需求增长。电动自行车以旧换新给予500元补贴，但未涉及充换电设施建设。
  电力_储能_V2G_交易: 未直接涉及。新能源公交车及动力电池更新提标未明确充电基础设施、V2G、储能或电力交易机制。家电以旧换新中的空气净化器等属于一般消费品，不涉及储能或充电业务。电动自行车电池规范要求属于安全标准，不构成储能或虚拟电厂业务机会。
行动建议:
- 'A 趁早: 梳理现有加油站网点辐射范围内的潜在报废更新客群，联合品牌车企在站点开展置换营销，对接高补贴政策窗口期吸引置换用户进站消费。'
- 'A 趁早: 评估高速公路服务区、城市核心商圈充电站周边社区的报废更新客群，研究与其合作的充电权益叠加方案，承接新能源乘用车增量带来的充电需求。'
- 'B 研究: 跟踪汽车报废更新补贴对家用慢充桩安装需求的间接拉动，评估布局社区充电桩或充电桩运维服务的可行性。'
- 'B 研究: 关注新能源公交车动力电池更新提标政策细化，研判其对公交场站充换电设施升级的潜在带动，提前储备相关技术和服务能力。'
didi_impact_one_liner: 上海以旧换新政策对燃油车和新能源车置换均给出高额补贴，直接利好加油业务置换消费和充电业务增量需求，但未涉及储能、V2G或电力交易机会。
