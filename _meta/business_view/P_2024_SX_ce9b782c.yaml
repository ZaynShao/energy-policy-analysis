影响分析:
  加油: 未直接涉及。该文件为电力市场规则体系，覆盖电力市场准入、现货交易、辅助服务、结算及绿色电力交易等机制，未涉及成品油业务或加油站在能源体系中的定位。
  充电: 充电业务属于负荷类资源的潜在聚合方向。V14.0明确虚拟电厂可聚合已注册用电企业，且负荷类虚拟电厂需绑定关系不低于6个月，为充电负荷参与虚拟电厂提供了制度通道，但正文未明确要求充电桩必须或优先参与市场。
  电力_储能_V2G_交易: 【直接涉及】三点核心影响：①新增独立新型储能和抽水蓄能的基本权利义务条款(5.6、5.7)，明确其参与市场交易、接受调度、提供辅助服务的权责边界，为储能设施进入山西电力市场提供规则依据；②虚拟电厂参与类型从"辅助服务交易"扩展为"电力市场交易"，并明确负荷类虚拟电厂聚合规则；③绿色电力交易实施细则(11)为绿电交易提供制度支撑。
行动建议:
- 'A 趁早: 储能运营主体（独立新型储能、抽水蓄能）对接山西电力交易中心，依规完成市场注册和资格认定，抢占V14.0施行后的市场准入先机'
- 'B 趁早: 充电运营商评估将充电负荷聚合为负荷类虚拟电厂的可行性，重点关注6个月绑定关系要求和售电资质条件'
- 'C 研究: 虚拟电厂运营主体梳理V14.0对参与市场类型的修订范围，确认是否需调整现有辅助服务合同或补充市场化交易合同'
didi_impact_one_liner: V14.0为山西储能入市和虚拟电厂参与市场提供明确规则依据，充电负荷聚合虚拟电厂存在潜在机会，能源业务需趁早完成市场注册和资格认定
