影响分析:
  加油: 未直接涉及。本方案聚焦电力系统调节能力建设,主要涉及电源侧(煤电、抽蓄)和电网侧资源优化,油气业务未被提及。
  充电: 直接涉及负荷侧调节资源。方案第(七)条明确提出以虚拟电厂、智能微电网等方式规范化、规模化、常态化、市场化参与系统调节,充电基础设施作为负荷侧资源可通过虚拟电厂模式参与电力运行调节。
  电力_储能_V2G_交易: 直接涉及三大领域。储能:方案第(四)条要求建设调度机构统一调度的新型储能电站,推动存量新能源配建储能改造;V2G:方案第(七)条要求实现负荷侧资源可观、可测、可调、可控,虚拟电厂参与机制为V2G提供参与路径;电力交易:方案多处强调市场化机制,包括跨省跨区市场机制、负荷侧响应资源市场交易机制。
行动建议:
- A 趁早:布局虚拟电厂业务,整合充电桩等负荷侧资源,对接电网调度机构统一调度体系
- B 趁早:争取纳入省级调节能力建设方案,与抽水蓄能、火电灵活性改造统筹参与市场
- C 趁早:参与地方负荷侧响应市场交易机制设计,建立充电负荷可调可控能力
- D 研究:虚拟电厂参与跨省跨区调节资源共享的市场准入条件和商业模式
- E 研究:存量配建储能改造政策及调度机构统一调用技术要求
- F 研究:系统友好型新能源电站建设标准对配套储能的要求
didi_impact_one_liner: 充电业务获政策明确支持参与系统调节,虚拟电厂模式将成充电基础设施参与电力市场的核心路径,储能调度调用机制完善带来V2G和电力交易业务机遇。
