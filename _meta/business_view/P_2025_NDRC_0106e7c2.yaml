影响分析:
  加油: 未直接涉及。该方案聚焦电力系统调节能力建设，主要针对抽水蓄能、火电灵活性改造、新型储能、虚拟电厂等调节资源，加油站业务不属于方案调整范围。
  充电: 未直接涉及。正文未明确提及充电桩或电动汽车充电设施作为独立调节资源。充电行为被纳入负荷侧资源范畴，但方案未对充电设施建设或运营提出具体要求。间接观察：随着负荷侧响应资源调度运行机制和市场交易机制的完善，充电负荷参与系统调节的市场环境有望逐步形成。
  电力_储能_V2G_交易: 直接利好。①储能：方案明确推动新型储能电站由调度机构统一调度运行，提升调用水平；②虚拟电厂：方案要求明确虚拟电厂规范化、规模化、常态化、市场化参与系统调节的方案；③聚合商：方案要求健全负荷侧响应资源的调度运行机制和市场交易机制，为聚合商参与市场创造条件；④电力交易：方案提出健全跨省跨区市场机制，完善负荷侧响应市场交易机制。V2G未在正文中出现。
行动建议:
- 'A 趁早: 与省级能源主管部门对接，纳入本地区调节能力建设方案编制，锁定新型储能项目选址和建设指标'
- 'B 趁早: 研究负荷侧资源聚合方案，提前布局充电/工商业可调负荷资源接入调度平台的技术对接准备'
- 'C 研究: 跟踪虚拟电厂规范化参与系统调节的配套细则，尽早完成资质申请和平台建设'
- 'D 研究: 关注跨省跨区市场机制和负荷侧资源交易机制进展，提前布局区域调节资源优化配置'
didi_impact_one_liner: 储能统一调度和虚拟电厂规范化参与系统调节，为充电负荷聚合和区域电力交易创造直接市场空间
