影响分析:
  加油: 未直接涉及。正文未写加油站、成品油批发/炼厂装车价、商户安全财税法合规成本、KA支付接口开放或下沉城市加油展业；仅提到矿区运输设备新能源替代（电动/氢能矿卡、电动矿用无轨胶轮车），属对矿区柴油需求的间接替代观察，不改变公司加油业务上述决策变量。
  充电: 直接提及但限于煤炭矿区场景：正文支持矿区合理布局建设充换电站、加氢站，鼓励建设“光储充放”多功能综合一体站，完善矿区绿色交通服务设施。未涉及城市公共充电网络、2C运营、建桩节奏与选址、充电服务费定价、场站侧电价结构、大功率/超充门槛及行业标准评级。对公司现有城市充电业务不改变决策变量；矿区场景是否纳入公司充电业务边界需人工裁定，若无矿区土地/客户资源则仅作观察。
  电力_储能_V2G_交易: 储能仅以矿区“光储充放”一体站配套形态出现，正文节选还出现“源网荷储”协同控制矿区（后文截断）；但未明确独立储能市场准入、VPP聚合、V2G、售电与电力交易、现货/中长期比例、售电利润/让利、火电长协或分布式新能源入市规则，故不改变公司电力交易核心决策变量。V2G、VPP、电力交易均未直接涉及。
行动建议:
- A 趁早:将矿区充换电站、加氢站、“光储充放”一体站登记为边缘场景观察项，不纳入城市充电年度建桩、选址和服务费定价模型；如无矿区客户、土地或电网接入资源，明确不跟进。
- B 研究:跟踪后续是否出台矿区充换电/光储充放配套细则及可参与的设备或运营服务接口；在细则明确前不测算新增收入，不据此调整电力交易、VPP、V2G或售电业务假设。
didi_impact_one_liner: 矿区充换电与“光储充放”是唯一与业务擦边的条款，但限于煤炭矿区，未改变公司加油、城市充电和电力交易的核心决策变量，影响有限且矿区场景需人工界定。
