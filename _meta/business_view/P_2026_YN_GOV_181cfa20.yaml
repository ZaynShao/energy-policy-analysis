影响分析:
  加油: 未直接涉及。但推动新能源重卡规模化将替代柴油重卡，间接影响成品油需求，需关注长期柴油消费结构变化。
  充电: 直接涉及。政策明确要求新（改）建高速公路服务区同步建设重卡充换电设施，已建成服务区加快改造并提升充电车位数量；同时规划建设零碳公路运输通道及3000个左右重卡充换电站，为充电基础设施运营商和产业链企业带来明确市场增量。
  电力_储能_V2G_交易: 未直接涉及。正文仅提到‘必要的储能设施’作为公路基础设施更新时的同期配套，未涉及V2G、虚拟电厂、电力交易等具体机制，目前暂不构成直接业务影响。间接看，大规模重卡充电负荷可能催生未来需求侧响应或储能调度需求，但尚无明确政策依据。
行动建议:
- 趁早：参与高速公路服务区重卡充换电设施建设项目的投标或合作，重点瞄准G1京哈、G2京沪等5射4纵5横重点通道及3000个充换电站布局。
- 趁早：针对长途干线运输场景，布局大功率直流快充、换电技术适配的重卡充电场站，抢占政策窗口期。
- 研究：跟踪零碳公路运输通道储能设施建设的技术要求和运营模式，为后续储能参与调峰、聚合商服务积累准备，但需等待具体实施细则。
didi_impact_one_liner: 政策明确加速重卡充电基础设施规模化建设，为充电业务带来确定性增量，但储能、V2G及电力交易尚未直接涉及。
