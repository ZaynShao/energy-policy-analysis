影响分析:
  加油: 明确要求在加油站建设充电设施。政策规定'到2020年实现我省各市（州）、高速服务区和具备建设条件的加油站充电设施全覆盖，桩车比达到1∶1'，并要求'在居民小区、学校、医院、酒店、车站、高速公路服务区、加油站、加气站、旅游景区等区域，为充电设施预留配电房'。这意味着加油站运营商需配合完成充电桩建设，同时预留配电条件，直接影响传统加油站的业务形态转型。
  充电: 充电基础设施是本方案的核心建设内容之一，享有明确政策支持。方案提出到2020年实现充电设施全覆盖和桩车比1:1的量化目标，要求按'适度超前'原则推进居民区电气化改造，并推进配电自动化和智能用电信息采集系统建设。这些举措为充电运营商提供了电网接入便利、配电资源预留和市场规模化扩容的直接利好。
  电力_储能_V2G_交易: 未直接涉及。方案虽提及'满足新能源、分布式电源及电动汽车等多元化负荷发展需求'和'支持增量配电网改革试点建设'，但未出现储能、V2G、虚拟电厂、电力交易等具体机制或业务形态。'分布式电源'的提及属于电网升级目标范畴，不构成直接的储能或电力交易机会。增量配电网改革试点仅为改革方向性支持，无具体准入或运营要求。V2G未在正文中出现。
行动建议:
- 'A 趁早: 梳理贵州省具备建设条件的加油站清单，对接地方电网公司，提前规划充电桩建设方案和配电房预留位置，配合完成2020年全覆盖目标。'
- 'B 趁早: 充电运营商趁早布局贵州充电市场，优先在居民小区、高速服务区、重要交通枢纽等政策明确覆盖区域选址，叠加''适度超前''建设原则争取配电容量的优先预留。'
- 'C 趁早: 电网企业趁早开展充电设施配套配电网改造规划，结合配电自动化和智能用电信息采集系统建设，统筹配电房廊道资源，提升充电设施无障碍接入的响应效率。'
- 'D 研究: 关注增量配电网改革试点推进动态，研究参与试点的可能性，储备相关资质和能力。'
didi_impact_one_liner: 贵州充电基础设施迎来政策强推，加油站须配套建设充电桩，充电运营商面临市场规模化扩容机遇，但需关注配电网改造时序与接入协调。
