影响分析:
  加油: 正文明确在加油站场景部署充电设施：'到2020年，实现我省各市（州）、高速服务区和具备建设条件的加油站充电设施全覆盖'，并要求在加油站'为充电设施预留配电房'。这意味着加油站需配套充电基础设施，间接影响传统加油业务的服务形态。
  充电: 正文直接明确充电基础设施建设目标：到2020年桩车比达到1:1，在居民小区、学校、医院、酒店、车站、高速公路服务区、加油站、加气站、旅游景区等区域'为充电设施预留配电房'，并结合老旧小区改造'积极推进现有居民区（含高压自管小区）停车位的电气化改造'。这是直接政策驱动，将显著扩大充电基础设施覆盖面。
  电力_储能_V2G_交易: 正文提到'满足新能源、分布式电源及电动汽车等多元化负荷发展需求'和推进配电自动化、智能用电信息采集系统建设，但未明确涉及储能、V2G、双向充电桩或电力交易的具体机制，属于配电网升级改造的配套受益，间接涉及。V2G、虚拟电厂、电力交易未直接出现。
行动建议:
- A 趁早对接贵州电网规划：主动联系贵州电网公司，确认加油站场地的充电设施配电容量预留条件，提前完成配套电力报装，避免因电力容量不足制约充电业务落地。
- B 趁早布局居民区充电场景：结合贵州'按适度超前原则积极推进现有居民区停车位电气化改造'的政策窗口，与物业公司或业委会合作，提前锁定居民区充电桩建设位置和配电房资源。
- C 研究充电桩建设运营资质：因正文要求充电设施'全覆盖'且桩车比达1:1，充电基础设施投资建设将大幅增长，趁早研究参与充电设施投资建设或运营的资质条件和商业模式。
didi_impact_one_liner: 贵州电网升级专项行动为充电基础设施在加油站、高速服务区及居民区全面覆盖提供政策保障，同时要求配电网满足新能源汽车等多元化负荷接入，充电业务迎来直接政策驱动机会。
