影响分析:
  加油: 明确要求在加油站预留充电设施配电房空间，实现充电设施覆盖加油站。政策驱动加油站业务从单一加油向「加油+充电」混合模式转型，需提前规划场地空间和电力容量预留。
  充电: 明确提出到2020年实现充电设施在全省覆盖，桩车比达到1:1。充电业务迎来大规模基础设施建设期，充电桩建设由规划引导进入全面落地阶段。
  电力_储能_V2G_交易: 明确提及满足分布式电源及电动汽车等多元化负荷发展需求，但未具体涉及储能、V2G或电力交易机制。配电网改革试点为未来电力服务拓展提供制度基础。
行动建议:
- A 趁早:对接地方电网规划,在加油站预留充电桩配电容量和安装空间,抢占充电业务布局先机
- B 趁早:研究充电业务运营模式,储备充电基础设施投资与运营能力,把握政策窗口期
- C 研究:关注增量配电网改革试点政策动向,提前布局配电网运维和服务延伸业务
- D 研究:跟踪配电网智能化、分布式电源接入等技术要求,形成配套服务能力
didi_impact_one_liner: 贵州省充电基础设施将在2020年实现全省覆盖,加油站场景需预留充电设施空间,配电网智能化改造为充电无障碍接入提供网架支撑。
