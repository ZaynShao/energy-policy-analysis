影响分析:
  加油: 未直接涉及。但加油站点若涉及电机、锅炉、变压器、照明等用能设备更新改造，且年节能量≥50万千瓦时或150吨标准煤、投资额≥500万元，可间接符合用能设备更新支持范围。
  充电: 未直接涉及。充电设施本身不属于本通知明确的节能降耗设备类型，且未提及充电基础设施建设或运营补助。
  电力_储能_V2G_交易: 未直接涉及。正文未明确提及储能、V2G、虚拟电厂或电力交易相关项目、试点或补贴机制。高效节能装备制造产业化中通用设备（如变压器）不直接等同于储能或V2G设备。
行动建议:
- 趁早 排查加油站点及办公楼宇的用能设备（如变压器、照明、电机等）更新改造需求，评估是否满足年节能量≥50万千瓦时/150吨标准煤、投资额≥500万元的条件，准备申报7月3日前提交项目申请。
- 研究 政策中“先进节能技术应用示范”及“公共机构节能示范”是否允许将充电桩能效管理、储能系统节能调度等创新方案包装为节能技术示范项目（需确认正文未明确禁止但亦未支持，谨慎推进）。
didi_impact_one_liner: 本次节能专项资金征集聚焦用能设备更新与节能技术示范，未直接涉及加油、充电、储能/V2G/电力交易业务，但间接为站场综合节能改造提供申报窗口。
