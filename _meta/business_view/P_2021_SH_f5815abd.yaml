影响分析:
  加油: 政策聚焦新能源汽车替代，公交、出租、公务、载货等公共领域车辆全面电动化目标明确。个人购车中纯电动占比超50%，意味着存量燃油车市场将被持续蚕食。加油站网络面临的不是直接限制，而是需求侧萎缩的渐进压力
  充电: 政策明确要求充换电技术水平大幅提升、设施布局持续优化、运营质量和服务便利性显著提高，智能化信息化运营体系基本建成。充换电设施规模扩大是确定性方向，监管标准体系也将趋于成熟。公交/出租/公务等领域全面电动化创造了稳定的公共充电需求
  电力_储能_V2G_交易: 未直接涉及。政策虽有充换电设施建设要求，但未明确提及V2G、虚拟电厂、储能系统参与充换电运营的交易机制或市场准入条款。加氢站建设属氢能领域，虽涉及电力但在正文中与充电基础设施分列表述
行动建议:
- 趁早研究加油加气站转型为综合能源补给站的技术方案，在纯电替代加速前完成布局调整
- 趁早与主流车企建立充电服务合作，锁定公交、出租等规模化电动车辆的充电供应资质
- 趁早布局充换电设施智能化升级，响应政策对信息化运营体系的明确要求
- 研究:跟踪上海充换电标准体系建设进展，提前对标新监管要求
- 研究:评估燃料电池汽车1万辆目标对加氢站运营的溢出效应，研判是否延伸布局
didi_impact_one_liner: 上海新能源替代目标明确加速充电需求增长，加油业务面临长期萎缩压力，需趁早布局充换电转型
