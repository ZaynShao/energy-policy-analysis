影响分析:
  加油: 未直接涉及。该办法聚焦电力需求侧管理，包括需求响应、节约用电、电能替代等，未明确涉及加油/燃油零售业务。
  充电: 直接涉及。（1）第七条明确鼓励电动汽车参与需求响应；（2）第七条将充电负荷列为可参与需求响应的资源类型；（3）第十二条明确支持整合电动汽车等需求侧资源；（4）第十条支持参与电能量和辅助服务市场交易；（5）第十一条明确通过虚拟电厂方式纳入电力平衡；（6）第十三条支持通过尖峰电价等经济手段和按市场规则获取收益。充电运营商/充换电运营作为电力需求侧管理服务机构被纳入重要实施主体。
  电力_储能_V2G_交易: 直接涉及。（1）第七条明确鼓励推广新型储能、分布式电源、电动汽车参与需求响应；（2）第十一条明确将需求侧资源以虚拟电厂方式纳入电力平衡；（3）第十二条将虚拟电厂运营商列为电力需求侧管理服务机构；（4）第十条支持需求响应主体参与辅助服务市场、容量市场交易；（5）第十三条支持按市场规则获取收益；（6）关于V2G虽正文未明确出现"V2G"字样，但电动汽车作为需求响应主体被反复提及，电动汽车参与需求响应包括其反向放电潜力（间接）。
行动建议:
- A 趁早:对接省级电力运行主管部门和电网企业，申请纳入需求响应资源清单，布局充电负荷参与需求响应市场
- B 趁早:研究将充电场站作为可调节负荷资源打包，以负荷聚合商或虚拟电厂形式参与需求响应和辅助服务市场
- C 研究:跟踪各省需求响应实施细则和尖峰电价机制设计，评估充电场站通过需求响应获取额外收益的可行性
- D 研究:关注2025年各省3%-5%需求响应能力目标分解机会，发掘充电负荷参与的空间布局节点
didi_impact_one_liner: 充电业务获得明确政策支持成为需求响应主体，可通过虚拟电厂和负荷聚合商模式参与电力市场，但需关注各地落地细则和需求响应能力目标分解。
