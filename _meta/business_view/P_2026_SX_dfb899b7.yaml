影响分析:
  加油: 未直接涉及。该政策聚焦电力市场体系建设，虽涉及能源转型和电力体制改革，但正文未提及燃油、加油站业务或成品油市场机制，加油业务不在本政策调整范围内。
  充电: 未直接涉及。正文仅提到车网互动聚合资源超19GW的现状数据，虚拟电厂聚合了充电资源，但未明确V2G机制或充电桩参与电力交易的具体规则，未涉及充电场站的市场准入、补贴或运营义务。
  电力_储能_V2G_交易: 储能领域：直接涉及但无新增义务。正文明确新型储能装机规模突破1.36亿千瓦、容量电价引导机制已建立等现状，但未发布新的储能建设指标或强制配储要求，储能参与市场有基础机制支撑但需关注后续规则细化。V2G/虚拟电厂：未直接涉及。正文仅将车网互动作为新业态列举，虚拟电厂作为聚合调节资源提及，未明确V2G交易机制或虚拟电厂参与辅助服务、现货市场的具体规则。
行动建议:
- 趁早研究统一电力市场规则体系（1+6基础规则），重点掌握中长期、现货、辅助服务市场的交易品种和准入条件，为储能/充电场站未来参与电力市场做准备
- 趁早关注新型储能参与容量电价机制的条件和申请流程，摸清储能电站在电力市场中的定位和收益路径
- 研究关注虚拟电厂和车网互动领域的配套规则出台动向，提前布局聚合资源参与需求响应或调峰辅助服务的业务模式
didi_impact_one_liner: 该政策为全国统一电力市场勾勒顶层设计框架，储能市场参与机制已有基础但待细化，充电及V2G领域尚未被政策直接覆盖。
