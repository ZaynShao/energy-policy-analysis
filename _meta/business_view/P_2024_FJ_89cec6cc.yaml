影响分析:
  加油: 未直接涉及。细则聚焦电力负荷管理（需求响应、有序用电、可中断负荷），未直接涉及加油/油品业务。
  充电: 直接涉及。第九条明确鼓励电动汽车参与需求响应；第十条要求积极拓宽需求响应主体范围，并明确鼓励推广电动汽车等主体参与需求响应。充电运营商/充电桩网络具备参与需求响应的资格机会，充电行为可成为可调节负荷资源。
  电力_储能_V2G_交易: 直接涉及。第九条设定量化目标：2025年需求响应能力达最大用电负荷5%，2030年形成规模化实时需求响应能力，结合辅助服务市场和电能量市场实现需求侧资源共享互济。第十条明确鼓励推广新型储能、分布式电源参与需求响应，为储能运营和虚拟电厂聚合提供直接参与路径。
行动建议:
- A 趁早:与电动汽车充电运营商建立需求响应资源合作关系，聚合充电负荷形成可调度资源池，参与省级需求响应邀约和竞价
- B 趁早:布局储能+充电耦合项目，依托新型储能参与需求响应的政策通道，将储能系统与充电桩协同运营以获取需求响应激励收益
- B 研究:2030年规模化实时需求响应与辅助服务市场、电能量市场交易衔接机制，提前储备VPP聚合商资质和技术能力
- B 研究:理解需求响应执行不到位的偏差考核规则，建立负荷预测和响应执行能力以规避考核风险
didi_impact_one_liner: 政策为充电网络和储能参与需求响应提供明确资格通道和2025年5%量化目标，Didi可趁早聚合充电负荷与储能资源形成可调度能力，参与省级需求响应市场获取增量收益
