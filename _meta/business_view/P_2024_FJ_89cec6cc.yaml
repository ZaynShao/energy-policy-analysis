影响分析:
  加油: 未直接涉及。本细则是电力负荷管理领域的规范性文件，主要规范电力需求侧管理、有序用电和需求响应机制，与传统加油业务无直接关联。
  充电: 间接涉及。第十条明确鼓励电动汽车作为需求响应参与主体，但本细则聚焦的是需求响应机制设计（协议签订、执行程序、效果评估），而非充电基础设施建设或运营规则。充电运营商作为需求响应资源主体参与，存在参与需求响应的潜在机会，但非直接的充电业务利好。
  电力_储能_V2G_交易: 储能直接涉及，V2G和电力交易未直接涉及。第九条明确2025年需求响应能力目标（最大用电负荷5%），第十条明确鼓励新型储能参与需求响应，并提出到2030年实现规模化实时需求响应及需求侧资源共享互济。但本细则是负荷管理程序性文件，未涉及储能具体建设指标、V2G技术要求或电力交易规则设计。
行动建议:
- A 趁早:研究将储能资源接入需求响应体系，探索储能聚合参与负荷管理的商业模式
- B 趁早:对接电网企业新型电力负荷管理系统，参与需求响应资源能力测试和资格审核
- C 研究:跟踪第九条5%需求响应能力目标的地方分解落实情况，评估作为储能或充电运营主体的参与空间
- D 研究:关注第九条2030年实时需求响应和需求侧资源共享互济目标的配套市场机制建设进展
didi_impact_one_liner: 政策明确储能可参与需求响应，本地新能源业务主体宜趁早对接电网负荷管理系统，争取纳入需求响应资源清单以获取负荷调节收益机会。
