影响分析:
  加油: 未直接涉及。该通知聚焦于风电、集中式光伏和分布式光伏发电项目参与电力市场的规则，不涉及加油业务或加油站相关领域。
  充电: 未直接涉及。该通知针对新能源发电项目（风电、光伏）的市场参与机制，不涉及充电桩、充换电站或新能源汽车充电服务的直接规定。间接观察：分布式新能源通过虚拟电厂聚合参与市场，可能为未来充电负荷聚合参与电力市场提供参考路径。
  电力_储能_V2G_交易: 明确涉及。通知明确鼓励新增分布式新能源项目通过虚拟电厂聚合方式参与电力市场；设定了2025-2026年新能源项目参与市场的电量比例（风电30%、光伏15%起）；明确未全电量参与的项目按比例确定结算电量，执行实时市场加权平均电价或燃煤发电基准价。这为分布式新能源的市场化交易确立了具体机制。V2G未直接涉及。
行动建议:
- A 趁早研究虚拟电厂聚合分布式新能源项目的技术方案与合规路径，文件已明确将虚拟电厂列为分布式项目入市方式，可作为聚合商角色切入市场。
- B 趁早对接分布式光伏/分散式风电项目业主，协助其完成市场注册并设计最优参与比例方案，在30%/15%基准比例与全电量入市之间做出经济性测算。
- C 趁早与山东电力交易中心沟通，了解分布式新能源项目注册、交易、结算的具体操作流程和系统接口要求，提前布局聚合商业务系统建设。
- D 研究分布式新能源项目参与电力市场的价格机制演变趋势，为客户提供从基准电价模式向实时市场价格模式过渡的咨询服务。
didi_impact_one_liner: 虚拟电厂聚合分布式新能源参与电力市场的机制已明确，为聚合商业务提供直接政策支撑；新能源项目市场化电量比例规则为聚合资源规模测算提供依据。
