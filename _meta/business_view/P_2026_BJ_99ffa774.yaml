影响分析:
  加油: 直接涉及。本文件明确调整本市汽柴油最高零售价格（含89/92/95号汽油、0/-10/-20/-35号柴油），并规定零售企业可在不超过最高零售价的前提下自主定价；同时设定批发价公式（最高零售价扣减300元/吨，配送制另含运杂费）；要求严格执行明码标价、维护市场稳定，并明确消费者可通过12345举报价格违法行为。
  充电: 未直接涉及。文件全程针对汽柴油（汽油/柴油）等成品油定价机制，不涉及新能源汽车充电服务价格、充电设施或充换电业务。
  电力_储能_V2G_交易: 未直接涉及。文件属于石油价格行政调整范畴，不涉及储能、虚拟电厂、V2G、电力交易、反向充电或任何电力系统机制。
行动建议:
- 趁早核查加油站定价系统，确保实际零售价不超过文件所列最高零售价上限，避免触发12345价格违法举报
- 趁早完善明码标价公示，在经营场所明显位置更新最新油品价格表，防范合规检查风险
- 趁早评估批发价公式影响，对比配送制与非配送制成本，优化供油合同条款以控制运杂费支出
- 趁早研判本轮调价幅度（汽油降0.42-0.47元/升、柴油降0.46元/升）对油站毛利空间和市场竞争态势的短期冲击
