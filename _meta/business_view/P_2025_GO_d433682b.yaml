影响分析:
  加油: 未直接涉及。正文聚焦于新建光储充检一体化示范站的补贴标准，未涉及加油站新建或改造事项；但光储充检一体化模式客观上为加油站点综合能源转型提供了可参考的技术组合路径（间接）。
  充电: 直接涉及。政策明确对配置储能电池系统的光储充检示范站提供补贴：200kWh以上+4根充电桩补10万元/站，400kWh以上+8根充电桩补20万元/站；补助由市县两级财政各承担50%；且明确充电桩数量为获取补贴的门槛条件。
  电力_储能_V2G_交易: 直接涉及储能。政策对配置储能电池系统额定容量200kWh或400kWh以上的示范站给予补贴，是明确的储能建设激励；充电桩+储能+光伏的组合被列为补贴对象。但正文未出现V2G、电力交易或虚拟电厂等机制设计，V2G和交易业务未直接涉及。
行动建议:
- A 趁早对接市县两级财政部门，提前锁定光储充检示范站项目补贴名额，重点布局400kWh+8桩规模以获取20万元顶额补助
- B 趁早研究储能系统与充电桩的协同设计方案，满足200kWh/400kWh额定容量门槛，将充电业务与储能建设打包申报
- C 研究本项目与省级光储充检补助的排他性规则，避免因重复申报导致市级补贴失效
- D 趁早评估光储充检一体化模式在现有加油站点的嫁接可行性，为综合能源站转型储备技术方案（间接）
didi_impact_one_liner: 宁德市光储充检示范站最高20万元补贴落地，储能+充电桩组合为必争赛道，加油站综合能源转型现窗口期。
