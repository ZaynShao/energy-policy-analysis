影响分析:
  加油: 未直接涉及。该政策聚焦电力市场改革，未提及油气、加油站或传统燃油业务。
  充电: 未直接涉及。该政策核心是新能源入市和绿电交易机制，不涉及充电基础设施、充换电站或新能源汽车充电服务。间接观察：政策提到推动绿电绿证市场建设、引导用能企业提高绿电消费比例，充电运营商作为电力用户，未来可能面临通过绿电交易满足绿色用能需求的机会，但这属于间接影响。
  电力_储能_V2G_交易: 直接涉及。政策明确提出健全绿电绿证市场建设，扩大绿证交易规模，将绿电交易纳入中长期交易机制，支持新能源与用户开展直接交易，为电力交易业务提供更完善的市场机制。同时，煤电灵活性改造和基础调节地位强化，客观上为储能调节和灵活调节资源创造了市场空间。
