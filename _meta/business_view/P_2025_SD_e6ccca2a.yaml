- 'B 研究: 关注新能源入市比例提升后的市场电价波动规律，特别是光伏大发时段的低价时段特征，探索与新能源项目开展直接交易的业务机会。'
- 'C 趁早: 对接山东电力交易中心，了解绿电交易纳入中长期交易机制的规则演进，提前布局用户侧绿色电力消费服务能力。'
