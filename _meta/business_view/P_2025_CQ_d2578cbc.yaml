  加油: 未直接涉及。正文聚焦分布式光伏发电的行业管理、备案、建设及电网接入规范，与加油站燃油零售业务无关联。
  充电: 未直接涉及。本细则是规范分布式光伏发电项目的开发建设管理，虽涉及电网接入与消纳，但未直接规定充电基础设施建设或运营要求。间接观察：分布式光伏发电的规范化发展或为充电设施提供更多绿色电力来源，但需另行论证。
  电力_储能_V2G_交易: 未直接涉及。本实施细则虽提及构建新型电力系统目标，并规定了电网接入与运行调度机制，但未明确涉及储能配置、虚拟电厂(VPP)、V2G、双向充电桩或电力市场化交易的具体机制。文件核心仍是分布式光伏发电项目的备案、建设与并网管理规范。
行动建议:
- 趁早梳理现有分布式光伏项目资产，对照新规核查备案手续、并网协议及自发自用比例合规性，重点排查主城都市区项目自发自用比例是否达到20%最低限值要求。
- 趁早研究红黄绿分区评估结果，结合项目所在区域可开放容量等级调整开发时序，红色区域项目暂缓推进，黄色区域项目需在可开放容量范围内规划建设。
- 趁早与属地区县能源主管部门建立常态化沟通机制，动态获取可开发区域及可开放容量更新信息，确保新增项目选址符合最新规划要求。
- 趁早修订农户屋顶分布式光伏开发协议模板，增加户主书面意见（代签需授权书）合规要件，完善农户知情同意与权益保护条款，规避合规风险。
