  加油: 未直接涉及。正文仅涉及发电、钢铁、水泥、铝冶炼行业的碳排放权交易管理，未提及加油/燃油零售业务。
  充电: 未直接涉及。正文管理对象为发电、钢铁、水泥、铝冶炼行业的重点排放单位，不涉及新能源汽车充电服务。间接观察：碳市场覆盖电力行业可能影响电网排放因子，但正文未明确充电业务或新能源汽车与碳市场的关联机制。
  电力_储能_V2G_交易: 未直接涉及。正文管理范围限于发电、钢铁、水泥、铝冶炼行业的碳排放权配额分配与清缴，未提及储能、虚拟电厂(VPP)、V2G或电力交易机制。
行动建议:
- A 趁早研究碳市场扩容趋势：虽本通知覆盖行业不含能源零售,但后续可能扩展,建议研究充电/加能网络的碳排放核算边界和纳入条件
- B 趁早建立碳数据管理能力：碳市场对数据质量管控要求严格,建议提前建立碳排放数据监测、核算和信息化存证能力,应对未来可能的合规要求
- C 趁早跟踪重点排放行业动态：铝冶炼行业纳入全国碳市场可能影响区域电力供需格局,建议持续跟踪重点排放行业配额分配和履约情况
