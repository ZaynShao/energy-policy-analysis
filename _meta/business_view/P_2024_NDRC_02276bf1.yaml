影响分析:
  加油: 未直接涉及。该政策聚焦电力系统调峰、储能和智能化调度能力建设，核心对象为电网侧、电源侧调节资源及源网荷储一体化机制，加油业务不在政策调控范围之内。
  充电: 需求侧调节资源纳入调度体系。政策明确要求建设源网荷储各类调节资源，充电负荷作为需求侧资源潜在构成，其响应能力被纳入智能化调度考量；但未明确充电基础设施的具体配置要求或市场准入条款。
  电力_储能_V2G_交易: 储能获明确政策目标支持。政策设定2027年抽水蓄能投运规模达8000万千瓦以上、新型储能市场化政策体系基本建成的量化目标，并强调电源侧、电网侧、负荷侧储能规模化高质量发展。虚拟电厂、V2G、电力交易未在正文中明确出现，未直接涉及。
行动建议:
- 'A 趁早: 趁早对接电网调度机构，摸清充电负荷接入智能化调度体系的资质要求和接入标准，为参与需求侧响应市场预做技术准备'
- 'B 趁早: 趁早研究储能在电源侧、电网侧的配置策略，重点关注与抽水蓄能规模目标协同的新型储能项目布局机会'
- 'C 研究: 研究源网荷储一体化项目中充电与储能资源的组合优化模式，探索充电+储能协同参与调峰的可行性'
- 'D 研究: 持续跟踪新型储能市场化政策体系完善进程，为储能项目商业化运营模式设计提供决策依据'
didi_impact_one_liner: 电网调峰储能政策为储能规模化发展提供明确目标，充电负荷作为需求侧调节资源纳入源网荷储调度体系存在参与空间，但V2G和虚拟电厂机制未获直接政策支撑
