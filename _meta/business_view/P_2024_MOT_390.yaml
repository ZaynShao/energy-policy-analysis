影响分析:
  加油: 未直接涉及。该政策聚焦新能源城市公交车更新补贴与动力电池更换，老旧城市公交车的淘汰更新方向为新能源汽车而非燃油车，政策本身不涉及传统燃油公交车或汽柴油消费补贴，对加油业务无直接政策影响。
  充电: 直接涉及。新能源城市公交车更新补贴（平均8万元/辆）将加速公交企业采购新能源公交车辆，新增大量纯电动公交车的充电需求。城市公交场站配套充电桩建设需求将随之增长，可能带动充电运营企业拓展公交充电场景。动力电池更换（补贴4.2万元/辆）延续车辆运营周期，电池更换后仍需持续充电补能，充电需求稳中有升。
  电力_储能_V2G_交易: 未直接涉及。该政策明确补贴对象为城市公交企业更新整车或更换动力电池，未涉及动力电池退役后的储能应用、V2G双向充放电机制、虚拟电厂聚合或电力市场化交易等业务。动力电池质保5年要求主要针对安全性，未延伸至梯次利用或电网互动。
行动建议:
- 'A 趁早: 与地方公交集团建立充电合作，趁政策窗口期锁定公交场站充电专位资源，提前布局大功率直流充电桩网络。'
- 'B 研究: 关注动力电池更换后的退役电池流向，研究布局动力电池梯次利用为储能电池的业务机会，跟踪政策是否会延伸至储能应用场景。'
- 'C 趁早: 研判城市公交新能源化加速对区域能源消费结构的影响，趁早调整区域网点布局中涉及传统能源消费的业务比重。'
didi_impact_one_liner: 新能源公交更新补贴直接带动充电需求增长，动力电池更换业务为充电运营带来增量机会，但储能/V2G/电力交易未纳入政策范围。
