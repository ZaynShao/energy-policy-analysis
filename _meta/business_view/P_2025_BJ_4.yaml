影响分析:
  加油: 未直接涉及。方案聚焦电力市场化交易与绿色电力交易，加油业务（加油站零售）不属于电力交易范畴。
  充电: 未直接涉及。方案标题虽涉及电力市场化交易，但正文节选仅含网页导航结构，未披露充电服务、充电桩运营或充放电价格机制等具体内容，无法确认对充电业务的直接影响。
  电力_储能_V2G_交易: 未直接涉及。正文节选仅包含网页导航代码，未见电力交易方案、绿电交易方案中关于储能、虚拟电厂、V2G或电力交易规则的具体条款。虽已判主题包含power_market和green_power_trading_theme，但正文证据不足，无法确认这些机制的具体影响范围。
行动建议:
