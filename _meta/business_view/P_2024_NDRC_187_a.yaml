影响分析:
  加油: 未直接涉及（间接：配电网高质量发展可能改善加油站转型充电业务的电力接入条件，但正文未明确提及）
  充电: 直接利好：政策明确要求配电网至2025年具备1200万台充电桩接入能力，并推广车网协调互动（V2G），为充电基础设施规模化建设和双向充放电业务提供电网支撑与政策导向。
  电力_储能_V2G_交易: 直接涉及储能与V2G：正文明确推动新型储能多元发展，并推广车网协调互动（V2G）和构网型储能等新技术；配电网向源网荷储资源高效配置平台转变。未直接涉及电力交易，但海量资源聚合互动（间接）为未来参与电力市场创造条件。
行动建议:
- 趁早与配电网运营主体对接，将充电场站和V2G设施纳入配电网规划，抢占1200万台充电桩接入能力下的优质网架资源。
- 趁早布局分布式储能聚合及车网互动试点，结合配电网柔性化、智能化转型，探索储充一体化与源网荷储协同调度模式。
- 研究配电网开放共享机制下参与辅助服务或需求响应的可行性，建立与电网调度部门的常态化沟通，为后续电力交易准入做准备。
didi_impact_one_liner: 配电网新政为充电基础设施大规模接入和V2G应用敞开政策窗口，同时推动储能多元发展，是充电业务布局和储能/V2G技术落地的直接利好。
