影响分析:
  加油: 未直接涉及。该政策聚焦于新能源(风电、太阳能)上网电价市场化改革，不涉及传统燃油业务。
  充电: 未直接涉及。政策核心是新能源发电侧上网电价机制，虽涉及电力市场建设，但对充电服务定价未有直接规定。需关注电力市场改革对充电运营商购电成本可能产生的间接影响。
  电力_储能_V2G_交易: 政策明确影响：①分布式新能源可直接或通过聚合方式参与现货交易，为分布式储能参与市场提供路径；②差价结算机制建立，为新能源项目提供了保底收入保障；③明确“各地不得将配置储能作为新建项目核准、并网、上网等前置条件”，减轻了新能源项目储能配套压力；④容量补偿机制覆盖市场化机组。V2G和反向充电未直接涉及。
行动建议:
- A 趁早研究:分布式储能参与电力现货市场的技术对接和报价策略,把握聚合参与现货交易的准入条件
- B 趁早对接:与电力交易机构建立联系,了解分布式新能源及聚合商参与现货市场的具体操作流程和时间表
- C 趁早评估:评估差价结算机制对本区域新能源项目收益的影响,重新测算储能配套经济性
- D 趁早跟踪:关注2025年6月1日起增量新能源项目价格竞争机制的具体实施细则
didi_impact_one_liner: 山东新能源电价全面市场化改革为分布式储能参与现货市场打开了通道,但政策明确不得强制配套储能,需重新评估储能项目经济模型和商业模式。
