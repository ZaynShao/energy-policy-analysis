影响分析:
  加油: 未直接涉及。该文件聚焦新能源汽车充换电基础设施建设，未涉及燃油车加油服务、加油站布局或成品油供应。
  充电: 直接利好公共与住宅充电桩建设。政策明确以充电为主、换电为辅，目标是2025年满足125万辆以上电动汽车充电需求，车桩比不高于2:1。公共领域重点推进快充桩布局，小区层面老小区推进'一桩多车'共享、新小区强制配建'一车一桩'，并通过智能桩推广和统建统营解决供电容量问题。五大新城将获得专项规划支持，充电网络建设纳入新建住宅审批验收流程，'僵尸桩'治理成为行业管理重点。
  电力_储能_V2G_交易: 未直接涉及。虽然政策提及'车网互动'和'新型电力系统建设'，但正文未明确V2G的双向充放电机制、虚拟电厂参与方式或储能配置要求，也未提及电力交易、需求响应或调峰辅助服务等具体机制。V2G虽在已判主题清单中，但政策正文未给出可执行的具体业务路径。充电桩建设本质上是电网负荷侧扩展，而非储能或电力市场交易层面的直接安排。
行动建议:
- A 趁早:对接五大新城专项规划编制窗口,在嘉定/青浦/松江/奉贤/临港新片区提前锁定公共快充站用地资源,避免后期规划调整导致的选址成本上升
- A 趁早:针对老小区'一桩多车'共享模式,提前与街道/居委会/物业建立协调渠道,锁定首批共享桩改造项目名额,抢占属地化建设管理先机
- B 研究:密切跟踪市级平台'僵尸桩'认定标准与治理节奏,评估存量慢充桩回收处置或升级快充的可行方案,降低合规整改不确定性
- B 研究:新小区'一车一桩'强制配建标准在规划/施工图/验收环节的具体执行口径,提前布局新建住宅充电桩供应与安装服务供应链
didi_impact_one_liner: 上海充电桩建设进入政策加速期,公共快充与住宅共享桩双轨推进,2025年125万辆充电需求窗口为充电运营商带来规模化布局机会,但需紧盯五大新城规划节奏与小区属地协调机制落地。
