影响分析:
  加油: 未直接涉及。正文聚焦电力市场体系完善,未提及燃油或加油站相关机制。绿色低碳转型为长期间接趋势,但非本文件直接要求。
  充电: 未直接涉及。正文提到建设绿色电力市场和完善用户侧参与机制,但未明确指向充电桩运营或电动汽车充换电业务。辅助服务市场建设或为充电负荷参与电网调节提供潜在路径(间接)。
  电力_储能_V2G_交易: 直接涉及多维度。1)辅助服务市场明确提到'支撑电力系统灵活调节',覆盖储能/V2G的调节功能定位;2)容量市场'可靠支撑调节电源建设',或影响储能的容量价值实现;3)绿色电力市场直接关联绿电交易机制;4)'新型经营主体'参与市场条款,覆盖虚拟电厂、储能聚合商等形态;5)V2G在已判主题中出现,但正文未明确展开机制设计。
行动建议:
- A 趁早:对照'新型经营主体'参与条款,梳理充电/储能/V2G业务参与电力市场的准入条件与合规要求,提前布局市场主体资格。
- B 研究:深入分析辅助服务市场与容量市场建设规则,评估储能资源通过双市场兑现价值的机会与路径。
- C 趁早:关注绿色电力市场机制细化进展,提前设计充电运营商的绿电采购或绿证消纳策略。
- D 研究:跟踪'统一电力市场技术标准'制定动态,为V2G/虚拟电厂等业务的标准化接入做好技术储备。
didi_impact_one_liner: 统一电力市场体系2030/2035两步走目标确立,辅助服务、容量、绿电三大市场同步推进,新型经营主体条款为充电储能V2G参与市场打开制度空间。
