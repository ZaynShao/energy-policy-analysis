影响分析:
  加油: 未直接涉及。政策聚焦新能源消纳和储能调节能力建设，主要针对电力系统源网荷储协调优化。间接影响方面，文件强调新能源与产业耦合发展，传统能源企业可能面临绿电替代压力和转型要求。
  充电: 直接涉及。政策明确提出加快培育源网荷储、绿电直连等新模式业态，并拓展虚拟电厂应用场景。分布式储能、"数据中心+储能"、移动式储能等创新场景发展，将为充电基础设施与储能协同提供政策空间。
  电力_储能_V2G_交易: 直接涉及。储能方面，文件设定2026年新型储能装机1400万千瓦目标，明确推进压缩空气储能、电化学储能、熔盐储能、液流电池、钠离子电池等多技术路线发展。虚拟电厂方面，文件将其列为重点应用场景拓展。抽水蓄能方面，目标在运在建装机达到1000万千瓦左右，包括潍坊首台机组投产、蒙阴垛庄和沂源石桥项目开工。电力交易方面，研究煤电机组与新型储能联合运行的优化运行方式。V2G未在正文中出现。
行动建议:
- 'A 趁早: 参与新型储能项目投资布局，重点跟进压缩空气储能、电化学储能、熔盐储能等政策支持方向，争取纳入省级储能项目清单。'
- 'B 趁早: 联合电网企业或聚合商，探索充电场站+分布式储能的运营模式，提前布局"充电+储能"一体化场景。'
- 'C 研究: 跟踪源网荷储一体化、绿电直连等新模式实施细则，结合自身负荷特性评估参与路径和商业可行性。'
- 'D 研究: 关注虚拟电厂参与山东电力现货市场的机制设计，储备相关技术能力和负荷调节资源。'
- 'E 趁早: 跟踪抽水蓄能容量电价机制改革进展，评估作为投资方或运营方的参与机会。'
didi_impact_one_liner: 政策大力推动新型储能和虚拟电厂发展，充电业务可借势布局"充电+储能"场景，但V2G机制尚未明确。
