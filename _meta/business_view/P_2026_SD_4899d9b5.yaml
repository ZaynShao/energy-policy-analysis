影响分析:
  加油: 未直接涉及。正文主要聚焦新能源消纳、储能和电网调节能力建设，无直接涉及加油/油品销售业务的内容。
  充电: 间接涉及。政策明确拓展虚拟电厂、农村微电网等应用场景，并提出源网荷储一体化新业态，将提升充电负荷的可调节性和绿电消纳能力，为充电运营提供更灵活的源网互动条件。
  电力_储能_V2G_交易: 直接涉及。政策明确提出2026年新型储能装机达到1400万千瓦、抽水蓄能达到1000万千瓦左右的目标；加快压缩空气储能、电化学储能、熔盐储能、钠离子电池等多元技术发展；积极拓展虚拟电厂应用场景；培育源网荷储、绿电直连等新模式新业态。这些具体指标和技术方向直接指向储能投资运营、虚拟电厂参与和电力交易业务机会。
行动建议:
- A 趁早布局储能投资:基于政策1400万千瓦新型储能装机目标，研究压缩空气储能、电化学储能等成熟技术项目的投资可行性，重点关注政策明确支持的中能建泰安、吉电潍坊等重点项目周边区域的机会
- B 趁早对接虚拟电厂:基于政策拓展虚拟电厂应用场景的明确方向，研究充电负荷接入虚拟电厂聚合的可行路径，探索参与山东虚拟电厂运营商资格的时机
- C 趁早探索绿电直连:基于政策培育源网荷储、绿电直连新业态的方向，研究新能源场站直连充电场站的绿电供应模式，评估分布式光伏+储能+充电的协同方案
- D 研究源网荷储一体化:关注政策优化完善源网荷储一体化实施细则的进展，提前研究充电场站作为负荷侧纳入一体化项目的条件和要求
didi_impact_one_liner: 政策储能目标和虚拟电厂场景拓展为充电运营提供绿电消纳和负荷调节机会，充电业务可探索参与虚拟电厂聚合和源网荷储一体化新业态。
