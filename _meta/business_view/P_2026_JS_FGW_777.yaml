影响分析:
  加油: 未直接涉及。间接来看，加油站作为商业用户，其日常用电成本可能随工商业输配电价及各项分摊调整而变化，但该变化不改变加油业务的核心决策变量（批发价、合规成本、合作接口、下沉展业）。
  充电: 直接影响。第四监管周期江苏电网工商业用电各电压等级输配电价重新核定，且气电容量电费分摊标准在2027年起调整为据实分摊、抽水蓄能容量电费据实向全体工商业用户分摊，这些费用均进入工商业用电成本。充电场站作为工商业用户，其场站侧电价结构、峰谷价差和购电成本将被重塑，进而影响建桩选址、运营经济性与充电服务费定价空间。需结合附件中的输配电价表，重新测算不同电压等级和负荷类型下的场站成本。
  电力_储能_V2G_交易: 直接影响（涉及抽水蓄能，V2G/虚拟电厂未直接涉及）。通知明确第四监管周期输配电价执行，这将改变售电公司代理购电及固定价格套餐中的输配电价基准，影响报价与收益测算。同时，江苏抽水蓄能电站抽水、发电价格按所在节点现货实时出清价格或市场规则执行，并明确抽发收益20%归电站、80%冲减系统运行费，抽水蓄能作为用户缴纳输配电价和系统运行费——这些机制将改变现货市场的供给与价格信号，影响电力交易持仓、结算及风险判断。V2G、虚拟电厂等未在本政策正文中出现相应机制，不直接涉及。
行动建议:
- 趁早对照附件《江苏电网输配电价表》，测算各电压等级工商业用电的输配电价及各项分摊变化，重算充电场站单位度电成本和项目回报，评估对选址与运营策略的影响。
- 趁早研究抽水蓄能抽发按现货价格结算及收益分享机制对江苏现货价格中枢和系统运行费分摊的影响，优化电力交易与中长期持仓结构，防止成本预测偏差。
didi_impact_one_liner: 江苏第四监管周期输配电价及抽蓄、气电费用分摊机制调整，将改写工商业用电成本结构，充电与电力交易需优先重测电费与现货风险，油品业务不直接涉及。
