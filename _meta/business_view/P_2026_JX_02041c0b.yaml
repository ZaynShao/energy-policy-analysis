影响分析:
  加油: 直接涉及。赣州市商务局部署2025年度全市成品油零售经营企业（含高速公路加油站）年检，检查证照获批、经营设施、管理制度、经营状况、购销存及质量、计量、消防、安全、环保、税收合规情况。要求企业提交7类材料（营业执照、危险化学品经营许可证、购销存报告、合规说明、安全隐患排查台账等），各县区商务部门落实'即来即检'，对不配合整改或整改不合格者按程序撤销经营资格，3月4日前完成结果报送。
  充电: 未直接涉及。政策针对传统成品油零售经营企业（加油站）的年度检查，未提及充电基础设施或新能源汽车相关业务。
  电力_储能_V2G_交易: 未直接涉及。政策内容为传统加油站年检要求，无虚拟电厂、储能、V2G或电力交易相关机制。
行动建议:
- A 趁早:对照年检材料清单逐项准备，特别是购销存报表和安全生产隐患排查台账，确保1-12月份数据完整准确
- B 趁早:梳理质量、计量、消防、安全、环保、税收等方面的合规情况，形成书面说明备查
- C 研究:关注'谁审查谁签字谁负责'要求可能带来的合规审查趋严风险，完善内部审核流程
- D 研究:注意各县区商务部门的检查尺度和'即来即检'落实情况，做好应对不同县域差异的准备
didi_impact_one_liner: 赣州传统加油站年检启动，3月4日截止，7类材料要求明确，安全环保合规成重点审查方向
