  电力_储能_V2G_交易: 直接涉及。规划明确新型储能（锂离子电池、液流电池、压缩空气储能、飞轮储能等）参与辅助服务、削峰填谷等市场化应用；河北省已有张北风光储输示范工程、火电+储能调频项目等成熟经验；到2020年底全省新型储能装机5.9万千瓦/12.9万千瓦时，为后续商业化规模应用奠定基础。
