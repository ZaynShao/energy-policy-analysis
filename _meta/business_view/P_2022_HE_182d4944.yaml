- B 趁早布局:紧抓十四五规划窗口期，在储能成本持续下降趋势下，提前储备电化学储能项目资源与合作渠道
- C 趁早对接:主动对接国网冀北/河北电力公司，了解新型储能并网调度规程及入市交易技术标准
