影响分析:
  加油: 政策明确推动小汽车"油换电"超33万辆，对燃油车市场份额形成直接挤压。带动2024年新能源汽车零售额同比增长22.6%、2025年同比增长13.2%，替代效应持续加速。
  充电: 政策直接利好充电桩行业：新能源车保有量大幅增长带动充电需求刚性上升；"油换电"超33万辆直接扩大私家车充电用户基数；家用电器能效提升同步带动家用充电设备更新。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦设备更新和消费品以旧换新的终端消费刺激，未提及储能、V2G、虚拟电厂或电力交易机制。间接观察：新能源车大规模替代燃油车为未来V2G潜力提供车辆基数，但正文未涉及相关机制设计。
