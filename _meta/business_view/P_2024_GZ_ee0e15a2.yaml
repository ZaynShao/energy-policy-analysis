行动建议:
- A 趁早:趁贵安新区配电网规划批复窗口期,梳理现有配电区域内的潜在用户用电需求,特别是大用户专变配套需求,争取纳入后续配电网接入方案。
- B 研究:持续跟踪贵安新区配电网实际建设时序与并网进度,研究新建变电站和线路周边的潜在供电市场机会,但须待规划落地并明确具体开放条件后再行布局。
