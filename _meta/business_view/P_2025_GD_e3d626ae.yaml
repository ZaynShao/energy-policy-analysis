影响分析:
  加油: 未直接涉及。正文聚焦纯电车型参与车网互动、放电收益及充电基础设施，未涉及传统燃油车/加油站业务。但政策体现能源消费侧电动化加速趋势（间接观察）。
  充电: 直接涉及。深圳84个场站参与V2G放电，总放电量超7万度，形成规模化常态；充电模块国内市场"含深度"突破80%、充电整桩突破50%、车网互动模块份额突破85%；换电站（时代电服单站放电功率1120kW）成为新参与主体；放电送积分等新消费模式落地；深圳正建世界一流超充之城。
  电力_储能_V2G_交易: 直接涉及。V2G明确作为核心机制落地：纯电重卡单台单次可放电300度、20台电动大巴每日形成3000度稳定放电；虚拟电厂管理中心组织18次交易、30家运营商参与，实现"日内+多时段日前"精准响应；正文明确提出车网互动资源参与备用、调频等电力辅助服务市场的可能性。
行动建议:
- A 趁早:研究V2G放电参与虚拟电厂响应的接入标准与技术规范，适配深圳"本地精准响应+跨区调频备用"体系
- B 趁早:对接南网电动、英飞源、特来电等头部运营商，探索放电送积分等用户激励模式，提升车主参与车网互动积极性
- C 趁早:评估换电站作为车网互动资源的商业可行性，重点关注单站放电功率1120kW的响应能力与备用/调频服务的市场准入条件
- D 研究:跟踪深圳车网互动模块份额突破85%、整桩产品年内降本50%以上的产业动态，评估对充电设备供应链的竞争格局影响
didi_impact_one_liner: 深圳以84站2500车次7万度放电规模验证V2G+虚拟电厂商业路径，充电设施产业（模块/整桩）及换电运营直接受益于国家试点加速，车网互动规模化有望从深圳向全国推广
