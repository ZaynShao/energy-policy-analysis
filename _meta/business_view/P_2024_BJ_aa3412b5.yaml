影响分析:
  加油: 政策明确支持利用现有加油站建设立体超充站，鼓励已建充电站升级改造为超充站。加油站转型为综合补能站成为政策导向，市属国企加油站首当其冲面临改造压力。
  充电: 直接利好。政策设定2024年建成500座、2025年建成1000座超充站目标，覆盖公共停车场、交通枢纽、居民小区周边、高速公路服务区等场景。超级快充功率达400-600kW，10分钟补电将重塑充电体验，现有充电站升级改造获政策鼓励。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦充电基础设施建设，未提及储能配套、V2G机制、电力交易或电网改造。超级快充高功率对电网的影响仅属于间接观察。
行动建议:
- 'A 趁早: 研究加油站改造为综合补能站模式，评估存量站点的超充接入条件与改造成本'
- 'B 趁早: 锁定政策重点布局区域，提前与各区对接用地资源，优先布局停车场、交通枢纽场景'
- 'C 研究: 评估超级快充大规模接入对区域电网承载能力的潜在影响，提前与电力部门协调增容方案'
- 'D 研究: 跟进各区分批次公布的超充站建设用地方案，梳理可参与投资或运营的机会点'
didi_impact_one_liner: 北京超级充电站建设加速，加油站转型与充电运营双向受益，需提前布局用地资源和电网协调。
