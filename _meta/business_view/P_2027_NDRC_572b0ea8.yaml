影响分析:
  加油: 未直接涉及。该政策聚焦电力现货市场的运营和管理，涵盖电能量交易、辅助服务市场及新型经营主体参与规则，与传统燃油零售业务无关联。
  充电: 间接观察。正文第九条（五）明确将“负荷聚合商”列为推动参与交易的新型经营主体，充电设施若作为负荷聚合商聚合的负荷资源或储能资源，理论上存在间接参与现货市场的通道；但政策未直接规定充电桩、充换电站、V2G或新能源汽车充放电的业务准入或运营义务。
  电力_储能_V2G_交易: 直接影响。核心条款包括：第二条明确将储能和虚拟电厂界定为市场成员中的新型经营主体；第九条（五）明确要求“推动分布式发电、负荷聚合商、储能和虚拟电厂等新型经营主体参与交易”；第九条（三）要求做好调频、备用等辅助服务市场与现货市场衔接。V2G和反向充电在正文中未出现。
行动建议:
- A 趁早研究：储能运营方趁早研究现货市场准入条件和交易规则，评估储能作为新型经营主体参与日前、日内、实时市场的路径
- B 趁早布局：虚拟电厂运营商趁早布局负荷聚合和资源整合，尽早获取市场参与资格并接入技术支持系统
- C 研究：充电运营主体研究负荷聚合商模式，评估充电负荷参与现货市场和辅助服务市场的可行性和技术路径
didi_impact_one_liner: 储能、虚拟电厂获明确市场准入资格，充电业务通过负荷聚合商间接获得参与路径，加油业务不涉及
