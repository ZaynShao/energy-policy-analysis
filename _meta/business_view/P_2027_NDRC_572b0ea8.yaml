影响分析:
  加油: 未直接涉及。该规则聚焦电力现货市场运营规范，针对电能量交易、辅助服务及新型经营主体参与市场，石油零售业务不在本规则调整范围内。
  充电: 未直接涉及。文件虽提及负荷聚合商可作为新型经营主体参与交易，但未明确充电桩/充换电服务的市场准入、交易机制或运营规范，充电业务的市场化路径尚待专项政策明确。
  电力_储能_V2G_交易: 明确纳入市场参与主体范围。文件第九条近期任务第（五）项明确提出"推动分布式发电、负荷聚合商、储能和虚拟电厂等新型经营主体参与交易"，确立了储能、虚拟电厂参与电力现货市场的制度框架；第二条定义部分将储能和虚拟电厂列为市场经营主体，赋予其合法市场地位。
行动建议:
- A 趁早研究储能/虚拟电厂参与现货市场的技术对接方案，提前完成系统改造和资质准备
- B 趁早梳理储能资产和虚拟电厂资源的规模、特性，建立参与现货市场的成本收益测算模型
- C 趁早与电力调度机构和交易机构建立沟通渠道，了解新型经营主体入市的技术门槛和信息披露要求
- D 趁早开展内部规则研判，评估现货价格波动对储能充放电策略和虚拟电厂调度模式的影响
- E 研究政策向全国推广的节奏，预判各地规则差异，布局跨区域市场参与能力
didi_impact_one_liner: 储能/虚拟电厂获明确市场主体地位，充电业务暂未直接涉及，需持续跟踪规则细化进展
