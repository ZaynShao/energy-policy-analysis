  加油: 未直接涉及。该政策聚焦新能源汽车充电基础设施和车网互动，不涉及传统燃油车加油业务。
  充电: 直接利好。政策明确重庆作为首批车网互动试点城市，将完善价格与需求响应机制、全面推广智能有序充电；重庆已累计建成充电桩38.12万个、超充站1452座，规模化应用试点将推动充电基础设施进一步完善和优化。
  电力_储能_V2G_交易: 直接涉及。政策明确将'聚合参与电力市场交易'和'协同创新V2G技术与模式'作为专项行动；重庆已有80个V2G项目、201个充储一体化站建成，此次入选的车网多能低碳融合V2G试点项目将进一步推动V2G技术规模化应用和电力市场参与机制完善。
