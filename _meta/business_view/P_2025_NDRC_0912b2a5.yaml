影响分析:
  加油: 未直接涉及。正文未提及任何与加油业务、加油站或成品油相关的内容，虽涉及多元储能体系建设，但均围绕电力系统展开，未向加油/油品业务延伸。
  充电: 直接涉及。政策明确提到建设"光储充放一体化充电站"，并要求推广"车网互动"应用模式，研究通过负荷聚合商形式参与需求响应，为充电运营商参与储能系统调节和电网互动提供政策依据；同时政策要求新型储能具备接受调度指令能力，将直接影响充电场站储能配套的调度运行机制。
  电力_储能_V2G_交易: 直接涉及。政策核心即为新型储能规模化建设，设定了2027年新型储能装机达1.8亿千瓦以上的目标，明确推动虚拟电厂、源网荷储一体化、车网互动（V2G）等应用模式，并支持储能参与电力现货市场调用及需求响应，为储能投资运营、V2G商业化及负荷聚合商参与电力市场提供了系统性政策支撑。
行动建议:
- 趁早在充电场站布局储能配套，将"光储充放一体化"纳入新建和改扩建充电基础设施的标配方案
- 趁早研究车网互动(V2G)技术及商业模式，储备V2G双向充电桩相关技术能力
- 趁早探索负荷聚合商角色，研究聚合充电资源参与需求响应和电力现货市场的路径
- 趁早对接区域电力调度机构，了解新型储能涉网试验和调度接入的技术规范要求
didi_impact_one_liner: 政策为充电场站配建储能和参与V2G/虚拟电厂提供规模化政策支撑，三大业务中充电业务受益最直接，需趁早布局光储充放一体化和负荷聚合商角色
