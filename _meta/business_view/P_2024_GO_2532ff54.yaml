影响分析:
  加油: 未直接涉及。本办法聚焦充电基础设施建设运营管理，加油业务不在正文调整范围内。
  充电: 直接涉及。正文设定了充电运营企业准入门槛（注册资金≥2000万元、专职运维人员≥4名、总容量≥2万千瓦且自建占比≥20%），设置了资质壁垒；要求新建居住区个人固定车位100%预留充电基础设施，释放居住区充电增量空间；明确公用/专用/换电等设施分类及规划布局要求（慢充为主、快充为辅），引导建设方向。
  电力_储能_V2G_交易: 正文第三条提及平台提供“车网互动支撑”服务，但仅为平台功能定位描述，无V2G、虚拟电厂、储能或电力交易的明确机制设计。充电基础设施定义中“电能补给”未扩展至储能或双向互动。
行动建议:
- 'A 趁早: 对标郑州新运营商准入门槛（注册资金2000万+、4名持证运维+2万千瓦容量），评估现有资质缺口，在政策正式落地前补齐合规要件。'
- 'B 趁早: 抓住新建居住区100%预留充电基础设施的政策窗口，趁早与开发商、物业公司对接批量安装合作，锁定居住区充电场景资源。'
- 'C 研究: 持续跟踪郑州“车网互动支撑”平台的功能演进和实施细则，研判V2G/有序充电参与电网调峰的潜在政策空间。'
- 'D 研究: 关注郑州市充电基础设施发展规划（2024—2035年）中关于超充、换电站的布局规模与时序，提前布局增量点位。'
didi_impact_one_liner: 郑州充电运营准入门槛趋严，居住区充电配套强制预留，充电业务需对标资质合规并抢占居住区场景先机。
