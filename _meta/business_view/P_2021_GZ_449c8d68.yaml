  电力_储能_V2G_交易: 直接涉及电力市场交易机制。文件明确了电网企业代理购电用户电价形成方式，包括代理购电价格（含平均上网电价、偏差电费、辅助服务费用）、输配电价及政府性基金附加；建立了2022年1月起电网企业以报量不报价方式参与场内集中交易的市场化购电模式；确定了挂牌交易价格按集中竞价加权平均价确定的机制。但未直接涉及储能、V2G或虚拟电厂等具体机制设计。
