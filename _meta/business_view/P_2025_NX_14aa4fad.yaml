影响分析:
  加油: 未直接涉及。正文仅规范用户与火电间的电力中长期交易价格与偏差结算机制，无加油业务相关表述。
  充电: 未直接涉及。正文聚焦火电与用户间的区内科电力交易规则，虽涉及用户侧用电管理，但未明确触及充电桩运营、充换电服务或新能源汽车聚合商参与市场等具体机制。
  电力_储能_V2G_交易: 未直接涉及储能、V2G或虚拟电厂。政策核心是规范区内火电与用户之间中长期交易的价格浮动区间（峰段≥150%、谷段≤50%）及偏差结算K系数，发电侧偏差K发取值（峰段1.1/平段0.8/谷段0.5），用户侧偏差K用取值（峰段1.8/平段1.3/谷段0.8），以及日融合交易申报上下限（年度最高低价±10%）。虽涉及电力批发交易主体与价格机制，但未明确出现储能、虚拟电厂、V2G或电力辅助服务交易相关表述。
行动建议:
- A 趁早研判K系数对自营电源侧偏差成本的影响，尤其峰谷段K值差异（发电侧峰段K发1.1、谷段K发3=0.5；用户侧峰段K用1=1.8、谷段K用3=0.8），据此优化月度及旬交易申报策略
- B 趁早对照70%成交电量比例门槛排查自身履约能力，不满足则峰段正偏差电量将触发K用1=1.8倍基准电价的高额结算成本
- C 趁早梳理年度（2-12月）各时段最高最低价±10%区间，作为日融合交易申报上下限合规边界，确保报价不越线
didi_impact_one_liner: 本通知聚焦区内火电与用户侧中长期交易价格与偏差结算规则，峰谷浮动区间及K系数体系构成核心约束，充电/加油/储能/V2G等业务均未直接涉及。
