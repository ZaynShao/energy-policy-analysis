影响分析:
  加油: 未直接涉及。该政策聚焦电力中长期市场交易优化，覆盖用户与火电企业之间的交易价格、偏差结算及交易组织规则，不涉及成品油业务。
  充电: 直接涉及。充电运营主体作为电力用户，须遵循70%电量比例要求及对应偏差电价结算规则；峰段不低于平段150%、谷段不超平段50%的价格浮动限制，直接影响充电场站分时购电成本结构。
  电力_储能_V2G_交易: 未直接涉及。政策正文仅明确用户与火电之间的中长期交易规则及偏差结算系数，未涉及储能装置调用、V2G双向充放电机制或虚拟电厂聚合交易等具体机制。
行动建议:
- A 趁早建立充电负荷预测模型，确保月度实际用电量不低于成交电量的70%，规避峰段K用1=1.8、平段K用2=1.3的偏差考核成本
- B 趁早优化充电场站运营时段安排，利用谷段低价时段（不超过平段50%）增加充电量，压缩峰段高价时段的购电占比以降低综合用电成本
- C 研究政策动态，跟踪日融合交易价格上下限浮动机制后续执行情况，评估充电场站参与现货市场交易的可能性
didi_impact_one_liner: 充电业务面临偏差结算风险与峰谷价差机遇，充电运营商需优化负荷曲线以满足70%电量比例要求并利用谷段低价降本。
