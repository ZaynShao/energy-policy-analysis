影响分析:
  加油: 未直接涉及
  充电: 直接涉及。政策明确鼓励充电桩作为虚拟电厂可调节资源参与需求响应和调频调峰；V2G能量互动写入国家《十四五现代能源体系规划》；特来电已构建以充电网为载体的虚拟电厂平台，聚合电动汽车有序充电资源。
  电力_储能_V2G_交易: 直接涉及。政策核心指向：1）储能（移动储能、梯次储能）作为虚拟电厂核心聚合资源；2）V2G明确写入国家规划获政策加持；3）虚拟电厂参与现货市场和辅助服务市场的商业模式已获实证（深圳首个盈利案例，度电收益0.274元）；4）山西省已出台首份省级虚拟电厂建设与运营管理实施方案；5）中电联预测2025年虚拟电厂投资规模有望达815亿元。
行动建议:
- A 趁早研究特来电、捷能智电等先行企业聚合充电资源和V2G构建虚拟电厂的商业模式，评估复制可行性
- B 趁早跟踪山西省首份省级虚拟电厂建设运营管理方案的细则要求，提前对标布局
- C 趁早对接山东省虚拟电厂和需求响应实施细则，明确聚合商准入条件和参与路径
- D 趁早研究国家层面虚拟电厂专项政策出台动向，预判对储能配置和V2G补贴的激励力度
