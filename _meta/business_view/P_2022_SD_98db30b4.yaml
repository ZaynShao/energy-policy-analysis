影响分析:
  加油: 未直接涉及
  充电: 正文明确提到V2G(新能源汽车与电网能量互动)是《十四五现代能源体系规划》虚拟电厂示范对象，特来电虚拟电厂平台整合电动汽车有序充电资源，V2G能量互动被列为重要聚合资源。充电业务作为虚拟电厂核心资源的定位已明确。
  电力_储能_V2G_交易: 正文多处涉及核心机制：储能设施被列为虚拟电厂主要聚合资源；V2G在国家规划层面被明确提出；虚拟电厂已实现参与电力现货市场盈利(首个案例)；明确参与调频调峰、需求侧响应、聚合售电、绿电消纳和碳交易等商业路径；2025年虚拟电厂投资规模预计达815亿元。
行动建议:
- A 趁早:在充电场站布局V2G双向充电桩硬件预置，为参与虚拟电厂调频调峰和需求响应做好准备
- B 趁早:对接特来电等已建成虚拟电厂平台的聚合商，探讨充电资源聚合接入的商业合作模式
- C 研究:关注山西省《虚拟电厂建设与运营管理实施方案》等省级细则出台动向，评估准入条件和建设运营资质要求
- D 研究:跟踪深圳虚拟电厂管理中心运营模式，为后续参与区域虚拟电厂聚合商资格申请积累经验
