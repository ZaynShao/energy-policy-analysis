影响分析:
  加油: 未直接涉及。该政策聚焦于省级电网输配电价核定，属于电力体制改革范畴，主要影响电力用户的用电成本结构，与油品销售业务无直接关联。
  充电: 未直接涉及。政策涉及发电侧和销售侧电价市场化，理论上参与市场化交易的充电桩运营商可能受输配电价变化影响，但正文仅泛指“参与电力市场化交易的用户”，未明确提及充电或新能源汽车充电设施。正文未写明充电行业的具体电价机制、准入条件或价格调整路径。
  电力_储能_V2G_交易: 未直接涉及。政策核心是省级电网输配电价定价规则完善和第二监管周期价格核定，虽提及“辅助服务费用”和“市场化交易”，但正文未明确涉及储能、虚拟电厂(VPP)、V2G或电力交易的具体机制设计、试点安排或准入条件，也未出现V2G、双向充电桩、聚合商等概念。
行动建议:
- A 趁早:排查公司现有电力设施和市场化交易合同，评估输配电价调整（自2021年1月1日起执行）对我省业务用电成本的实际传导影响
- B 研究:关注后续辽宁省输配电价执行细则及市场化交易扩围政策，研判充电业务参与电力市场的潜在路径
- B 研究:持续监测省级电网输配电价动态，为未来可能涉及的储能或电力交易业务预留电价分析能力
- B 研究:区分“执行政府规定的销售电价”与“市场化交易电价”的用户类型，评估公司各业务板块适用的电价机制
didi_impact_one_liner: 输配电价第二监管周期于2021年执行，充电业务间接承压但机制未明，储能/V2G/电力交易领域未见直接政策约束。
