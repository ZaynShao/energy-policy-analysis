影响分析:
  加油: 政策明确要求有序淘汰国三及以下排放标准营运类柴油货车，全面实施汽车国六排放标准，将加速高污染老旧燃油车辆退出市场，减少传统燃油消费；同时政策推动节能降碳和设备更新改造，倒逼加油站等配套设施提升能效和安全标准，面临存量客户流失与设备升级双重压力。
  充电: 政策大力推进城市公交车电动化替代，提高城市公交、快递、环卫、城市物流配送等领域新能源汽车比例，明确制定新能源公交车动力电池更新淘汰方案，将直接扩大新能源汽车保有量和充电需求，充电基础设施市场迎来增量空间。
  电力_储能_V2G_交易: 政策提到推动船用电池动力、氢燃料等低碳清洁能源装备研发，但未明确涉及V2G、虚拟电厂、储能设施建设或电力交易具体机制，以电力能源为核心的创新业务暂未直接涉及（间接观察到节能降碳趋势可能长期带动相关需求）。
行动建议:
- A 趁早:研判燃油车淘汰时间表，提前布局高能效加能站转型或综合能源服务改造方案
- B 趁早:对接公交、物流企业新能源汽车替换计划，提前锁定充电桩建设运营合作机会
- C 研究:跟踪船用电池动力、氢燃料船舶政策落地节奏，评估港口充换电基础设施需求
- D 研究:关注新能源汽车电池回收和梯次利用政策，探索充电+储能一体化商业模式
didi_impact_one_liner: 政策加速淘汰高排放燃油车并大力推广新能源车，充电市场获直接利好，加油业务面临萎缩压力，电力储能创新业务暂无直接政策触发。
