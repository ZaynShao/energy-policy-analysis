影响分析:
  加油: 未直接涉及。方案聚焦电力交易中心独立规范运行，未涉及油气销售或传统加油站业务。
  充电: 未直接涉及。方案规范的是电力交易平台的建设运营与市场规则，为市场主体提供交易服务，未直接针对电动汽车充电桩建设或充电运营制定条款。
  电力_储能_V2G_交易: 直接涉及。方案明确交易中心负责电力交易平台建设运营与市场规则编制，推进股份制改造（电网持股降至40%），为储能、虚拟电厂等新型市场主体提供了更规范、透明的市场交易环境基础。2020-2025年分阶段推进市场框架完善和交易品种规范，将影响储能、虚拟电厂等参与电力市场的路径和条件。
行动建议:
- A 趁早研究：跟进交易中心股份制改造进程，了解新增股东构成及准入条件，探索成为市场交易主体或潜在股东的机会
- B 趁早参与：主动对接交易中心，参与市场规则和交易品种的编制工作，为储能、虚拟电厂等业务争取有利的市场准入条件
