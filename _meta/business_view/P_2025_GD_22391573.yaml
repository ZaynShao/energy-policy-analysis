影响分析:
  加油: 未直接涉及。该政策聚焦电动自行车（低速二轮车）充电收费规范，与机动车燃油零售业务无关联。
  充电: 直接涉及。政策对电动自行车充电收费作出系统性规范：(1)充电费用须电费、服务费分别标示计价；(2)2025年1月1日起全面实现充电电量单独计量；(3)居民住宅小区内充电设施执行合表电价；(4)服务费实行市场调节价但须弥补成本、合理收益；(5)倡导场地提供方不收或少收场地租赁费、不参与或降低收入分成以降低服务费；(6)加强明码标价和监督检查，查处违法行为。
  电力_储能_V2G_交易: 未直接涉及。该政策针对电动自行车充电收费，未涉及储能、虚拟电厂、V2G、电力交易等机制或业务。电网企业仅涉及按'三零'政策配合充电设施接电工作，间接关联居民合表电价执行。
行动建议:
- A 趁早研判服务费定价策略：鉴于服务费实行市场调节价且政策倡导降低服务费，充电运营商需重新审视成本结构和定价模型，在弥补成本与保持市场竞争力之间寻找平衡点
- B 趁早落实单独计量改造：2025年1月1日大限将至，需提前完成充电设施的电量单独计量改造，避免合规风险
- C 趁早完善明码标价体系：按照政策要求在充电场所、手机应用程序、微信公众号等醒目位置完整标示电价、服务项目、收费标准和服务电话
- D 研究场地合作模式调整：政策倡导场地提供方让渡利润空间，运营商需提前与小区产权单位、物业、业委会沟通，探索长期合作协议（建议5年及以上）以摊薄成本
didi_impact_one_liner: 政策规范电动自行车充电收费，要求电费服务费分别计价、单独计量、落实合表电价、强化明码标价，倡导场地让利降低服务费，充电运营商需重新定价并完成计量改造。
