影响分析:
  加油: 直接影响：湖南汽油、柴油最高零售价每吨分别下调645元和625元，最高批发价等额调整；合同约定配送时，对零售企业供应价按最高零售价每吨扣减不低于300元，对符合资质的民营批发企业不低于400元；未约定配送的运杂费由供需双方协商。该通知改变了批发价与供应价差底线，需重算采购成本、单吨毛利和零售定价空间。商户合规成本、KA支付接口、下沉城市展业未在本通知直接涉及。
  充电: 未直接涉及。正文仅调整成品油价格，未涉及建桩节奏、选址、充电服务费、场站电价、大功率/超充或行业标准。间接观察：油价下调可能边际影响燃油车使用成本，但不改变充电业务上述决策变量。
  电力_储能_V2G_交易: 未直接涉及。正文未出现售电、现货、中长期、偏差考核、分布式新能源入市、储能、虚拟电厂、V2G或电力交易机制，不构成电力业务规则变化。
行动建议:
- A 趁早：核对湖南各加油站点采购/配送合同中的扣减与运杂费条款，按零售企业不低于300元/吨、合规民营批发企业不低于400元/吨的价差底线，重算单吨毛利与零售定价空间。
- B 研究：跟踪湖南省成品油最高批发价、最高零售价及市场监测和异常报告要求，评估对下沉城市供油成本与展业可行性的影响。
didi_impact_one_liner: 湖南成品油最高零售/批发价同步下调，并明确对零售企业不低于300元/吨、合规民营批发企业不低于400元/吨的供应价差底线，加油业务需重算批发折扣与单吨毛利；充电与电力业务未直接涉及。
