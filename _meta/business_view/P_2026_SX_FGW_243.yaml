影响分析:
  加油: 未直接涉及。该文件是山西省发电侧增量新能源机制电价竞价规则，与加油业务的批发价/炼厂装车价、商户合规成本、KA 总部接口、下沉城市展业均无对应变量；间接观察：山西新能源装机与电价走势不改变本业务任何在做的动作。
  充电: 未直接涉及。正文仅规范集中式风电、集中式光伏、分布式光伏、分散式风电的机制电量竞价，未涉及建桩节奏与选址、充电服务费定价、场站侧电价结构或超充标准；间接观察：文件明确把大型工商业分布式光伏、绿电直连、源网荷储一体化等就近消纳项目排除在竞价之外，与充电场站侧的绿电采购无直接衔接。
  电力_储能_V2G_交易: 直接涉及“分布式新能源入市与聚合商准入门槛”：正文明确分散式风电、分布式光伏可自主参与竞价，也可委托代理商代理，且代理商需具备售电资质、为每个代理项目单独填报信息。这是山西分布式新能源聚合代理的准入条件，落在本公司售电与电力交易的能力维度上。价格参数构成山西增量新能源的结算锚：机制电量总规模
    69.43 亿千瓦时（风电 42.55、光伏 26.88），风电竞价上限 0.30 元/千瓦时、光伏 0.32 元/千瓦时、下限均为 0.20 元/千瓦时，执行期
    12 年，竞价结果通过“新能源可持续发展价格结算机制差价协议”落地，间接影响该省现货与中长期价格预期。储能、V2G、虚拟电厂未直接涉及。
行动建议:
- A 趁早:核对本公司在山西的售电资质是否有效、能否作为代理商承接分散式风电与分布式光伏的竞价代理，并测算逐项目单独填报的人力与流程成本，再决定是否承接该项代理业务。
- B 研究:以 0.20—0.32 元/千瓦时竞价区间、12 年执行期和 69.43 亿千瓦时规模为输入，测算山西增量新能源机制电价对现货及中长期价格曲线的影响，纳入“该省进不进”的评估。
- C 研究:跟踪山西电力交易中心发布的竞价公告与最终竞价结果，据此校验该省新能源入市节奏与我方聚合代理策略的一致性，形成是否扩大代理规模的建议。
didi_impact_one_liner: 山西 2027 年增量新能源机制电价竞价明确代理商须具备售电资质，这是我方售电业务在山西做分布式聚合代理的第一道准入闸门，需先核资格再谈规模。
