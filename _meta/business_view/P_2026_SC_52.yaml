影响分析:
  加油: 直接影响：政策推动新能源重卡替代柴油重卡，到2030年渗透率达40%、保有量160万辆，将显著减少柴油消费需求，对传统加油业务构成长期结构性压力。
  充电: 直接影响：方案明确建设重卡充换电站约3000个，依托高速公路网打造零碳公路运输通道，并在重点场景布局加氢站、绿色燃料加注站，直接拉动充电/换电基础设施投资与运营需求。
  电力_储能_V2G_交易: 未直接涉及。正文未提及储能、V2G、虚拟电厂或电力交易的具体机制；仅提到补能设施规划需与能源电力规划衔接，可间接关注充电负荷对配电网的协同影响，但无明确业务机会。
行动建议:
- A 趁早：联合高速公路运营方及物流企业，在‘5射4纵5横’零碳通道关键节点布局重卡充换电站，抢占补能网络先发优势。
- B 研究：跟踪京津冀、汾渭平原等固定线路短倒运输电动化要求，开发针对矿区和港口的电动重卡充换电一体化解决方案，培育客户需求。
- C 研究：评估新能源重卡规模化对柴油需求的替代节奏，提前调整加油站的网络布局与业务结构，向综合能源补给站转型。
didi_impact_one_liner: 新能源重卡规模化落地将加速柴油替代与重卡补能网络扩张，充电设施布局迎来政策窗口，但储能和电力交易尚未直接受益。
