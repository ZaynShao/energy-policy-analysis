影响分析:
  加油: 未直接涉及。该政策专门针对电动汽车充电基础设施建设，与传统燃油加油业务无直接关联。
  充电: 直接涉及且影响重大。政策明确以加快充电基础设施建设为核心目标，要求到2020年满足超过500万辆电动汽车充电需求；提出加快快充站、换电站建设；强调形成智能高效的充电基础设施体系；推广PPP模式引导社会资本参与；培育'互联网+充电基础设施'产业生态。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦充电基础设施的'充电'环节，虽提出建设智能高效充电基础设施体系，但正文未明确涉及储能配套、V2G机制或电力交易等具体领域。
行动建议:
- A 趁早布局充电基础设施投资与运营，聚焦快充站、换电站及大型公共停车场充电桩建设
- B 研究'互联网+充电基础设施'商业模式，探索充电服务创新
- C 趁早对接地方政府充电基础设施专项规划，争取PPP项目合作机会
- D 研究充电智能服务平台建设路径，为未来互联互通做准备
didi_impact_one_liner: 政策明确推进充电基础设施建设目标，充电运营业务迎来直接政策利好，加油业务未受影响。
