影响分析:
  加油: 未直接涉及。该政策聚焦电动汽车充电基础设施建设，不涉及传统燃油加油业务。间接观察：充电基础设施的加快布局，长期或影响加油站向综合能源补给站转型的节奏。
  充电: 直接利好。政策明确要求到2020年满足超500万辆电动汽车充电需求，'桩站先行'适度超前建设；专项规划纳入城乡规划明确配建比例要求；推动'互联网+充电基础设施'产业生态，培育具有国际竞争力的充电服务企业；推广PPP模式引导社会资本参与。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦充电基础设施建设，虽提及建设'智能高效'充电基础设施体系，但正文未明确涉及储能装置、V2G反向充电、虚拟电厂聚合或电力交易机制等具体内容。
行动建议:
- 'A 趁早: 研究PPP合作模式介入充电基础设施建设，响应政策吸引社会资本导向，锁定优质点位资源'
- 'B 趁早: 对接地方充电基础设施专项规划，布局用户居住地、单位停车场等政策明确的主体建设区域'
- 'C 研究: 跟踪''互联网+充电基础设施''互联互通标准进展，为跨平台接入和业务协同预做准备'
didi_impact_one_liner: 政策强力推动充电桩建设提速，明确2020年500万辆充电需求目标并强化规划刚性要求，为充电业务扩张创造窗口期，需趁早卡位优质点位并布局互联互通能力
