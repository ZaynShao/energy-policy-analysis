  加油: 未直接涉及。该公告为新能源前期研究课题比选公告，涉及风电光伏资源普查、电动汽车充放电、绿电交易中心可行性研究，均与加油站及燃油业务无关。
  充电: 直接涉及。课题二《基于车网双向互动的新型智慧配电网建设研究》明确研究电动汽车超级充电站规划布局及其对电网影响、充放电电价政策建议、配套电网建设项目清单，直接影响充电基础设施布局和运营策略。
  电力_储能_V2G_交易: 直接涉及。课题一涉及风电光伏发电资源普查（电力/新能源）；课题二明确研究车网双向互动（V2G）电网侧技术标准及充放电电价政策；课题三研究西南绿电交易中心可行性，涵盖绿电绿证交易、核算认定认证等核心业务体系，直接影响绿电交易机制设计。储能虽未被明确提及，但新能源资源普查结果将间接影响储能需求（间接）。
