影响分析:
  加油: 未直接涉及。该政策聚焦新型储能（除抽水蓄能外的储能技术）并网与调度，加油业务（燃油销售、加油站网络）不在本政策调整范围内。
  充电: 政策明确支持光储充一体化联合调用模式发展，优先调用新型储能试点示范项目。充电场站作为光储充一体化的核心场景，可获得更明确的并网服务保障和调度优先级，有利于提升充电基础设施的能源利用效率和商业模式吸引力。
  电力_储能_V2G_交易: 本政策核心调整对象为新型储能，涉及并网接入管理、调度运行机制、市场化调用三大维度。政策要求电力调度机构制定储能调度运行规程，支持储能参与各类电力市场，为储能价值发挥提供制度保障。但V2G（车辆到电网反向放电）未在正文中出现，暂不构成直接影响。
行动建议:
- A 趁早研究光储充一体化模式下的储能调度规则和技术标准，提前布局充电场站与储能系统协同运营能力。
- B 趁早对接电网调度机构，了解新型储能优先调用机制，争取纳入试点示范项目范围。
- C 趁早探索聚合储能、共享储能与充电业务的组合商业模式，提升充电场站能源综合服务能力。
- D 研究储能参与电力市场的准入条件和交易机制，评估储能资产的市场化运营空间。
didi_impact_one_liner: 充电业务迎来政策利好，光储充一体化项目有望获优先调度支持；储能作为核心调整对象，其并网服务与市场化调用机制进一步明确，但V2G领域尚未直接涉及。
