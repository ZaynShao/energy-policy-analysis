影响分析:
  加油: 未直接涉及。该规则规范电力市场行为,核心主体为发电企业、售电企业、电力用户及新型经营主体(储能、虚拟电厂、负荷聚合商),加油业务属于成品油销售领域,不在本规则管辖范围内。
  充电: 未直接涉及。充电桩/充电站运营涉及电力使用,但正文仅原则性将负荷聚合商列为新型经营主体,未明确充电基础设施的市场准入、交易机制或运营要求。负荷聚合商的列举属于市场成员定义范畴,不等同于充电业务的直接规范。
  电力_储能_V2G_交易: 直接涉及。规则明确将储能企业、虚拟电厂、负荷聚合商界定为新型经营主体,纳入电力市场成员体系;第十三条明确储能可作为容量交易标的,参与容量成本回收机制;第十二条储能可参与调频、备用、调峰等有偿辅助服务市场;第十五条赋予储能企业通过市场注册后参与电能量交易的资格。V2G未在正文中出现。
行动建议:
- 'A 趁早: 完成储能业务的市场注册准备工作,对接电力交易机构准入要求,确保具备参与电能量交易和辅助服务市场的合规资质。'
- 'B 趁早: 研究储能参与容量市场的技术条件和成本核算机制,跟踪容量补偿、容量市场等市场化容量成本回收机制的落地进展。'
- 'C 研究: 虚拟电厂的聚合运营模式,结合负荷聚合商的定位,探索聚合分布式资源参与辅助服务或容量交易的市场路径。'
- 'D 研究: 密切跟踪容量交易具体规则和辅助服务管理办法的后续出台,及时调整储能及虚拟电厂业务的市场策略。'
didi_impact_one_liner: 规则正式确立储能/虚拟电厂/负荷聚合商的市场成员地位,储能获得参与容量交易和辅助服务市场的明确路径,需趁早完成注册合规准备和研究市场机制。
