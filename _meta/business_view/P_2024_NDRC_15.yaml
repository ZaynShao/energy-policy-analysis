影响分析:
  加油: 未直接涉及。该规则聚焦电力市场运行，加油业务属于油品销售范畴，不在电力市场交易体系内。
  充电: 未直接涉及。正文未明确提及充电桩、充换电服务或新能源汽车充电作为独立交易品种。间接观察到：第四条将负荷聚合商列为新型经营主体，充电运营商若作为负荷聚合商可间接获得市场参与资格，但正文未明确建立充电与电力市场的直接联动机制。
  电力_储能_V2G_交易: 直接涉及。（1）第四条明确储能企业、虚拟电厂、负荷聚合商属于电力市场新型经营主体，赋予市场准入资格；（2）第十条、第十三条明确储能可参与电能量交易、容量交易，且容量交易明确将储能列为可靠容量能力提供者，为储能投资回收提供市场化路径；（3）第十二条、第十九条明确储能可参与调频、备用、调峰等有偿辅助服务市场，通过市场竞争获取收益。V2G未在正文中出现，等价机制也未明确提及，故未直接涉及。
行动建议:
- 趁早完成电力市场注册手续：第五条确立了注册制度，储能企业、虚拟电厂、负荷聚合商应趁早按照交易规则完成市场准入注册，避免因注册流程延误影响后续参与交易。
- 趁早研究容量市场机制：第十三条提出探索容量补偿、容量市场等机制，储能企业应趁早研究容量成本回收机制设计，为未来投资决策提供依据。
- 趁早布局辅助服务市场：第十二条、第十九条明确有偿辅助服务采用市场竞争方式，具备条件的储能应趁早储备调频、备用、调峰等技术服务能力，抢占辅助服务市场份额。
- 趁早探索负荷聚合商模式：第四条规定负荷聚合商为新型经营主体，充电等负荷侧资源可趁早研究通过聚合商形式参与电力市场的路径。
didi_impact_one_liner: 规则明确储能、虚拟电厂、负荷聚合商的市场主体地位，赋予直接参与电能量、容量和辅助服务三大交易市场的资格，充电业务可通过负荷聚合商间接参与电力市场。
