影响分析:
  加油: 间接影响——政策支持国四及以下排放标准老旧营运货车报废更新并优先电动化，以及私家车以旧换新向新能源倾斜（补贴比例更高），长期看可能抑制燃油需求增长，但政策未直接限制燃油或削减加油站资质，属于市场自然替代效应
  充电: 直接涉及——政策多维度支持新能源车更新：(1)新能源城市公交车及动力电池更新补贴；(2)老旧营运货车报废更新为电动货车优先；(3)私家车报废换新能源补贴12%（最高2万元），均将扩大充电市场规模和需求
  电力_储能_V2G_交易: 未直接涉及——政策正文未出现储能、V2G、虚拟电厂、电力交易等机制。动力电池更新指公交车报废更新的电池替换，不是储能项目；私家车补贴针对车辆购置，不涉及V2G或聚合商业务
行动建议:
- A 趁早布局上海公交车、物流电动化场景的充电运营合作，政策补贴窗口期将带来增量充电需求
- B 趁早研究老旧货车报废更新政策对重型货车充电网络的需求特征，提前储备场站资源
- C 研究私家车高额补贴对上海新能源汽车保有量的拉动效应，评估社区和商业充电桩的加密需求
- D 跟踪上海技术改造贷款贴息政策中对工业储能设备的间接支持可能性
didi_impact_one_liner: 政策补贴全面向新能源车倾斜将显著扩大上海充电需求，但储能/V2G/电力交易机会需另寻政策依据
