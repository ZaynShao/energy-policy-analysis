影响分析:
  加油: 政策主要聚焦煤炭和石油消费的总量控制与优化结构。在石油消费方面，提出推广先进生物液体燃料、可持续航空燃料，合理调控石油消费。政策未对加油业务提出直接的替代时间表或市场准入限制，但明确要优化油气消费结构，长期看传统加油业务面临转型压力。
  充电: 政策明确支持车网互动等新技术新模式，将推动充电基础设施与电网的双向互动能力建设。配电网改造加速和分布式新能源承载力提升，为充电业务提供了更好的并网条件。新能源汽车消纳可再生能源的通道将更加通畅，充电业务与电力系统的协同效应将增强。
  电力_储能_V2G_交易: 政策对储能、虚拟电厂(VPP)和V2G构成直接利好。明确提出到2025年新型储能装机超过4000万千瓦、需求响应能力达到最大负荷3%-5%的具体目标；明确'大力发展微电网、虚拟电厂、车网互动等新技术新模式'；绿证制度建设将促进绿电交易。虚拟电厂和车网互动(V2G)已明确列为重点发展的新技术模式，储能参与电力系统调节的通道将进一步打开。
行动建议:
- A 趁早:在充电场站规划中嵌入V2G双向充放电功能，预留与虚拟电厂聚合的接口协议
- B 趁早:对接各地需求响应市场规则，探索充电负荷参与电网调峰调频的商业模式
- C 研究:储能业务如何与虚拟电厂聚合商合作，形成调频调峰服务能力
- D 研究:绿电采购和绿证交易策略，满足新上项目非化石能源消费比例要求
- E 趁早:布局分布式光储充一体化场站，参与源网荷储协调优化
didi_impact_one_liner: 虚拟电厂和车网互动获政策明确支持，储能装机目标4000万千瓦，充电业务向V2G双向互动转型机遇明确。
