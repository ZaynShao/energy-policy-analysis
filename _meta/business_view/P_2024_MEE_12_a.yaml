影响分析:
  加油: 未直接涉及。正文未提及加油站、成品油销售、燃油车替代等直接业务影响。交通领域节能降碳行动未在正文节选中出现，无法确认对加油业务的具体影响。
  充电: 直接涉及。正文明确提出'大力发展微电网、虚拟电厂、车网互动等新技术新模式'，并将'车网互动'列为提升可再生能源消纳能力的重要举措。2025年需求响应能力目标(最大用电负荷3%-5%)为充电基础设施参与电网调节提供政策依据。
  电力_储能_V2G_交易: 直接涉及。1)储能：明确2025年新型储能装机超过4000万千瓦、抽水蓄能超过6200万千瓦的目标；2)虚拟电厂：明确'大力发展微电网、虚拟电厂'；3)V2G：正文将'车网互动'与虚拟电厂并列部署；4)绿电交易：提出加强可再生能源绿色电力证书(绿证)制度；5)需求响应：明确各地区需求响应能力建设目标，为储能/虚拟电厂参与电力市场创造条件。
行动建议:
- 'A 趁早: 在车网互动技术标准尚在形成阶段,提前布局V2G充电桩研发与试点,抢占技术制高点和标准话语权'
- 'B 趁早: 对接各地需求响应能力建设要求,提前设计储能系统参与电网调峰调频的商业模式,争取纳入省级需求响应资源目录'
- 'C 趁早: 依托虚拟电厂政策支持,构建聚合充电负荷与分布式储能的灵活资源池,探索与电网公司的调度协作机制'
- 'D 研究: 深入分析绿证制度与碳市场的衔接路径,评估代理用户参与绿电交易的市场空间和合规要求'
didi_impact_one_liner: 政策明确支持储能规模发展、虚拟电厂建设及车网互动,V2G/储能/VPP业务迎实质性政策窗口,充电业务可通过参与需求响应获得新盈利模式,加油业务未见直接政策调整。
