影响分析:
  加油: 未直接涉及。该政策聚焦电力中长期交易市场规则，未涉及油品销售或加油站业务。
  充电: 充电运营商作为工商业用户被纳入市场主体范围（推动全部进入市场），可参与中长期交易和分时段电量交易，间接受益于市场化购电机制和峰谷分时电价的优化，但政策未直接针对充电基础设施建设或运营出台具体措施。
  电力_储能_V2G_交易: 独立储能电站已明确可参与电力市场，分两个交易单元分别作为发电和用电主体参与交易，并鼓励参与分时段电量交易；虚拟电厂（负荷聚合商）被列为推动参与电力市场的新型经营主体。V2G机制未在正文中出现，虚拟电厂和负荷聚合商仅处于"推动参与"阶段，尚无具体准入或交易规则。
行动建议:
- 趁早研判分时段交易规则对本业务峰谷用电成本的影响，制定适配中长期签约策略，确保年度签约比例不低于80%合规要求
- 趁早对接河南电力交易中心，了解独立储能分交易单元参与分时段电量的技术对接要求和结算规则
- 趁早跟踪虚拟电厂（负荷聚合商）参与电力市场的配套实施细则发布，提前布局聚合资源储备
didi_impact_one_liner: 政策推动工商业用户和新型主体进入电力市场，独立储能明确了分单元参与分时段交易路径，充电业务可间接受益市场化机制，但虚拟电厂尚处推动阶段无具体准入规则。
