- '趁早: 主动对接河南电力交易中心，了解虚拟电厂（负荷聚合商）参与电力市场的准入条件和注册流程'
- '研究: 关注工商业用户全面入市政策的配套执行细则，为充电运营的电力成本管理做好预案'
