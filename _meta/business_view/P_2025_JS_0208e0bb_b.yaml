影响分析:
  加油: 正文明确将新能源清洁能源营运船舶列为补贴对象，并继续推进老旧营运船舶报废更新（燃油动力）。这意味着对传统船用燃油市场的替代将随补贴扩围而加速，长期来看可能压制区域船用燃料需求增长。
  充电: 政策以大规模设备更新和消费品以旧换新为抓手，间接带动新能源汽车更广泛替代燃油车，客观上扩大充电需求基本面。但正文未直接出台充电桩建设或运营补贴政策，未直接涉及充电基础设施本身。
  电力_储能_V2G_交易: 正文明确将能源电力领域列为重点支持方向，包括'能源电力'领域的存量设备评估诊断与更新，同时明确新增支持'电子信息'领域设备高端化、智能化、绿色化应用，并涉及电力相关设备更新与节能改造，对能源电力行业设备更新形成直接拉动。正文未直接涉及储能、V2G、电力交易机制或虚拟电厂，但用能设备的更新换代可能间接受益于能效提升。
行动建议:
- A 趁早对接:主动对接省、市能源电力设备更新项目储备库，争取纳入超长期特别国债支持项目清单，以设备更新投资补助或贷款贴息降低自身升级成本
- B 趁早布局:密切跟踪新能源清洁能源船舶补贴及老旧船舶报废更新进展，预判船用燃料替代节奏，前瞻性评估区域内燃料需求结构变化并调整业务策略
- C 研究:深入分析能源电力领域存量设备更新对用能侧能效提升的间接拉动效应，研判相关电气化改造带来的新增电力负荷和配套供电需求机会
didi_impact_one_liner: 江苏扩围设备更新明确能源电力为重点支持领域并新增电子信息方向，新能源船舶补贴持续推进，油品替代压力长期趋增，充电需求间接受益扩大。
