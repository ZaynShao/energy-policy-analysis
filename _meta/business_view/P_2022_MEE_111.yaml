影响分析:
  加油: 未直接涉及。该方案针对全国碳排放权交易市场中的发电行业重点排放单位，管控对象为发电机组碳排放配额，加油业务不属于本方案适用范围。
  充电: 未直接涉及。该方案管控对象为发电机组碳排放配额分配与核算，充电设施建设运营及充电服务未在正文中出现。文件虽涉及购入电力间接排放计算，但仅限于配额核算范畴，未扩展至充电运营商的碳排放义务或市场准入。
  电力_储能_V2G_交易: 未直接涉及。该方案核心是火电行业碳配额分配与核算方法，修正系数虽鼓励热电联产和电力调峰，但未直接出现储能、V2G、虚拟电厂或电力交易机制。碳排放权配额交易不同于电力交易机制，两者监管框架独立，文件未涉及后者。
行动建议:
- A 趁早研判:密切跟踪全国碳市场扩容动态,关注政策向其他高排放行业延伸的可能性,提前评估对能源服务业务的潜在影响
- B 趁早对接:针对方案中明确的调峰机组修正系数,研究优化机组运行策略以获取配额优势,为参与电力辅助服务市场提供碳成本视角
- C 研究:系统梳理碳配额成本对发电侧的影响传导路径,量化分析对后续电力交易价格和用户侧能源服务定价的潜在溢出效应
didi_impact_one_liner: 政策聚焦火电行业碳配额分配,核心业务不受直接影响,但需关注碳市场扩容趋势及碳成本向电力系统传导的潜在影响
