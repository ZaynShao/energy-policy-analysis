影响分析:
  加油: 未直接涉及。该方案针对全国碳市场配额管理的重点排放单位(发电机组),机组分类仅涉及燃煤/燃气发电机组,不含加油站或油品销售业务。
  充电: 未直接涉及。该方案为发电机组碳排放配额分配方案,不涉及充电基础设施、充电服务或新能源汽车充电业务。
  电力_储能_V2G_交易: 未直接涉及。该方案虽涉及电力行业,但仅针对发电机组碳排放配额核算与分配,未涉及储能系统、虚拟电厂、V2G机制或电力交易机制。配额实行免费分配,非市场化交易。
行动建议:
- A 趁早:研究发电机组碳排放配额核算方法(供电基准值×实际供电量×修正系数+供热基准值×实际供热量),跟踪碳排放基准值年度变化趋势,评估碳成本对发电侧的影响。
- B 研究:关注全国碳市场扩容动向,研判未来是否可能将充电运营商或储能设施纳入碳市场边界,提前布局碳排放监测和核算能力。
didi_impact_one_liner: 该方案仅针对发电机组碳排放配额分配,加油/充电/电力业务均未直接涉及,但需跟踪碳成本对电力系统长期影响。
