  充电: 未直接涉及。该文件针对储能项目（电化学储能）规划布局、项目管理、市场机制和结算规则，不涉及充电桩建设或充电运营业务。
  电力_储能_V2G_交易: 直接利好储能产业。（1）明确独立储能电站规划布局指引，在新能源富集区、负荷中心区划定推荐区域；（2）清理超两年未开工项目的备案文件，释放电网接入资源；（3）强制配储要求：增量新能源项目并网前须完成储能配置，存量项目未配储或租期届满未续租的消纳困难时优先弃电至装机容量10%；（4）长时储能激励：4小时及以上大容量储能签订租赁合同按功率1.2倍折算配储规模；（5）明确独立储能可参与中长期电能量市场、调峰辅助服务、现货电能量交易及调频辅助服务，推动建立容量补偿机制；（6）明确储能结算规则：损耗电量承担输配电价（免基本电费）、系统运行费、线损和基金附加，上网电量按市场交易价格结算。
行动建议:
- A 趁早:研究4小时及以上长时储能项目开发，契合1.2倍配储规模折算激励政策窗口
- B 趁早:对照备案失效清理规则，评估储备储能项目合规性，及时办理开工手续或重新备案
- C 研究:独立储能参与自治区中长期电能量市场、调峰辅助服务及现货交易的操作机制与准入条件
- D 研究:新能源强制配储及弃电优先控制规则对项目收益率影响，优化配储租赁策略
- E 趁早:建立储能电站安全管理内控制度，对接县区各职能部门安全要求
