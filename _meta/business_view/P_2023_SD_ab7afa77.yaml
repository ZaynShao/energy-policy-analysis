影响分析:
  加油: 未直接涉及。该文件聚焦于煤电容量电价机制，适用于合规在运的公用煤电机组，燃煤自备电厂不在执行范围内，与传统加油业务无直接关联。
  充电: 未直接涉及。文件针对煤电机组的容量电价机制，未涉及充电桩、新能源汽车充电服务或充换电基础设施的电价调整。文件中的容量电费分摊虽由工商业用户承担，但未明确提及充电运营商或充电服务商的具体影响。
  电力_储能_V2G_交易: 文件核心涉及煤电容量电价机制，间接影响电力市场交易结构。容量补偿电价用户侧标准由0.0991元/千瓦时调整为0.0705元/千瓦时，影响工商业用户用电成本结构。文件未涉及储能系统、虚拟电厂（VPP）、V2G或电力现货交易机制的具体安排，不构成对上述业务领域的直接政策调整。
行动建议:
- 'A 趁早: 测算容量补偿电价调整后对工商业用电成本的影响,优化代理购电和市场化交易策略'
- 'B 研究: 关注煤电容量电价机制执行情况及考核规则,为后续可能延伸至其他电源类型的政策演进做好准备'
- 'B 研究: 跟踪国家关于应急备用煤电机组管理办法的后续出台,评估应急备用资源参与调峰的市场机会'
didi_impact_one_liner: 该文件聚焦煤电容量电价机制,容量补偿电价用户侧标准下调约29%至0.0705元/千瓦时,将降低工商业用电成本中的容量费用分摊,但未直接触及充电、储能或V2G等业务领域。
