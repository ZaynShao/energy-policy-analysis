影响分析:
  加油: 未直接涉及。该政策针对煤电机组容量电价机制，与加油（燃油/天然气零售）业务无直接关联。间接影响方面，煤电成本变化可能通过电价传导影响整体能源价格水平，但加油业务本身不在政策调整范围内。
  充电: 直接涉及。工商业用户按用电量比例分摊煤电容量电费，充电运营商作为工商业用户将承担容量电费分摊成本；同时分时电价政策（峰谷清算）要求充电运营商需关注峰谷电价套利机会。现行容量补偿电价用户侧标准从0.0991元调整至0.0705元，直接影响充电运营的电力成本结构。
  电力_储能_V2G_交易: 直接涉及。政策明确煤电容量电费纳入系统运行费用由工商业用户分摊，峰谷清算损益机制与储能峰谷套利、V2G反向放电的经济性直接相关。容量补偿电价调整（0.0991→0.0705元）将影响储能项目收益测算和虚拟电厂聚合商的容量收益预期。跨省跨区煤电机组容量电价执行规则对参与电力交易的电源侧主体有直接影响。
行动建议:
- A 趁早:充电运营商应测算容量电费分摊对运营成本的增量影响，将0.0705元/kWh的容量补偿电价纳入充电定价模型
- B 研究:储能投资方应重新评估峰谷套利空间，考虑容量电费分摊机制下储能项目全生命周期收益变化
- C 趁早:虚拟电厂聚合商应研究煤电容量电价机制下的灵活性资源调度价值，优化容量收益和辅助服务收益组合
didi_impact_one_liner: 煤电容量电价机制通过调整容量补偿电价至0.0705元/kWh和建立工商业用户分摊机制，将直接影响充电运营成本结构和储能项目经济性测算，需重新评估峰谷套利策略。
