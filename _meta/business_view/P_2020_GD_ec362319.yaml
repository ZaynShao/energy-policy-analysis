影响分析:
  加油: 直接涉及。22座加油站被注销成品油零售经营资格，其中21座因经营主体/投资主体/法人代表发生变化，1座因终止经营申请注销。涉及东莞、清远、江门、惠州、河源、陆丰、湛江、云浮、汕头、中山等13个地级市，包括中石化2座水上加油站、1座陆上加油站及中油深燃、中英石油等民营加油站。注销后相关加油站不得继续从事成品油零售经营。
  充电: 未直接涉及。通告仅涉及加油站成品油零售经营资格注销，未提及充电桩、充电站、新能源汽车充电设施等业务。
  电力_储能_V2G_交易: 未直接涉及。通告为纯成品油零售行政许可注销文件，不涉及储能、虚拟电厂、V2G、电力交易或反向充电等机制。
行动建议:
- '趁早: 排查公司旗下加油站是否存在经营主体、投资主体或法人代表变更情形，确保及时办理许可变更手续，避免被动注销风险'
- '趁早: 关注广东省能源局后续许可审批动态，掌握变更登记合规时限要求'
- '趁早: 梳理被注销加油站所在区域市场格局，研判潜在市场空白或竞争格局调整机会（间接）'
didi_impact_one_liner: 广东省集中注销22座加油站成品油零售经营资格，主要因经营主体变化导致许可注销，对公司加油站网络合规管理提出警示，需防范被动注销风险。
