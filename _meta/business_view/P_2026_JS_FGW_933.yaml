影响分析:
  加油: 未直接涉及。正文通篇为江苏省新能源汽车充换电设施建设财政奖补安排，未涉及批发价/炼厂装车价、油站安全与财税法合规成本、KA总部对外合作与支付接口口径，也未改变加油业务任何决策变量。间接观察(标记为间接):奖补明确向苏中苏北、乡村等薄弱地区上浮标准，与加油业务“下沉城市展业可行性”在空间上重叠，可作为下沉能源站点选址的参考信息，但正文未提油品，不构成加油业务的直接影响。
  充电: 直接且高相关，多项决策变量被改变。① 建桩节奏与选址：省财政一次性安排1.5亿元建设奖补，锁定支持范围为细则印发后至2026年底前新备案（审批）建设、且2027年10月底前建成投运的项目，等于给出明确的时间窗口，直接改变江苏项目的备案与建设排期；支持对象明确为城市和县（市、区）建成区、高速公路服务区及收费站、普通国省道沿线的大功率公共充换电设施、乡村地区公共充换电设施、居住小区“统建统服”（统一规划、统一建设、统一运维）充电设施，选址优先级随奖补目录变化。②
    大功率/超充升级的成本与合规门槛：按核算功率奖补，单枪最大输出功率1000千瓦及以上的兆瓦级设施100元/千瓦，250千瓦以上（不含250）且低于1000千瓦的80元/千瓦，核算取“同桩大功率充电枪功率总数”与“单桩（或单堆、单机）输出功率”两者最小值，柔性充电堆按同一充电堆所带大功率充电枪功率之和与该充电堆输出功率取小值——直接压低大功率/超充升级的单位成本，改变升级门槛测算。③
    区域结构：苏中苏北、乡村等薄弱地区奖补标准适当提高，乡村250千瓦以上设施在城市标准基础上增加10元/千瓦，资金安排比例按大功率:乡村:小区统建统服=6:3:1（可依申报情况调整），改变省内资源投放的地域与品类配比。④
    换电口径：独立配建变电设施（单独用电户号或独立受电点）按额定容量400元/千伏安奖补，未独立配建的通用型换电站按站不超过20万元，影响换电项目是否独立配变的投资决策。未直接涉及：正文未提充电服务费定价空间、场站侧电价结构（峰谷/需量/大工业电价）、行业标准与评级话语权。
  电力_储能_V2G_交易: 未直接涉及。正文仅围绕充换电设施建设的财政奖补，未出现储能、虚拟电厂（VPP）、V2G/反向充电/双向充电、电力交易、现货规则、中长期与现货比例、偏差考核、售电公司收益分成、火电长协或分布式新能源入市与聚合商准入等任何机制或表述。换电设施虽在奖补范围内，但正文只涉及建设端奖补核算，未涉及换电站参与电力市场、聚合或车网互动，不得据此推断交易或储能机会。
行动建议:
- A 趁早:对照奖补时间窗口（2026年底前新备案/审批、2027年10月底前建成投运）梳理江苏在手与拟投项目清单，趁早完成备案与开工排期，避免错过一次性建设补助。
- B 趁早:优先在苏中苏北、乡村及居住小区“统建统服”等标准上浮或政策倾斜的场景排布产能，并优先立项250千瓦以上、尤其单枪1000千瓦及以上的兆瓦级大功率设施，按100元/千瓦与80元/千瓦两档测算投资回收。
- C 研究:按细则核算口径做收益测算模型——大功率按“枪功率总数”与“单桩（或单堆、单机）输出功率”取小值、柔性充电堆按堆内枪功率之和与堆输出功率取小值；换电项目比选“独立配建变电按400元/千伏安”与“按站不超过20万元”两种路径，判断是否值得单独建受电点。
- D 研究:跟踪1.5亿元资金在6:3:1（大功率:乡村:小区统建统服）比例下依申报情况调整的实际口径，以及各设区市配套申报要求，形成申报节奏与材料准备的内部指引。
- E 研究:针对居住小区“统建统服”模式（统一规划、统一建设、统一运维）研究进场与运维主体安排，仅就细则已明确的建设与奖补口径展开，不预设正文未写的运营或交易安排。
didi_impact_one_liner: 江苏以1.5亿元省级财政奖补定向撬动大功率、乡村与小区统建统服三类充换电设施，充电业务迎来明确的项目时间窗口与单位成本下移，加油与电力（储能/VPP/V2G/交易）不受直接影响。
