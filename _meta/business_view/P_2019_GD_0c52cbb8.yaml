影响分析:
  加油: 未直接涉及。本政策聚焦电动汽车充电基础设施补贴，加油业务不在本文件调整范围内。
  充电: 直接利好。政策明确对海珠区2019-2021年度建成的非个人自用充电基础设施给予补贴，补贴标准按年份和类型分层：2019-2020年直流桩120-300元/千瓦、交流桩20-60元/千瓦、换电设施600-800元/千瓦；2021年直流桩100-125元/千瓦、交流桩15-25元/千瓦、换电设施500-600元/千瓦。申报门槛包括：须在海珠区行政区域范围内、接入羊城充监管平台、已建成总功率不少于2000千瓦、未获过其他财政补贴等。
  电力_储能_V2G_交易: 未直接涉及。政策针对充电基础设施建设运营补贴，未涉及储能装置、虚拟电厂、V2G机制或电力交易等业务领域。
行动建议:
- 'A 趁早: 符合申报条件的企业（总建成功率≥2000千瓦、充电设施已接入羊城充平台）应在2022年9月20日17:00截止日期前完成全套申报材料提交，逾期不予受理'
- 'B 研究: 尚未满足申报门槛（如功率不足2000千瓦）的市场主体，应研究加快充电设施建设进度以争取后续补贴政策窗口'
didi_impact_one_liner: 海珠区充电基础设施补贴政策对充电运营市场形成直接资金支持，符合条件的企业应把握申报窗口期。
