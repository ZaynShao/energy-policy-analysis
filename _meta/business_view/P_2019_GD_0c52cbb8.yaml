影响分析:
  加油: 未直接涉及。该政策聚焦电动汽车充电基础设施补贴，加油业务不在政策覆盖范围内。
  充电: 直接涉及。海珠区企业可申报2019-2021年度充电基础设施建设补贴，非个人自用充电基础设施（直流桩、交流桩、换电设施）符合条件可获资助。补贴标准按年份和类型分档：2019-2020年直流桩120-300元/千瓦、交流桩20-60元/千瓦、换电设施600-800元/千瓦；2021年直流桩100-125元/千瓦、交流桩15-25元/千瓦、换电设施500-600元/千瓦。申报门槛包括：需在海珠区行政区域范围内、提前办理建设项目登记、建成投运并通过验收、未获其他财政补贴、接入羊城充监管平台，且企业在广州市范围内已建成总功率不少于2000千瓦。
  电力_储能_V2G_交易: 未直接涉及。政策正文未提及储能、V2G、虚拟电厂、电力交易或绿电交易等内容。
行动建议:
- 'A 趁早: 符合申报条件的企业趁早核查自身项目是否符合补贴要求，于2022年9月20日17:00前完成申报材料提交，避免逾期不候'
- 'B 趁早: 充电运营企业趁早确认是否满足''已建成并正常营运总功率不少于2000千瓦''门槛，提前准备羊城充平台接入证明、竣工验收报告、CNAS资质合格报告等核心材料'
- 'C 研究: 关注后续批次政策窗口，鉴于本轮覆盖2019-2021年度，后续可能开放新周期申报，提前建立项目登记和合规建设流程'
didi_impact_one_liner: 海珠区充电运营商抓紧申报2019-2021年度建设补贴，单桩最高补300元/千瓦，需在截止日前备齐羊城充接入证明、CNAS验收报告等材料，总装机门槛2000千瓦。
