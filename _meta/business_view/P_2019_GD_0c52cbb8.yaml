影响分析:
  加油: 未直接涉及。该政策聚焦于电动汽车充电基础设施补贴申报，加油业务不在政策覆盖范围内。
  充电: 直接利好。（1）明确2019-2021年度充电基础设施建设项目可申请补贴，补贴标准为：2019-2020年直流桩120-300元/千瓦、交流桩20-60元/千瓦、换电设施600-800元/千瓦；2021年直流桩100-125元/千瓦、交流桩15-25元/千瓦、换电设施500-600元/千瓦。（2）申报条件包括：在海珠区行政区域范围内、非个人自用、已办理建设项目登记、建成投运通过验收、未获得过国家级/省级/市级财政补贴、接入羊城充监管平台、已建成总功率不少于2000千瓦。（3）申报截止时间为2022年9月20日17:00前。
  电力_储能_V2G_交易: 未直接涉及。政策仅针对充电基础设施建设和运营补贴，未涉及储能项目、虚拟电厂(VPP)、V2G、电力交易或反向充电等业务内容。
行动建议:
- A 趁早:对在海珠区持有2019-2021年间建成的充电设施企业，核查是否符合'未获得过国家级/省级/市级财政补贴'及'总功率不少于2000千瓦'的条件，满足条件者趁早准备申报材料赶在2022年9月20日截止前提交
- B 研究:关注后续批次补贴政策及广州市工信部门关于充电基础设施安全管理和建设运营管理的配套文件，确保合规建设运营以获取持续补贴支持
didi_impact_one_liner: 海珠区充电桩运营商若2019-2021年间建有项目且总功率达2000千瓦以上、尚未获其他财政补贴，可获直流桩100-300元/千瓦、交流桩15-60元/千瓦的补贴，需在2022年9月20日前申报。
