影响分析:
  加油: 未直接涉及。该政策聚焦电动汽车充电设施建设，加油业务不属本政策调整范围。但政策推动充电网络加速覆盖，间接加速新能源替代进程，建议关注加油+充电混合站转型趋势。
  充电: 直接利好。《行动方案》明确2027年建成2800万个充电设施、满足超8000万辆电动汽车充电需求的目标，带来充电基础设施大规模建设机遇。重点提及快充为主、慢充为辅、大功率充电为补充的城市公共充电网络建设，高速公路服务区点位加密，农村充电网络下沉延伸，以及居住区'统建统服'新模式试点。充电运营服务商面临设备升级、服务质量提升和场站运维规范化要求。
  电力_储能_V2G_交易: 直接涉及车网互动与V2G。政策明确车网互动'利用充换电设施将新能源汽车与供电网络相连，通过智能有序充电和双向充放电，发挥新能源汽车作为灵活性储能资源的调节潜力'，并部署车网互动规模化应用推广行动，扩大试点范围、探索市场化响应模式。配电网架优化和台区增容将强化电网承载能力。虚拟电厂和电力交易机制在正文中尚未具体涉及，属间接观察。
行动建议:
- 'A 趁早布局大功率充电桩投资: 政策明确重点城市、高速公路服务区加快大功率充电设施建设，公共充电设施平均功率将从45.5千瓦提升，相关投资窗口已开启'
- 'B 研究居住区统建统服模式: 政策推广''统建统服''建设新模式，既有居住区因地制宜补充充电设施，具备社区资源的运营商可提前研究参与路径'
- 'C 跟踪车网互动试点政策: 政策部署扩大车网互动试点范围、探索市场化响应模式，V2G相关技术储备和业务模式研究宜趁早启动，但需待具体试点规则明确'
