影响分析:
  加油: 直接涉及。本政策要求江苏省内所有成品油零售经营企业（含加油站/点）于2025年6月30日前完成2024年度监督检查，逾期可能面临整改或证书处置。企业须通过江苏省成品油管理服务平台线上提交税务凭证（进销存审计报告或购销代储纳税凭证）、营业执照、危化证、进货发票及供油协议等材料，并确保平台中企业名称/地址/法人/GPS数据与证照一致。对存在偷逃税、加油机作弊、重大安全隐患或被相关部门处罚的企业，不予年检通过。暂停经营未恢复的企业无需参加年检。
  充电: 未直接涉及。本政策针对成品汽油/柴油零售经营企业的年度监督检查，监管对象为加油（气）站，未提及新能源汽车充电桩、充换电站或充电运营平台等业务。
  电力_储能_V2G_交易: 未直接涉及。本政策监管范围为石油成品油流通环节（进/销/存/税务合规），不涉及电力交易、储能设施、虚拟电厂(VPP)、V2G或双向充电桩等电力业务，亦未涉及绿电交易或电力市场准入。
行动建议:
- 'A 趁早: 对照检查清单逐项梳理企业2024年度税务凭证、进货发票、供油协议、危化证及营业执照等原件，确保在平台提交前证照有效、数据一致，避免因材料缺失导致年检不通过'
- 'B 趁早: 在6月30日截止日前预留充足时间完成平台数据核对，重点校正企业名称、地址、法人代表及GPS坐标与证照的匹配性，防止基础信息错误引发后续整改'
- 'C 研究: 关注《江苏省成品油流通管理办法》关于脱检企业及有证无站清理的处置规定，评估本企业是否存在多年未检或证照与实际经营不符的情况，提前制定整改或歇业备案方案'
- 'D 研究: 核查企业电子台账制度执行情况，完善每日安全巡检和月度大检查记录，确保油品购销数据、出入库凭证及检验报告等档案完整备查，满足可追溯的合规要求'
didi_impact_one_liner: 江苏省2024年度加油零售企业年检全面启动，6月30日截止、平台化办理、税务与危化证合规成审查重点，脱检或证照不一致企业将面临清理整改。
