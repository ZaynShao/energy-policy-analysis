影响分析:
  加油: 未直接涉及。该方案聚焦电动汽车充电设施建设与车网互动，不涉及燃油车补给业务。
  充电: 直接利好。（1）目标明确：到2027年全国建成2800万个充电设施，满足超8000万辆电动汽车充电需求，充电服务能力翻倍；（2）公共充电提质：快充为主、大功率充电为补充，城市、高速公路、农村三层网络加密；（3）居住区攻坚：新建100%配建/预留，既有区因地制宜补充，推广统建统服模式；（4）车网互动试点扩大：智能有序充电、双向充放电探索市场化响应模式。
  电力_储能_V2G_交易: 直接涉及车网互动规模化应用。（1）明确V2G机制：新能源汽车与供电网络相连，双向充放电作为灵活性储能资源；（2）试点扩大：持续扩大车网互动试点范围，探索价格政策、市场化机制和应用场景；（3）市场化推进：构建协同推进和跟踪评价机制，探索市场化车网互动响应模式。充电桩向双向充放电功能升级要求隐含其中。
行动建议:
- A 趁早布局充电场站选址：紧盯城市快充需求热点及高速公路服务区加密机会，储备优质点位资源
- B 趁早对接居住区统建统服：与物业、开发商合作，承接新建及既有居住区充电设施建设运营
- C 趁早储备V2G技术能力：升级双向充放电桩，参与车网互动试点申报和技术标准预研
- D 研究峰谷套利与需求响应：基于车网互动市场化响应模式，探索充电+储能协同的商业模式
- E 研究农村充电网络：跟踪春节返乡保障及新能源汽车下乡政策，寻找县域市场切入点
didi_impact_one_liner: 充电业务迎来三年倍增政策红利，2800万充电设施目标驱动公共/居住区/农村三层网络建设，车网互动规模化应用加速V2G双向桩布局，充电运营需趁早卡位优质点位并储备V2G技术能力。
