影响分析:
  加油: 未直接涉及。政策聚焦充电设施建设，未涉及加油站或油气销售业务。间接观察：随着新能源汽车渗透率持续提升和充电网络加速覆盖，传统加油业务可能面临长期替代压力。
  充电: 直接涉及。《行动方案》明确部署五大专项行动，对充电业务形成系统性政策支持：①公共充电设施提质升级，明确重点城市和高速公路服务区加快大功率充电设施建设，加密点位布局；②居住区充电条件优化，推广'统建统服'建设新模式，简化居民充电桩报装申请；③车网互动规模化应用推广，扩大V2G试点范围；④供电能力改善，将充电设施接入需求纳入配电网规划；⑤运营服务质量提升，推动老旧设备升级改造，完善监测服务平台功能。政策目标为2027年全国建成2800万个充电设施，满足超8000万辆电动汽车充电需求。
  电力_储能_V2G_交易: 未直接涉及。正文提到'车网互动'作为新模式新业态，通过充换电设施将新能源汽车与供电网络相连，但未明确提及储能、电力交易、虚拟电厂(VPP)或V2G的具体机制、商业模式或准入政策。仅在'更加注重创新性'部分原则性提出扩大车网互动试点范围，在价格政策、市场化机制和应用场景等方面持续探索创新，未展开具体机制设计。间接观察：车网互动规模化应用可能为未来储能资源参与电网调节奠定基础，但当前阶段具体政策尚不明确。
行动建议:
- 'A 趁早: 布局大功率充电设施建设，优先在城市热点区域和高速公路服务区规划快充站点，对标2027年2800万充电设施目标抢占优质点位。'
- 'B 趁早: 切入居住区充电业务，积极参与''统建统服''模式试点，探索与物业、地产开发商合作的新路径，争取简化报装政策红利。'
- 'C 趁早: 研究车网互动(V2G)试点机会，关注扩大试点范围的政策信号，提前储备智能有序充电和双向充放电技术能力。'
- 'D 研究: 跟踪车网互动市场化响应模式的机制设计进展，探索价格政策、市场化机制和应用场景的创新方向，为未来参与电力辅助服务市场做准备。'
- 'E 研究: 关注配电网规划调整动向，将充电设施接入需求纳入电网改造规划，争取供电能力改善的政策支持。'
didi_impact_one_liner: 充电业务迎来政策窗口期：大功率快充网络建设、居住区'统建统服'、V2G试点扩大三大方向均获明确支持，建议趁早布局城市、高速公路服务区及居住区充电设施，并跟踪车网互动市场化机制进展。
