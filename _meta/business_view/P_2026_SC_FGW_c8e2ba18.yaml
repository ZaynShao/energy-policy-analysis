影响分析:
  加油: 直接涉及。本通知调整四川省三个价区汽、柴油最高零售价格，并明确成品油零售企业在不超过最高零售价前提下自主定价；批发实行最高批发价，供需双方可协商；符合资质的民营批发企业最高供应价按最高零售价扣减400元，且零售降价时需保持差价不小于400元；自2026年8月28日24时执行，并强调生产调运保供、价格监管与市场监测。加油业务需据此合规调整价格并关注监管要求。
  充电: 未直接涉及。
  电力_储能_V2G_交易: 未直接涉及。
行动建议:
- 趁早核对川发改价格〔2026〕355号附件所列三个价区的汽柴油最高零售价，于执行时点前完成各加油站点价格调整与公示。
- 趁早梳理现有批发和零售价差，特别是对民营批发企业的供应价格，确保扣减400元及市场降价时差价不少于400元的合规要求。
- 趁早与中石油、中石化等供应商沟通协商具体批发价格，优化采购成本，并加强价格执行情况的内部核查与监控。
- 趁早配合各级发展改革部门的价格监测与检查要求，完善价格变动记录和异常情况报告机制。
didi_impact_one_liner: 四川省成品油价格上调通知直接影响加油业务的价格合规与市场监测，充电和储能电力业务未受影响。
