影响分析:
  加油: 未直接涉及。该方案聚焦新型储能发展，虽涉及新能源消纳与能源清洁低碳转型，但未提及加油站、燃油或任何加油业务相关内容。
  充电: 未直接涉及。用户侧储能鼓励分时电价政策削峰填谷、参与辅助服务市场，存在间接联系（储能设施可服务充电负荷管理），但正文未明确提及充电桩、充换电站或新能源汽车充电基础设施。
  电力_储能_V2G_交易: 直接利好。政策明确到2025年新型储能装机达到260万千瓦左右，提出电源侧'新能源+储能'机制、电网侧储能纳入规划管理、用户侧储能参与辅助服务市场和需求侧响应等具体部署，为储能规模化发展提供明确方向和商业化路径。
行动建议:
- 趁早研究用户侧储能商业模式，充分利用分时电价政策设计工商业储能削峰填谷方案，挖掘辅助服务市场和需求响应参与机会。
- 趁早对接电网规划布局，关注关键电网节点（大规模新能源汇集区、负荷中心等）的储能项目需求，寻找电网侧储能项目合作空间。
- 趁早跟踪'新能源+储能'机制执行动态，提前布局光储一体化或共享储能服务能力，满足新建光伏项目配建储能的政策要求。
- 趁早布局储能技术合作资源，政策支持电化学储能、压缩空气储能等多元化技术发展，需提前锁定优质技术合作伙伴。
didi_impact_one_liner: 江苏'十四五'储能装机260万千瓦目标明确，电源侧配储、用户侧参与市场等机制为公司拓展储能业务提供直接政策支撑，需趁早布局工商业储能和光储一体化项目。
