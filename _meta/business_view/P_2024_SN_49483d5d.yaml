影响分析:
  加油: 未直接涉及。政策聚焦设备更新改造，虽提到老旧营运船舶报废更新，但主要是推动新能源清洁能源船舶发展，间接影响传统燃油船舶，但未明确加油业务相关支持或改造要求。
  充电: 直接涉及。正文明确提到支持使用8年（含）以上的充电设施更新改造，支持6年（含）以上车龄的新能源机场内作业车辆更新改造，以及城市轨道交通牵引供电系统更新改造，这些直接指向充电基础设施和电动车辆更新。
  电力_储能_V2G_交易: 直接涉及。正文明确支持老旧机场使用8年（含）以上的储能设施更新改造，以及城市轨道交通牵引供电系统升级改造；同时工业领域设备更新要求主要产品能效应达到标杆水平、用能设备能效均须达到节能水平（能效2级以上），涉及电力系统节能改造机会。
行动建议:
- A 趁早:对接省内老旧机场，承接充电设施和储能设施更新改造项目
- B 趁早:布局城市轨道交通牵引供电系统升级改造市场
- C 研究:跟进老旧营运船舶报废更新政策，探索新能源船舶配套服务机会
- D 研究:关注工业领域用能设备能效提升改造市场机会
didi_impact_one_liner: 充电设施和储能设施更新改造获直接政策支持，城市轨道交通供电系统升级和工业能效改造带来新市场机会。
