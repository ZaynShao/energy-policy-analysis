影响分析:
  加油: 未直接涉及。正文通篇为发电侧容量补偿与电力市场规则，未出现成品油批发价、炼厂装车价、加油站合规或 KA 合作相关条款。仅有一处谨慎的间接观察（间接）：可靠容量补偿电费由全体工商业用户用电量分摊，加油站用电若按工商业用户计量，站点电费存在被分摊抬升的可能，量级与执行口径需以省内分摊细则为准；不改变加油业务的批发折扣空间与展业判断。
  充电: 正文未直接提及充电业务，建桩节奏与选址、大功率/超充升级门槛、行业标准与评级均未涉及。有两处间接传导（间接）：一是补偿电费由全体工商业用户用电量分摊，充电场站作为工商业用户，场站侧购电成本结构会受影响，需重算服务费定价空间；二是正文明确“完善零售套餐价格形成机制、丰富零售套餐品种、合理优化套餐调整频次、扩大零售用户交易自由度”，场站购电的套餐选择空间与调整灵活性存在改善可能，但具体品种与准入以省内零售细则为准。
  电力_储能_V2G_交易: 直接相关且是主战场。①现货与中长期规则改变：中长期交易价格下限改为现货出清价格下限，《辽宁电力市场结算实施细则》中“现货全天统一结算点加权均价不高于燃煤基准电价1.5倍”条款不再执行，现货价格上限打开，直接影响目标省的现货报价与结算模型；②持仓结构：2027年底前取消强制中长期签约比例考核，煤电可自愿选择年度至月度合同电量按比例与现货价格联动（联动按370元/千瓦·年补偿，不联动按165元/千瓦·年、暂不执行运行成本补偿），中长期与现货比例及偏差考核的口径随之变化；③储能：电网侧独立新型储能电站纳入可靠容量补偿实施范围，自正式商运次月起执行，按年核定可靠容量，2027年度标准370元/千瓦·年（含税），同时储能电站充电电量需参与补偿电费分摊，收益模型需双向重算；④成本与合规：配套扣减机制（按未达调度指令或核定可靠容量的差额扣减）、运行成本调查、报价替换与市场力缓解措施，构成报价行为与成本申报的新约束；⑤省间外购电90%按省内年度中长期均价、10%按现货执行。V2G、虚拟电厂、分布式新能源入市与聚合商准入：正文未直接涉及。
行动建议:
- A 趁早:以辽宁为新样本,重算“中长期价格下限=现货出清下限、1.5倍燃煤基准价上限取消”后的现货价格区间与收益分布,更新现货报价与持仓模型,再判断该省进不进。
- A 趁早:把“全体工商业用户用电量+电网侧独立储能充电电量”两项分摊折算成度电成本,回填到充电场站的场站侧电价结构与服务费定价空间测算中。
- A 趁早:梳理2027年底前取消强制中长期签约比例考核的过渡窗口,对比“价格联动370元/千瓦·年+运行成本补偿”与“不联动165元/千瓦·年、无运行成本补偿”两条路径的收益差,形成煤电长协签约与持仓结构调整方案。
- B 研究:电网侧独立新型储能“纳入容量补偿(370元/千瓦·年)与充电电量参与分摊”的双向影响,出具储能项目收益模型与是否申报进入主体清单的判断。
- B 研究:报价替换机制、市场力缓解措施与发电侧成本调查细则对我方报价行为、成本申报的合规约束,形成报价合规红线清单。
- B 研究:零售套餐品种丰富、调整频次优化、交易自由度扩大对售电侧零售套餐设计与用户锁客的影响,评估红利向终端传导后的价差空间。
didi_impact_one_liner: 辽宁建立发电侧可靠容量补偿机制并放开现货价格上限、取消强制中长期签约考核,直接改写电力业务的现货报价与持仓结构,并把储能纳入补偿与分摊双向口径;加油未直接涉及,充电仅通过工商业分摊与零售套餐优化间接受影响。
