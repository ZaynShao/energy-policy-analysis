影响分析:
  加油: 未直接涉及。该细则是针对用电量较大的工业企业推进源网荷储一体化建设，加油站业务不在政策明确支持的重点领域（战略性新兴产业、轻纺、冶金、电子制造、装备制造、大数据中心等）范围内。
  充电: 未直接涉及。政策聚焦于工业企业的电源（光伏/风电）+储能+负荷一体化建设，充电基础设施（充电桩/充电站）未在正文中出现；虽涉及绿电消纳和储能配置，但未扩展至充电领域的市场准入、补贴或运营要求。
  电力_储能_V2G_交易: 直接涉及储能配置要求，间接涉及电力交易机会。第六条明确要求配置储能实现自发自用；第七条明确一体化项目作为同一主体接受统一调度，为参与电力系统运行提供依据；第十五条明确纳入可再生能源项目信息管理系统，为后续绿电交易提供数据支撑。但政策强调防逆流、不向大电网反送电，自发自用为主，V2G未在正文中出现。
行动建议:
- A 趁早:摸排河南工业企业集聚区域的潜在一体化项目机会，在试点名额窗口期（每市限5个）内锁定优质工业客户资源
- B 趁早:针对工业企业用能特性和绿电消纳需求，设计适配的储能系统方案，主动对接用电大户的储能配置需求
- C 研究:跟踪河南省后续出台的增量配电网类源网荷储一体化项目实施细则（征求意见稿同步公示），评估配电侧业务机会
- D 研究:关注河南省可再生能源项目信息管理系统的专项通道申请流程和绿电溯源机制，提前储备相关服务能力
didi_impact_one_liner: 河南试点每市5个工业企业源网荷储一体化，储能配置成刚性需求，自发自用防逆流机制锁定本地消纳，需趁早锁定试点名额
