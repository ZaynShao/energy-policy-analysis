影响分析:
  加油: 未直接涉及。政策聚焦风电、光伏等新能源开发利用，虽提及煤电与新能源优化组合，但未涉及加油站业务或油品销售领域。
  充电: 未直接涉及。政策强调分布式能源发展和终端用能新能源比重提升，虽与充电桩的电力来源间接相关，但未明确涉及充电桩建设运营或新能源汽车充电服务。
  电力_储能_V2G_交易: 直接涉及多项机制。储能方面：明确推动新型储能快速发展，研究储能成本回收机制；电力交易方面：明确支持新能源项目与用户开展直接交易，鼓励签订长期购售电协议，明确新能源电量可参与电力市场；绿色电力方面：明确开展绿色电力交易试点，建立绿色电力证书制度并加强与碳排放权市场衔接；调节能力方面：明确完善调峰调频电源补偿机制，推动抽水蓄能项目建设，深入挖掘需求响应潜力；配电网方面：明确提高配电网接入分布式新能源能力，发展有源配电网。但V2G未在正文中出现。
行动建议:
- A 趁早:研判储能项目的商业模式和成本回收路径，评估参与新型储能项目的可行性
- B 趁早:对接绿色电力交易试点和绿色电力证书制度，评估新能源电力直接交易的机会
- C 研究:密切跟踪新能源参与电力市场交易规则完善动向，提前布局购售电协议谈判能力
- D 趁早:对接分布式新能源接入政策，研究参与有源配电网改造或微电网项目的可能
didi_impact_one_liner: 新能源高质量发展实施方案明确推动储能快速发展、绿电交易试点和新能源直接交易，为公司电力业务（尤其是储能项目投资和新能源购售电）带来直接政策机遇，但充电业务和加油业务未获直接支持。
