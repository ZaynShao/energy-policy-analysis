  加油: 未直接涉及。政策聚焦新能源开发利用,未提及油气终端或加油场景。但光伏建筑一体化推进(间接)可能覆盖加油站罩棚等建筑光伏改造空间。
  充电: 未直接涉及。政策强调分布式新能源(光伏/风电)开发、消纳和电力系统调节,未明确提及充电桩、充换电网络或新能源汽车补能设施。
  电力_储能_V2G_交易: '**储能**:明确推动新型储能快速发展,研究储能成本回收机制,加大抽水蓄能项目建设力度,对储能行业形成直接政策利好。

    **绿电交易**:开展绿色电力交易试点,完善绿色电力证书制度并与碳市场衔接,为绿电消费提供制度保障。

    **电力市场**:支持新能源项目与用户直接交易、签订长期购售电协议,新能源可参与电力市场,推动市场机制完善。

    **V2G**:未直接涉及,正文未出现V2G、双向充电或反向充电机制表述。

    **虚拟电厂**:未直接涉及,正文虽提''源网荷储一体化''和''需求响应'',但未明确出现虚拟电厂(VPP)概念或聚合商机制。'
