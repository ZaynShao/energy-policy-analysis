- A 趁早:研究储能业务布局,政策已明确支持新型储能发展且研究成本回收机制,应优先评估电化学储能投资机会
- B 趁早:布局分布式光伏/风电项目获取,政策鼓励工商业分布式新能源和源网荷储一体化,存在增量市场空间
- C 研究:绿电交易规则和证书体系,政策完善绿电消费认证制度并与碳市场衔接,需提前准备参与绿电交易市场
- D 研究:配电网接入和调度能力提升带来的机遇,政策要求提高配电网智能化水平和接纳分布式新能源能力,关注电网改造相关需求
