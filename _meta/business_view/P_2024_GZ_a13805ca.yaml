影响分析:
  加油: 未直接涉及。该政策针对的是电力用户（含工商业、充换电设施、电储能）的电价机制，不涉及油品销售业务。加油站若为工商业用电户，仅作为普通电力用户受分时电价影响，非加油业务层面的直接规制。
  充电: 直接涉及。政策明确将电动汽车集中式充换电设施纳入峰谷分时电价实施范围，执行峰谷时段划分及浮动机制（峰上浮60%、谷下浮60%），且到2030年前对实行两部制电价的充换电设施免收需量（容量）电费。这意味着充电运营商的购电成本将与时段高度关联，谷时充电成本优势显著扩大，具备明显的套利空间。
  电力_储能_V2G_交易: 部分直接涉及。电储能用电明确执行峰谷分时电价，独立储能电站向电网送电的充电电量免担输配电价和政府性附加，为储能峰谷套利提供政策支撑。电力交易方面，政策建立了峰谷损益分摊机制，中长期市场交易用户须按峰平谷时段计量结算。但虚拟电厂（VPP）和V2G未在正文中出现，虚拟电厂聚合、车辆到网等机制不在本政策规制范围内。
行动建议:
- A 趁早:充电运营业务调整充电排班策略，将定价引导向谷时倾斜，利用峰谷价差60%的浮动空间优化收入结构
- A 趁早:储能业务研究峰谷套利模式，独立储能电站可充分受益于充电免输配电价的政策红利，提前布局储能调度策略
- B 研究:充电运营商需在2024年1月1日前完成分时计量装置改造，确保与电网峰平谷时段对齐，避免计量合规风险
- B 研究:跟踪政策动态调整机制，根据贵州省电力供需及新能源消纳情况预判峰谷时段划分可能的优化窗口
didi_impact_one_liner: 贵州峰谷分时电价扩大范围至充换电设施，储能获充电免输配优惠，谷时充电成本优势翻倍，充储联动运营存在显著套利窗口。
