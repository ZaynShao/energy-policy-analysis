影响分析:
  加油: 政策明确要求到2025年，国道、省道和城际快速公路沿线加油（气）站全部配建快速充电桩，单桩功率不低于60千瓦。加油站在满足安全条件下将同步建设快速充电桩，形成'加油+充电'混合服务模式。
  充电: 直接利好。政策量化了多场景充电桩配建比例：新建住宅预留比例由规划审批管控、公共机构不低于10-20%、产业园区不低于30%、4A级以上景区不低于15%、公共服务领域停车场不低于25%、大型公共建筑和社会停车场不低于15%，并要求各县（市、区）至少建成1座示范性集中式公用充电站。明确了2025年累计建成15万个充电桩的目标。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦充电基础设施建设和配套电网接入便利化（简化报装、就近接入），未提及储能、V2G、电力交易或虚拟电厂等机制。
行动建议:
- A 趁早:在加油站网点评估场址条件（安全间距、电力容量、空间布局），提前对接充电桩建设要求，布局加油+充电混合站改造方案。
- B 研究:跟进居民区充电桩配建比例的规划审批细则和验收标准，研判物业、业委会协调机制，为住宅充电桩建设提供合规路径。
- C 趁早:对接电网企业，了解集中式充换电站'就近接入'的流程和配套工程标准，预留电力容量接口。
- D 研究:针对公共服务领域（公交、环卫、物流、通勤）配建比例不低于25%的要求，研究集中式充换电站的选址和运营模式。
didi_impact_one_liner: 河南明确2025年充电桩达15万个，加油站全配快充桩，多场景配建比例量化，充电运营市场空间明确释放，加油站向综合能源站转型压力与机遇并存。
