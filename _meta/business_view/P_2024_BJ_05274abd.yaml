影响分析:
  加油: 未直接涉及。该政策聚焦绿电、绿证交易补贴，未涉及油品销售、加油站运营或燃油替代相关内容。
  充电: 未直接涉及。该政策针对绿电、绿证采购方补贴，要求企业100%使用绿电，但未直接规定充电设施建设、运营或充电服务费补贴。园区内有用电需求的充电相关企业可间接受益于绿电采购成本降低（间接）。
  电力_储能_V2G_交易: 直接涉及绿电交易补贴。政策明确对参与绿色电力交易、绿证交易的企业按使用量给予0.01元/千瓦时补贴，上限50万元/年。储能、V2G在正文中未出现，不涉及该业务。绿电交易属于电力交易范畴，补贴将降低企业绿电采购成本，激励绿电消费需求。
行动建议:
- 趁早对接园区管理机构：摸排园区内具有绿电采购意向的充电运营商或能源企业，协助其参与绿证或绿电交易，尽早锁定补贴资格
- 趁早研究100%绿电达标路径：政策要求企业年度实现100%使用绿电，协助目标企业规划绿电采购合同或绿证购买方案，满足申报门槛
- 趁早关注申报时间窗口：政策规定每年1月发布申报通知后一个月内申报，提前准备营业执照、绿电交易凭证等材料，避免逾期
didi_impact_one_liner: 延庆园区绿电交易补贴政策为具有100%绿电消纳能力的企业提供0.01元/千瓦时（上限50万元/年）的采购成本补贴，间接利好园区内充电运营等用电企业参与绿电市场。
