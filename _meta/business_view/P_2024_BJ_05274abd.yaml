影响分析:
  加油: 未直接涉及。该政策针对绿电、绿证交易补贴，加油业务不在补贴范围内，正文未提及加油站或燃油相关企业的绿电替代或交易内容。
  充电: 间接影响。充电运营企业在延庆园内若通过绿电交易实现100%绿色供电，可申请本项补贴降低成本；但补贴条件明确要求申报主体年度使用绿电量，充电企业需先完成100%绿电替代才具备资格。
  电力_储能_V2G_交易: 直接涉及。政策核心即支持绿电交易和绿证交易，对符合条件的储能企业在延庆园的绿电采购给予0.01元/千瓦时的补贴（上限50万元/年），实质降低了储能项目绿电采购成本，激励园区内储能配套风光等可再生能源的消纳。虚拟电厂、V2G在正文中未出现，不适用。
行动建议:
- A 趁早:对公充电运营商趁早对接延庆园科信局，确认绿电采购路径与100%替代的技术方案，争取纳入首批补贴名单。
- B 研究:储能投资方趁早研究在延庆园配套可再生能源+储能的组合模式，利用0.01元/千瓦时补贴降低度电成本。
- C 趁早:有意拓展延庆市场的综合能源服务商趁早布局绿电代理购电业务，帮助园区企业满足申报条件中的交易凭证要求。
- D 研究:绿证交易服务商趁早关注延庆园绿证需求量增长机会，提前储备合规绿证资源。
didi_impact_one_liner: 延庆园绿电绿证补贴政策为园区内充电和储能企业的绿色电力采购提供0.01元/千瓦时的成本支持，上限50万元，充电运营商和储能项目可借此降低绿电替代成本。
