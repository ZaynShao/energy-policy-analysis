影响分析:
  加油: 未直接涉及。政策聚焦可再生能源绿证核发与交易制度，加油业务未被提及；但绿证制度属于绿色低碳环境价值体系组成部分，体现能源绿色转型方向（间接）。
  充电: 直接涉及。政策明确绿证是可再生能源电力消费凭证，充电使用可再生能源电力可获绿证；分散式风电和分布式光伏发电项目核发可交易绿证，充电运营商可参与绿电绿证交易。
  电力_储能_V2G_交易: 未直接涉及。政策虽明确绿证可交易、发电企业和用户可参与绿证交易，但未具体规定储能、绿电交易、V2G、虚拟电厂或聚合商的参与机制。
行动建议:
- A 趁早:研究绿证交易机制，结合充电业务布局绿色电力消费凭证应用
- B 研究:跟踪分散式风电和分布式光伏项目绿证核发进展，探索与上游可再生能源发电项目合作模式
- C 趁早:梳理现有充电场站可再生能源电力使用比例，为未来绿电消费认证做准备
- D 研究:关注政策动态，等待储能参与绿电交易的细化规则出台
didi_impact_one_liner: 充电业务受益于绿证制度成为可再生能源消费凭证，可探索绿电交易机会；加油业务面临长期能源转型压力；储能/V2G/电力交易暂未直接涉及。
