影响分析:
  加油: 直接涉及。省级商务厅将成品油零售经营资格审批（含加油船）下放至市县级，加油站和岸基加油点的规划确认权限归市级，审批层级显著降低。加油业务准入流程从省级收口转为市县层级受理，准入通道拓宽但监管主体下移。
  充电: 未直接涉及。该政策明确针对石油成品油流通管理，未涉及充电基础设施审批事项，充电站/桩业务不受本文件调整影响。
  电力_储能_V2G_交易: 未直接涉及。正文仅涉及传统石油成品油零售审批层级调整，未涉及储能、虚拟电厂、V2G或电力交易等机制或业态。
行动建议:
- '趁早: 重新评估在营及规划加油站的选址与开业节奏，审批层级下放后市县受理效率可能提升，趁机加快项目推进'
- '趁早: 及时调整省级商务厅窗口业务办理策略，新增市县两级对接渠道，趁机建立与属地审批部门的常态化沟通'
- '研究: 深入分析加油船审批县级权限变化对水上加油业务布局的影响，研究差异化审批应对方案'
didi_impact_one_liner: 省级加油业务准入权限下放至市县，加油网络布局审批通道拓宽但监管主体下移，需重新对接属地商务审批体系
