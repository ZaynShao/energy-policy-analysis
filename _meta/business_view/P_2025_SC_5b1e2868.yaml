影响分析:
  加油: 未直接涉及。该方案为电力市场交易总体方案，聚焦电力批发交易主体和市场机制，加油业务不属于方案规范范围。
  充电: 直接涉及。方案明确将电动汽车充（换）电设施列为新型经营主体，须在四川电力交易中心完成市场注册，需具备分时计量能力满足电力市场计量和结算要求；有放电能力的设施须与电网企业签订负荷确认协议并接入新型电力负荷管理系统。这为充电运营商参与电力市场提供了制度框架。
  电力_储能_V2G_交易: 直接涉及三个细分领域。（1）储能：方案明确新型储能为新型经营主体，区分用户侧储能和独立储能电站两类，均须具备独立分时计量、控制等技术条件，接入电力调度自动化系统；（2）虚拟电厂：方案将其与负荷聚合商并列列为新型经营主体，须具备独立分时计量、控制能力，与电网签订负荷确认协议或并网调度协议，接入系统并能聚合可调节负荷及分布式电源、新型储能等资源；（3）V2G机制：有放电能力的电动汽车充电设施须与电网签订负荷确认协议接入管理系统，隐含了放电/反向供电机制。
行动建议:
- 趁早研究充电设施参与电力市场注册的技术条件和分时计量改造方案，特别是有放电能力设施的负荷确认协议签署流程
- 趁早布局储能项目时对接入调度自动化系统的技术要求，确保满足独立分时计量、控制等注册条件
- 趁早研究虚拟电厂聚合可调节负荷、分布式电源、新型储能等资源的运营模式，为参与四川电力市场做准备
- 趁早研究用户侧新型储能通过售电公司或负荷聚合商参与电力批发的路径
- 研究绿电交易机制，研究绿电消费对业务组合的价值贡献
- 研究常规直购交易、保障性用电市场化交易等交易品种，结合用能结构寻找市场化交易参与机会
didi_impact_one_liner: 四川2026年电力市场方案为充电、储能和虚拟电厂打开了参与电力批发市场的制度通道，具备放电能力的充电设施和满足技术条件的储能项目可作为新型经营主体在四川电力交易中心注册入市。
