影响分析:
  加油: 未直接涉及。全文为辽宁省2027年新能源增量项目机制电价竞价规则，未涉及成品油批发价/炼厂装车价、商户合规成本、KA总部对外合作与支付口径或下沉城市展业，无正文依据的传导链条。
  充电: 未直接涉及。竞价主体与参数均指向集中式/分散式风电、集中式/分布式光伏（含自然人户用分布式光伏），未提及建桩节奏与选址、充电服务费定价空间、场站侧峰谷/需量电价结构、大功率超充成本与合规、行业标准与评级；V2G、车网互动、高速服务区、县域场景亦未出现。间接观察（仅为间接）：分布式光伏机制电量按全部上网电量80%申报，或影响含屋顶光伏场站的收益测算，但正文未写充电业务，不构成直接影响。
  电力_储能_V2G_交易: 直接相关（电力交易侧）。辽宁2027年新能源增量项目机制电价竞价：纳入机制电量总规模53.08亿千瓦时（风电39.56、光伏13.52），竞价上限0.3元/千瓦时、下限0.18元/千瓦时，执行期12年，以差价协议锁定；集中式申报电量上限为全部上网电量60%、分布式80%；配履约保函、未中标且晚于中标项目申报时间并逾期6个月并网者取消未来三年竞价资格。该机制电价是本省增量新能源的结算参照，直接影响对该省现货价格中枢与新能源供给曲线的判断（即‘这个省进不进’与持仓/报价假设），但正文未涉及售电公司利润上限、收益分成、让利退还，也未涉及中长期与现货比例及偏差/反向考核上限。聚合商准入维度：正文明确‘本次竞价，暂不考虑分布式光伏项目聚合后参与竞价’，即本轮聚合入市未开闸，不得读成准入放开。储能、V2G、虚拟电厂、双向充电：未直接涉及，正文无等价明确机制。
行动建议:
- A 趁早：以辽宁53.08亿千瓦时机制电量、0.18–0.3元/千瓦时上下限、12年执行期这组参数，更新本省新能源供给与现货价格中枢假设，复核该省‘进不进’的判断口径与持仓结构。
- B 趁早：盯住省电力公司按通知3个工作日内发布的竞价公告、资料与差价协议模板及最终竞价结果，把‘分布式光伏聚合本轮不参与’记为聚合准入门槛的观察点，跟踪后续是否调整。
- C 研究：就履约保函开具与退还规则、未中标三年取消竞价资格等约束，研究其对新能源主体中长期与现货报价行为的影响，从而评估本省偏差与反向考核环境变化；仅作研究，不新增业务动作。
