影响分析:
  加油: 未直接涉及。该政策聚焦于可再生能源发电企业的绿证核发、交易机制及绿证收益归属问题，不涉及油气业务领域。
  充电: 间接涉及。绿证具有认证绿色电力消费的基础性作用，充电服务提供商如参与绿电交易购买绿证，可支撑绿色电力消费认证；但政策未明确充电桩或新能源汽车为直接应用场景。
  电力_储能_V2G_交易: 直接涉及。政策明确依托北京电力交易中心、广州电力交易中心、内蒙古电力交易中心开展绿电交易业务，可再生能源发电企业可选择直接参与绿电交易并同步转让绿证，或参与电力市场交易单独出售绿证；绿证在核算可再生能源电力消费量及衔接碳市场方面具有基础性作用。
行动建议:
- 'A 趁早: 布局绿电交易渠道，与北京/广州/内蒙古电力交易中心建立联系，为后续参与绿电交易和绿证交易做好渠道储备'
- 'B 研究: 深入研究绿证在碳市场衔接中的机制设计，评估储能项目参与绿证交易所能获得的绿色价值收益路径'
- 'C 趁早: 关注补贴项目与无补贴项目绿证收益归属的差异，在业务规划中区分项目类型对绿证收益的影响'
didi_impact_one_liner: 绿电交易平台体系已明确，储能/电力交易主体可依托三大交易中心直接参与绿电交易并转让绿证，绿证在碳市场衔接中具有基础性作用
