影响分析:
  加油: 未直接涉及。政策聚焦新能源发电(风/光/水)消纳与电网调度，不涉及成品油业务。
  充电: 未直接涉及。政策核心是新能源发电侧消纳与输电侧调控，虽涉及配电网开放(分布式新能源接网)，但未专门涉及充电桩建设或新能源汽车充电服务。
  电力_储能_V2G_交易: 直接涉及电力交易机制。政策明确要求健全电力市场促进新能源消纳机制，推动跨省跨区新能源交易更加顺畅，到2035年全国统一电力市场在新能源资源配置中发挥基础作用。储能/V2G在正文中未出现，不作展开。
行动建议:
- A 趁早:布局跨省区绿色电力交易通道，跟踪全国统一电力市场中新能源现货与中长期交易规则制定动向
- B 趁早:在分布式新能源接网可开放容量释放政策下，重新评估配电侧负荷聚合和购电协议(PPA)业务机会
- C 研究:梳理现有分布式新能源项目的自调节能力短板，对接修订后的接网承载力评估标准
didi_impact_one_liner: 政策强化跨省区新能源交易与统一电力市场，利好绿电交易和配电侧负荷聚合，需趁早布局跨区购电和分布式接网容量业务
