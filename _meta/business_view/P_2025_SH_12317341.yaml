影响分析:
  加油: 直接利好。报废更新补贴覆盖2.0升及以下排量燃油乘用车，补贴比例10%（最高1.5万元），置换更新补贴比例6%（最高1.3万元）。政策明确要求旧车须于2025年1月8日前登记在申请人名下，预计在2026年1-2月形成集中换购高峰。新能源补贴比例（报废12%、置换8%）高于燃油车（报废10%、置换6%），体现补贴差异化引导。
  充电: 间接利好。新能源乘用车报废更新补贴比例（12%）高于置换更新（8%），且报废更新补贴上限（2万元）高于置换更新（1.5万元），政策引导报废老旧新能源车并购买新车，将带动新能源汽车新车销量增长，间接扩大充电服务市场增量。（间接）
  电力_储能_V2G_交易: 未直接涉及。政策聚焦于汽车报废更新和置换更新的补贴发放，未涉及虚拟电厂、储能、V2G或电力交易机制。
行动建议:
- 趁早:与沪上汽车经销商集团建立以旧换新合作通道，将加油业务客户转化为置换更新补贴申请的服务入口
- 趁早:监测政策实施细则发布动态，结合报废更新与置换更新的差异化补贴比例，调整区域新能源车与燃油车销售激励配比
- 趁早:在加油站点增设新能源车购置咨询服务触点，把握政策带来的客户需求迁移机遇
