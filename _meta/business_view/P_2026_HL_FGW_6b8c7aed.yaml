影响分析:
  加油: 直接相关。黑龙江省发改委与市场监管局公布2026年11月—2027年4月南、北区吨升折算系数（E92汽油南区1310.72、北区1304.33；E95汽油1297.10/1290.09；0号柴油1183.36/1179.29；-35号柴油1186.62/1184.03），自2026年11月1日零时执行，并要求成品油经营企业严格执行、不得违反价格政策损害消费者权益。这直接改变本省加油业务的两个在做的数：一是吨价与升价的换算基准（批发、装车、结算环节的折扣空间折算），二是价格标识与结算合规口径，冬季-35号柴油单列意味着季节品号切换需对应换系数。同时文件明确发改、市场监管部门加强价格监测与监督检查、严厉打击价格违法违规，意味着省内站点的价格公示与促销合规检查强度上升。未涉及KA总部合作、支付接口与下沉城市展业口径。
  充电: 未直接涉及。文件对象仅为成品油吨升折算系数与成品油价格监管，未提及充电桩、充电服务费、场站电价或超充标准。间接观察（间接）：省级价格监管部门在同一时期加强价格监督检查的力度，可能带来同区域充电服务费明码标价的检查趋严，但正文无任何充电相关要求，不构成行动依据。
  电力_储能_V2G_交易: 未直接涉及。文件未出现电力交易、现货、中长期、储能、虚拟电厂、聚合商或V2G、双向充电等内容，不改变售电与电力交易的任何决策变量。
行动建议:
- A 趁早：把黑龙江南区/北区四类品号的新吨升折算系数（E92、E95、0号、-35号）在2026年11月1日前更新到省内站点价格标识、结算与进销存换算口径，核对吨价与升价的换算一致性。
- B 趁早：按新系数复核黑龙江冬季品号（-35号柴油）切换后的折扣空间与毛利测算，避免沿用上一年度系数造成结算偏差。
- C 趁早：对省内站点开展一次价格公示与促销口径自查，配合发改、市场监管的价格监测与监督检查要求，留存执行与问题上报路径。
- D 研究：跟踪本省下一期（2027年5月起）系数公布节奏与南北区差异，形成系数更新的例行更新机制。
didi_impact_one_liner: 黑龙江成品油吨升折算系数更新，仅直接改变加油业务在本省的吨升换算与价格合规口径，充电与电力两条线未涉及。
