影响分析:
  加油: 直接涉及。规划明确惠民县加油站总量控制在100座（现状80座+新建20座），近期16座、远期4座。对现状加油站原则保留，远期引入退出机制。规划纳入国土空间规划，落实土地供应，强化商务、自然资源、应急管理等部门联合审批监管。加油站建设须满足《山东省成品油零售经营资格管理暂行规定》站间距要求和《山东省建设用地控制标准》用地要求。
  充电: 未直接涉及。充电业务已从本规划分离——原《惠民县县域加油加气充电站专项规划（2021-2035年）》拆分后，充电相关内容另行处理。本规划虽提及'统筹传统加油服务与新能源补给设施融合发展'，但未明确充电桩具体布局、数量指标、建设要求或监管规定。
  电力_储能_V2G_交易: 未直接涉及。本规划为纯加油站专项规划，正文未出现储能、V2G、虚拟电厂、电力交易、聚合商、需求响应等相关机制或业务。
行动建议:
- A 趁早:研判县域新建加油站选址机会，对照规划站间距要求和用地条件，评估现有场地改扩建或新布点可行性
- B 趁早:对接商务、自然资源部门，提前介入规划加油站选址论证程序，争取纳入国土空间规划落地
- C 研究:跟踪本规划退出机制细则，摸底远期拟清理加油站资产状况，评估接手或承接其客户资源的可能性
- D 关注:留意充电专项规划另行编制动态，充电业务影响不在本规划范围内，需另案跟踪
didi_impact_one_liner: 本规划为惠民县加油站专项规划，加油业务受总量管控和准入监管直接影响；充电业务已分离至另行规划；电力储能V2G交易未涉及。
