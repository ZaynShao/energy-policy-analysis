影响分析:
  加油: 直接涉及。规划明确全县加油站总量控制在100座（现状80座+新建20座），现状加油站原则保留但需满足安全间距和车行距离规范，远期引入退出机制；新建加油站须满足《山东省建设用地控制标准（2024年版）》和国土空间规划用地性质要求；规划实施须经商务、自然资源、应急管理等部门联合审批。
  充电: 未直接涉及。原综合规划中的充电站部分已拆分由其他部门单独编制，本专项规划聚焦加油站布局，未涵盖充电设施规划内容。
  电力_储能_V2G_交易: 未直接涉及。本规划为加油站专项规划，主要规范成品油零售网络，未涉及储能设施、虚拟电厂、V2G或电力交易机制。
行动建议:
- A 趁早对照《汽车加油加气加氢站技术标准》和《山东省建设用地控制标准（2024年版）》，排查现有站点站间距、安全间距合规风险，纳入近期整改计划
- B 趁早对接商务、自然资源部门，提前锁定规划新建站点用地指标，确保16座近期规划站点纳入国土空间规划落地
- C 研究建立远期退出机制下的加油站资产处置预案，评估服务年限较长或经营状况不佳站点的退出成本
- D 趁早完善安全间距和车行距离的合规档案，为联合审批和联合执法检查备齐材料
