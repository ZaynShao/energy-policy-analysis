影响分析:
  加油: 未直接涉及。该实施意见聚焦新能源汽车与电网融合,加油业务(燃油车加油)不在政策调整范围内,加油站在该政策中未被提及为直接或间接调整对象。
  充电: 直接涉及。政策明确推动智能有序充电,要求2025年私人充电桩充电电量80%以上集中在低谷时段;部署充电峰谷电价机制全面实施并持续优化;明确车网互动主要包括智能有序充电、双向充放电等形式,并将充电桩充电电量结构列为试点示范核心考核指标。
  电力_储能_V2G_交易: 直接涉及。政策首次设定量化目标——2030年力争为电力系统提供千万千瓦级双向灵活性调节能力;明确推动新能源汽车作为移动式电化学储能资源参与削峰填谷、虚拟电厂、聚合交易等应用场景;要求培育车网融合互动新型产业生态,完善市场机制建设。双向充放电(V2G)作为核心技术路径被明确提出。
行动建议:
- A 趁早研究:充电业务团队趁早研究智能有序充电与双向充放电(V2G)技术标准,跟进充电峰谷电价机制动态,提前布局满足低谷时段充电比例考核要求的基础设施改造路径
- B 趁早研究:充电业务团队趁早探索V2G模式下的充放电桩改造与运营,提前设计双向充放电定价机制和用户激励机制,把握2025年试点示范窗口期
- C 研究:电力与储能业务团队趁早研究V2G参与虚拟电厂、聚合交易的商业模式与聚合调控技术方案,跟进市场机制建设进展
didi_impact_one_liner: 政策明确推动新能源汽车成为储能体系重要组成,充电业务面临有序充电和V2G技术改造要求,电力交易和聚合业务获得千万千瓦级灵活性调节市场空间
