影响分析:
  加油: 未直接涉及。该政策聚焦新能源汽车与电网融合互动，主要针对充电/放电设施与供电网络的双向能量互动，加油业务不在正文论述范围内。
  充电: 直接涉及且影响显著。正文明确推动智能有序充电、实施充电峰谷电价机制，设定2025年试点城市充电电量60%以上集中在低谷时段、私人充电桩80%在低谷时段的目标，充电运营需适应有序充电调节和V2G放电模式带来的运营变化。
  电力_储能_V2G_交易: 直接涉及且影响核心。正文将新能源汽车定位为可控负荷和移动式电化学储能资源，明确双向充放电（V2G）机制，提出2030年形成千万千瓦级双向灵活性调节能力的目标，覆盖削峰填谷、虚拟电厂、聚合交易等应用场景，为储能资源和电力交易带来增量市场空间。
行动建议:
- 'A 趁早: 充电运营业务趁早调整峰谷分时定价策略，匹配政策引导的低谷充电时段目标，挖掘低谷时段充电需求市场'
- 'A 趁早: 充电运营趁早布局智能有序充电和V2G放电功能的技术储备，适应车网互动新型运营模式'
- 'B 研究: 电力与储能业务趁早研究新能源汽车作为移动储能资源的聚合参与机制，布局虚拟电厂和聚合交易业务场景'
- 'B 研究: 技术研发趁早跟进高循环寿命电池（3000次以上）和双向充放电桩技术标准预研'
didi_impact_one_liner: 该V2G政策为充电业务带来峰谷电价优化和智能有序充电改造需求，为电力储能业务开辟新能源汽车移动储能资源聚合的市场机会。
