影响分析:
  加油: 未直接涉及。政策聚焦电力市场体系建设，未涉及油气零售或燃油销售业务。
  充电: 直接涉及：政策明确提出到2025年初步建成全国统一电力市场，绿色电力交易规模显著提高，有利于新能源、储能等发展的市场交易和价格机制初步形成。充电运营商作为新能源消纳的重要环节，将间接受益于统一电力市场的价格机制和市场交易规则完善。
  电力_储能_V2G_交易: 直接涉及：政策目标到2025年形成有利于新能源、储能等发展的市场交易和价格机制；到2030年新能源全面参与市场交易。明确提到要完善多层次统一电力市场体系，包括国家电力市场（北京、广州交易中心）、区域市场和省级市场，为储能和电力交易提供制度基础。V2G未在正文中明确出现。
行动建议:
- 'A 趁早: 跟踪北京、广州电力交易中心跨省跨区交易机制进展，探索参与绿色电力交易渠道'
- 'B 研究: 深入研究储能参与市场交易和价格机制的政策走向，提前布局储能资产的市场化运营模式'
- 'C 趁早: 关注省（区、市）/区域电力市场建设动态，在核心区域市场完成准入准备'
didi_impact_one_liner: 统一电力市场体系建设为新能源充电业务提供更完善的价格机制和市场环境，储能参与电力交易的市场化路径逐步清晰。
