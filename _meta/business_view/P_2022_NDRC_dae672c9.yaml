影响分析:
  加油: 未直接涉及。该政策聚焦电力市场体系建设，未涉及石油或成品油相关业务。
  充电: 未直接涉及。政策虽涉及电力市场整体架构，但正文未明确提及充电桩、充换电基础设施或新能源汽车充电相关机制。
  电力_储能_V2G_交易: 直接涉及：政策明确提出到2025年初步建成全国统一电力市场，并形成'有利于新能源、储能等发展的市场交易和价格机制'；到2030年实现'新能源全面参与市场交易'。储能领域将受益于市场交易和价格机制的完善，获得更明确的市场准入和盈利路径。间接：跨省跨区资源市场化配置和绿电交易规模提升，客观上有利于储能资源优化配置和价值实现。
行动建议:
- 趁早研究储能参与电力市场的准入条件与交易规则，为市场机制成熟后快速切入做好准备。
- 趁早对接区域电力市场建设试点，布局储能资源参与调频、备用等辅助服务市场的业务机会。
- 趁早跟踪绿电交易机制完善动向，提前规划储能项目与绿色电力消费的协同模式。
didi_impact_one_liner: 储能业务受益于全国统一电力市场体系建设推进，市场交易和价格机制将趋于完善，为储能资源化运营创造条件。
