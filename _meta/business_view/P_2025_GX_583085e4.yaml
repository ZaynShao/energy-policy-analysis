影响分析:
  加油: 未直接涉及。该政策聚焦于新能源（风电、光伏）上网电价市场化改革，与加油站业务无关联。
  充电: 未直接涉及。政策主要规范新能源发电侧上网电价形成机制，未直接涉及充电服务或充换电设施运营。
  电力_储能_V2G_交易: 未直接涉及。政策虽涉及电力市场交易和绿色电力交易，但明确针对新能源发电项目上网电价改革，未直接规定储能、V2G或虚拟电厂的准入、交易或价格机制。（间接）绿色电力交易规则完善可能为未来相关主体参与绿电交易提供框架参考，但具体参与方式和条件待交易规则明确。
行动建议:
- A 趁早研判:密切跟踪自治区电力交易主管部门后续出台的交易规则，关注分布式新能源、海上风电项目全量入市后的市场供需变化和价格走势。
- B 研究:关注新能源可持续发展价格结算机制的具体参数（机制电量规模、机制电价水平、执行期限）确定进展，评估对存量新能源项目收益的影响。
- C 趁早布局:关注绿色电力交易政策执行细节，在交易规则明确后评估绿电交易（含绿证）的潜在机会。
didi_impact_one_liner: 该政策核心规范新能源发电侧上网电价市场化，对公司加油、充电、电力储能V2G交易三项业务均未形成直接业务影响，仅新能源全面入市和绿电交易规则完善可能产生间接参考意义。
