  充电: 未直接涉及。正文中的汽车报废更新、置换更新补贴均止于车辆补贴资金拨付，未出现充电桩建设、选址、充电服务费、场站电价、大功率或超充、行业标准等任何条款，因此不改变充电业务的决策变量。间接观察：若以旧换新带动本地新能源车保有量增长，可能间接影响充电需求，但本文未写新能源车、充电设施或充电量口径，不构成建桩节奏或定价依据。
  电力_储能_V2G_交易: 未直接涉及。正文仅列示汽车、家电、数码智能产品、消费品四类以旧换新补贴的资金来源与拨付金额，包括节能降碳减排专项资金11194.761016万元、超长期特别国债42781.92008万元；未出现售电、现货规则、中长期持仓、偏差考核、分布式新能源入市或聚合商准入等条款，也未出现储能、V2G、虚拟电厂或电力交易等任何机制，不改变电力业务的任何决策变量。
