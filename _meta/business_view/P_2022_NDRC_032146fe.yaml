  电力_储能_V2G_交易: 直接涉及：政策明确新型储能是构建新型电力系统的重要技术和基础装备，提出到2025年新型储能由商业化初期步入规模化发展阶段，电化学储能系统成本降低30%以上；到2030年新型储能全面市场化发展，与电力系统各环节深度融合。政策要求突破电化学储能系统安全预警、高效灭火等安全技术，研究退役电池梯次利用。政策明确新型储能独立市场地位，完善市场化交易机制。涉及技术方向：钠离子电池、新型锂离子电池、液流电池、压缩空气储能、氢（氨）储能、热（冷）储能等。注：政策正文未出现V2G、虚拟电厂（VPP）、聚合商等具体机制描述。
行动建议:
- A 趁早:布局电化学储能供应链，瞄准钠离子电池、液流电池等多元储能技术路线，跟踪储能系统成本下降趋势
- A 趁早:对接新型储能独立市场地位政策动向，研究储能参与电力市场化交易的合规路径
- B 研究:跟踪储能电池循环寿命快速检测和退役电池梯次利用技术规范，提前布局电池健康管理业务
