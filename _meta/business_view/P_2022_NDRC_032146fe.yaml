影响分析:
  加油: 未直接涉及。政策聚焦新型储能技术研发、规模化发展和市场化机制建设，未提及加油业务或传统油气能源补给场景。
  充电: 直接利好。政策明确新型储能是构建新型电力系统的重要技术基础，可为充电基础设施提供稳定电力支撑和负荷调节；到2025年电化学储能系统成本降低30%以上的目标，有望降低充电运营商的用电成本和配套储能投入。
  电力_储能_V2G_交易: 直接利好。政策明确到2025年新型储能步入规模化发展阶段并具备大规模商业化应用条件；2030年实现全面市场化发展，与电力系统各环节深度融合；技术创新重点涵盖钠离子电池、液流电池、压缩空气储能、氢储能等多技术路线；明确新型储能独立市场地位，将完善市场化交易机制和配套市场规则，为储能参与电力交易提供政策依据。V2G虽未在正文中明确提及，但储能系统成本下降和独立市场地位确立为V2G发展提供了基础条件。
行动建议:
- 'A 趁早: 研究储能技术与充电业务的融合场景，如光储充一体化、储能缓解充电负荷峰谷差等商业模式'
- 'B 趁早: 关注储能成本下降趋势，提前规划充电场站配套储能设施的可行性方案'
- 'C 研究: 密切跟踪储能独立市场地位相关的交易品种和市场规则制定进展，评估参与电力辅助服务市场的机会'
- 'D 研究: 关注钠离子电池、液流电池等新技术路线成熟度，评估其在特定应用场景的替代优势'
didi_impact_one_liner: 政策明确储能独立市场地位并设定成本下降目标，直接利好充电业务降本和储能产业发展，为公司探索储充结合及电力交易业务奠定政策基础。
