影响分析:
  加油: 未直接涉及。政策聚焦柴油货车淘汰更新为新能源车，间接可能减少柴油消费，但正文未对加油业务提出具体要求或影响。
  充电: 直接影响。政策明确提出构建补能驿站网络，在干线公路、城市周边、分拨中心建设大功率充（换）电站，形成目的地充电为主、中途补能为辅的补能体系，将带动充电基础设施投资与运营需求。
  电力_储能_V2G_交易: 未直接涉及。正文未提及储能、V2G、虚拟电厂或电力交易相关机制；仅提到充电设施建设，未扩展至电力市场或储能业务。
行动建议:
- A 趁早：评估杭州绕城范围及绿色运输廊道的充电桩布点机会，优先在物流分拨中心、干线公路服务区建设大功率充电站，争取纳入政府补能驿站网络规划。
- B 研究：密切跟踪杭州市新能源货车推广补贴及充电设施配套政策，研判充电负荷增长趋势，为未来参与电力需求响应或V2G试点储备技术方案。
didi_impact_one_liner: 杭州加大老旧柴油货车淘汰力度并构建补能驿站网络，直接拉动城市物流场景充电基础设施需求，但储能、V2G及电力交易业务暂未直接受益。
