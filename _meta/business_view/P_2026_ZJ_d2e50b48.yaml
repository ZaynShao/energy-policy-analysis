影响分析:
  加油: 政策明确以老旧柴油货车淘汰和新能源替代为核心，到2028年目标淘汰5.5万辆老旧柴油货车、新增3.7万辆新能源货车。直接推动柴油货车存量收缩，绕城范围内清洁运输推进将逐步削减柴油需求。
  充电: 政策专设'全力构建覆盖广泛的补能网络'条款，要求'因地制宜建设大功率充（换）电站'，构建'目的地充电为主、中途站补能为辅'的补能驿站网络。直接推动杭州市充电基础设施建设提速，覆盖干线公路沿线、城市周边及分拨中心等场景。
  电力_储能_V2G_交易: 政策聚焦充电基础设施布局以支撑新能源货车推广，未直接涉及储能配置、V2G机制、电力交易或虚拟电厂等新型电力系统业务。
行动建议:
- 'A 趁早: 在杭州干线公路、城市物流枢纽及分拨中心沿线布局大功率充换电站，对接政策''补能驿站网络''建设窗口期'
- 'B 趁早: 研究针对建筑工地、渣土运输、大宗货物运输等领域的换电重卡商业模式，把握中重型货车清洁运输率先突破机遇'
- 'C 趁早: 联动地方政府争取''两新''政策补贴支持，降低新能源货车替代的''油电差价''，提升新能源物流竞争力'
- 'D 研究: 跟踪杭州市后续充换电站规划布局及用地保障政策，预判重点补能网络节点分布'
didi_impact_one_liner: 政策加速杭州物流领域从柴油向新能源转型，充电基础设施迎来确定性建设窗口，物流车队能源结构面临重构
