影响分析:
  加油: 未直接涉及。该政策聚焦新能源汽车充放电设施和车网互动，无任何加油站相关表述。
  充电: 直接利好智能有序充电桩建设。对经认定的试点社区给予一次性建设奖励（每个≤5万元）；对2025年新建智能有序充电桩按每个≤1000元补助。明确要求：居民个人桩谷时充电占比>85%或提升10%+，统建统服充电站谷时充电占比>60%；充电桩须接入政府监测平台和常畅充平台；充电场站应积极参与聚合互动。
  电力_储能_V2G_交易: 直接涉及V2G放电和聚合互动补贴。V2G放电补贴最高4元/千瓦时（新能源公交车2元/千瓦时），放电量数据与供电公司采集数据差异≤10%。聚合互动（疑似VPP机制）补贴≤2元/千瓦时。V2G桩须国网单独装表计量。社区鼓励探索V2G放电等创新模式。
行动建议:
- 趁早对接国网常州供电公司：确保V2G桩单独装表计量、聚合互动响应量申报通道畅通，为获取放电补贴和聚合互动补贴建立数据核查基础
- 趁早参与试点社区申报：协调社区申报智能有序充电试点，配套争取充电桩建设补助（≤1000元/桩）和社区奖励（≤5万元/社区）
- 趁早优化充电时段：调整运营策略提升谷时充电占比至要求水平（个人桩≥85%，统建统服≥60%），同步接入政府监测平台满足合规条件
didi_impact_one_liner: 常州专项补贴落地：V2G放电≤4元/度、聚合互动≤2元/度、有序充电桩≤1000元/桩三重激励叠加，充电运营商需满足谷时充电占比和平台接入要求方可获补。
