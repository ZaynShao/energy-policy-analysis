影响分析:
  加油: 未直接涉及。该方案聚焦电力系统建设，未涉及加油站或燃油业务。
  充电: 直接涉及。（一）第(八)条明确要求在电动汽车发展规模较大的重点省份开展配电网可接入充电设施容量研究，建立可开放容量定期发布和预警机制；（二）第(二)条要求针对电动汽车充电基础设施制修订并网技术标准和管理要求；（三）第(十)条将建立配电网发展指标评价体系，充电设施接网能力为评价方向之一。
  电力_储能_V2G_交易: 部分涉及。（一）第(二)条将新型储能列为快速发展的新型主体之一，要求制修订并网技术标准，提升涉网性能和主动支撑调节能力；（二）第(十一)条智慧化调度体系建设提及适应新型主体对调度的新要求；（三）但未明确涉及V2G机制、电力交易规则或虚拟电厂(VPP)具体政策。储能领域仅涉及并网标准修订，尚未构成直接的市场准入或交易机会。
行动建议:
- A 趁早对接地方配电网可开放容量研究:关注重点省份发布的充电设施接网容量预警,优化充电网络选址与扩容节奏
- B 趁早参与并网标准制修订:跟踪新型储能并网技术标准的修订进展,提前调整储能项目涉网性能参数以符合新要求
- C 研究智慧调度体系对储能的机遇:密切跟踪新一代电力调度系统定义与新型主体调度机制,探索储能参与系统调节的商业模式
- D 趁早建立配电网协同规划:将充电设施布局与配电网改造方案主动衔接,争取纳入地方配电网发展实施方案
didi_impact_one_liner: 充电业务迎配电网容量研究与并网标准双重政策驱动,储能需跟进涉网性能新规,加油业务无直接关联。
