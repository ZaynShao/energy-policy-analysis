影响分析:
  加油: 未直接涉及。本文件为南方区域电力市场转正式运行的复函，正文未提及成品油批发价、炼厂装车价、加油站合规或下沉城市展业等事项，我司加油业务决策变量不变。
  充电: 未直接涉及。正文未提及充电桩建设、充电服务费、场站电价结构或充电标准；仅可作间接观察：文件提出“除保障性用户外的电力用户全部直接参与市场交易”，若后续执行细则将充电场站列为工商业用户入市，可能通过购电方式变化间接影响场站侧电价成本，但这属于间接推断，不构成本文件项下的直接业务影响。
  电力_储能_V2G_交易: 直接相关，且改变决策变量。一、南方区域电力市场由试运行转入正式运行，南方电网经营区内现货由“试”转“正式结算”，直接决定“这个省进不进”以及现货报价、结算与风控流程须按正式运行规则重搭。二、文件明确“健全完善电力保供中长期合同高比例签约履约机制”，直接改变中长期与现货的持仓比例约束，进而影响偏差敞口管理。三、文件要求“推动除保障性用户外的电力用户全部直接参与市场交易”，改变零售端客户池结构与代理购电客户转化节奏，同时“进一步规范电力零售市场”直接影响售电侧的报价、让利与合规口径。四、文件要求“规范高效落实国家能源规划和政府间协议明确的省间送电”“强化与跨电网经营区常态化交易的高效衔接”，改变跨省跨区购电渠道与电源组合选择。五、文件要求“完善适应新能源运行特性的市场机制”“充分挖掘新能源消纳空间”，影响新能源电量入市与购电成本结构。储能、V2G、虚拟电厂、聚合商准入事项在正文中未明确出现，该部分未直接涉及。
行动建议:
- A 趁早:按南方区域电力市场正式运行要求，重排南方电网经营区目标省的现货报价、结算与风控流程，并将中长期高比例签约履约机制纳入持仓比例测算，先算清再谈扩量。
- A 趁早:针对“除保障性用户外全部直接参与市场交易”和“规范电力零售市场”，梳理现有零售客户合同的入市路径、报价与让利口径，排查合规与价格承诺风险。
- A 趁早:把省间送电与跨电网经营区常态化交易衔接纳入购电组合方案，评估其对冲现货价格波动与保供成本的作用。
- B 研究:跟踪南方能源监管局后续修订的交易细则、信息披露与市场监测要求，建立正式运行首月的规则变动与结算偏差观测清单。
- B 研究:研究“适应新能源运行特性的市场机制”落地后新能源电量入市对购电成本与消纳空间的影响，暂不据此新增储能、V2G或聚合业务投入。
didi_impact_one_liner: 南方区域电力市场转正式运行，直接改变我司电力业务在南方电网经营区的现货结算、中长期签约比例、零售客户入市与省间购电四组决策变量，加油与充电业务未直接涉及，应趁早重算持仓与零售合规口径。
