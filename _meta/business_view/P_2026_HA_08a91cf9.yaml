影响分析:
  加油: 未直接涉及。政策聚焦于电力市场体系完善,未涉及油气零售或燃油供应业务。
  充电: 未直接涉及。政策虽涉及用户侧参与电力市场,但正文未明确提及充电设施、新能源汽车充电或充换电业务。间接地,新能源车主作为电力用户可参与现货和辅助服务市场,但需待各省细则明确。
  电力_储能_V2G_交易: 政策整体框架直接利好电力市场建设,具体到储能/V2G/电力交易:储能方面,辅助服务市场提及调频、备用、爬坡等灵活调节品种,为储能资源参与市场提供通道,但正文未明确储能参与方式或准入规则;V2G未在正文中出现;电力交易方面,正文明确了多时间尺度市场建设路径(年度/多年到月内多日)、用户侧参与现货市场、跨省跨区交易一体化等直接内容,为电力批发交易业务创造了明确的制度框架。市场电价机制健全目标为交易业务提供价格发现基础。间接影响方面,现货市场全面运行将提升电力交易复杂度和专业要求。
行动建议:
- A 趁早:布局跨省跨区电力交易能力,研究省间电力互济交易机制和联合交易模式,把握市场融合先机
- A 趁早:跟踪辅助服务市场建设进展,梳理调频/备用/爬坡等灵活调节品种的交易规则,为储能资源入市做准备
- B 研究:深入分析现货市场与中长期市场衔接机制,评估分时价格信号对购电策略的影响
- B 研究:关注各省用户参与省间现货交易的具体实施路径和准入条件
