影响分析:
  加油: 直接涉及。政策明确将燃油乘用车列为可置换的旧车类型，对售卖旧燃油车并购买新车的个人消费者给予补贴，将刺激燃油车置换需求。
  充电: 直接涉及。政策明确将新能源乘用车列为可置换旧车类型，且新购车辆需纳入工信部《减免车辆购置税的新能源汽车车型目录》，直接促进新能源汽车以旧换新消费。
  电力_储能_V2G_交易: 未直接涉及。该政策聚焦于汽车置换补贴，未涉及储能设施、V2G机制、虚拟电厂或电力交易等业务领域。
行动建议:
- 趁早:把握2026年全年补贴窗口期，在加油站/充电站网点加强以旧换新政策宣传，吸引持旧车客户置换
- 趁早:对接重庆市汽车销售企业合作，建立置换客户引流机制，扩增新能源客户基数
- 趁早:关注后续细则中新能源车型目录更新，及时调整充电业务营销策略匹配主流车型
didi_impact_one_liner: 政策直接利好燃油车和新能源车置换，新能源车补贴要求纳入免税目录将加速新能源渗透，建议趁早布局置换客户引流合作。
