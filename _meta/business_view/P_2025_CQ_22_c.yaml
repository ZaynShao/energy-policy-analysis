影响分析:
  加油: 间接。报废国四及以下燃油乘用车后，消费者可能转向购买新能源汽车，减少燃油消费需求；但政策本身是消费补贴机制，非燃油监管政策，属间接影响。
  充电: 间接。报废旧燃油车后购买新能源汽车会带动充电需求增长；但政策正文未直接规定新能源车购买或充电基础设施建设要求，属间接影响。
  电力_储能_V2G_交易: 未直接涉及。正文仅涉及燃油乘用车报废更新补贴，未提及储能、虚拟电厂(VPP)、V2G、电力交易或反向充电等机制。
行动建议:
- A 趁早:跟踪报废更新补贴执行数据，研判燃油车淘汰节奏，提前布局非油业务转型场景。
- B 研究:结合报废更新补贴与国家设备更新政策，评估新能源汽车渗透率提升对电力负荷侧管理的潜在影响。
didi_impact_one_liner: 报废补贴主要影响燃油车淘汰节奏和新能源汽车消费，充电需求有望随置换率提升而增长，储能/VPP/V2G/电力交易暂未直接涉及。
