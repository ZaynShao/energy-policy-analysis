影响分析:
  加油: 未直接涉及。本政策聚焦电力市场体系建设，虽提及能源市场整体框架，但正文未涉及油气、加油站业务或成品油市场机制。
  充电: 直接涉及。政策明确提出'优化分布式电源、虚拟电厂、负荷聚合商和新型储能等新型主体市场准入环境'，充电基础设施运营商作为负荷聚合商或新型主体有望受益于准入环境优化；政策强调完善辅助服务市场，充电灵活性资源参与辅助服务具有制度空间。
  电力_储能_V2G_交易: 直接涉及。《能源法》第二十五、第三十四、第五十七和第三十二条明确了对储能等新技术的研究、开发、示范、推广应用和产业化发展，发挥各类储能在电力系统中的调节作用；政策提出构建完备的统一电力市场架构，完善中长期与现货市场、现货与辅助服务市场的协同与衔接，为储能参与多品种交易提供机制基础。虚拟电厂和新型储能均被列为重点优化准入的新型主体。
行动建议:
- A 趁早:评估聚合商准入条件，储备充电负荷参与辅助服务市场所需的技术和运营能力
- B 趁早:对接省级电力交易机构，关注分布式电源和新型储能准入规则细化进展
- C 研究:储能参与中长期、现货、辅助服务多品种交易的技术方案和市场策略
- D 研究:虚拟电厂和储能聚合参与省间大范围资源优化配置的商业机会
- E 关注:各省级电力市场规则配套细则的制定动态，提前布局市场参与资质
didi_impact_one_liner: 统一电力市场加速推进，充电负荷聚合商和储能新型主体准入环境优化，带来参与电力交易和辅助服务的制度性机遇。
