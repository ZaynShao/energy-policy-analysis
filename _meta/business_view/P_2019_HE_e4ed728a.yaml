影响分析:
  加油: 未直接涉及。该通知聚焦于增量配电网配电价格管理，主要规范配电网企业与电力用户、省级电网之间的电价结算机制，加油业务不在本政策调整范围内。
  充电: 充电桩运营商作为配电网区域内的电力用户，其到户电价构成受配电价格管理直接影响。具体而言，参与市场交易的充电运营商电费由交易价格、配电价格和输配电价构成；未参与交易的则按目录销售电价执行。峰谷分时电价政策同样适用，可能影响充电服务定价策略。配电网可探索结合负荷率等因素制定配电价格套餐，为充电运营商提供差异化电价选择空间。此外，配电网区域内非水可再生能源与用户就近交易机制，理论上可支撑充电运营商采购低价可再生电力（需结合后续市场规则）。
  电力_储能_V2G_交易: 政策明确配电网区域内非水可再生能源与电力用户可开展就近交易，用户仅支付本电压等级配电价格、不承担上级输配电价，这为储能参与就近消纳提供了电价机制基础。配电网企业承担新能源消纳义务，储能作为调节资源在该机制下或具备参与空间。电力交易方面，政策详细规范了配电网与省级电网的结算方式（分类结算/综合结算电价），为配电网内市场化电力交易提供结算依据。V2G未在本政策中明确涉及，无直接业务影响。
行动建议:
- 'A 趁早: 研究配电网配电价格最高限价框架，评估充电场站接入增量配电网的可行性，对比省级电网输配电价，测算配电成本差异，优化充电服务定价模型。'
- 'B 趁早: 对接增量配电网企业，跟踪配电价格套餐政策落地，探索结合负荷率因素争取更优配电单价，降低充电运营电费成本。'
- 'C 研究: 跟踪配电网区域内非水可再生能源就近交易实施细则，评估储能参与就近消纳的交易模式和结算路径，提前布局可再生能源采购策略。'
didi_impact_one_liner: 充电运营电费成本与配电价格直接挂钩，配电价格套餐机制和可再生能源就近交易为降本提质提供潜在空间。
