影响分析:
  加油: 未直接涉及。正文为多用户绿电直连项目的开发建设管理规则，通篇未出现成品油、批发价/炼厂装车价、加油站安全与财税法合规成本、KA总部合作口径或下沉城市展业内容，不改变加油业务任一决策变量。
  充电: 未直接涉及。正文未提及充电场站、建桩节奏与选址、充电服务费定价、场站峰谷/需量电价适用或大功率/超充升级门槛。间接：正文把工业园区、零碳园区、增量配电网的全部或部分负荷列为绿电直连的适用负荷，若公司充电场站坐落于此类园区且为独立法人用户，其场站侧购电结构可能被间接影响；但正文未出现充电设施，此点落在画像空白维度，需人工裁定，不得据此判定可参与或受益。
  电力_储能_V2G_交易: 未直接涉及储能、V2G、虚拟电厂与电力交易品种规则：正文未写现货规则与结算、中长期与现货比例、售电公司利润上限/收益分成/让利退还、火电长协履约，也未写聚合商准入门槛。间接：政策把新能源电量在公共电网之外直接匹配给多个法人用户（年自发自用电量不低于总可用发电量60%、不低于总用电量30%且2030年前不低于35%），可能分流湖南等目标省的电网购电与绿电交易盘子，进而影响售电代理电量与绿电供给结构；但正文未授予售电公司或聚合方任何角色，也无准入与分成安排，本业务是否/如何介入需另行判断。
行动建议:
- A 趁早:按正文“投资模式”口径（项目须明确具备法人资格的独立主责单位，原则上由电源方与负荷方合资，园区型可由园区管委会或第三方机构组建，且不含运营220千伏及以上输变电业务的公共电网企业）评估公司在目标省以第三方机构或负荷方身份介入园区型绿电直连项目的可行性与合规边界。
- B 研究:以正文“以荷定源”及年自发自用电量≥60%、占总用电量≥30%（2030年前≥35%）的硬约束为参数，测算湖南绿电直连项目落地对目标省售电代理电量、绿电供给结构与现货持仓比例的间接分流，判断是否需调整中长期签约与持仓节奏。
- C 研究:核实正文“适用负荷”范围（工业园区、零碳园区、增量配电网等）是否覆盖公司现有充电场站所在园区，形成是否需要人工裁定的结论；正文未提及充电设施，在裁定前不作建桩、定价或参与绿电直连的业务动作。
didi_impact_one_liner: 湖南多用户绿电直连：电源就近直供多个法人用户，加油与充电在正文中均未出现；对电力业务主要是间接分流——目标省售电代理电量与绿电交易盘子可能被园区型直连项目挤占，而正文未给出售电/聚合方角色，建议先算清分流再定进场节奏。
