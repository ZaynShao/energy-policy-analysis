影响分析:
  加油: 未直接涉及
  充电: 直接涉及。产品方面，要求充电设施符合国家标准，需CMA或CNAS标识合格报告，强制认证产品须取证。建设方面，既有停车位等安装充电设施可免规划许可，但需满足消防、安全、市容要求；公用/专用充电设施实行登记管理，施工单位需具备水电安装或电力设施承装资质。运营方面，需录入广州市充电设施智能管理平台，实时数据接入；需建立运行维护管理制度、履行安全生产主体责任。补贴方面，需在平台录入且已建成总功率不少于2000kW方可申请财政补贴。
  电力_储能_V2G_交易: 未直接涉及
行动建议:
- A 趁早:对照CMA/CNAS资质和强制认证要求，梳理现有充电设施产品清单，对不符合标准的设备制定整改或替换计划
- B 趁早:到所在区工信部门咨询建设登记流程，提前准备施工单位资质材料，确保项目开工前完成登记手续
- C 趁早:完成广州市充电设施智能管理平台的企业信息录入，建立实时数据接入机制
- D 趁早:评估现有运营充电设施总功率，若接近或低于2000kW门槛，加快站点投运进度以满足补贴申报条件
- E 趁早:按文件要求建立健全充电设施运行维护管理制度和安全责任体系，储备持证电工等专业人员
