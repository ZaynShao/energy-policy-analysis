影响分析:
  加油: 在加油加气站增加安装充电设施（含框架式、集装箱式换电设施）可免申领建设工程规划许可证，但需满足消防、安全、市容景观要求，为油气能源企业向综合能源站转型提供便利化路径。
  充电: 全面纳入监管体系：产品须有CMA/CNAS合格报告，公用/专用充电设施须在平台实时数据录入并通过竣工验收；申请财政补贴须满足平台录入、建成运营总功率≥2000kW的在穗企业条件；运营企业须承担安全生产主体责任并接受各级安全监管。
  电力_储能_V2G_交易: 未直接涉及。正文仅定义充电设施为集中式充换电站和分散式充电桩，未出现储能、虚拟电厂(VPP)、V2G、双向充电桩或电力交易等机制，相关业务不适用本通知约束或支持范围。
行动建议:
- A 趁早:利用加油加气站免规划许可的窗口，在存量场地上布局充电设施，构建油气电综合能源服务站
didi_impact_one_liner: 政策规范充电运营准入门槛和补贴条件，加油站增设充电设施获便利化支持，2000kW运营功率门槛对中小运营商形成竞争壁垒，充电运营企业须强化信息平台对接和安全生产主体责任以合规申领补贴。
