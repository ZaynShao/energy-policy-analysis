影响分析:
  加油: 未直接涉及。该文件聚焦工商业用户的分时电价机制调整，加油业务核心为油品销售，不涉及用电价格调整的直接业务影响。
  充电: 直接涉及。充电桩运营属于工商业用电范畴，分时电价机制的峰谷时段划分和浮动比例直接影响充电运营成本：尖峰时段（夏季18-21时、冬季17-20时）电价上浮，高峰时段上浮60%，低谷时段下浮55%，节假日深谷时段（13:00-15:00）进一步下浮20%。充电运营商可据此优化定价策略和充电时段安排。
  电力_储能_V2G_交易: 未直接涉及。该文件为分时电价政策，不涉及储能建设、V2G机制、虚拟电厂准入或电力交易规则。峰谷价差扩大（最高浮动80%）客观上为储能套利提供空间，但文件未明确表述储能参与机制。直接参与电力市场交易用户按相关市场规则执行，非本文件规范范畴。
行动建议:
- 'A 趁早: 充电运营业务线利用低谷时段（夜间2:00-5:00及午后9:00-15:00）部署低价充电促销，提升低谷时段利用率，对冲尖峰时段上浮成本。'
- 'B 趁早: 充电运营业务线结合节假日深谷时段（春节/劳动节/国庆节13:00-15:00）设计专项优惠活动，扩大深谷电价让利空间。'
- 'C 研究: 综合能源业务线评估工商业用户分时电价套利模式，探索''储能+分时电价''组合的商业可行性。'
