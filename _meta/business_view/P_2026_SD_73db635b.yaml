影响分析:
  加油: 未直接涉及。文件聚焦电力市场交易机制，包括新型储能参与调频辅助服务、分布式储能结算、零售市场管理等，未涉及加油业务或成品油市场相关机制。
  充电: 未直接涉及。文件主要规范发电侧和用户侧电力市场主体交易行为，虽提及分布式储能以独立或聚合方式参与市场，但未明确涉及充电桩、充换电站或新能源汽车充电服务领域的市场机制。
  电力_储能_V2G_交易: 直接涉及。一、新型储能参与调频辅助服务市场机制完善：系统按小时调整调频容量、调频速率需求并开展分时出清；熔盐储热设施可按日选择匹配机组联合参与市场。二、分布式储能结算机制明确：自2026年6月1日起，未参与市场的分布式储能上网电量按所在市级行政区域发电侧节点实时市场算术平均电价结算；鼓励分布式储能以独立或聚合方式报量报价参与电力市场；向电网送电当月等量充电量不承担输配电费。三、容量补偿费用分配：发电侧市场化电量扣除新能源机制电量对应容量补偿费用后，按月度市场化可用容量占比分配。四、核电入市部署：适时研究启动参与市场核电项目机制电价结算机制。五、零售市场规范化：强化用户身份认证、完善价格封顶条款、优化零售套餐考核条款。六、售电公司管理：履约担保额度确定可签约电量上限，信用评价和违规处置办法年内启动实施。V2G未直接涉及（正文未出现V2G、双向充电或反向充电等机制）。
行动建议:
- A 趁早:趁早研究分布式储能以独立或聚合方式参与电力市场的准入条件与技术要求，对接山东电力交易中心尽早完成入市准备，6月1日前锁定市场化结算收益路径
- B 趁早:趁早评估现有储能项目调频容量和速率配置，对接二季度分时出清机制调整运营策略，争取调频辅助服务市场收益
- C 趁早:趁早梳理分布式储能向电网送电的计量与结算流程，确认等量充电量免输配电费的操作细则，优化储能充放电调度逻辑
- D 趁早:趁早完成售电公司履约担保额度评估与信用评价体系建设，3月21日前完成二季度零售合同签订，关注年内信用评价启动实施要求
- E 趁早:趁早完善零售市场合规体系，对接价格封顶条款、身份认证和套餐考核新规，提前布局终端用户签约与价格联动类套餐设计
