影响分析:
  加油: 未直接涉及。该政策聚焦电力市场体系完善，正文未提及加油业务、加油站或成品油市场机制改革。
  充电: 未直接涉及。政策虽涉及电力市场全品类覆盖和用户侧工商业全部进入市场，但正文未明确提及充电桩、充换电基础设施或新能源汽车充电市场准入、交易机制或价格机制。
  电力_储能_V2G_交易: 明确涉及电力交易全品类覆盖和价格机制。政策明确建立新能源可持续发展价格结算机制，通过容量电价引导煤电、抽水蓄能等调节性电源建设，辅助服务市场已覆盖全国，这些为储能参与容量市场和辅助服务提供直接市场框架支撑。
行动建议:
- A 趁早:研究储能参与容量电价机制和辅助服务市场的准入条件与结算规则，匹配调节性电源定位布局储能项目
- B 趁早:对接绿电绿证和零售市场机制，探索新能源配储项目的市场化消纳和收益路径
- C 研究:跟踪跨省跨区电力交易规则演进，重点关注省间交易规模从0.1万亿增至1.6万亿千瓦时背后的市场空间和准入机会
- D 研究:深入分析用户侧全部工商业进入市场后的用电侧需求响应机制，评估储能作为灵活性资源参与需求侧管理的商业机会
didi_impact_one_liner: 电力市场全品类覆盖和容量电价机制为储能提供了明确的参与框架，但充电和加油业务不在本政策直接调整范围内。
