影响分析:
  加油: 未直接涉及。文件聚焦电力市场中长期交易分时结算规则，未涉及油气业务或成品油定价机制。
  充电: 未直接涉及。文件规范的是工商业用户中长期分时交易结算方式，充电运营作为电力用户可参照零售用户规则执行分时电价，但未对充电基础设施、V2G或充电市场准入作出直接规定。
  电力_储能_V2G_交易: 未直接涉及。文件核心是2025年8-12月中长期分时交易结算的过渡期安排，明确过渡期内批发交易不开展分时价格浮动，仅调整市场化用户执行方式。文件未直接涉及储能项目、虚拟电厂(VPP)、V2G、反向充电或电力交易准入等机制。
行动建议:
- A 趁早研判分时电价浮动对工商业用电成本的影响，分业务时点核算峰谷时段用电成本结构变化，作为后续参与分时交易的决策基础
- B 趁早评估组合类电价条款（批发市场参考价联动/售电公司批发均价联动）的适用性，比对两种条款的价格传导路径和风险敞口差异，提前与售电公司沟通条款选择意向
- C 研究建立零售套餐价格预警监测机制，对标文件中明确的电能量价格预警值（中长期批发交易均价1.1倍）和绿电环境价值预警值（绿电环境价值均价1.3倍），防控签约风险
- D 趁早梳理中长期合同时段结构，结合分时电价峰谷时段和浮动比例，优化后续购电合同签订策略，提升峰谷时段持仓匹配度
didi_impact_one_liner: 文件规范电力中长期分时结算过渡期规则，加油和充电业务未直接涉及，但工商业用电客户将受分时电价浮动影响，售电公司及代理购电用户需关注组合类电价条款选择和价格风险管理。
