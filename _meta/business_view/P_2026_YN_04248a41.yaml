影响分析:
  加油: 未直接涉及。正文聚焦充电基础设施，未涉及燃油供给、加油站布局或成品油监管等事项。（间接）充电设施大规模建设或长期促进新能源汽车渗透率提升，对燃油车市场份额存在潜在替代压力，但正文未写。
  充电: 直接利好。政策明确提出五大行动，覆盖城市快充网络、高速公路服务区（95%覆盖率目标）、国省干线、乡村充电桩、居住区充电设施等多场景，并给出量化目标：2027年底累计建成25万枪、公共充电容量超500万千瓦、城市直流公共充电桩4.5万枪、乡村直流公共充电设施2万枪。居住区充电设施覆盖推进行动要求严格落实新建固定车位配建要求，存量居住区推进工作同步推进。
  电力_储能_V2G_交易: 部分涉及但有限。政策提到开展'光储充换放'充电场景示范（昆明等中心城市），并鼓励建设'光储充放'乡村服务站，但正文未明确储能容量目标、V2G机制、电力交易或虚拟电厂参与模式。政策核心仍是充电基础设施数量和服务能力倍增，储能、V2G、电力交易等机制仅为示范场景而非正文明确的建设或准入要求。
行动建议:
- A 趁早布局云南城市快充网络:政策明确支持大功率充电设施占比提升和光储充换放示范，城市核心区、交通枢纽、商业中心是关键场景，应在政策落实初期抢占优质点位。
- B 趁早对接公路业主单位:政策要求高速公路服务区充电设施覆盖率95%以上，新建高速同步配建，是进入公路补能市场的窗口期，可与充电运营商或设备商联合投标。
- C 趁早研究乡村充电运营模式:政策支持利用分布式光伏+储能+充电的乡村服务站建设，应探索'光伏自发自用+储能调峰'的商业模式，服务季节性充电需求。
- D 研究居住区充电整体解决方案:政策要求严格落实新建固定车位配建、推进存量居住区覆盖，可提前与开发商、物业对接，提供从报装到运维的一站式服务。
- E 研究重卡充电联建联营机会:政策鼓励工矿企业、大型项目业主与充电运营商联建联营满足重卡补能需求，可探索与园区、矿区合作的重卡充换电运营模式。
didi_impact_one_liner: 云南充电基础设施2027年目标25万枪、全省覆盖，城市快充/高速服务区/乡村/居住区多场景同步推进，利好充电网络布局和运营，但储能/V2G/电力交易仅为示范场景而非政策主体要求。
