影响分析:
  加油: 未直接涉及。政策聚焦充电基础设施建设，虽长期可能因电动汽车普及间接影响燃油车市场，但正文未涉及加油业务。
  充电: 直接利好。政策明确提出五大行动推进充电设施建设：（1）城市快充网络提质：2027年底城市直流公共充电桩达4.5万枪；（2）高速及国省干线：2027年高速服务区充电设施覆盖率达95%，国省干线服务区不少于30座；（3）乡村充电：2027年底乡村直流公共充电设施达2万枪；（4）重点场景：旅游景区、园区矿区、出境通道加密布局；（5）居住区：新建居住区固定车位落实充电设施配建。
  电力_储能_V2G_交易: 未直接涉及。正文虽多处提到'光储充放'场景示范，但均为描述性提及，无具体建设目标、补贴政策或市场准入机制。储能、V2G、电力交易等机制未在方案中直接涉及。
行动建议:
- A 趁早:在昆明等中心城市及高速公路沿线服务区提前布局快充站点，对接政府示范项目资源
- B 趁早:跟踪居住区充电设施配建政策落地，趁早与新建住宅开发商、物业对接私桩建设合作
- C 研究:关注州市层面对旅游景区、园区矿区、出境通道等细分场景的配套细则出台，研判本地化市场机会
- D 研究:分析乡村充电'春节返乡'季节性需求特点，研究分布式光伏+充电的可行性方案
didi_impact_one_liner: 充电基础设施规模化建设目标明确，2027年达25万枪，城市、高速、乡村、重点场景全覆盖，居住区充电配套政策加码，充电运营商迎直接利好。
