影响分析:
  加油: 政策明确扩围支持老旧营运船舶和老旧营运货车报废更新（国四及以下排放标准），涉及交通运输领域用能设备更新。政策导向为"高端化、智能化、绿色化"，长期可能加速高排放燃油设备淘汰，但未直接出台燃油替代或加能站改造激励条款，属间接影响。
  充电: 政策涉及交通运输领域设备更新，但未在消费品以旧换新部分明确提及新能源汽车或充电基础设施补贴扩围。政策着力点为设备更新而非新建，充电业务未获直接支持。
  电力_储能_V2G_交易: 政策在重点领域支持中提到"能源电力"设备更新，并支持高端化、智能化、绿色化设备应用，但未明确储能装置、V2G双向充放电、虚拟电厂或电力交易机制的具体支持政策，属未直接涉及。
行动建议:
- A 趁早:跟踪老旧营运船舶、货车报废更新补贴执行细则，结合地方"工业园区、产业集群"设备更新部署，研判清洁能源动力替代需求窗口
- B 研究:梳理交通运输领域设备更新贷款贴息政策覆盖范围（科技创新和技术改造再贷款工具），评估新能源设备更新融资成本优化空间的业务机会
- C 趁早:对接国家重大建设项目库设备更新项目储备机制，探索能源电力领域设备更新项目的用能服务合作模式
didi_impact_one_liner: 政策扩围支持能源电力、交通运输等重点领域设备更新，提供超长期特别国债贴息，但未直接惠及充电、储能或V2G业务，加油业务受绿色设备更新导向间接影响。
