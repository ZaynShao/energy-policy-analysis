影响分析:
  加油: 直接相关。本次通知把湖南汽油、柴油(标准品)每吨分别上调395元和385元,汽、柴油最高批发价格等额调整,并按既有机制维持批零差价:合同约定供方配送到零售企业的,在执行最高零售价基础上全省统一扣减每吨300元;符合资质的民营批发企业按最高零售价每吨扣减400元执行,市场零售价格降低时差价分别不少于300元和400元。这直接改写我方加油业务的两个关键数——最高零售价上限与批发结算基准,而利润来源(折扣空间)的规则本身未被改变,变的是价格水平。零售仍实行最高价格管理,零售企业可在不超最高零售价前提下自主定价。执行时点为2026年9月24日24时,须同步更新价签与系统。通知要求中石油、中石化湖南公司做好调运衔接并督促所属企业执行价格政策,各级价格主管部门加强市场动态与价格监测。
  充电: 未直接涉及。正文未出现充电、充电服务费、场站电价结构、建桩选址或大功率超充等任何内容。(间接:成品油零售限价上调可能间接影响油电使用成本比较,但不改变充电业务任何决策变量,不作为行动依据。)
  电力_储能_V2G_交易: 未直接涉及。正文未出现电力市场、现货规则、售电、中长期交易、储能、虚拟电厂(VPP)、V2G、反向充电或聚合商准入等任何机制或安排。
行动建议:
- A 趁早:以2026年9月24日24时为界,核对湖南在营站点的批发结算价与零售挂牌价,确认每吨300元(配送至零售企业)与每吨400元(民营批发企业)的扣减机制在调价后照常足额执行,防止折扣空间被压缩。
- B 趁早:按最高零售价格管理要求,在限价内完成站点价签、系统价格与对外报价口径的同步更新,并留存价格执行记录,以应对各级价格主管部门的动态与价格监测。
- C 研究:复盘本次调价前后湖南批零价差与批发折扣空间的实际变化,评估国家后续调控节奏对采购时点、站点毛利及下沉城市展业的影响提示。
didi_impact_one_liner: 湖南汽、柴油最高零售价每吨分别上调395元、385元,最高批发价等额调整,300/400元批零扣减机制保持不变——加油业务直接相关,充电与电力(储能/VPP/V2G/交易)未直接涉及。
