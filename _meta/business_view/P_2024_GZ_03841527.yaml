  电力_储能_V2G_交易: 直接利好储能。报告明确：①195万千瓦新型储能示范项目已并网运行；②开工建设贵阳、黔南抽水蓄能电站；③新型综合能源基地建设持续推进。这些项目落地为储能投资运营创造实质性市场空间。V2G、电力交易机制未在报告中出现。
