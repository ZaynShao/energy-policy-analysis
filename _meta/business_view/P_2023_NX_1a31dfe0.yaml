影响分析:
  加油: 未直接涉及。该政策针对高可靠性供电费收取范围和标准的调整，加油业务属于终端能源零售，不涉及多回路供电的高可靠性用电需求。间接影响：商业用能成本结构中电力成本占比可能因该政策调整而优化，但与加油业务运营无直接关联。
  充电: 部分涉及。充电基础设施运营属于用电侧业务，如充电站申请多回路供电（含备用电源），则其除最大供电回路外的其余供电回路将按降低后的标准缴纳高可靠性供电费，直接降低充电运营商的电力接入成本。需注意：政策明确排除无高压、低压及末端联络的双（多）回路供电用户，意味着仅需单回路供电的中小型充电站点不受影响。
  电力_储能_V2G_交易: 发电企业明确不收取高可靠性供电费（不含发电无关的其他用电行为），对发电企业降本有直接积极影响。储能、V2G、虚拟电厂、电力交易等业务未在正文中直接涉及，无法判断具体影响——政策正文仅明确发电企业和增量配电网企业免收高可靠性供电费，未展开描述储能/VPP/V2G/交易机制。
行动建议:
- A 趁早梳理充电业务板块各站点供电方式：区分单回路与多回路（含备用电源）站点，测算高可靠性供电费降低带来的成本节省，纳入充电场站投资回报模型。
- A 趁早对接地方电网公司：确认本轮降价后的具体收费标准（见附件），核实已建成场站是否存在补缴或退费可能性。
- B 研究储能业务接入模式：关注高可靠性供电费政策与储能系统并网供电的衔接，评估储能项目申请多回路供电的必要性及成本影响。
- B 研究发电业务合规边界：政策明确发电企业从事与发电无关的其他用电行为仍需缴纳费用，建议排查旗下发电企业是否存在混合用电情况，确保合规。
- C 关注增量配电网企业动态：政策明确增量配电网企业免收高可靠性供电费，该政策红利可能影响区域增量配电网的投资吸引力，建议持续跟踪区内增量配电网项目进展。
didi_impact_one_liner: 充电运营的多回路供电场站可享高可靠性供电费降低红利，发电企业明确免收该费用，但储能/VPP/V2G/电力交易等新业态未获直接政策支持。
