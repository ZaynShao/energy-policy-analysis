影响分析:
  加油: 未直接涉及。该政策聚焦虚拟电厂的聚合调控和电力市场交易，加油业务属于传统化石能源领域，政策未涉及加油设施参与需求响应、储能或电力交易的机制设计。
  充电: 间接。政策明确鼓励“车网互动”并支持聚合充电资源作为虚拟电厂的分布式可控资源，充电运营商通过建设车网互动（V2G）功能可作为负荷侧资源参与虚拟电厂聚合，但政策正文未对充电行业提出具体的建设、准入或交易要求。
  电力_储能_V2G_交易: 直接涉及。政策明确虚拟电厂可聚合储能等分布式资源作为新型经营主体参与电力中长期、现货和辅助服务市场；发电类虚拟电厂聚合储能（10千伏及以下接入）作为发电侧主体；混合类虚拟电厂可同时聚合储能与可调负荷。政策设定了2027年100万千瓦、2030年300万千瓦调节能力目标，并提出放宽中长期电量约束、鼓励参与现货和应急调节交易等市场机制完善方向。
行动建议:
- A 趁早:对接省能源局试点申报通道，依托现有售电公司资质完善车网互动功能，将充电桩资源纳入虚拟电厂聚合范围
- B 趁早:对接江西电力交易中心，研究储能资源作为发电类虚拟电厂参与现货市场的技术指引和计量结算规则
- C 研究:关注政策配套规则文件出台动态，跟踪负荷类、发电类、混合类虚拟电厂的市场准入和交易机制细化要求
- D 研究:评估分布式储能（10千伏及以下接入）的V2G潜力，研究混合类虚拟电厂发用电数据分别叠加的技术路径
didi_impact_one_liner: 政策直接明确储能可作为虚拟电厂聚合资源参与电力市场，充电桩资源通过车网互动可间接纳入虚拟电厂调控范围，2027/2030年调节能力目标（100/300万千瓦）打开市场空间。
