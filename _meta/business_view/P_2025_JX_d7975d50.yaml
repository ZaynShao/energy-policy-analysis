影响分析:
  加油: 未直接涉及。该方案聚焦虚拟电厂发展，加油业务与虚拟电厂的资源聚合、电力市场交易功能无直接关联。
  充电: 间接涉及。充电桩作为可调节负荷具备参与虚拟电厂聚合的潜力，方案提到聚合负荷类资源、鼓励车网互动相关系统平台参与试点，但未明确充电桩参与的具体技术路径、入网检测标准或调节能力要求。
  电力_储能_V2G_交易: 直接涉及。储能明确作为发电类虚拟电厂的聚合资源（10千伏及以下分布式新能源、储能），可参与需求响应、电能量市场和辅助服务市场；方案提出培育虚拟电厂新型经营主体参与电力交易，要求具备售电公司资质并完善分时计量传输条件；混合类虚拟电厂将逐步探索发用电资源融合交易。V2G未在正文中明确出现。
行动建议:
- A 趁早:在赣开展储能项目时，主动研判作为虚拟电厂聚合资源参与电力市场的资质条件和技术要求，提前对接电网企业和电力交易中心布局先机
- B 研究:密切跟踪江西省虚拟电厂试点申报动态和配套规则文件出台进程，评估储能资源参与试点的可行性和最优聚合路径
- C 趁早:对接省级虚拟电厂运营管理平台建设需求，储备电力市场交易所需的计量、传输和交易策略能力
didi_impact_one_liner: 江西省虚拟电厂方案将储能纳入聚合资源范围并明确电力市场参与路径，为充电业务间接带来需求响应和聚合潜力，但具体技术标准和参与机制待配套文件细化。
