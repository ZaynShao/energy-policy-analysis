影响分析:
  加油: 未直接涉及。该政策聚焦沈阳市新能源基础设施布局，包括风电、光伏、氢能、新型储能等领域，未涉及传统加油业务。
  充电: 未直接涉及。政策主要围绕风电光伏发电、氢能、新型储能等发电侧和电网侧内容，未明确涉及充电基础设施或新能源汽车充电服务。
  电力_储能_V2G_交易: 直接利好。政策明确：1)亿纬锂能100亿元储能与动力电池项目签约沈阳，规划产能40GWh；2)沈阳微控飞轮储能订单近8亿元，产值预计增长超400%；3)省级规划布局新型储能项目27个、总装机350万千瓦，其中沈阳市60万千瓦；4)支持沈阳市打造“千亿储能之都”。政策还提出推进新型储能技术试点示范和规模化发展，促进储能与电力系统各环节融合发展，支撑新型电力系统建设。
行动建议:
- A 趁早:在沈阳市储能项目规划落地前，主动对接亿纬锂能、沈阳微控等已落地企业，洽谈储能设备采购或运营合作
- A 趁早:跟踪省级27个新型储能项目布局进展，在沈阳市60万千瓦装机容量落地过程中寻找合作切入点
- B 研究:密切跟踪沈阳市打造“千亿储能之都”的配套政策出台，提前布局储能投资或运营业务
