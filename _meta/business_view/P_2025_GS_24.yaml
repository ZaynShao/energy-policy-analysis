  加油: 直接相关。整治重点涵盖黑加油站（点）清除、计量作弊整治、销售劣质/非标油品打击、偷逃税整治等，违规加油站面临整改或关停风险；明确打击以'新能源''替代能源'名义销售非标车用燃油行为，需确保油品质量合规。
  充电: 未直接涉及。文件聚焦成品油流通整治，虽提及'新能源'相关表述，但仅作为打击以新能源名义销售非标油品的监管背景，不涉及充电基础设施、充电运营或新能源汽车充电服务。
