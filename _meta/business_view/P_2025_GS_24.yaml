行动建议:
- A 趁早:对自有加油站开展合规自查，重点核查证照齐全、计量器具校准、油品进货渠道和质检报告，杜绝掺假、非标油品销售和偷逃税行为
- B 趁早:完善油品供应链管理，留存完整出入库记录和电子运单，确保实物与单据一致，避免被认定为非法仓储或非法运输
