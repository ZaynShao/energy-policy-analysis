影响分析:
  加油: 未直接涉及。该政策聚焦新型储能参与电力市场，加油业务不属于储能或电力市场范畴。
  充电: 未直接涉及。政策针对新型储能参与电力市场，虽提及配建储能，但正文未明确指向充电场站配建储能，未直接涉及充电桩运营或充电服务。
  电力_储能_V2G_交易: 直接涉及。政策明确建立独立储能参与电力市场的机制：独立储能可作为市场主体参与中长期、现货市场及辅助服务；配建储能可通过技术改造联合参与市场；独立储能充电电量免收输配电价及政府性基金附加；辅助服务费用按'谁提供、谁获利，谁受益、谁承担'原则分摊。
行动建议:
- A 趁早:研究独立储能项目转为市场主体的技术条件和申报流程，评估将现有储能转为独立储能参与电力市场的经济性。
- B 研究:跟踪独立储能签订顶峰/低谷时段市场合约的规则制定，提前布局参与调峰市场的商业策略。
- C 研究:梳理存量配建储能规模，评估满足独立参与市场条件所需的技术改造方案和改造成本。
- D 趁早:与电力调度机构建立沟通机制，掌握配建储能科学调度机制的具体要求，确保储能系统符合安全稳定运行标准。
- E 研究:分析独立储能参与辅助服务市场的收益结构，涵盖有功平衡、无功平衡及快速有功响应等服务类型。
didi_impact_one_liner: 政策明确独立储能参与电力市场的准入机制和收益模式，为储能业务开辟市场化盈利路径，充电业务未直接涉及。
