影响分析:
  加油: 未直接涉及。该政策聚焦新型储能参与电力市场和调度运用，与传统加油业务无关联。
  充电: 未直接涉及。该政策针对新型储能（电力储能设施），虽提及配建储能，但不涉及充电桩、充换电站等充电服务业务。
  电力_储能_V2G_交易: 【直接涉及】1. 市场准入：明确新型储能可转为独立储能作为独立主体参与电力市场；2. 收益机制：独立储能可参与中长期市场、现货市场及辅助服务市场，充电电量免输配电价和政府性基金及附加；3.
    调度运用：建立科学调度机制，鼓励储能顶峰、调峰、调频、黑启动等多场景应用；4. 配建储能选择权：新能源配建储能可选择转为独立储能或与电源联合参与市场。
行动建议:
- 趁早布局独立储能项目，具备法人资格和调度自动化接入条件的新型储能项目可率先申请转为独立储能，参与电力市场获取市场化收益
- 趁早研究配建储能转为独立储能的路径，对现有新能源配建储能进行技术改造评估，满足独立计量、控制等技术条件后可选择转为独立储能
- 趁早对接电网调度机构，建立科学调度机制，确保储能系统安全稳定运行以符合市场参与要求
- 趁早研究辅助服务市场规则，准备提供调峰、调频、顶峰等服务，挖掘新型储能的多重收益来源
didi_impact_one_liner: 新型储能获得独立市场主体地位，可参与电力现货和中长期市场，充电电量免输配电价，政策直接利好储能投资和运营收益。
