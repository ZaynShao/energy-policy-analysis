summary: 国家发改委、国家能源局修订印发《电力中长期市场基本规则》,规范全国电力中长期交易行为,明确发电企业、售电公司、电力用户和新型经营主体的市场注册与交易规则,推动跨省跨区与省内交易耦合,统一电力交易平台。要求各地2026年3月1日前完成实施细则备案。
