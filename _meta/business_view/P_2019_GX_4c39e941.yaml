影响分析:
  加油: 未直接涉及。该文件聚焦增量配电网配电价格定价方法、调整机制和结算制度，不涉及燃油销售或加油站相关业务。
  充电: 未直接涉及。文件规范的是增量配电网配电价格管理，虽涵盖市场化交易电力用户，但正文未明确提及充电桩、充电设施或电动汽车充换电业务。
  电力_储能_V2G_交易: 直接涉及电力交易机制。文件明确了配电网区域内市场化交易电价构成（市场交易电价+输配电价+配电价格+政府性基金及附加）；规定了非市场化电量按集中竞价交易结算；允许配电网区域内的非水可再生能源发电项目与用户开展就近交易；支持配电网企业探索结合负荷率制定配电价格套餐。储能与V2G未在正文中出现。
行动建议:
- A 趁早研究招标文件评分标准：文件要求招标定价项目的竞标主体须同时承诺投资规模、配电容量、供电可靠性、服务质量、线损率等指标，建议趁早分析招标评审维度，提前布局配电网项目投资方案设计能力。
- B 趁早建立配电价格套餐设计能力：文件允许配电网企业在最高限价内结合负荷率等因素制定配电价格套餐，建议趁早研究用户用电特性，构建差异化配电价格套餐模型。
- C 趁早对接电力交易规则：文件明确配电网区域电力交易适用自治区现行市场化交易规则，非市场化电量须按集中竞价出清价格结算，建议趁早对接广西电力交易平台，熟悉交易申报和结算流程。
didi_impact_one_liner: 广西增量配电网配电价格管理新规落地，明确招标定价与最高限价双轨机制，为配电网投资主体提供了配电价格套餐设计空间，同时强化了与上级电网的结算选择权。
