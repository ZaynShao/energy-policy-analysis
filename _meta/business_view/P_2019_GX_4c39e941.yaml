  电力_储能_V2G_交易: 文件规范增量配电网配电价格制定与结算机制，为配电网区域内市场化交易提供价格框架。涉及配电网与上级电网的结算制度（分类结算电价、综合结算电价），明确市场化交易用户电价构成包括市场交易电价+输配电价+配电价格+政府性基金及附加。非水可再生能源发电项目就近交易可仅支付本电压等级配电价格。但未直接涉及储能充放电价格机制、虚拟电厂聚合结算、V2G反向送电定价或独立电力交易资格准入。
行动建议:
- A 趁早研究:密切跟踪区内增量配电网试点项目配电价格执行情况,评估配电网区域内存量电力用户市场化交易放开节奏,提前布局竞争售电业务
- B 研究:梳理区内已投运及规划增量配电网项目清单,分析不同结算方式(分类/综合)对终端用户成本结构的影响,预研跨电压等级供电的配电网内储能项目商业模式
- C 研究:关注国家层面增量配电网配电价格政策调整动态,结合广西竞价/限价定价机制特点,评估参与配电网投资或与其开展购售电合作的准入条件与合规要点
didi_impact_one_liner: 增量配电网配电价格管理规范了配电网区域市场化交易价格框架,但对充电/储能/V2G/虚拟电厂等具体业务无直接价格机制或准入规定,影响主要体现为配电网投资主体多元化可能带来的间接竞争格局变化。
