影响分析:
  加油: 未直接涉及 - 本政策聚焦新能源发电侧上网电价市场化改革，适用对象为风电、光伏等增量新能源项目，不涉及油品业务
  充电: 未直接涉及 - 政策规范对象为新能源发电项目的上网竞价机制，充电服务属于电力消费侧不在本政策调整范围内
  电力_储能_V2G_交易: 直接涉及 - 明确增量新能源项目须通过竞价确定机制电价和电量，上网电量全部参与电力市场交易；源网荷储、绿电直连等新能源就近消纳项目除自发自用外的上网电量同样纳入电力市场交易范畴；分布式项目可通过售电公司代理参与竞价（代理容量上限各10万千瓦）
行动建议:
- 趁早研究竞价规则 - 深入研读《河北南网实施方案》和《冀北电网实施方案》，掌握申报-审核-竞价-公示-考核全流程及资质审核要求
- 趁早对接代理渠道 - 如有分布式新能源项目，提前与河北、冀北电力交易中心完成注册的售电公司建立代理合作，明确代理协议签订时点和容量限制
- 趁早评估合规边界 - 对照集中式/分布式全容量并网认定标准（含电力业务许可证、营销系统容量等），核查项目资质材料完备性
didi_impact_one_liner: 增量新能源项目须通过竞价机制确定电价并全量参与电力市场，分布式项目可通过售电公司代理参与，对新能源电量交易形成直接价格影响
