影响分析:
  加油: 直接相关。正文明确：自9月24日24时起，国内汽、柴油（标准品）价格每吨应分别上调830元、800元，调控后实际上调395元、385元——传导幅度被压减约一半，直接改变了加油业务零售端的价格上限与单吨价差空间。同时正文明确要求相关企业"严格执行国家价格政策"，各地加大市场监督检查力度、严厉查处不执行国家价格政策的行为，消费者可通过12315举报，价格合规由软要求变为硬约束。间接观察：本轮限价上调幅度显著低于机制测算，若炼厂装车价/批发价随国际原油上涨同步抬升，批零价差（公司利润来源）将被压缩，需按实际采购成本重算折扣空间和站点定价动作。
  充电: 未直接涉及。正文只涉及成品油价格调控与价格政策执行，未提及建桩、服务费、场站电价结构、超充或行业标准。间接观察（仅间接）：成品油零售价格上调会小幅抬升燃油车使用成本，对充电业务无任何
    decision_variables 改变，不构成本轮政策的业务影响。
  电力_储能_V2G_交易: 未直接涉及。正文未出现现货规则、中长期签约、售电分成、分布式入市，也未出现储能、虚拟电厂（VPP）、V2G、双向充电等任何等价机制。
行动建议:
- A 趁早：按本轮汽、柴油实际上调395元/吨、385元/吨的幅度，逐站校准零售挂牌价与各省最高零售价格的挂接关系，核对价格台账与明码标价，把"不执行国家价格政策"的查处风险与12315举报应对落到站级责任人。
- B 研究：跟踪调价后炼厂装车价/批发价的实际跟随幅度，测算批零价差与折扣空间的收窄区间，评估对单站毛利及下沉城市展业可行性的影响，形成下一轮调价前的调运与备货建议。
didi_impact_one_liner: 成品油限价上调被调控压减约一半，加油零售端价格上限与毛利空间同步承压、价格执行合规为硬约束；充电与电力（储能/VPP/V2G/交易）本轮未直接涉及。
