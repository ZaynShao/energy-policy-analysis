影响分析:
  加油: 未直接涉及。本文件聚焦趸售电价改革与分时电价机制调整，系电网侧电价政策，不涉及成品油定价或加油业务。
  充电: 间接。本文件明确工商业电量通过市场交易或代理购电获得，并调整分时电价浮动水平（尖峰月份0.09729元/千瓦时、平段月份0.0634元/千瓦时，自2022年4月起执行）。充电运营商若执行分时电价，其购电成本将随浮动系数变化；但文件针对地方电网与省电网结算层面，未专项规定充电电价。
  电力_储能_V2G_交易: 间接。文件涉及工商业电量市场交易机制和分时电价浮动规则，市场交易价格和输配电价构成将影响储能充放电成本；但文件未明确储能、虚拟电厂、V2G等聚合主体的市场准入或运营规则，2023年新输配电价标准亦未明确。
行动建议:
- 'A 研究: 充电业务线趁早建立分时电价专项台账，跟踪0.09729元/千瓦时（1/7/8/9/12月）与0.0634元/千瓦时（其余月份）差异下的峰谷套利空间与定价策略；'
- 'B 趁早: 密切跟踪2023年新输配电价标准落地情况，提前测算其对工商业用户购电成本的影响并调整报价模型；'
- 'C 研究: 地方电网工商业用户分类结构若有重大变化须报省级发改委核查，趁早评估分类调整对区域市场交易格局的潜在影响。'
didi_impact_one_liner: 分时电价浮动系数季节性分化（尖峰0.09729元/千瓦时、平段0.0634元/千瓦时）将重塑充电运营购电成本结构，市场交易+输配电价的工商业电价形成机制对储能套利空间产生间接压力。
