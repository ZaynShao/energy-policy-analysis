影响分析:
  加油: 直接涉及。通知要求零售企业从具批发资质企业购油、查验供油资质、不得代销，并须完成自查整改报告于7月26日前提交、配合年检。对加油站的合规审查流程和进油渠道管理产生直接影响。
  充电: 未直接涉及。政策聚焦传统成品油（汽油、柴油）供应渠道与资质核查，未涉及充电基础设施或充换电业务。
  电力_储能_V2G_交易: 未直接涉及。全程以「成品油」为对象，涉及仓储、批发、零售环节，无储能、VPP、V2G、电力交易等新能源机制表述。
行动建议:
- 趁早建立供油方资质核查机制：对照《成品油市场管理办法》，梳理加油站进油渠道，排查是否存代销或向无资质方购油的合规风险，形成书面备查记录。
- 趁早完成自查整改报告：7月26日前通过传真提交上海市经济信息化委经济运行处（电力处），报告须加盖公章，逾期将影响年检。
- 趁早与区经委对接：将自查结果纳入年检材料，未发现问题的零售企业须随年检附件一并报送，确保合规闭环。
didi_impact_one_liner: 上海地区合规运营加油站须在7月26日前完成供油渠道资质自查及整改报告提交，逾期影响年检；充电、电力及新能源业务未直接涉及。
