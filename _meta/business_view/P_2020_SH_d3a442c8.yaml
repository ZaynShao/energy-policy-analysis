影响分析:
  加油: 直接涉及。要求规范供应渠道，零售企业须从有批发资质企业购油、不得代销；仓储企业须验证来源并签订自用承诺书；批发企业须查验购买方资质。同步要求自查整改并报送报告，未发现问题的零售企业须随年检材料一并报送自查报告，违规行为将依法严肃处理。
  充电: 未直接涉及。全篇文件针对成品油（汽油、柴油）市场管理，未提及充电设施、充电服务或新能源汽车相关事项。
  电力_储能_V2G_交易: 未直接涉及。文件聚焦传统石油市场合规监管，不涉及储能、虚拟电厂、V2G或电力交易机制。
行动建议:
- A 趁早部署:对照文件要求，全面梳理加油站点供应渠道资质，排查是否存在代销行为或向无资质方供油的情况
- B 趁早完善:建立健全购油方资质查验记录制度、供油方资质备案制度及油品自用承诺书管理机制
- C 趁早准备:按期完成自查整改报告，准备好随年检材料报送的合规附件，确保7月26日前完成上报
- D 研究:密切跟踪区级监管部门将落实情况纳入年检的具体执行标准和执法尺度，提前做好合规应对准备
didi_impact_one_liner: 上海成品油市场监管收紧，加油业务需严控供应渠道资质、自查整改并做好年检准备，7月26日为关键截止节点。
