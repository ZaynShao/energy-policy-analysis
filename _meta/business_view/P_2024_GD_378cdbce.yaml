影响分析:
  加油: 未直接涉及。但充电设施智能化与V2G推广可能间接加速加油向充电转型趋势。
  充电: 直接涉及。新建充电设施须具备有序充电能力并符合地方标准；存量直流公共快充站完成智能化改造可获单个企业最高500万元补贴；全市超充、快充及交流充电设施须全部实现车网互动（V2G）功能，具备V2G功能的充电设施可获单个企业最高500万元补贴；换电站须具备有序充电能力，鼓励存量站改造为双向PCS模块。
  电力_储能_V2G_交易: 直接涉及。V2G充电桩、分布式资源智能控制终端等关键设备产业化项目可获最高1500万元支持；新型储能智慧化改造获支持（含与充电设施融合场景）；推动光伏以虚拟电厂模式参与电力市场交易；支持充电场站等加装智能控制终端并接入市虚拟电厂管理平台，为参与需求响应或辅助服务奠定基础。
行动建议:
- 趁早针对旗下存量直流公共快充站申报智能化改造补贴，满足有序充电标准并实现V2G功能，单个企业上限500万元。
- 趁早对所有新建充电站（含超充、快充、交流桩）同步配置有序充电与V2G功能，并确保换电站具备双向功率控制能力，以符合地方标准并争取V2G设施补贴。
- 趁早研究充电负荷聚合后接入深圳市虚拟电厂管理平台的路径，提前评估参与电力市场交易（如需求响应、辅助服务）的可行性与收益模式。
didi_impact_one_liner: 充电设施智能化与V2G升级成硬性要求并附补贴窗口，需趁早改造申报；储能及虚拟电厂交易布局可借充电网络切入，加油业务短期未受直接冲击但需关注转型趋势。
