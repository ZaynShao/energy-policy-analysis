影响分析:
  加油: 未直接涉及。该政策聚焦虚拟电厂、充电设施、车网互动及储能领域，未提及加油站或汽柴油相关业务。
  充电: 直接涉及。政策明确要求新建充电基础设施具备有序充电能力；存量直流公共快充站升级改造提升功率调节能力；具备V2G功能的充电设施单个企业最高可获500万元支持；新建换电基础设施须具备有序充电能力，鼓励存量换电站改造为双向PCS模块。
  电力_储能_V2G_交易: 直接涉及。政策全面覆盖虚拟电厂生态：关键技术研发单个项目最高1000万元支持；V2G关键设备产业化单个项目最高1500万元；建筑楼宇、园区接入虚拟电厂管理平台；分布式光伏以虚拟电厂模式参与电力市场；用户侧储能多元化发展含充电设施场景；虚拟电厂聚合商接入规模扩大。
行动建议:
- A 趁早:在新建公共充电场站中强制嵌入V2G硬件预埋方案,规避后期改造高成本;对存量快充站制定分批次智能化改造计划,优先申请500万元补贴窗口;
- B 趁早:对接市虚拟电厂管理平台,将充电场站的可调节负荷资源纳入分布式资源调度序列,提前锁定聚合商资格和需求响应收益分成;
- C 研究:摸排存量换电站PCS双向改造技术路径与成本,评估改造后参与调峰辅助服务市场的经济性;
- D 研究:探索充电场站+分布式储能+光伏一体化聚合运营模式,研究作为虚拟电厂聚合商参与绿电交易的合规路径。
didi_impact_one_liner: 政策以最高1500万元补贴强力驱动V2G充电桩和储能设备量产,充电场站须尽快完成有序充电和V2G功能升级,同步接入市虚拟电厂管理平台以抢占聚合商资源位和需求响应市场收益。
