影响分析:
  加油: 未直接涉及。政策聚焦虚拟电厂聚合分布式资源(充电桩/储能/建筑/光伏),未提及加油站点或燃油车相关改造补贴政策。
  充电: 直接利好。新建直流公共快充站须具备有序充电能力,存量快充站智能化改造可获单个企业最高500万元支持;V2G充电桩产业化项目可获单个最高1500万元支持;全市超充、快充、交流充电设施须实现车网互动功能,充电场站加装智能控制终端可接入市虚拟电厂管理平台。
  电力_储能_V2G_交易: 核心受益。V2G充电桩/分布式资源智能控制终端/计量通信芯片模组等关键设备产业化获最高1500万元支持;分布式光伏须统一接入虚拟电厂管理平台并参与电力市场交易,探索与碳市场衔接;用户侧储能多元场景(大数据中心/通信基站/充电设施/工业园区)获支持;虚拟电厂聚合商可参与绿电交易。V2G机制明确存在,双向充电桩和储能变流器升级均有正文依据。
行动建议:
- 趁早对接市虚拟电厂管理平台,将存量充电场站纳入分布式资源调度序列,申请智能控制终端加装补贴。
- 趁早研究直流公共快充站有序充电改造和V2G功能升级方案,编制申报材料争取单个企业最高500万元的智能化改造支持。
- 趁早布局用户侧储能场景(充电场站备电/工业园区光储一体化),对接电力交易规则,参与虚拟电厂聚合商角色。
- 趁早摸排可接入虚拟电厂管理平台的建筑楼宇和通信基站资源,结合合同能源管理模式扩大分布式资源接入规模。
didi_impact_one_liner: 深圳支持虚拟电厂政策直接驱动充电场站加速具备V2G和有序充电能力,存量快充站智能化改造成补贴重点,分布式资源接入虚拟电厂平台成为充电企业获取政策红利的关键路径。
