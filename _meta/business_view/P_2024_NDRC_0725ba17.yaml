影响分析:
  加油: 文件支持老旧营运船舶报废更新中包含'燃油动力船舶'（按1500-3200元/总吨补贴），同时支持报废国三及以下柴油货车更新为低排放货车，间接维持传统燃油消费需求；但政策整体导向仍为推动新能源清洁能源替代，燃油消费增长空间有限。
  充电: 未直接涉及。文件主要支持新能源公交车及动力电池更新（8年以上车龄平均补贴6万元/辆）、新能源清洁能源船舶发展，间接拉动公共领域新能源车辆充电需求，但不涉及充电桩建设、充电运营或充换电基础设施投资。
  电力_储能_V2G_交易: 未直接涉及。文件将能源电力领域设备更新纳入支持范围，但仅泛指既有电力设施更新，未明确涉及储能系统建设、虚拟电厂、V2G机制、电力交易或相关运营主体准入，不构成直接业务影响。
行动建议:
- A 趁早:研判燃油动力船舶补贴政策窗口期，统筹安排传统加油网络与新能源替代的业务结构优化节奏
- B 研究:跟踪地方自主以旧换新资金分配动向，评估新能源公交车、船舶更新对区域充电需求格局的间接影响
didi_impact_one_liner: 政策以3000亿超长期特别国债加力支持设备更新与消费品以旧换新，主要惠及交通运输领域新能源替代，间接影响能源消费结构，但未直接涉及充电基础设施、储能或电力交易机制。
