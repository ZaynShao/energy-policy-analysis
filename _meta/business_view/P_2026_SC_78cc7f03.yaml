影响分析:
  加油: 未直接涉及。间接观察：本办法提出的可再生能源非电消费目标包含生物燃料等非电利用，可能对交通燃料结构产生远期引导，但正文未明确针对成品油或加油业务提出量化要求。
  充电: 未直接涉及。间接观察：可再生能源电力消费最低比重目标可能提升绿电整体消费规模，但正文未提及充电设施、新能源汽车或充电运营，故不构成直接业务影响。
  电力_储能_V2G_交易: 直接涉及电力交易。正文明确将绿证绿电交易（划转）列为完成重点用能行业可再生能源电力消费最低比重目标的方式之一，并要求国务院能源主管部门负责绿证交易和核销统计；同时省级可再生能源电力消纳责任权重制度将强化绿电消纳责任。这为绿电交易、绿证交易创造了明确政策空间。储能、V2G、虚拟电厂未在正文出现，不构成直接影响。
行动建议:
- A 趁早:梳理重点用能行业客户名单，评估其可再生能源电力消费最低比重目标需求，提前对接绿电交易或绿证采购服务。
- B 趁早:跟踪绿证绿电交易及核销统计细则，研究自建绿电直连或自发自用模式对现有购售电业务的协同价值。
- C 研究:评估省级消纳责任权重提升后对区域内绿电供需、价格及电力交易结构的中期影响，为交易策略储备数据模型。
didi_impact_one_liner: 本办法以重点用能行业和省级双目标压实绿电消费责任，直接利好绿证绿电交易，但未涉及充电及储能V2G业务。
