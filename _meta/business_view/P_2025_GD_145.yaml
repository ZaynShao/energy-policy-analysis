影响分析:
  加油: 未直接涉及。该方案聚焦工业、用能设备、能源电力、交通运输、船舶等领域的大规模设备更新，以财政贴息、风险补偿、超长期特别国债等资金支持设备购置替代，未对加油站在内的油品销售网络提出更新或改造要求。
  充电: 未直接涉及。方案提及支持新能源、清洁能源船舶发展和老旧营运船舶报废更新，属于交通领域设备更新范畴；充电桩或新能源汽车充电基础设施建设未在正文中明确列为补贴或支持对象。
  电力_储能_V2G_交易: 未直接涉及。正文明确将「能源电力」「用能设备」列为设备更新支持领域，并提及推动新能源船舶发展，但未出现虚拟电厂（VPP）、储能项目市场准入、V2G机制、电力交易平台或聚合商相关表述。回收循环利用被列为支持方向，但不等于储能资产直接进入市场。
行动建议:
- 'A 趁早: 研究本方案贴息与风险补偿工具对能源电力设备更新项目的适配性，储备融资方案以对接财政资金渠道'
- 'B 研究: 关注广东省后续是否会出台「设备更新支持范围」配套细则，明确能源电力设备中与储能、充电桩相关的边界'
- 'C 趁早: 密切跟踪老旧营运船舶报废更新补贴实施方式调整进展，提前布局新能源船舶供能服务能力'
- 'D 研究: 梳理本方案与粤财金〔2024〕19号、粤金管〔2024〕14号两份贴息文件的衔接关系，评估公司现有设备是否在贴息支持范围内'
didi_impact_one_liner: 广东省大规模设备更新方案以工业、交通基础设施设备更新为主，财政贴息与风险补偿机制覆盖在列领域，但加油、充电、储能/V2G/电力交易等业务未获直接政策支持。
