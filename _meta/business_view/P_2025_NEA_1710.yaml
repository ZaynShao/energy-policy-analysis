影响分析:
  加油: 未直接涉及。政策全文聚焦电网规划建设与电力市场，未提及成品油批发、炼厂装车价、加油站合规或 KA 支付接口；对加油业务的间接影响仅是配电网投资增强可能改善下沉城市与公路沿线用电条件，与加油展业无直接决策变量关联。
  充电: 直接相关。正文明确把“支撑充电基础设施超过4000万台”列为2030年目标，并要求配电网“承载多元化源荷开放接入、双向互动”、优化并网接入技术标准和管理流程。这会改变建桩节奏与选址的电网接入可行性、场站侧电价与需量结构，以及接入审批的合规门槛；超充和大功率升级的并网容量与改造成本将更依赖配电网承载能力。
  电力_储能_V2G_交易: 直接相关（部分）。正文明确“服务建设全国统一电力市场”“提升电网对各类并网主体公平开放水平”“服务分布式能源、源网荷储一体化、绿电直连、虚拟电厂等电力新业态健康发展”，并设定2030年接纳分布式新能源能力9亿千瓦、省间互济新增4000万千瓦左右。这关系到分布式新能源入市与聚合商准入，以及跨省交易和现货市场的物理基础；正文未明确出现储能、V2G、双向充电桩的独立机制，也未给出各省现货规则、中长期与现货比例、售电公司利润上限或火电长协规则，这些仍需看后续配套文件。
行动建议:
- A 趁早:把配电网可接入容量和并网审批要求纳入明年建桩选址评审，优先在配电网“开放接入、双向互动”明确的区域锁定场站，趁早与属地供电公司确认接入标准和管理流程。
- B 研究:围绕“虚拟电厂、源网荷储一体化、绿电直连”的并网开放表述，研究聚合商准入门槛与分布式新能源入市路径，暂不新增正文未明确的储能、V2G项目。
- C 跟踪:2030年充电设施4000万台和分布式新能源接纳9亿千瓦目标的省级分解与配套文件，据以修订充电网络覆盖与电力交易进省判断。
didi_impact_one_liner: 电网高质量发展意见把配电网开放接入与虚拟电厂等新业态写入国家目标，充电建桩接入与电力聚合业务需趁早对齐属地并网规则。
