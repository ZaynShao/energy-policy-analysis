影响分析:
  加油: 未直接涉及。该政策聚焦煤电机组的两部制电价改革，与成品油业务无关。
  充电: 未直接涉及。该政策针对煤电容量电价机制，虽提到工商业用户按用电量分摊容量电费，但未明确涉及充电服务商的电价结算或运营模式。
  电力_储能_V2G_交易: 未直接涉及。政策核心是煤电机组的容量电价水平和分摊机制，虽提及加快电力市场体系建设，但未明确涉及储能、虚拟电厂、V2G或电力交易的直接机制安排。
行动建议:
- 趁早研判煤电容量电价调整对电力供应成本结构的影响，评估对工商业用户侧用电成本传导的可能性
- 趁早跟踪容量电价与电量电价两部制改革的推进节奏，关注后续辅助服务市场等配套政策
- 趁早评估煤电基础保障性电源定位强化后，系统调节性资源的市场空间变化
didi_impact_one_liner: 煤电容量电价政策暂不直接涉及加油、充电及储能/V2G/电力交易业务，但电力系统成本结构变化和容量市场建设动向值得关注。
