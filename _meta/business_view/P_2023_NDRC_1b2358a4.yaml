影响分析:
  加油: 未直接涉及。该政策针对煤电机组的容量电价机制，属于电力系统改革范畴。加油业务属于石油燃料零售，不涉及煤电价格或容量电价体系，无法定义性影响。
  充电: 间接影响。煤电容量电价纳入系统运行费用由工商业用户分摊，充电运营商作为工商业用户将承担相应容量电费分摊，或传导至充电电价成本。政策推动煤电向调节性电源转型，客观上有利于提升电力系统稳定性，支撑充电基础设施的供电可靠性，但具体影响程度取决于各地市场传导机制。
  电力_储能_V2G_交易: 未直接涉及。该政策核心是建立煤电两部制电价，虽提及构建容量市场、辅助服务市场协同机制，但仅针对煤电机组。政策未明确涉及储能、虚拟电厂、V2G或电力交易的具体机制安排或准入规则。
行动建议:
- 'A 趁早: 充电运营商研究容量电价纳入系统运行费用后的成本分摊逻辑，评估对充电定价策略的潜在影响，预留成本缓冲空间'
- 'B 研究: 关注后续容量市场、辅助服务市场与煤电两部制电价协同推进的政策动态，跟踪充电侧电价传导机制演变'
didi_impact_one_liner: 充电运营承压容量电费分摊，需提前测算成本传导影响；电力系统调节能力增强有利充电供电稳定性，但短期成本上升压力需关注
