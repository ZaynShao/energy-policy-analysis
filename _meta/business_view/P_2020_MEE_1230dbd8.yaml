影响分析:
  加油: 未直接涉及。该方案明确限定于发电行业（含自备电厂）的碳排放配额管理,针对拥有燃煤/燃气发电机组的重点排放单位,加油业务不在方案适用范围内。
  充电: 未直接涉及。该方案聚焦发电侧碳排放配额分配机制,未涉及充电基础设施、新能源汽车用电或充电运营商。方案仅核算发电机组碳排放（含净购入电力产生的间接排放），不涉及用电侧激励或约束。
  电力_储能_V2G_交易: 未直接涉及。该方案针对发电机组碳排放配额分配,虽提及碳排放权注册登记结算系统和配额交易机制（多退少补）,但未明确涉及储能、V2G、虚拟电厂或电力辅助服务市场等主体参与碳市场的具体机制。
行动建议:
- A 趁早:若关联企业涉及发电业务,应趁早完成碳排放核算体系建设,对照2.6万吨CO2当量门槛确认纳入主体范围,熟悉基准法配额计算公式及修正系数规则。
- B 趁早:关联电力业务若涉及碳资产管理,应趁早研究预分配流程（按2018年供电量70%）与最终核定规则,评估配额缺口履约风险。
- C 研究:持续跟踪2021年后碳市场扩容进展及配额分配机制演进,特别是免费分配向有偿分配过渡的政策信号。
didi_impact_one_liner: 碳市场配额管理聚焦发电行业,关联加油和充电业务暂无直接影响,但关联发电业务需关注碳配额分配机制和履约规则。
