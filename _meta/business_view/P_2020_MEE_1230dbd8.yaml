影响分析:
  加油: 未直接涉及。该方案聚焦发电行业的碳排放配额管理，加油业务（加油站）不属于发电侧碳排放管控范围，无直接政策约束或机会。
  充电: 未直接涉及。方案针对发电侧机组设定碳排放配额，充电运营/充电桩属于电力消费侧，不在配额管理对象内。但政策通过碳价格传导机制（间接）可能影响电网碳强度，长期或影响充电运营商的电力来源碳成本。
  电力_储能_V2G_交易: 未直接涉及。方案明确纯生物质发电机组暂不纳入配额管理，储能、虚拟电厂、V2G、电力交易等机制在正文中未出现，无直接规制或激励条款。
行动建议:
- A 趁早研判碳价传导路径：跟踪全国碳市场碳价走势，分析化石能源发电碳成本上升对电网购电价格的影响，为充电/储能业务的电力采购成本变化做准备。
- B 研究新能源配储碳效益：方案虽未直接惠及储能，但随着碳市场扩容和碳价提升，可再生能源+储能组合的低碳优势或将转化为碳资产或降低碳成本，研究相关计量和核证路径。
didi_impact_one_liner: 碳市场发电配额管理暂不直接影响加油、充电和储能业务，但碳价传导将间接影响能源供应侧成本结构。
