影响分析:
  加油: 直接涉及。报废2012年6月30日前汽油乘用车或2014年6月30日前柴油及其他燃料乘用车，购买2.0升及以下排量燃油乘用车可获1.5万元补贴；置换更新补贴最高1.3万元。政策将刺激存量老旧燃油车报废更新，带动加油站油品消费结构性变化，高排量老旧车辆淘汰换购需求有望释放。
  充电: 直接涉及。报废2018年12月31日前注册登记的新能源乘用车，购买新能源乘用车可获2万元补贴；置换更新补贴最高1.5万元。政策对新能源汽车消费支持力度更大，将显著推动新能源汽车销量增长，进而带动充电服务需求提升。报废旧新能源车更新也可能加速充电桩更新换代需求。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦于汽车报废更新和置换更新的消费补贴机制，未明确涉及储能、虚拟电厂、V2G、电力交易或双向充电桩等机制，不构成直接业务准入、建设或运营义务。（间接）新能源汽车保有量增长或为未来充电负荷管理和有序充电提供更大市场空间，但需另行政策明确。
行动建议:
- '趁早: 把握报废更新窗口，联动油企合作推出老旧燃油车报废引导方案，锁定高补贴标准下的换购需求'
- '趁早: 对接置换更新政策，联合汽车经销商布局新能源车销售合作，配套充电服务权益包以增强粘性'
- '研究: 跟踪报废旧新能源车加速更新趋势，评估充电桩升级改造需求规模及时间窗口'
didi_impact_one_liner: 政策对新能源车补贴力度更大（报废更新2万、置换更新1.5万），将显著刺激新能源汽车消费和充电需求增长，同时带动老旧燃油车报废更新，加油业务面临结构性调整压力。
