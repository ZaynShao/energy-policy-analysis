影响分析:
  加油: 未直接涉及。该政策聚焦新能源汽车（电动车）与电网融合，加油业务不在本政策调整范围内，无直接关联。
  充电: 直接利好。政策明确要求2025年底前全面应用居民充电峰谷分时电价，持续优化定价机制；推动智能有序充电技术推广应用；加快充换电场站关键技术研发和标准制定；探索双向充放电综合示范，覆盖公共领域和居民社区等重点场景。充电运营商需关注峰谷电价机制调整、有序充电标准合规及双向充放电试点机遇。
  电力_储能_V2G_交易: 直接涉及多个维度。V2G：政策明确探索双向充放电（V2G）技术路径，要求2025年底前完成双向充放电场景关键标准制修订。储能：明确提出2030年新能源汽车成为电化学储能体系重要组成部分，力争提供千万千瓦级双向灵活性调节能力。电力交易：政策部署探索参与需求响应、辅助服务市场、电力现货市场、绿证交易和碳交易的实施路径，验证双向充放电等效储能潜力。聚合商角色在探索聚合交易等市场环境构建中被提及。整体看，政策为储能和电力交易打开了参与通道，但具体准入机制和参与路径尚待细化。
行动建议:
- 'A 趁早: 跟进充电峰谷分时电价政策执行节奏，提前调整居民充电和工商业充电的定价策略与负荷管理方案，适配分时电价全面应用后的运营模式'
- 'B 趁早: 布局智能有序充电技术改造和双向充放电（V2G）能力建设，对标政策要求的关键技术标准，参与公共领域和居民社区试点示范项目申报'
- 'C 趁早: 研究参与需求响应和辅助服务市场的资质条件与系统接口要求，为新能源汽车作为灵活性调节资源参与电网调度做好准备'
- 'D 研究: 密切跟踪电力现货市场、绿证交易、碳交易与车网互动衔接机制的政策细化，提前评估储能和聚合交易业务拓展的法律合规边界'
didi_impact_one_liner: 政策明确充电峰谷分时电价2025年全面落地、V2G标准2025年完成、双向充放电试点启动，新能源汽车作为千万千瓦级储能资源参与电力市场的通道逐步打开，充电运营和储能交易赛道迎来规模化发展窗口期
