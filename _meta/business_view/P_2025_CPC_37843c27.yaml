影响分析:
  加油: 未直接涉及。政策聚焦新能源汽车充电基础设施和车网互动，未涉及传统燃油车业务。
  充电: 重庆作为首批车网互动规模化应用试点城市，将加速充电基础设施体系建设。已建成充电桩38.12万个、换电站219座、超充站1452座，目标2025年推广新能源汽车100万辆以上。重点推进智能有序充电全覆盖，对党政机关、公共充电站等存量充电桩开展智能化改造，扩大V2G价格机制适用范围。充电运营企业面临参与虚拟电厂聚合和电力市场交易的机遇。
  电力_储能_V2G_交易: 重庆已率先发布V2G上网价格机制，明确结算价格。本次作为首批试点城市将进一步扩大V2G价格机制覆盖范围。政策明确鼓励充换电企业成为虚拟电厂运营商参与需求响应和电力市场交易（辅助服务和现货市场）。已建成V2G项目80个、充储一体化站201个，政策推动公交场站、机场、港口等场景建设V2G/S2G项目，党政机关、写字楼、商业综合体等场景建设V2B项目，充换电企业参与虚拟电厂运营有望扩大市场规模。
行动建议:
- A 趁早对接重庆V2G上网价格机制，扩大充放电价差和适用范围，争取参与V2G试点项目的机会
- B 研究成为虚拟电厂运营商的资质要求和申报流程，提前布局聚合充换电负荷资源参与电力市场交易
- C 趁早布局党政机关、写字楼、商业综合体等场景的V2B项目建设，响应政策明确的多元场景拓展方向
- D 趁早参与智能有序充电管理体系建设，对存量充电桩开展智能化改造，抢占市场先机
didi_impact_one_liner: 重庆入选首批车网互动试点城市，V2G价格机制率先落地，充电和充换电企业迎来参与虚拟电厂和电力市场的政策窗口期。
