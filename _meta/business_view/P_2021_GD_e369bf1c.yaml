影响分析:
  加油: 直接涉及。政策要求全市加油站安装智能税控系统，实时采集加油明细和泵码数据，强化税务监管和经营合规。系统安装使用不收费，但加油站须配合安装、升级和维护，违规将被多部门依法查处。
  充电: 未直接涉及。政策针对安装燃油加油机的加油站，不涉及充电设施或新能源业务。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦加油站成品油零售税务合规，无储能、V2G或电力交易机制。
行动建议:
- A 趁早:摸清系统接入技术要求，提前与系统开发商和加油机厂商对接，确保不影响正常经营
- B 趁早:对照多部门监管要求（税务、工信、公安、应急等），自查经营数据合规性，提前整改隐患
- C 趁早:研究智能税控系统数据采集逻辑，优化内部经营数据管理流程，降低涉税风险
didi_impact_one_liner: 广州加油站全面接入智能税控系统，实时采集加油数据，多部门协同监管，加油业务合规成本上升。
