影响分析:
  加油: 未直接涉及。政策聚焦新能源汽车与电网融合互动，加油业务不在本通知覆盖范围内。
  充电: 直接利好充电基础设施行业。一是政策明确要求推动智能有序充电桩建设、替代或改造,并推动充换电场站接入容量优化提升试点;二是峰谷分时电价机制将重塑充电行为模式,目标年度充电电量60%以上集中在低谷时段,其中私人桩电量80%以上在低谷时段充电;三是居住社区智能有序充电管理体系建设将释放居住区充电设施接入潜力。
  电力_储能_V2G_交易: 直接涉及V2G和储能潜力验证。政策设定V2G项目参与门槛(放电总功率不低于500千瓦、年度放电量不低于10万千瓦时),明确推动V2G资源聚合参与电力现货、绿电交易及储能容量租赁等市场,验证V2G资源的等效储能潜力。负荷聚合商参与电力市场的商业模式获政策支持探索,有望形成可复制推广的V2G商业模式。
行动建议:
- A 趁早研究:围绕政策明确的电力现货、绿电交易、储能容量租赁等市场路径,提前布局V2G资源参与电力市场的技术方案和商业模式设计,把握政策窗口期。
- B 趁早对接:主动对接各地试点城市申报要求,特别是V2G项目放电功率和年度放电量的门槛标准,提前储备符合规模要求的V2G项目资源。
- C 研究:跟踪居住社区智能有序充电管理体系建设政策动态,评估居住区充电设施接入能力提升带来的市场空间,适时调整居住区充电业务布局。
didi_impact_one_liner: 车网互动规模化试点政策为充电业务带来智能充电桩改造和峰谷调节机遇,V2G项目明确获得参与电力市场的政策路径,负荷聚合商业模式有望率先在试点城市形成可推广范式。
