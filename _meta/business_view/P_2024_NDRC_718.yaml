影响分析:
  加油: 未直接涉及。该政策聚焦新能源汽车与电网融合互动，不涉及传统燃油车或加油站业务。
  充电: 直接涉及。政策明确推动智能有序充电桩建设改造、居住社区智能有序充电管理体系，以及充换电场站接入容量优化试点，并设定充电电量向低谷时段引导的目标（年度60%以上，私人桩80%以上）。
  电力_储能_V2G_交易: 直接涉及。政策系统部署V2G规模化：明确V2G项目放电总功率不低于500千瓦、年度放电量不低于10万千瓦时的门槛；鼓励V2G项目聚合参与电力现货、绿电交易及储能容量租赁市场；探索V2G资源作为等效储能的潜力；研究放电价格机制，建立居民充电峰谷分时电价并探索放电价格；支持负荷聚合商参与电力市场的商业模式培育。
行动建议:
- 'A 趁早布局V2G聚合业务: 基于政策明确的放电功率/电量门槛和参与电力现货、绿电交易、储能容量租赁的路径，抓紧构建V2G资源聚合能力，提前对接电力市场交易规则'
- 'B 趁早对接居住社区场景: 政策部署智能有序充电试点社区和管理体系，充电运营商应趁早与住宅小区物业、业委会建立合作，锁定私人桩规模化接入资源'
- 'C 趁早研究放电商业模式: 政策探索对电网放电价格机制，充电运营商应提前测算V2G放电收益模型，探索可复制推广的V2G商业模式'
- 'D 趁早申请试点资格: 政策以城市为主体开展试点，具备条件的区域运营商应趁早与地方政府沟通，参与试点申报，争取先发优势'
didi_impact_one_liner: 政策系统打开V2G规模化路径，明确聚合商准入、电力市场参与和充放电价格机制三大支点，充电运营和聚合商业务迎来规模化发展窗口期，电力交易和等效储能潜力获政策背书。
