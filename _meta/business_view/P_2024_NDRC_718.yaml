影响分析:
  加油: 未直接涉及。该政策聚焦新能源汽车与电网融合互动，加油业务不在讨论范围内。
  充电: 直接利好。政策明确要求参与试点地区全面执行充电峰谷分时电价，力争年度充电电量60%以上集中在低谷时段（私人桩80%在低谷），并推动智能有序充电桩建设、替代或改造，以及智能有序充电试点社区建设，将大幅改变充电运营的时间分布和负荷曲线，对充电桩的智能化改造和运营策略产生直接影响。
  电力_储能_V2G_交易: 深度涉及。政策多处部署V2G规模化：V2G项目放电总功率不低于500千瓦、年度放电量不低于10万千瓦时；推动V2G资源聚合参与电力现货、绿电交易及储能容量租赁；探索V2G放电价格机制；明确培育负荷聚合商参与电力市场的商业模式；依托动力电池溯源平台开展V2G电池状态评估。这些部署意味着V2G已从示范走向规模化商业运营阶段，储能侧和电力市场侧均获得明确的参与路径。
行动建议:
- A 趁早对接各地试点申报通道，联合车企、电池企业以V2G项目主体身份参与试点申报，提前锁定放电功率和年度放电量门槛的合规资格。
- B 趁早布局居住社区智能有序充电改造产品线，研发适配低谷时段集中充电需求的硬件和平台控制系统，切入智能有序充电试点社区的改造成本市场。
- C 趁早研究负荷聚合商参与电力现货和绿电交易的准入条件与交易规则，构建聚合新能源汽车充放电资源参与电力市场的技术平台，储备电力市场交易能力。
- D 趁早协同电池企业完善V2G场景下的电池质保体系，探索动力电池溯源平台接入方案，为V2G电池状态评估和残值管理建立数据基础。
didi_impact_one_liner: 政策为充电运营和V2G规模化应用提供了明确的市场准入和盈利路径，Didi需趁早布局智能有序充电改造、聚合商资质和V2G项目申报，以在车网互动规模化浪潮中占据先发优势。
