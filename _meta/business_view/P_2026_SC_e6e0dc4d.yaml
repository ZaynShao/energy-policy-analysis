  加油: 未直接涉及。政策为电网侧新型电网建设部署，未提及成品油批发、炼厂装车、加油站合规或零售政策，不改变加油业务相关决策变量。
  充电: 未直接涉及。正文未直接提及充电基础设施、充电服务费、场站电价或建设标准；仅以'配电网公共平台''新模式新业态'等宽泛表述提及电网新架构。间接观察：配电网公共平台功能强化可能间接有利于充电场站接网与扩容，但在具体地方配网规划与接入细则出台前，不改变现有建桩节奏与定价决策。
  电力_储能_V2G_交易: 未直接涉及。正文仅将'长时储能'列为加快研发应用的电网新技术，并提及'智能微电网''主配微协同'，但未出台现货规则、中长期与现货比例、偏差考核、售电公司收益分摊、火电长协或聚合商准入等具体机制/量化要求，不改变电力交易持仓与省份进入决策。间接观察：智能微电网与主配微协同是新业态承载力提升方向，可能为后续分布式资源聚合与V2G政策铺垫，但当前不构成可直接行动的业务条款。
行动建议:
- 趁早跟踪国家能源局及属地省能源局关于'主配微协同''配电网公共平台'的后续实施细则，就公司充电场站与分布式储能资源的并网接入条件进行预判。
- 趁早建立与省级电网规划部门的沟通渠道，跟进智能微电网与配电网开放试点区域的名单与规则，识别充电场站升级和电力聚合能力建设的潜在窗口。
- 研究长时储能与配电网新架构的技术趋势，评估其对公司电力业务中长期电源侧/用户侧资源组合的适配性，待具体市场规则明确后再形成投资动作。
