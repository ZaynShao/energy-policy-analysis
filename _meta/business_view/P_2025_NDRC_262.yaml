影响分析:
  加油: 未直接涉及。该政策聚焦于可再生能源绿色电力证书市场建设，与传统加油业务（石油、成品油）无直接关联。
  充电: 直接涉及。政策明确要求'依法稳步推进绿证强制消费，逐步提高绿色电力消费比例并使用绿证核算'，充电业务作为电力消费的重要场景，面临绿证核算要求；同时绿色电力交易规模扩大为充电运营商参与绿电交易提供制度依据。
  电力_储能_V2G_交易: 直接涉及。政策要求'加快提升以绿色电力和对应绿色电力环境价值为标的物的绿色电力交易规模'，推动风电、太阳能发电等可再生能源发电项目参与绿色电力交易，为新能源场站配套的储能设施创造了绿证环境价值变现路径；绿证跨省流通机制打开了全国性交易空间。
行动建议:
- 'A 趁早: 研究充电场站绿色电力消费认证路径，评估通过采购绿证实现充电业务''绿电化''的可行性及成本结构'
- 'B 趁早: 对接电网企业和电力交易中心，提前布局新能源场站配套储能项目的绿证核发与交易能力建设'
- 'C 研究: 跟踪''到2027年绿证市场交易制度基本完善''阶段目标下的强制消费比例要求，预判充电业务合规成本变化'
didi_impact_one_liner: 政策推进绿证强制消费和绿色电力交易规模化，将直接影响充电业务的绿色电力核算要求，同时为新能源场站及储能资产的绿证变现创造制度条件。
