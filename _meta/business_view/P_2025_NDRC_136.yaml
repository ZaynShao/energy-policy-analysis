影响分析:
  加油: 未直接涉及。该政策聚焦新能源（风电、太阳能）发电侧上网电价市场化改革，传统石油/天然气加油业务不属于政策调整范围。
  充电: 未直接涉及。该政策主要针对新能源发电侧电价机制，充电业务（新能源汽车充电服务）属于电力消费侧，政策正文未直接涉及充电价格、充电桩建设或运营。但需关注（间接）：新能源全面入市后电力供需格局变化可能影响充电运营商购电成本。
  电力_储能_V2G_交易: 直接涉及电力交易和绿色电力交易。新能源上网电量原则上全部进入电力市场，通过市场交易形成价格；政策明确完善绿色电力交易机制，申报和成交价格应分别明确电能量价格和绿证价格；健全中长期市场交易，缩短周期提高频次；建立新能源可持续发展价格结算机制（差价结算）。V2G和储能未在正文中直接出现。
行动建议:
- 'A 趁早研究: 新能源全面入市和绿色电力交易规则变化,梳理现有电力采购结构,评估从保障性收购向市场交易转轨的合规路径和成本波动风险'
- 'B 趁早对接: 主动与电力交易机构衔接,提前熟悉新能源可持续发展价格结算机制的差价结算模式,为参与绿色电力交易和多年期购电协议做准备'
- 'C 研究: 绿色电力证书价值体系变化趋势,评估绿证价格单独标注后对企业碳减排核算和绿电消费认证的潜在影响'
didi_impact_one_liner: 新能源发电侧电价全面市场化,绿色电力交易机制获完善,电力交易频次和期限灵活性提升,但充电/V2G/储能业务未获直接政策支持,需关注新能源入市对购电成本的间接传导。
