影响分析:
  加油: 直接涉及。武汉市行政区域内持有《成品油零售经营批准证书》的加油站须接受2025年6月至11月的年度检查，检查内容包括合法合规经营、安全生产、税务合规、油品质量、油气回收设施等。检查不通过将面临暂缓通过年检、责令整改，情节严重者可被吊销或注销经营批准证书。
  充电: 未直接涉及。该通知专门针对成品油（汽油、柴油）零售经营企业，充电站/充电桩运营不在检查范围内。
  电力_储能_V2G_交易: 未直接涉及。该通知为石油成品油流通行业监管政策，不涉及储能、虚拟电厂、V2G、电力交易等业务领域。
行动建议:
- A 趁早:对照检查要求逐项自查整改，提前准备《年度检查登记表》、证照副本、完税凭证、进销存台账、购油发票、自查报告等材料，确保7月31日前通过区级初检
- B 趁早:排查是否存在暂缓通过年检情形（如年销售汽油5000吨以上未装油气回收在线监测、地下油罐未防渗改造、证照信息不一致、无法提供合规油品来源证明、税务违法、油品抽检不达标等），有则限期整改
- C 趁早:如存在停歇业情况，及时书面报备原因申请暂缓年检，避免被吊销或注销《成品油零售经营批准证书》
didi_impact_one_liner: 武汉市加油站须在2025年7月31日前完成年度检查自查准备，重点关注油气回收、罐区防渗、税务合规、油品来源等合规事项，不合格者将被暂缓通过年检或吊销经营资格。
