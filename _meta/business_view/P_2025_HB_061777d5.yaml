影响分析:
  加油: 直接影响：武汉市成品油零售经营企业须在2025年6月至11月参加2024年度检查，提交真实完整的材料并通过区、市两级审查；若存在未安装油气回收在线监测、地下油罐防渗不达标、证照信息不一致、无法提供合规油品来源、税务违法或油品抽检不合格等情形，将被责令限期整改、暂缓通过年检；无故不参加或整改不到位的，可能被吊销或注销《成品油零售经营批准证书》。
  充电: 未直接涉及（间接：该政策仅聚焦成品油零售经营合规，不涉及充电业务，但可视为政府强化事中事后监管的延续，未来可能对充电基础设施领域推行类似年度检查机制）。
  电力_储能_V2G_交易: 未直接涉及（间接：政策未提及电力、储能、V2G或电力交易相关要求或机会，但成品油零售企业年检中的合规经营和安全管理要求可借鉴至未来综合能源站申请相关资质）。
行动建议:
- 'A 趁早: 全面自查2024年度经营台账、购油发票、油气回收及防渗设施等合规材料，确保年检提交文件真实、完整，避免因材料缺漏或违规被暂缓通过。'
- 'B 趁早: 针对正文列出的六类暂缓情形进行逐项整改，特别是年销售量5000吨以上未安装油气回收在线监测的加油枪，应迅速补充设备并获取验收报告。'
didi_impact_one_liner: 武汉成品油零售企业需在2025年11月前完成年度合规审查，重点防油气回收、防渗、油源及税务合规，否则面临停、吊销风险。
