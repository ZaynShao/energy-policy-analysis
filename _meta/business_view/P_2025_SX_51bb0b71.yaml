影响分析:
  加油: 未直接涉及。政策聚焦于存量新能源项目的发电侧电价机制，不涉及油气业务领域。
  充电: 未直接涉及。政策规范对象为新能源发电项目（风电、光伏）的上网电价，不涉及充电设施建设、运营或充电服务价格。
  电力_储能_V2G_交易: 直接涉及电力交易和绿色电力交易。政策明确存量新能源项目须参与电力市场交易，通过机制电价（差价结算）替代原有的保障价机制；明确绿色电力交易合约电量与机制电量的衔接扣减规则（第十四条），即绿电交易超出部分须从机制电量中扣减。储能、V2G未在正文中出现，未直接涉及。
行动建议:
- A 趁早研究绿色电力交易与机制电量的衔接规则，提前测算绿电交易量超出实际上网电量时的扣减影响，优化交易组合方案。
- B 趁早评估85%机制电量比例对集中式平价项目收益的影响，研判参与市场交易的报价策略和风险对冲空间。
- C 研究:关注增量项目政策的后续出台，为新建新能源项目做好机制电价申请和合规备案的准备工作。
didi_impact_one_liner: 新能源项目进入市场交易，绿色电力交易与机制电量挂钩，存量项目须重新审视交易策略和收益结构。
