影响分析:
  加油: 未直接涉及。该文件规范对象为新能源项目的机制电价实施，不涉及成品油业务或加油站相关政策。
  充电: 未直接涉及。虽然电力市场改革可能间接影响充电运营商的购电成本，但文件正文未直接提及充电桩、充换电设施或新能源汽车充电相关内容。
  电力_储能_V2G_交易: 直接涉及存量新能源项目的机制电价执行。文件明确：1）存量项目（2025年6月1日前投产）的机制电量比例为85%（集中式平价项目）；2）绿色电力交易合约电量与机制电量挂钩扣减机制；3）适用于集中式风电、集中式光伏、分散式风电、分布式光伏等新能源项目，涉及新能源参与电力市场的差价结算机制。
行动建议:
- A 趁早摸排存量新能源项目:梳理现有新能源项目资产，核实项目投产时间、核准容量与电力业务许可证载明容量的对应关系，按本细则审核认定程序提前准备申报材料，确保纳入存量项目管理
- B 趁早评估绿电交易合约:重新审视已签订和计划新签的绿色电力交易合约，测算合约电量与机制电量扣减后的综合电价收益，优化绿电交易策略
- C 研究增量项目政策衔接:关注2025年6月1日后投产的增量新能源项目政策安排，提前布局新增项目的电价市场化应对方案
