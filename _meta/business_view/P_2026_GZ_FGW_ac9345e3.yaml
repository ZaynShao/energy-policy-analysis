  加油: 直接涉及。贵州省成品油价格自2026年7月3日24时起下调，89号汽油每吨下调950元，0号柴油每吨下调915元。经营企业可在最高批发、零售价格上限内自主定价，但需严格执行国家价格政策，承担保供责任，并接受市场监管及消费者举报。
