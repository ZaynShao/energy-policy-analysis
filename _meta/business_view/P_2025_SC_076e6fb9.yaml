  电力_储能_V2G_交易: 直接涉及。正文明确印发《四川省电网侧新型储能项目清单（2025年度）》，包含17个电网侧新型储能项目，涵盖电化学储能、压缩空气储能、超级电容混合式储能等技术类型，明确要求相关市（州）加强指导协调推进项目建设、电网企业做好接入并网、项目业主按市场化原则推进实施。同时设定1年未实质性开工则调出清单的约束机制。
行动建议:
- A 趁早:趁早对接清单内项目业主和属地电网公司，锁定接入并网合作窗口期
- B 研究:研究清单项目的储能技术路线（电化学/压缩空气/超级电容混合式）的接入技术要求和调度规则差异
- C 研究:研究压缩空气储能等新型技术项目的商业运营模式和技术经济性
- D 趁早:趁早布局与储能项目业主的战略合作，承接储能设施运维或聚合调度服务
didi_impact_one_liner: 四川电网侧储能清单落地加速储能规模化，需提前锁定接入并网合作和运维服务机会
