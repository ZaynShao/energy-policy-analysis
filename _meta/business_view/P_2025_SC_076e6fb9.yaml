影响分析:
  加油: 未直接涉及。该文件聚焦电网侧新型储能项目发布与建设管理，不涉及任何加油业务、加油站或燃油相关内容。
  充电: 文件提及成都东部新区100MW/200MWh'光储充数智化综合能源项目'（项目4），但文件核心是发布储能项目清单而非充电基础设施专项政策。'光储充'中的充电仅为该综合能源项目附属功能单元，文件未对充电桩建设或运营作出直接部署。充电业务为间接关联。
  电力_储能_V2G_交易: '直接涉及。文件核心即为发布四川省2025年度电网侧新型储能项目清单，涉及电化学储能、压缩空气储能、固态电池储能、超级电容混合储能等多种技术路线，覆盖成都、宜宾、德阳等地共计17个储能项目（总规模约1500MW/3300MWh）。文件明确要求电网企业做好接入并网服务，项目业主按市场化原则推进实施，自印发之日起1年内未实质性开工的项目将调出清单。文件未直接涉及V2G、电力交易或虚拟电厂机制，储能功能定位为电网侧削峰填谷，未明确参与电力市场交易。文件直接利好储能项目投资方及建设方。 '
行动建议:
- 趁早:趁早对接清单内项目业主（如蜀道清洁能源、中创新航、大唐四川等），争取储能设备供应或EPC总包业务机会
- 趁早:趁早与电网企业沟通接入并网技术标准，确保储能项目并网服务顺利对接
- 研究:研究清单内不同技术路线（压缩空气/固态电池/超级电容混合储能）的技术经济性，识别差异化竞争机会
- 关注:关注项目1年内开工时限要求，提前布局储能项目建设资源与供应链
didi_impact_one_liner: 四川发布17个电网侧储能项目清单（2025年），明确接入并网要求与1年开工时限，直接利好储能项目投资建设方，加速四川储能规模化发展。
