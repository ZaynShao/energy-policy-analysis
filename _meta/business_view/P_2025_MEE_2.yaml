影响分析:
  加油: 未直接涉及。该政策聚焦钢铁、水泥、铝冶炼行业的碳排放权配额分配，加油业务（燃油零售）不在覆盖范围内。
  充电: 未直接涉及。该政策针对钢铁、水泥、铝冶炼行业的碳配额分配，充电业务（新能源汽车充电基础设施）不在直接覆盖范围。
  电力_储能_V2G_交易: 未直接涉及。该政策明确覆盖钢铁、水泥、铝冶炼三个行业，虽提及《全国碳排放权交易市场覆盖钢铁、水泥、铝冶炼行业工作方案》，但未涉及电力交易、储能、V2G或虚拟电厂等具体机制。
行动建议:
- '趁早: 关注后续政策动向，留意钢铁、水泥、铝冶炼行业纳入碳市场后，是否有向其他高耗能行业（如电力行业）扩容的政策信号，提前研判对能源业务板块的潜在影响。'
- '研究: 铝冶炼行业属于高载能行业，其碳配额成本变化可能间接影响区域电力供需格局，建议深入研究碳成本对该行业用能需求变化的传导路径。'
didi_impact_one_liner: 该政策将碳市场扩容至钢铁、水泥、铝冶炼三行业，虽未直接覆盖加油、充电及储能/V2G/电力交易业务，但相关行业碳成本上升将间接影响区域能源结构和电力需求，需关注后续政策扩容动向。
