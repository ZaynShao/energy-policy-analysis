影响分析:
  加油: 未直接涉及。该指导意见聚焦新型储能技术发展与电力系统建设，加油业务未在正文提及，无法评估直接业务影响。
  充电: 未直接涉及。正文提及鼓励围绕充电设施等终端用户探索储能融合发展新场景，但仅作为用户侧储能融合发展的场景之一提及，未明确充电基础设施的建设目标、补贴政策或市场准入要求，无法构成直接业务影响。
  电力_储能_V2G_交易: 直接涉及。政策明确将新型储能定位为支撑新型电力系统的重要技术和基础装备，设定2025年装机规模达3000万千瓦以上目标，覆盖电源侧、电网侧、用户侧多元发展路径，推动技术进步和成本下降，构建产业体系，为储能从商业化初期向规模化发展提供系统性政策支持。虚拟电厂仅在用户侧储能部分作为融合商业模式示例提及，缺乏具体市场准入、交易机制或运营义务的明确政策安排，属于探索方向但非直接业务影响。V2G未在正文明确出现。电力交易未在正文直接涉及。
行动建议:
- 趁早对接省级能源主管部门，争取纳入新型储能专项规划布局
- 趁早研究电源侧储能项目建设模式，把握系统友好型新能源电站配套储能的政策窗口
- 趁早布局用户侧储能场景，探索分布式新能源与储能融合的商业路径
- 趁早跟踪储能技术标准和检测认证体系建设进展，提前做好合规准备
didi_impact_one_liner: 新型储能规模化发展政策明确，储能装机目标和多元发展路径为公司布局储能业务及参与虚拟电厂商业模式探索提供战略机遇窗口。
