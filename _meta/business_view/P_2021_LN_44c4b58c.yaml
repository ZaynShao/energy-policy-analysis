影响分析:
  加油: 未直接涉及。该政策聚焦新型储能（电化学储能等）的发展指导意见，正文未提及任何与加油/加油站/燃油业务相关的内容。
  充电: 间接影响。政策在用户侧储能发展中提到鼓励探索储能融合发展新场景时列举了“充电设施”，但未将充电设施作为独立政策对象或明确充电业务的专项支持、准入条件或商业模式。充电设施仅为储能多元应用场景之一提及。
  电力_储能_V2G_交易: 直接涉及。（1）明确设定2025年新型储能装机达3000万千瓦以上的量化目标；（2）提出电源侧、电网侧、用户侧三侧储能多元发展路径；（3）鼓励聚合利用不间断电源、电动汽车、用户侧储能等分散式储能设施，探索虚拟电厂商业模式；（4）推动锂离子电池、压缩空气、液流电池、飞轮储能等核心技术成本下降和商业化应用；（5）健全技术标准和检测认证体系。
行动建议:
- A 趁早布局储能项目：紧抓3000万千瓦装机目标和三侧发展路径窗口期，统筹布局电源侧储能（风光储一体化）、电网侧储能（关键节点调峰）和用户侧储能项目，做好项目备案和选址论证
- B 趁早研究虚拟电厂业务：政策明确鼓励聚合分散式储能设施探索虚拟电厂商业模式，建议组建专业团队研究VPP技术方案和运营模式，储备聚合商能力
- C 趁早跟踪标准体系：政策提出健全储能技术标准和检测认证体系，建议主动参与标准制定工作，提前布局满足合规要求的产品技术路线
- D 趁早布局用户侧综合场景：政策鼓励储能融合分布式新能源、微电网、充电设施、工业园区等用户侧场景，建议整合现有资源探索“储能+”综合能源服务模式
didi_impact_one_liner: 新型储能装机目标明确、三侧发展路径清晰、虚拟电厂商业模式获政策支持，加油站业务未受影响，充电业务仅被列为融合场景之一
