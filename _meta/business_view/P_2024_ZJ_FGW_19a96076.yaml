影响分析:
  加油: 未直接涉及。该政策聚焦电网侧储能改造项目盘活闲置资产，未提及加油站业务或成品油相关内容。
  充电: 未直接涉及。政策主要描述电网侧储能电站建设及运营模式，虽储能系统可间接支撑充电基础设施负荷侧管理，但正文未明确涉及充电桩、充换电站或新能源汽车充电相关业务。
  电力_储能_V2G_交易: 直接涉及。政策明确电网侧储能项目作为独立主体参与电力辅助服务市场，通过峰谷差价、容量租赁、容量补贴、辅助服务等市场化模式实现盈利，并列举了50MW/100MWh磷酸铁锂储能系统的具体应用场景，为同类储能项目提供了商业模式参考。
行动建议:
- A 趁早研究:储能参与电力辅助服务市场的准入条件与竞价机制，对照本案例的商业模式评估自身项目可行性。
- B 趁早对接:主动联系萧山经开区国有资本运营主体，了解其盘活存量资产建设储能电站的审批流程和实施路径。
- C 趁早布局:关注属地电网侧独立储能项目指标申报窗口，储备符合条件的地块和接入资源。
- D 研究:梳理辖区内可盘活的存量土地厂房资源，评估改扩建为储能电站的合规路径与投资回收周期。
