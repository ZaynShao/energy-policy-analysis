影响分析:
  加油: 政策明确推动具备条件的加油（气）站配建公共快充和换电设施，打造加油（气）、充换电一体综合供能服务站。传统加油站面临向综合能源补给站转型的直接机遇，但转型涉及场地改造、用电容量扩容和运营资质调整等实际问题，需评估现有站点改造成本与新能源渗透率的时间窗口匹配。
  充电: 政策对充电基础设施的覆盖范围做出全面部署：城际走廊和高速公路服务区补短板、新建停车场配建比例强制要求、居住区固定车位100%预留或建设充电设施、各类公共停车场景全覆盖。充电运营服务商在B端（地产/物业/园区）和G端（政府机关/景区）存在项目机会，私桩建设的市场空间同步释放。
  电力_储能_V2G_交易: 政策聚焦充换电基础设施建设本身，未涉及储能配置、V2G机制、虚拟电厂或电力交易等电力系统灵活性调节内容。充电基础设施的大规模接入将对配电网容量产生配建需求（正文明确要求配套供配电设施建设），但电力系统灵活性资源相关业务未直接涉及。
行动建议:
- 'A 趁早: 研究具备转型条件的核心加油站资产，编制综合供能站改造可行性方案，对接地方商务和能源部门了解场地审批流程与建设要求'
- 'B 趁早: 对接地方交通运输主管部门和高速集团，获取城际走廊、高速公路服务区充电设施建设规划及招商信息，评估B端合作机会'
- 'C 趁早: 对接省住房城乡建设厅和自然资源厅，掌握新建停车场充电设施配建标准执行细则，提前布局公共充电运营市场'
- 'D 研究: 跟踪居住区固定车位100%建设要求对私桩市场的影响，评估物业合作模式与社区充电服务平台建设路径'
didi_impact_one_liner: 充电基础设施迎来省级全面部署，加油站转型综合供能站机遇明确，城际/高速/公建/居住区多场景释放充电运营市场空间，电网配套需求同步增长。
