影响分析:
  加油: 政策明确支持在具备条件的加油（气）站配建公共快充和换电设施，推进建设加油（气）与充换电一体的综合供能服务站，为加油站向综合能源站转型提供省级政策依据和发展空间。
  充电: 政策全面覆盖充电桩和换电站建设目标（2025年充电桩12万个、换电站200座），明确城际、城市公共领域、居住区、旅游景区等全场景建设任务，提出新建居民区固定车位100%建设或预留充电条件的要求，为充电运营市场提供大规模增量空间和明确建设标准。
  电力_储能_V2G_交易: 政策聚焦充换电基础设施硬件建设，未涉及虚拟电厂、储能调度、V2G反向放电、电力交易或聚合商等机制建设，充换电设施的电力系统互动和能源服务业务未在正文明确涉及。
行动建议:
- A 趁早研判现有加油站转型为综合供能服务站的可行性，利用政策窗口期争取配建公共快充和换电设施的布点机会
- B 趁早对接地方政府和交通枢纽管理方，在大型商业区、驻车换乘（P+R）、旅游景区等优先场景提前布局公共充电运营点位
- C 趁早研究充电桩规模化接入对配电网容量需求的影响，为后续参与配电网配套建设或需量管理做好准备
- D 研究居住区固定车位100%预埋充电条件政策对私人充电桩市场和存量社区改造市场的影响
- E 研究高速公路和普通国省干线服务区充电设施建设的供电配套需求和供配电设施建设机会
didi_impact_one_liner: 政策全面加速充电基础设施覆盖，加油站获综合供能转型空间，充电运营市场迎来省级规模化增量，电力系统互动机制未涉及。
