影响分析:
  加油: 政策直接支持报废国三及以下排放标准燃油乘用车、2.0升及以下排量燃油乘用车以旧换新（补贴1.5万元/2万元），同时推动国三及以下排放标准营运柴油货车和国四柴油车提前报废更新，给予定额淘汰补贴和新能源化更新补贴。政策明确加快更新高标准低排放货车和新能源车辆，将对燃油车消费结构产生直接影响。
  充电: 政策对个人消费者以旧换新购买纯电动小客车补贴1.5万元，对报废旧车购买新能源乘用车补贴2万元，均明确指向新能源乘用车购买行为。同时鼓励报废柴油车更新为新能源车辆，并落实新能源公交车及动力电池更新提标政策，将直接拉动新能源汽车消费，间接带动充电需求增长。
  电力_储能_V2G_交易: 政策明确落实新能源公交车及动力电池更新提标，涉及动力电池更新换代，但未直接涉及储能系统建设、V2G机制、虚拟电厂或电力交易等业务领域。
行动建议:
- 趁早研判燃油车淘汰补贴政策对加油站客户结构的影响，提前规划油品销量下降应对方案和新能源补给服务转型布局
- 趁早对接本市汽车以旧换新补贴申请流程，梳理合作网点，为后续叠加销售服务做好准备
- 趁早布局新能源车辆补能场景，结合公交、物流等商用车电动化更新需求，前瞻规划充电基础设施网络
- 趁早对接动力电池回收和更新产业链条，探索动力电池梯次利用或回收合作模式
didi_impact_one_liner: 上海以旧换新政策加码燃油车报废补贴至1.5-2万元并推动国四柴油车淘汰，加速私家车和营运车辆电动化替代，需前瞻布局充电网络和新能源补给服务以应对客户结构变化
