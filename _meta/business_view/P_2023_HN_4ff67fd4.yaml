影响分析:
  加油: 未直接涉及。该政策聚焦电动汽车充电基础设施建设，未涉及传统燃油加油业务。
  充电: 直接涉及多个关键环节。（1）市场准入：实行全省统一准入制度，未取得资质或未完成备案的须3个月内整改补办；（2）平台接入：须在发文后3个月内接入全省统一充电设施智能服务管理平台，实现省市县三级互联互通（2023年2月底前）；（3）验收管理：须通过具有CMA资质的第三方中介机构验收；（4）奖补申请：通过管理平台线上申报，按“标准建设、分类奖补、逐步退坡、总量控制”原则发放；（5）退出机制：退出平台超1年者取消资质备案并追缴奖补资金。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦充电基础设施建设运营规范，未涉及储能、V2G、虚拟电厂或电力交易机制。
行动建议:
- '趁早: 对照全省统一准入标准，3个月内完成未备案充电站的备案补办或资质申请，确保合规运营资格不受影响。'
- '趁早: 组织技术团队在3个月内将存量充电设施接入省级智能服务管理平台，避免因未接入平台而被通报、追缴奖补或取消备案资质。'
- '趁早: 梳理现有合作第三方验收机构资质，优先选择已获省级及以上CMA检测资质认定的机构开展验收对接，确保合规。'
- '趁早: 通过管理平台线上渠道跟踪奖补资金政策动态，按“分类奖补、逐步退坡”原则提前规划新/改建项目以争取补贴。'
- '研究: 深入理解“全省一张网”平台运行规则和质量评价机制，优化站点运营质量以获取政策正向激励。'
- '研究: 关注高速公路服务区、国省县乡道路沿线等细分场景的专项奖补实施细则差异，制定针对性市场布局策略。'
didi_impact_one_liner: 湖南充电市场全面进入合规化、平台化管理阶段，3个月整改窗口期和CMA验收要求形成运营准入门槛，统一平台接入和退坡奖补机制重塑竞争格局。
