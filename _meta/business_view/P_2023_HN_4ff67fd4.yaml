影响分析:
  加油: 未直接涉及。政策聚焦电动汽车充电基础设施建设，未涉及传统加油站业务调整或油品销售监管。
  充电: 直接涉及。政策明确建立全省统一充电基础设施建设运营市场准入制度，3个月内须完成资质备案整改；要求2023年2月底前接入省级智能服务管理平台，存量设施3个月内应接尽接；到2025年大中及以上城市新建停车场充电车位比例须高于电动汽车注册比例10%以上，长株潭都市圈50%居民小区具备充电条件；建立分类奖补、逐步退坡的财政支持机制；要求第三方中介机构（CMA资质）验收。这些要求直接影响充电设施建设运营企业的市场准入、合规整改、平台接入时限和补贴申领。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦充电基础设施建设与运营规范，虽提及智能服务平台建设但未涉及储能、V2G、双向充电桩或电力交易机制。政策中的专用车充电设施开放共享指公交客运、物流运输专用桩的对外运营，不等于虚拟电厂或需求响应参与。
行动建议:
- A 趁早梳理现有充电站建设运营资质，对照政策要求在3个月整改期内完成备案补办，避免资质缺失导致合规风险
- A 趁早对接省级充电设施智能服务管理平台，完成接口对接和数据接入，满足存量设施3个月内接入的时限要求
- B 趁早研究长株潭都市圈居民小区充电设施投资布局，锁定50%小区覆盖目标带来的增量市场空间
- B 趁早研究分类奖补、逐步退坡的奖补政策，合理规划投资回收周期，避免政策退坡后被动
- B 趁早建立第三方中介机构验收合作关系，优先选择具备CMA检测资质认定（含非车载充电机、交流充电桩检测范围）的机构
didi_impact_one_liner: 湖南省充电基础设施进入强监管周期，3个月内平台接入和资质备案整改窗口期紧迫，长株潭50%居民小区目标创造增量市场，奖补政策逐步退坡要求加快投资节奏。
