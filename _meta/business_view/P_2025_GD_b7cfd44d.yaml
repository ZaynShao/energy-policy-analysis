  加油: 本次调价遵循国家成品油价格形成机制，汽、柴油每吨分别下调180元和175元，92号汽油零售价降至7.13元/升，0号柴油降至6.76元/升。调价直接影响加油业务的定价合规和油品采购成本，需按文件要求于8月26日24时起执行新的最高销售价格。
