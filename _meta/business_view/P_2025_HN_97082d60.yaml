影响分析:
  加油: 未直接涉及。正文四个课题均聚焦电力系统规划与机制研究，煤电研究面向电源侧，无加油/燃油相关表述。
  充电: 直接涉及。车网互动课题明确将“新能源汽车和充换电场站对电网放电的价格机制”“充换电设施作为灵活性资源聚合参与现货市场、绿证交易、碳交易”列为研究对象，充电场站被纳入电力市场参与路径研究范围。
  电力_储能_V2G_交易: 直接涉及。车网互动课题涵盖V2G价格机制、需求响应资源聚合；绿色电力交易课题涉及新能源参与电力市场、绿证交易；均将“车网互动资源聚合”“充换电设施作为灵活性资源聚合”列为现货市场、绿证交易、碳交易的研究标的。电力交易、VPP、绿电交易主题在正文中均有明确体现。
行动建议:
- A 趁早:联合省内充换电场站运营商及充电平台,对接省发改委课题组申报车网互动电价机制研究,用运营数据支撑政策研究,争取研究成果向商业化机制转化。
- B 趁早:以灵活性资源聚合商身份,主动参与省发改委牵头的需求侧管理和现货市场机制研讨,提前布局充电侧资源聚合参与电力市场的合规路径。
- C 研究:梳理公司充电场站可调节负荷资源规模及V2G桩保有量,为课题研究提供新能源与充换电参与电力交易、碳交易的前置数据支撑。
- D 研究:跟踪省发改委绿色电力交易机制研究成果,评估充电用户绿电购买需求及充电侧参与绿证交易的可操作性。
didi_impact_one_liner: 湖南新型电力系统课题研究将充电场站纳入车网互动电价机制和灵活性资源聚合参与电力市场的研究范围,充电业务参与V2G、绿电交易、碳交易的市场路径有望在课题研究中明确。
