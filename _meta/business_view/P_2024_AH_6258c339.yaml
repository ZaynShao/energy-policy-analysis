影响分析:
  加油: 未直接涉及。本政策聚焦新型储能推广应用，加油业务不属于政策覆盖范围。
  充电: 未直接涉及。政策虽在用户侧场景中提及公路服务区，但该提及是作为储能应用场景，而非充电桩建设或充电运营业务。
  电力_储能_V2G_交易: 直接利好。政策明确提出到2025年新型储能累计装机不低于300万千瓦、2027年不低于450万千瓦/力争500万千瓦的量化目标；支持锂电池储能等成熟技术规模应用、钠离子电池储能等新兴技术示范应用、氢储能等潜力技术探索应用；加快电力市场建设；拓展电源侧、电网侧、用户侧三大应用领域，涵盖高能耗企业、大数据中心、5G基站、工业园区、公路服务区等用户侧场景。（间接）V2G未在正文中明确出现。
行动建议:
- 'A 趁早: 研判公路服务区、工业园区等用户侧储能场景的市场准入时机，结合储能装机目标规划布局相关项目'
- 'B 研究: 跟踪锂电池、钠离子电池储能技术成熟度进展，评估参与示范应用项目的资质条件与合作模式'
- 'C 趁早: 关注电力市场建设进度，研究储能参与电力交易的准入条件与商业模式'
- 'D 研究: 梳理大数据中心、5G基站等高能耗用户侧合作机会，探索工商业储能投资运营路径'
didi_impact_one_liner: 安徽储能装机目标锁定300-500万千瓦，用户侧场景向公路服务区等延伸，电力市场建设加快，利好储能项目投资运营。
