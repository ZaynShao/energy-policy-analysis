影响分析:
  加油: 未直接涉及。间接观察：该规则为电力市场基本规则，对加油业务无直接影响。
  充电: 未直接涉及。间接观察：充电负荷聚合商可能作为新型经营主体（负荷聚合商）参与电力市场，但正文未明确提及充电基础设施。
  电力_储能_V2G_交易: 直接影响：规则明确将储能企业、虚拟电厂、负荷聚合商列为新型经营主体，可参与电能量交易（中长期和现货）、电力辅助服务交易（调频、备用、调峰）及容量交易（储能提供出力能力）；V2G未直接提及，但虚拟电厂和储能定义覆盖双向充放电场景。需注册后方可参与市场。
行动建议:
- 趁早：完成电力市场注册，将储能、虚拟电厂等资产纳入经营主体范围，确保合规参与电能量、辅助服务及容量交易。
- 研究：分析中长期、现货、辅助服务及容量交易规则，评估储能/VPP/V2G资产在不同交易品种中的收益潜力，制定初期参与策略。
didi_impact_one_liner: 电力市场基本规则首次将储能、虚拟电厂列为新型经营主体，赋予其参与全部交易品种的资格，需趁早注册并研究多市场策略。
