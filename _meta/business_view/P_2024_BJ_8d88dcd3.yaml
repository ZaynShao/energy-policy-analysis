影响分析:
  加油: 未直接涉及。该政策聚焦设备更新与消费品以旧换新，虽涉及老旧货、客车等车辆更新，但均为补贴支持而非燃油消费激励，加油业务不在政策覆盖范围内。
  充电: 间接涉及。正文明确提到个人乘用车报废更新和置换更新补贴大幅提标（新能源最高2万元），置换更新首次纳入支持范围。虽未直接建设充电基础设施，但补贴扩围提标有望刺激新能源汽车置换需求，带动充电桩使用频次和建设需求增长（间接）。
  电力_储能_V2G_交易: 未直接涉及。正文仅在设备更新部分原则性提到'能源电力领域设备更新支持'和'煤改电设备更新'，在绿色低碳改造中提到数据中心为重点行业，未明确涉及储能、虚拟电厂(VPP)、V2G、电力交易或反向充电等具体机制。设备更新≠储能建设，市场准入≠交易机会。
行动建议:
- 'A 趁早: 摸排门店周边新能源车主置换意向池，对接''京通''平台补贴资格发放通道，提前锁定以旧换新客源转化。'
- 'B 研究: 梳理数据中心绿色低碳改造、''煤改电''设备更新等能源电力领域设备更新需求，评估对配电网扩容和后续储能配套的潜在拉动。'
- 'C 趁早: 关注''真金白银''3000亿元超长期特别国债资金拨付节奏，对接市发改委后续出台的重点领域更新补贴实施方案，争取参与''老旧电梯''''能源电力设备''更新改造供应链。'
didi_impact_one_liner: 政策扩围提标利好新能源车置换需求，间接带动充电桩使用频次；但未直接惠及加油、储能或电力交易业务。
