  电力_储能_V2G_交易: V2G和储能均直接涉及。规划明确提出推广'V2G（车辆到电网）'和'光储充一体化'技术，推动充换电网络与可再生能源、智能电网融合发展，为储能应用和车辆到电网互动创造技术条件和应用场景。
