影响分析:
  加油: 政策直接涉及。报废更新和置换更新均覆盖2.0升及以下排量燃油乘用车，补贴标准分别为10%(最高1.5万元)和6%(最高1.3万元)。政策将刺激黑龙江省内燃油车消费需求，间接带动加油消费增长。申请要求新车《机动车销售统一发票》在黑龙江省内开具，利好省内燃油车经销商和配套加油网络。
  充电: 政策直接涉及。新能源乘用车纳入补贴范围，报废更新补贴12%(最高2万元)、置换更新补贴8%(最高1.5万元)，补贴力度高于燃油车。政策将显著刺激黑龙江省内新能源汽车购置需求，理论上带动充电服务需求增长，但本政策聚焦购车补贴，未涉及充电基础设施建设或运营支持。
  电力_储能_V2G_交易: 未直接涉及。政策目标为汽车以旧换新补贴，虽涵盖新能源车购置，但正文未涉及储能、虚拟电厂、V2G、双向充电桩或电力交易机制。置换更新中的'转让(售卖)旧乘用车'为二手车交易，非储能或电网相关机制。
行动建议:
- A 趁早与省内新能源车经销商建立合作，整合置换补贴申请通道，承接政策带来的充电服务增量需求
- A 趁早研究将充电场站营销与以旧换新政策捆绑，在省内新能源汽车销售聚集区域提前布局充电服务场景
- B 研究报废更新与置换更新的补贴差异策略，优化对高补贴(报废更新)客群的定向营销方案
- B 跟踪政策执行效果，关注黑龙江省后续是否出台配套充电基础设施建设支持措施
didi_impact_one_liner: 政策通过差异化补贴(新能源车12%/燃油车10%报废更新)强力刺激黑龙江省汽车以旧换新，加油需求受益于燃油车补贴，充电需求受益于新能源车更高补贴但政策未覆盖充电基础设施本身。
