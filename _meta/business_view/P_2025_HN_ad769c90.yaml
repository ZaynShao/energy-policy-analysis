影响分析:
  加油: 未直接涉及。本方案聚焦于风电、太阳能发电、生物质发电等新能源通过直连线路向单一电力用户供给绿电，明确项目定义中的电力用户指使用绿电的企业主体，未涉及油品供应或加油站业务场景。
  充电: 未直接涉及。本方案适用对象为新增用电需求企业、配备自备电厂的存量负荷企业、降碳刚性需求的出口外向型企业及算力企业（含数据中心），明确针对单一电力用户，未扩展至充电桩、充换电站或新能源汽车充电等分散式负荷场景。
  电力_储能_V2G_交易: 未直接涉及。本方案虽涉及新能源发电与电力用户直连，但其核心机制为'以荷定源'的专线供电模式，年上网电量比例上限20%且整体自发自用为主，未建立储能调用、V2G反向放电或虚拟电厂聚合参与机制；绿电交易仅作为余电上网的附带形式而非独立交易品种；离网型项目虽可独立运行，但亦未明确储能配置要求。
行动建议:
- 'A 趁早: 研究本方案适用条件，若自身属于出口外向型或算力企业（含数据中心），可关注后续配套申报流程中的绿电直连申报要求与资料清单'
- 'B 研究: 跟踪本方案明确排除的''园区绿电直连项目''后续国家政策进展，园区级多用户绿色电力直接供应另文规定'
didi_impact_one_liner: 本方案针对单一电力用户的新能源专线直连，适用主体为大型工业/算力/外向型出口企业，不涉及加油/充电/储能/V2G/电力交易等业务场景。
