影响分析:
  加油: 政策明确将'加油（气）站'列为超充需求大、利用率高的优先支持场所，可申请市政府固定资产投资补助（最高30%）建设大功率充电设施或车网互动充电场。加油站向综合能源站转型获得直接资金支持窗口。
  充电: 政策直接支持大功率充电设施建设（新建或改造）和车网互动充电场，补助资金达工程投资30%。双向充放电设施被明确定义为等效'储能'设施，智能有序充电设施可缓解配电网压力。项目需接入'车、桩（站）、网'一体化市级平台。
  电力_储能_V2G_交易: 双向充放电设施被明确定义为'等效储能'，可实现负荷低谷充电、负荷高峰向电网放电的V2G机制。但政策聚焦于设施建设和接入平台要求，未涉及电力交易机制、辅助服务市场准入或具体调度规则的展开表述。
行动建议:
- 趁早研判:在营加油站加装超充设施或车网互动设施的场地条件与申报路径,把握加油（气）站优先支持的政策窗口
- 趁早对接:联系属地区发展改革委,了解2025年第二批项目申报初审要求,确保7月25日前具备申报条件
- 趁早布局:将双向充放电桩纳入充电设施建设方案,提前对接市级平台接入技术要求,抢占V2G示范项目资格
didi_impact_one_liner: 北京市第二批先进充电设施示范项目开闸,大功率充电与V2G双向充放电设施获30%固定投资补助,加油（气）站获优先支持地位,充电运营与能源服务转型迎实质资金支持窗口
