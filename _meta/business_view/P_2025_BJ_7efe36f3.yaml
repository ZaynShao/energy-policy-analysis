影响分析:
  加油: 直接涉及。政策明确将'加油（气）站'列为优先支持超充需求大、利用率高的项目场景，意味着加油站可获政府固定资产投资支持（最高30%）用于充电设施建设或改造，是加油企业拓展充电业务的重要政策窗口。
  充电: 直接涉及。政策全面支持大功率充电设施建设（新建或改造）和车网互动充电场，并提供最高30%的市政府固定资产投资补助，明确申报截止2025年7月25日，是充电运营商获取补贴、扩大布局的明确机会。
  电力_储能_V2G_交易: 直接涉及V2G。政策明确支持'双向充放电设施'，将电动汽车定位为等效储能设施，通过平台聚合实现负荷低谷充电、负荷高峰向电网放电，并要求建成后接入市级一体化平台，为储能聚合商和V2G运营提供了明确的政策支持框架和接入渠道。
行动建议:
- A 趁早:利用政策窗口期，在加油（气）站场景中规划建设超充设施，于7月25日前完成项目申报材料准备
- A 趁早:充电运营商应针对大功率充电设施新建或改造项目编制资金申请报告，同步准备绩效目标表和备案文件
- B 研究:储能聚合商和V2G运营主体应研究平台接入技术要求，提前布局负荷聚合调控能力
