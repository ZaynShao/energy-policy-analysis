影响分析:
  加油: 碳排放权交易针对固定设施的化石能源燃烧排放，配额成本将通过能源价格链条向下传导。文件明确'二氧化碳和大气污染物同根同源'，碳市场机制将增加化石能源使用成本，形成对加油业务的间接价格压力，但未直接规定加油站的碳排放报告义务或配额交易要求。
  充电: 充电业务属于电力消费产生的间接排放，文件未直接涉及电动汽车充电设施的碳排放核算或交易机制。但CCER机制可能覆盖部分可再生能源发电项目，间接提升充电网络的清洁能源属性。文件提及'推广应用节能减碳新技术'，未明确指向充电基础设施。
  电力_储能_V2G_交易: 未直接涉及。文件仅笼统提及'形成新的金融创新产品'，未出现储能、V2G、虚拟电厂、电力交易等具体机制或市场准入规定。CCER抵消机制仅针对碳排放配额，使用比例上限为5%，未延伸至电力辅助服务或需求响应领域。
行动建议:
- 趁早研判碳成本对燃油采购成本的影响路径，建立加油业务碳排放核算能力以应对可能延伸至终端销售的碳报告要求
- 趁早梳理充电网络运营中的电力消费结构，准备接入碳排放数据报送系统的技术对接方案
- 趁早研究CCER机制对可再生能源电力项目的覆盖范围，评估充电网络与清洁能源项目的碳减排协同空间
- 趁早关注碳市场与能源市场的联动机制演变，跟踪碳价信号向终端能源消费的传导进程
didi_impact_one_liner: 碳排放权交易试点建立碳定价机制，燃油使用成本面临碳价上行压力，充电业务可借助CCER机制间接获益，储能/V2G/电力交易暂未纳入试点范围。
