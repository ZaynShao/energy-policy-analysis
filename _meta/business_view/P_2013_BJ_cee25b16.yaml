影响分析:
  加油: 未直接涉及。该通知聚焦于二氧化碳排放配额交易，主要针对固定设施碳排放主体(年排放≥1万吨或年综合能耗≥2000吨标准煤)，虽加油站运营消耗化石能源产生碳排放，但通知未明确提及加油业务、加油站或成品油相关内容。
  充电: 未直接涉及。通知未提及充电桩、充电基础设施或新能源汽车充换电业务，也未涉及新能源汽车相关碳排放核算或交易安排。充电业务不在本试点通知的直接调整范围内。
  电力_储能_V2G_交易: 未直接涉及。通知虽涉及核证自愿减排量(CCER)抵消机制，但仅作为碳配额抵消工具(比例≤5%)，并非电力交易机制。通知未出现储能、虚拟电厂(VPP)、V2G、反向充电、双向充电桩或电力交易等具体机制安排。
行动建议:
- 趁早摸排自身碳排放底数：具备一定用能规模的单位可趁早对照通知要求，了解年综合能耗核算边界和碳排放报告义务，为未来可能纳入碳市场管理做基础准备。
- 趁早研究CCER抵消机制：通知明确允许重点排放单位使用CCER抵消配额(1吨CCER抵1吨排放量，上限5%)，可趁早研究CCER的获取途径、成本和适用条件，评估作为抵消储备的可行性。
- 趁早关注北京环交所交易规则：通知明确碳交易平台设在北京环境交易所，相关交易规则由环交所制定发布，建议趁早跟踪了解交易规则、流程及风控要求。
didi_impact_one_liner: 本通知聚焦北京市碳排放权交易试点建设，加油、充电、电力储能V2G交易均未直接涉及；相关用能单位宜趁早摸排碳排放底数并关注CCER抵消机制及交易规则。
