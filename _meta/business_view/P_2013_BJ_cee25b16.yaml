影响分析:
  加油: 间接涉及。政策明确将石油燃烧列为CO2和PM2.5主要排放源之一，加油站在碳交易体系中主要通过上游炼化环节间接受控。正文明确碳排放报告针对固定设施排放，年综合能耗2000吨标准煤以上方须参与，加油站单体规模通常未达报告强制门槛，但其燃料供应链上游的炼化企业若为重点排放单位则可能影响油品成本传导机制。
  充电: 未直接涉及。正文聚焦固定设施的CO2排放，充电场站建设运营、充电桩接入及充电服务均未被提及。间接观察：碳市场控排约束可能通过电力系统间接影响充电运营商用电成本，但正文未写明电力供应侧配额变化对用户侧定价的传导机制。
  电力_储能_V2G_交易: 间接涉及。正文虽设立碳配额交易机制和CCER抵消机制（1吨CCER可抵消1吨配额、使用上限5%），但未涉及虚拟电厂、V2G、储能系统参与碳市场的机制设计，也未明确电力交易平台与碳交易平台的衔接。CCER项目类型未在正文中枚举，故新能源发电项目参与碳市场的具体路径仍需参照国家后续规定。
行动建议:
- A 趁早：盘点自身或关联用能单位的综合能耗规模，判断是否触发2000吨标准煤/年报告门槛，提前建立碳排放数据监测台账。
- B 趁早：跟踪北京市碳排放权交易注册登记系统及配套方法学的更新，关注配额核定方法对间接排放核算口径的调整，提前评估碳价波动对电力采购成本的潜在影响。
- C 研究：CCER抵消机制允许使用比例不高于5%，结合自身节能减碳项目，探索是否具备申请核证减排量的条件。
didi_impact_one_liner: 北京碳交易试点仅针对固定设施排放，加油站单体未达报告门槛但石油供应链上游炼化环节受控，充电和储能业务未直接涉及，CCER抵消机制为后续间接参与留下空间。
