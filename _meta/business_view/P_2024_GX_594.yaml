影响分析:
  加油: 未直接涉及。该通知聚焦电力市场化交易，未涉及成品油销售业务。
  充电: 未直接涉及。正文虽提及分布式光伏发电、分散式风电参与市场化交易，但未直接涉及充电桩建设、运营或充电服务市场。
  电力_储能_V2G_交易: 直接涉及新型储能参与市场。政策明确：新型储能企业按规定办理注册手续后，可分别按照发电企业、电力用户身份参与交易，为储能企业提供了明确的入市路径和市场主体资格认定。此外，燃煤发电采用“基准价+上下浮动”的上网电价机制，广西燃煤发电基准价为420元/兆瓦时，该价格机制将影响储能项目参与市场交易的收益预期。
行动建议:
- A 趁早完成新型储能企业的市场注册手续，获取发电企业或电力用户双重身份准入资格
- B 研究储能企业以双身份参与批零交易的策略，评估“低价存电+高价放电”的价差套利空间
- C 趁早对接广西电力交易中心，了解新型储能参与中长期交易和偏差结算的具体规则与流程
- D 研究燃煤发电基准价+浮动机制与储能峰谷套利模式的匹配方案，测算项目收益边界
didi_impact_one_liner: 储能企业获明确市场准入，可双身份参与电力交易，趁早注册锁定先发优势。
