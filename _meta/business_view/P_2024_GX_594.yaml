影响分析:
  加油: 未直接涉及。文件聚焦电力市场化交易机制建设，加油业务未在经营主体范围或交易机制中提及。间接观察:新能源渗透率提升或间接影响加油站的能源消费结构，但正文未明确表述。
  充电: 工商业用户原则上参与市场直接交易。10千伏及以上的充电运营商属于应参与市场的工商业用户范围，可通过批发或零售交易购电。分布式光伏发电、分散式风电等分布式电源按有关规定参与市场化交易，为充电站配套分布式能源提供了市场对接通道。
  电力_储能_V2G_交易: 新型储能企业被明确列为新型经营主体，按规定办理注册手续后，可分别按照发电企业、电力用户身份参与交易。集中式新能源发电企业（集中式光伏、集中式风电）全电量参与市场化交易。分布式光伏发电、分散式风电按有关规定参与市场化交易。虚拟电厂、V2G、反向充电等机制未在正文中出现。
行动建议:
- 趁早研究新型储能企业按发电企业或电力用户身份参与广西电力市场的注册流程和交易规则，布局储能入市策略
- 趁早对接集中式新能源发电企业，探索储能参与新能源消纳或辅助服务的市场化合作模式
- 趁早梳理充电运营资产电压等级，对达到10千伏及以上的充电站，趁早研究参与批发或零售交易的路径和电价优化空间
- 研究关注分布式电源参与市场化交易的具体规则，为充电场站配套光储一体化项目的市场对接做准备
didi_impact_one_liner: 广西明确新型储能可按双身份参与市场化交易，集中式新能源全电量入市，为储能业务布局提供市场准入依据；充电运营商若达10千伏等级需直接参与市场交易
