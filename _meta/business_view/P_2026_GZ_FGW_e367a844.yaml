影响分析:
  加油: 直接影响。贵州自2026年11月12日24时起下调成品油最高批发价、最高零售价：89#汽油（国VIB）每吨下调645元、0#柴油每吨下调625元；经营企业可在不超过最高批发价、最高零售价的范围内自行确定具体价格。这改变了贵州加油业务的价格上限，也改变了批发价的具体数值，因此直接影响本站挂牌价、批零价差和折扣空间（利润来自折扣空间，而非零售挂牌价）。同时正文要求企业保证市场供应、严格执行国家价格政策、规范经营行为，各地将加大监督检查，不执行国家价格政策的行为会被严查，消费者可通过12315举报；站端（加油站现场）的调价执行时点和明码标价合规风险因此上升。附件按价区给出汽油、柴油销售价格表，各价区挂牌需要分别对齐。
  充电: 未直接涉及。正文只涉及贵州成品油最高批发价、最高零售价调整与价格监督检查，没有提到充电桩、充电服务费、场站电价或选址建设。间接观察（仅作背景，不构成动作依据）：成品油零售价下调可能微弱影响油电使用成本的相对比较，但正文没有相关机制表述。
  电力_储能_V2G_交易: 未直接涉及。正文没有出现电力交易、现货、售电、储能、虚拟电厂、V2G或分布式新能源入市等任何机制或规则，不改变电力业务决策变量。
行动建议:
- A 趁早:在贵州各价区站点按11月12日24时生效时点更新挂牌价与收银、价格系统，确保汽油、柴油均不超过最高批发价、最高零售价（89#汽油下调645元/吨、0#柴油下调625元/吨），并留存调价执行记录以备检查。
- B 趁早:按贵州各价区附件价格表复核进货成本与折扣空间，重算吨油毛利与单站保底，识别批零价差收窄对下沉城市站点的挤压，形成调价后的站点价格执行清单。
- C 研究:梳理站端明码标价与价格政策执行合规自查清单，明确12315举报与价格监督检查的应对流程和责任人。
- D 研究:跟踪后续调价窗口与国际油价传导节奏，建立贵州价区价格联动的定期复盘机制。
didi_impact_one_liner: 贵州成品油最高批发价、最高零售价下调（汽油-645元/吨、柴油-625元/吨），直接改变加油业务价格上限与折扣空间，需在11月12日24时前完成各价区挂牌与系统调价及合规自查；充电与电力业务未直接涉及。
