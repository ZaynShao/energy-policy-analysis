行动建议:
- A 趁早研究:密切跟踪河南电力现货市场"1+6+2"规则体系完善进度,提前部署新能源项目参与现货市场的交易策略和风险管控机制
- B 趁早布局:深入研读《河南省绿证绿电交易工作细则(试行)》,完善可再生能源项目建档立卡,提前锁定绿证绿电交易资格和市场份额
