影响分析:
  加油: 未直接涉及。正文未提及成品油、批发价/炼厂装车价、加油站网络或商户合规成本。间接看，园区严把“两高”项目准入、“一企一策”推进节能降碳改造，可能影响园区内工业物流与通勤的用油节奏；但这不改变加油业务的任何决策变量，不应据此立项。
  充电: 未直接涉及。正文只把“推动基础设施绿色升级”列为七大任务之一，节选未展开充电桩、超充、选址、服务费定价空间或场站侧电价结构，不构成建桩节奏和定价空间的依据。间接观察：园区能源基础设施升级，理论上可能为后续园区内充电合作留出入口，但正文未写，须以《方案》全文和申报大纲核实，暂不作为动作依据。
  电力_储能_V2G_交易: 业务相关，但属机会侧，规则未变。正文明确“鼓励参与绿电、绿证交易”“推进源网荷储深度融合”“积极推进绿电直连等低零碳技术创新与场景落地”，并把非化石能源供电占比、清洁供热占比、单位能源碳排放列为核心论证指标——江苏园区将成为绿电/绿证采购的集中需求方，扩大售电与绿电交易的客户面；同时绿电直连若在园区落地，可能对售电公司代理电量形成分流，应在江苏客户测算中单列情景。但正文未写现货规则、中长期与现货比例、偏差/反向考核上限、售电利润上限与让利退还，这些决策变量均未改变；储能的具体配置要求、聚合商准入门槛、分布式新能源入市规则均未出现（“储”仅存在于“源网荷储”任务表述中），V2G/车网互动未直接涉及；园区侧申报口径（2030年培育10个左右省级园区、申报主体为省级及以上开发区或“园中园”、建设期原则上不超过5年）属需人工跟踪项，不得由此推演储能或充电建设义务。
行动建议:
- A 趁早:把江苏省级及以上开发区及边界清晰的“园中园”名单做成园区级客户清单，先接触园区管理机构与园区内用能企业，对接绿电、绿证采购与售电服务（依据：正文“鼓励参与绿电、绿证交易”、以园区为重要载体）。
- B 趁早:在江苏售电客户测算中单列“绿电直连”情景，量化园区自建绿电对代理电量的分流敞口与保底客户结构（依据：正文“积极推进绿电直连等低零碳技术创新与场景落地”）。
- C 研究:正文对储能配置、聚合商准入、现货与偏差考核、充电配套均未落笔，需调取《方案》全文、申报大纲与碳排放核算方法后再判定电力、储能（VPP/V2G）、充电侧的可行性；在此之前不据此新增项目或合规义务。
didi_impact_one_liner: 江苏零碳园区把绿电绿证交易与绿电直连推到园区层面，给电力业务开了集中客户入口，也带来代理电量分流的隐忧；加油、充电本篇正文未涉及，不动作。
