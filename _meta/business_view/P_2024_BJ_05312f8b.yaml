影响分析:
  加油: 未直接涉及。正文仅规定汽车以旧换新补贴条件与标准，未涉及燃油零售、加油站运营或汽柴油销售环节。间接影响方面，以旧换新补贴若带动燃油车新车购置，理论上可短期支撑存量加油站业务，但正文未明确补贴车辆类型构成，此影响须以实际申请数据验证。
  充电: 未直接涉及。正文规定的是报废旧车后购置新车的补贴条件，未专项提及新能源汽车购置补贴，亦未涉及充电基础设施建设、充电桩运营或充换电服务。间接影响方面，汽车以旧换新政策整体背景包含新能源汽车推广，理论上可带动充电需求增长，但正文未明文将此作为政策目标或实施路径，相关业务影响须以政策落地后实际新能源汽车销售数据为据。
  电力_储能_V2G_交易: 未直接涉及。正文为汽车以旧换新补贴实施细则，聚焦报废车辆与购置新车的资格条件、补贴标准及申领流程，未涉及储能设施建设、虚拟电厂、V2G机制、电力交易、峰谷电价调整或需求响应等内容。
行动建议:
- 'A 趁早: 研究以旧换新补贴政策对目标客群汽车购置决策的分化影响，结合区域新能源渗透率数据，评估现有加油站网络的车流量变化风险，为后续网点布局调整储备数据基础。'
- 'B 研究: 跟踪北京市以旧换新政策执行期间新能源车与燃油车申请比例，关注政策对充电需求增量的间接拉动，为后续充电业务扩张寻找量化依据。'
didi_impact_one_liner: 北京汽车以旧换新补贴政策未直接触及加油、充电或储能/电力交易业务，间接影响取决于实际带动的新能源车购置规模，建议跟踪政策落地数据以评估长期能源消费结构变化。
