影响分析:
  加油: 未直接涉及。该方案聚焦虚拟电厂聚合资源类型与市场机制，虽提及分布式电源、储能、负荷类聚合单元，但未明确涉及加油/加油站相关业务。
  充电: 直接涉及。方案明确将"电动汽车充电设施"列为分布式发电类聚合单元的可聚合资源，并提出"加快车网互动（V2G）规模化应用"重点任务；要求持续提升公共交通、充换电设施等聚合调控能力，充电桩运营商和充换电运营商具备参与虚拟电厂聚合的合规路径。
  电力_储能_V2G_交易: 直接涉及。方案系统性覆盖四类聚合单元（分布式发电/储能/全电量负荷/调节量负荷），明确用户侧储能参与机制，单独强调储能类聚合单元聚合分布式储能参与现货市场，提出加快V2G规模化应用，目标是到2027年调节能力达200万千瓦、2030年达400万千瓦，为储能资源聚合商和V2G运营商创造明确的参与框架与市场空间。
行动建议:
- 'A 趁早: 接入虚拟电厂聚合体系——充电/储能运营商趁早对接聚合单元技术标准，争取纳入分领域响应资源库，锁定早期聚合商资格'
- 'B 趁早: 布局V2G规模化应用——新能源车企与充电运营商趁早布局V2G桩，具备秒级/分钟级响应能力以匹配聚合单元响应速度分级要求'
- 'C 研究: 参与可调节资源排查——趁早摸排管辖范围内分布式储能、充电桩、可调负荷资源的电压等级与响应特性，建立分类资源台账'
didi_impact_one_liner: 方案明确充电设施可参与虚拟电厂聚合，V2G规模化应用获政策加持，充电/储能运营商具备直接参与电力现货市场的聚合商路径，需趁早接入标准体系并锁定聚合商资格
