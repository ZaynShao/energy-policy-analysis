影响分析:
  加油: 未直接涉及。该办法奖励对象为虚拟电厂资源聚合平台、V2G调节能力和新型储能，加油业务不属于奖励范围。
  充电: 直接利好。办法明确将V2G调节能力纳入奖励范围，奖励对象为基于用户自愿原则形成的V2G调节能力，现阶段优先支持目的地停车V2G调节能力建设，由虚拟电厂运营商聚合管理。对智能充（放）电桩V2G根据电网企业调节能力考核结果给予奖励。
  电力_储能_V2G_交易: 直接利好。虚拟电厂资源聚合平台、新型储能均被明确列入奖励对象：虚拟电厂平台按50元/千瓦·年奖励，上限150万元/年，奖励期3年；新型储能按并网项目给予奖励，适用期2024年1月1日至2028年12月31日。资金来源为市级节能减排专项资金。V2G调节能力奖励标准将根据电网企业考核结果另行确定。
行动建议:
- 'A 趁早: 对接上海市虚拟电厂运营商资质要求，将V2G充电资源接入上海市虚拟电厂运营管理平台，争取纳入首批V2G调节能力奖励范围'
- 'B 趁早: 依据《上海市新型储能示范引领创新发展工作方案（2025—2030年）》要求，加快用户侧储能或独立储能电站项目布局，在2025年9月1日前实现并网以适用较高奖励标准'
- 'C 研究: 密切跟踪上海市虚拟电厂运营管理平台接入要求、虚拟电厂准入技术与商务注册条件及V2G调节能力考核规则，提前完成合规准备'
didi_impact_one_liner: 上海新型储能/VPP/V2G迎实质性资金奖励，充电运营商可借V2G聚合模式切入奖励体系，储能项目需在政策窗口期加速并网布局
