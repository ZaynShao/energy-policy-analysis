影响分析:
  加油: 未直接涉及。本办法聚焦电力系统调节能力建设，奖励对象为虚拟电厂、V2G和新型储能三类调节资源，不涉及传统加油业务。
  充电: 直接涉及。办法明确将V2G调节能力列为奖励对象，包括智能充（放）电桩，并优先支持目的地停车V2G调节能力建设，由虚拟电厂运营商基于用户自愿原则开展智能有序充电或车网互动。当前奖励标准适用于2025年9月1日前并网项目。
  电力_储能_V2G_交易: 直接涉及。办法系统性覆盖三大调节能力：①虚拟电厂资源聚合平台须接入上海市虚拟电厂运营管理平台并完成调度注册，每个平台奖励上限150万元/年；②V2G调节能力根据电网企业考核结果给予奖励；③新型储能覆盖用户侧储能和独立储能电站。奖励资金来自市级节能减排专项资金，奖励期至2028年底。
行动建议:
- A 趁早:对接入上海市虚拟电厂运营管理平台的技术和商务注册要求开展预研，明确平台建设标准与奖励条件
- B 趁早:针对目的地停车场景评估V2G充电桩改造或新建可行性，锁定2025年9月1日前并网时点以适用现行奖励标准
- C 研究:跟踪上海市虚拟电厂运营管理平台接入规程和V2G调节能力考核规则出台动态
- D 研究:对标《上海市新型储能示范引领创新发展工作方案》用户侧储能和独立储能电站要求，评估项目合规性
didi_impact_one_liner: 办法系统性覆盖虚拟电厂、V2G、新型储能三类调节能力的资金奖励，充电运营和储能投资需在2025年9月前完成并网以锁定奖励条件，并须通过虚拟电厂运营商渠道接入市级平台调度体系。
