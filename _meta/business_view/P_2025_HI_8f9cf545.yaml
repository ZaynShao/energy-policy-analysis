影响分析:
  加油: 未直接涉及。该政策针对工商业电力用户的电力市场交易，核心调整对象为两部制工商业用户的入市时间节点和电网代理购电价格惩罚机制，不涉及成品油或燃气业务。
  充电: 直接涉及。充电运营商若属于年用电量50万千瓦时及以上的10千伏及以上两部制工商业用户，需按对应时间节点入市直接参与电力市场交易。政策顺延了入市期限（部分顺延1-2个月）并设定了逾期惩罚（电网代理购电价格1.1倍），充电运营商面临市场化购电和价格风险管理的现实要求。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦于工商业用户的入市门槛和时间节点管理，未涉及储能充放电调度、V2G反向送电、虚拟电厂聚合参与或电力现货交易等具体机制，不构成对储能/V2G/电力交易业务的直接规范。
行动建议:
- 'A 趁早摸排: 充电运营商趁早核查自身用电规模是否达到年用电量50万千瓦时及以上且为两部制10千伏用户，确认是否属于强制入市范围'
- 'A 趁早对接: 符合入市条件的充电运营商趁早联系海南电力交易中心和有资质的售电公司，完成零售服务合作事宜和注册手续'
- 'B 研究: 各业务线条趁早研究市场化购电策略，关注电力市场价格波动风险，提前评估入市后的成本管理方案'
didi_impact_one_liner: 海南工商业用户入市期限顺延1-2个月，充电运营商需按规模节点直接参与电力市场，面临市场化购电与价格风险管理要求。
