影响分析:
  加油: 未直接涉及。本方案聚焦风电、光伏等新能源上网电价市场化改革，加油业务（石油/加油站）不在政策讨论范围内。
  充电: 未直接涉及。本方案主要规范风电、集中式光伏和分布式光伏的上网电价机制，充电桩/充换电服务未在正文直接涉及。分布式新能源可由代理机构代理参与市场交易的机制，可能对充电运营商参与电力市场有间接启示（间接），但正文未明确写到充电业务。
  电力_储能_V2G_交易: 本方案核心内容直接规范新能源项目参与电力市场的价格机制和结算方式，为新能源（风电、光伏）入市建立明确的交易框架。方案明确2026年起新能源上网电量原则上全部进入市场，通过竞价建立可持续发展价格结算机制。现货市场出清价格将直接决定新能源上网电价，电力交易市场的价格形成机制由此得到进一步完善。但方案主要针对新能源项目本身，储能、虚拟电厂（VPP）、V2G、双向充电桩或聚合商等具体机制未在正文直接涉及。
行动建议:
- 'A 趁早: 趁早研究新能源上网电价全面市场化后的电力交易策略，评估新能源项目参与市场交易的报价机制和风险对冲方案'
- 'B 趁早: 趁早研究分布式新能源代理机构资质要求（须具备售电公司资质），探索作为代理方参与分布式新能源市场化交易的机会'
- 'C 研究: 研究存量与增量新能源项目的机制电价差异，为涉及的新能源资产投资或运营优化提供决策依据'
didi_impact_one_liner: 新能源电价市场化改革深化，2026年起风电光伏全部入市上网，电力交易机制进一步完善，对公司电力交易业务布局和分布式新能源代理合作具有直接参考价值。
