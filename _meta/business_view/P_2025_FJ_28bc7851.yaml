影响分析:
  加油: 未直接涉及。政策聚焦于新能源（风电、光伏）上网电价市场化改革，不涉及传统燃油业务。
  充电: 未直接涉及。政策核心为新能源项目上网电价形成机制和绿电交易规则，虽提及分布式新能源可聚合参与交易，但未明确充电基础设施或充电运营商的市场准入、交易资格或补贴安排。间接观察：绿电交易机制可能为充电运营商采购绿电提供市场化路径，但正文未就此展开。
  电力_储能_V2G_交易: 直接涉及。新能源（风电、光伏）项目自2026年1月1日起上网电量原则上全部进入电力市场，上网电价通过市场交易形成。政策详细规定了现货市场、中长期市场、绿电市场的交易机制和价格形成规则。但政策未直接涉及储能参与市场、V2G机制或虚拟电厂。增量项目通过竞价确定机制电价，存量项目按燃煤基准价或竞配价格执行过渡性机制电价。
行动建议:
- 'A 趁早: 研判新能源项目入市对自身购电成本的影响，评估是否需调整中长期签约策略以锁定绿电价格'
- 'B 趁早: 跟踪分布式新能源聚合参与交易的具体实施细则，提前布局聚合商合作或评估参与条件'
- 'C 研究: 绿电交易机制中绿证结算规则（电能量+绿证分价结算），评估对采购绿电的成本结构影响'
- 'D 研究: 关注现货市场价格上下限动态调整机制，理解对购电侧电价波动风险的传导影响'
didi_impact_one_liner: 新能源全面入市和绿电交易机制完善将重塑电力采购市场结构，虽未直接涉及充电业务，但绿电采购路径和电价波动风险值得提前研判
