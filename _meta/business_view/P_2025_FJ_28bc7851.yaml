影响分析:
  加油: 未直接涉及。该政策聚焦于风电、光伏等新能源上网电价市场化改革，未涉及成品油销售、加油站点运营或传统能源补给业务。
  充电: 未直接涉及。政策主要规范新能源发电侧上网电价机制，虽提及分布式新能源以聚合方式参与交易，但未明确涉及充电基础设施、充换电站运营或新能源汽车充电服务定价。
  电力_储能_V2G_交易: 未直接涉及。政策核心是新能源（风电、光伏）上网电价市场化，虽涉及绿电交易机制，但未明确涉及储能、虚拟电厂（VPP）、V2G（车辆到电网）或电力交易中的储能充放电价格机制。
行动建议:
- 趁早研究政策传导路径：密切跟踪该方案对福建省内电力市场结构的影响，评估新能源上网全面市场化后电力批发价格波动对零售侧的可能传导，为后续业务决策储备市场分析能力
- 趁早梳理存量资产边界：对照政策划定的存量项目范围（2025年6月1日前全容量并网项目），排查公司现有新能源资产是否属于机制电量保障范围，提前做好电价过渡期财务测算
- 趁早关注聚合商准入动态：虽该政策未直接涉及，但明确鼓励分布式新能源以聚合方式参与交易，可提前研究聚合参与电力市场的技术条件和市场规则
didi_impact_one_liner: 福建省新能源上网电价全面市场化政策主要影响新能源发电侧，对充电业务和电力交易业务的直接影响有限，但需关注市场电价波动对后续业务定价的间接传导风险。
