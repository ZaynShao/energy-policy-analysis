影响分析:
  加油: 未直接涉及。本政策为贵州省储能上网电价政策问答，不涉及加油业务。
  充电: 未直接涉及。本政策聚焦独立储能项目电价机制，虽政策依据文件提及新型储能，但正文未明确涉及充电基础设施或充换电业务。
  电力_储能_V2G_交易: 直接涉及。贵州省明确了储能项目电价政策三层结构：①15个独立储能示范项目享有阶段性电价支持政策；②示范项目外储能项目可作为市场主体参与电力中长期市场和现货市场，通过双边协商等市场化方式形成上网电价；③下一步储能项目可参与容量租赁交易，以市场化方式形成容量价格。政策明确推动储能电站参与电力市场，储能收益渠道包括上网电价和容量租赁两部分。
行动建议:
- A 趁早:对接省能源局确认示范项目申报条件，摸清本企业储能项目是否在15个示范项目名单内，提前享受阶段性电价支持政策窗口期
- B 研究:深入研究储能项目参与电力中长期市场、现货市场的交易规则和技术要求，提前布局市场准入能力
- C 趁早:跟踪容量租赁交易机制落地进展，提前储备客户资源，探索储能容量租赁商业模式
- D 研究:关注黔能源〔2023〕52号原文及后续配套文件，掌握示范项目阶段性电价支持政策的具体执行期限和退出机制
didi_impact_one_liner: 贵州储能项目三层电价机制明确，示范项目享阶段性支持，非示范项目进入电力市场形成电价，容量租赁交易通道打开，需趁早布局市场参与能力。
