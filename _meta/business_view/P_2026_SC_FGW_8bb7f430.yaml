影响分析:
  加油: 直接涉及：按国家发展改革委调价，四川省三个价区汽油、柴油最高零售价格同步调整；零售企业可在不超过最高零售价前提下自主定价，批发执行最高批发价，符合资质的民营批发企业最高供应价按最高零售价扣减400元确定；调整自2026年7月31日24时起执行。同时要求中石油、中石化在川企业保障供应，发改部门会同市场监管开展价格监管。
  充电: 未直接涉及。正文仅调整成品油价格，未提及充电设施、充电服务费或充电电价；间接看，油价变化可能影响燃油车与电动车使用成本比较，但无充电业务直接依据。
  电力_储能_V2G_交易: 未直接涉及。正文未涉及电力价格、储能、V2G、虚拟电厂、电力交易或绿电交易等机制；间接看，油价调整可能改变整体能源比价，但政策未给出相关业务直接依据。
行动建议:
- A 趁早：对照川发改价格〔2026〕317号附件，复核三价区汽柴油最高零售价和最高批发价，确保在川加油站自7月31日24时起不超价销售。
- B 趁早：核查民营批发企业最高供应价=最高零售价扣减400元的执行口径，以及合同约定配送费用条款，及时修正批发价格与价差。
- C 趁早研究：本次油价调整对加油业务量、与充电出行的相对成本的影响；正文未涉及充电、储能/V2G/电力交易，建议暂不新增相关业务动作。
didi_impact_one_liner: 油价调整直接要求川内加油站及成品油批发执行新的最高限价，加油业务优先合规；充电和电力储能交易未直接涉及。
