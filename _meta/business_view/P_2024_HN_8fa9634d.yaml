影响分析:
  加油: 未直接涉及。本政策聚焦电网调峰、储能和智能化调度能力建设，核心调节资源为电源侧调峰（含煤电、气电、水电、核电）、电网侧优化配置及需求侧资源，不涉及加油/油气业务。
  充电: 直接涉及需求侧调节资源参与调峰。正文明确提出"挖掘需求侧资源调峰潜力"，要求"深入挖掘可调节负荷、分布式电源等资源潜力，支持通过负荷聚合商、虚拟电厂等主体聚合形成规模化调节能力"，充电桩（作为可调节负荷）具备参与需求响应和虚拟电厂聚合的制度通道。
  电力_储能_V2G_交易: 直接涉及两大核心领域。（1）储能：政策明确要求"推进储能能力建设"，规划到2027年抽水蓄能投运规模达8000万千瓦以上，并要求"保障新型储能市场化发展的政策体系基本建成"，直接利好新型储能项目的市场化发展。（2）虚拟电厂/需求响应：正文多处强调"支持负荷聚合商、虚拟电厂等主体聚合形成规模化调节能力"，并设定需求侧响应能力达最大负荷5%以上的目标，为虚拟电厂提供了明确的政策支撑和量化目标。V2G未在正文中明确出现，但作为电动汽车的调节能力或可通过虚拟电厂聚合机制间接涉及。
行动建议:
- A 趁早布局充电桩负荷聚合能力,接入省级电力负荷管理系统或参与虚拟电厂聚合,抢占需求响应市场席位
- B 研究虚拟电厂聚合商准入条件和盈利模式,对接电网调度机构,获取聚合资格
- C 趁早跟进新型储能市场化政策配套节奏,储备储能项目资源,对接抽水蓄能省级资源统筹布局
didi_impact_one_liner: 充电负荷成为政策明确的需求侧调节资源,虚拟电厂聚合机制为充电运营打开规模化调峰市场通道,储能市场化政策体系建设为充电+储能一体化商业模式提供制度基础。
