影响分析:
  加油: 未直接涉及。该政策聚焦电力系统调峰、储能和调度能力建设，主要涉及电力系统的源网荷储各环节，加油业务（成品油销售）不在本政策调整范围内。
  充电: 间接涉及。政策提出推进源网荷储一体化，支持通过负荷聚合商、虚拟电厂等主体聚合可调节负荷形成规模化调节能力，推动分钟级和小时级需求响应。充电桩作为可调节负荷资源，理论上可纳入虚拟电厂聚合范围参与调峰，但本政策未直接明确充电领域的具体部署要求或市场机制。
  电力_储能_V2G_交易: 直接涉及。政策明确提出推动电源侧、电网侧、负荷侧储能规模化高质量发展；到2027年抽水蓄能电站投运规模达8000万千瓦以上；需求侧响应能力达最大负荷5%以上；保障新型储能市场化发展的政策体系基本建成；支持虚拟电厂等主体聚合形成规模化调节能力；推动系统友好型新能源电站建设实现风光储协调互补。这些目标直接利好储能投资运营和虚拟电厂商业模式。
行动建议:
- A 趁早研究:跟踪本省新型储能市场化政策体系完善进程，提前布局储能项目投资和运营的商业模式
- B 趁早布局:关注虚拟电厂参与调峰的政策路径，探索将充电桩等可调节负荷资源纳入聚合范围的机会
- C 趁早对接:主动对接电网调度部门，了解系统友好型新能源电站在储能配置和协调运行方面的合作需求
- D 研究:密切跟踪需求侧响应能力达最大负荷5%目标下的市场机制设计，评估充电桩参与分钟级/小时级需求响应的可行性
didi_impact_one_liner: 政策直接利好储能和虚拟电厂，充电业务可通过虚拟电厂聚合间接参与调峰市场，电力交易领域将迎来市场化政策体系完善机遇。
