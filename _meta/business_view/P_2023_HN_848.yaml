影响分析:
  加油: 未直接涉及。该文件聚焦充电基础设施规划与建设，未提及加油站业务转型、加油加气合建站或油、气、电综合能源供应相关内容。
  充电: 直接影响。文件设定了明确目标：到2025年全省累计建成充电桩40万个以上；城市地面公共停车场配建比例不低于20%；公共机构/国企内部停车场按30%车位比建设充电设施，2025年底前基本全覆盖；农村地区实现充电桩'村村全覆盖'。重点布局'两区'（居住区、办公区）和'三中心'（商业中心、工业中心、休闲中心），以快充为主、慢充为辅，鼓励建设充换电一体化场站。政策驱动力度大，将显著扩大公共充电市场规模。
  电力_储能_V2G_交易: 未直接涉及。文件仅涉及充电基础设施建设与运营，虽提及充换电一体化场站建设，但未明确涉及储能系统、V2G双向互动、虚拟电厂或电力交易机制等内容。
行动建议:
- A 趁早:在城市商业中心、工业园区、住宅密集区等'两区三中心'区域抢占优质场地资源，提前与业主方、物业方对接充电桩建设合作，避免政策窗口期后场地资源被竞争对手锁定。
- B 趁早:对接公共机构、国有企业内部停车场充电设施建设需求，发挥已有充电运营经验和平台优势，争取成为其充电设施建设与运维服务商。
- C 研究:关注农村充电设施'村村全覆盖'政策落地节奏，提前了解县域市场空间及农村用户充电行为特征，为下沉市场拓展做能力储备（间接）。
- D 研究:跟踪换电设施'通用性、兼容性'标准进展，了解换电模式政策走向，评估是否具备参与换电网络建设的条件（间接）。
didi_impact_one_liner: 充电业务迎重大政策红利，省内2025年需新增大量充电桩，重点区域和公共机构场景存在快速布点机会，需趁早锁定优质场地资源。
