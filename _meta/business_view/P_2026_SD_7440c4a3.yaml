影响分析:
  加油: 未直接涉及。政策聚焦电力市场改革，涉及中长期交易、现货市场、辅助服务、绿电绿证等电力交易品种，未提及加油站或油品销售相关内容。
  充电: 直接涉及车网互动价格机制改革试点。济南、淄博等地开展居民充电桩车网互动价格机制改革试点，电动汽车充电可根据市场价格在低谷时段充电赚取价差，并可在高峰时段自愿反向放电获利，实现充电由高峰向低谷时段转移。零售市场标准化套餐设计（含绿电类套餐）为充电桩运营商提供了新的市场参与路径。
  电力_储能_V2G_交易: 直接涉及储能盈利机制与虚拟电厂建设。现货市场高峰高电价激励新型储能顶峰发电最高达804万千瓦，低谷低电价激励储能低谷充电电力最大达814万千瓦；创新建立独立储能'电能量收益+容量补偿+租赁收益+辅助服务'多元盈利机制；44家虚拟电厂注册入市、聚合资源576万千瓦；车网互动与电力现货市场有效衔接，电动汽车可参与反向放电；2025年度新能源机制电价竞价完成，新能源电价市场化改革率先实操落地。
行动建议:
- A 趁早:在济南、淄博试点经验基础上，研究将车网互动价格机制拓展至其他地市充电桩运营商，提前布局V2G充放电价差盈利模式。
- B 趁早:对接独立储能'电能量收益+容量补偿+租赁收益+辅助服务'盈利机制，评估建设或运营储能项目的商业可行性。
- C 趁早:研究虚拟电厂聚合资源576万千瓦的接入标准和参与模式，评估聚合商角色的市场机会。
- D 研究:关注'容量补偿+电能量'完整能量市场价格体系的运行规则演变，为储能参与现货市场顶峰/填谷交易做好准备。
didi_impact_one_liner: 充电业务受车网互动试点和V2G价格机制直接影响，储能盈利模式多元化为相关业务创造机会。
