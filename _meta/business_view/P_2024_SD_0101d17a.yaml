影响分析:
  加油: 未直接涉及。该文件针对可再生能源绿色电力证书的核发与交易规则，不涉及燃油业务或加油站运营。
  充电: 未直接涉及。文件聚焦可再生能源发电侧绿证的申领及补贴抵扣机制，未直接规定充电桩、充电运营或新能源汽车用能侧的绿证使用或交易规则。
  电力_储能_V2G_交易: 直接涉及绿电交易与补贴衔接机制。具体而言：①文件明确自发自用电量现阶段核发绿证但暂不参与交易，待2025年4月国家征求意见稿正式印发后将按新规执行，这意味着分布式光伏自用部分未来可产生绿证交易收益；②享受中央财政补贴的全额上网项目，市场化交易的绿证收益在补贴发放时等额扣减——即绿证收益将直接冲抵应发补贴，项目实际到手补贴将减少。储能、虚拟电厂、V2G等业务未在文中出现，不涉及相关机制。
行动建议:
- A 趁早摸清山东省内分布式光伏自用项目的绿证核发底数，评估待国家新规落地后自用绿证可交易化带来的增量收益空间；
- B 趁早梳理公司持有的享受国补的可再生能源项目清单，按市场化交易绿证收益等额扣减补贴的规则测算实际补贴减损幅度，并将其纳入项目经济性评估；
- C 趁早对接国家可再生能源信息管理中心（010-51973333），确认公司项目在绿证核发系统中的注册状态及数据申报流程，为后续合规申领奠定基础；
- D 研究国家能源局2025年4月发布的《可再生能源绿色电力证书核发实施细则（试行）》（征求意见稿）正式版本，跟踪自发自用绿证交易机制的落地时间表和政策细节。
didi_impact_one_liner: 政策明确了自发自用绿证暂不可交易但未来可期，以及补贴项目市场化交易绿证收益等额扣减补贴，直接影响分布式新能源项目收益预期。
