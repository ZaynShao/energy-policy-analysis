  加油: 直接涉及。政策明确调整本市汽柴油最高零售价格（90/93/97号汽油及0/-10/-20/-35号柴油），规定批发价扣减标准（配送每吨扣300元，非配送加运杂费1%），要求明码标价和价格监督检查。这是加油站核心合规事项，涉及定价权限和合规义务。
  充电: 未直接涉及。全文仅针对汽柴油价格调整，未涉及充电服务或新能源汽车相关定价、补贴或监管要求。
  电力_储能_V2G_交易: 未直接涉及。政策聚焦成品油价调整，不涉及电力交易、储能、虚拟电厂、V2G或双向充电桩等机制或市场准入要求。
