影响分析:
  加油: 直接相关。贵州自2026年9月11日24时起上调成品油价格,89号汽油(国VIB)、0号柴油每吨在现行标准基础上分别上调260元、250元,最高批发价与最高零售价同步上移,经营企业只能在不超过最高批发、零售价的前提下自主定价。对本业务线的直接影响有两处:(1)价格天花板变化改变贵州各价区的批零价差与折扣空间,加油站挂牌价与采购结算价的相对关系需要重新测算(利润来自折扣空间而非挂牌价本身);(2)调价文件同时要求严格执行国家价格政策、规范经营行为,各地相关部门加大监督检查力度、严查不执行国家价格政策的行为,消费者可通过12315举报,属于商户合规成本项的边际上行。县域及下沉城市展业、KA总部合作与支付接口口径未在正文涉及。
  充电: 未直接涉及。正文只调整贵州成品油最高批发价与最高零售价,并规定价格监督检查与12315举报,未提及充电桩建设、充电服务费、场站电价结构或超充标准。间接观察(仅作参考,不构成决策依据):成品油零售价上调会小幅抬升燃油车用能成本,对充电的相对经济性略有正向,但该文件不改变充电业务任何在建节奏、选址或定价变量。
  电力_储能_V2G_交易: 未直接涉及。正文为省级成品油价格调整通知,未出现电力市场、现货交易、售电、储能、虚拟电厂、V2G、分布式新能源入市或聚合商准入等任何内容。间接观察:成品油价上行对火电燃料成本与电力市场供需无直接传导机制可依据,不建议据此调整电力业务判断。
行动建议:
- A 趁早:在9月11日24时调价窗口前,取回贵州省各价区汽油、柴油销售价格表附件,核对贵州在营站点的最高批发价/最高零售价基准,同步更新站点挂牌与后台价格参数,确保定价不超过最高限价。
- B 趁早:结合新最高批发价与炼厂装车价,重算贵州各价区单吨折扣空间与站点毛利,识别价差被压缩的站点并调整采购与让利口径,避免出现超限价或价格违规风险。
- C 研究:对照本文件“规范经营行为、加大监督检查、12315可举报”的要求,盘点贵州商户的价格公示与合规自查流程,排查是否存在不执行国家价格政策的敞口。
didi_impact_one_liner: 贵州省成品油最高批发价、零售价分别上调260元/吨、250元/吨并要求严格执行国家价格政策,直接触及加油业务在黔的价格合规与批零折扣空间;充电与电力(储能/VPP/V2G/交易)未直接涉及。
