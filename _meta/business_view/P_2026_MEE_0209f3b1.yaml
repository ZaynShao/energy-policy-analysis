影响分析:
  加油: 未直接涉及。加油站运营不直接产生2.6万吨CO2当量门槛的排放，不属于发电/钢铁/水泥/铝冶炼等直接管控行业，亦不在石化/化工/建材/有色/造纸/民航等其他重点行业范围内。碳市场直接约束的是排放端而非零售消费端。
  充电: 未直接涉及。充电服务属于终端电力消费环节，碳排放权交易市场管控的是生产端排放源，不直接覆盖新能源车充电运营。文件未涉及充电设施建设、V2G或电动汽车碳减排机制等事项。
  电力_储能_V2G_交易: 未直接涉及。文件明确纳管的是发电/钢铁/水泥/铝冶炼行业，电力交易、储能设施、V2G机制、双向充电桩、虚拟电厂等均未在正文中出现等价明确机制。碳市场管控的是排放端配额，发电侧碳成本传导至电价的机制文件未明确阐述，电力消费侧交易品种未提及。
行动建议:
- A 趁早建立碳价监测机制，追踪发电侧碳成本变化对能源产品定价的潜在影响，为未来碳成本内部化传导做战略预判
- B 研究碳市场扩容趋势，关注其他重点行业纳入碳市场的节奏，提前布局可能受影响客户的能源服务需求
- C 趁早评估企业自身碳排放家底，对照2.6万吨CO2当量门槛开展碳资产管理基线调查
- D 研究碳价信号对电力批发市场的中长周期影响，储备碳-电联动分析能力
didi_impact_one_liner: 碳市场2026年扩容至钢铁/水泥/铝冶炼行业，加油/充电/储能/电力交易业务均未直接涉及，但需关注发电侧碳成本向终端能源价格的间接传导影响
