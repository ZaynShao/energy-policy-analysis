影响分析:
  加油: 未直接涉及。正文聚焦于发电、钢铁、水泥、铝冶炼行业的碳排放权交易管理，加油业务（加油站零售）不在直接排放源管理范围。
  充电: 未直接涉及。正文针对发电等直接排放行业的碳配额管理，充电运营服务未在调控范围内。
  电力_储能_V2G_交易: 未直接涉及。正文明确将发电行业纳入碳排放权交易市场，但储能、虚拟电厂(VPP)、V2G、电力交易等机制未在正文中出现，无等价明确机制，故不构成直接业务影响。发电行业被纳入配额管理，可能通过碳成本传导影响电力供给结构和价格形成（间接），但需另行分析。
行动建议:
- A 趁早:关注碳市场扩容信号，正文已将铜冶炼、平板玻璃等纳入排放报告管理范围，能源消费侧企业宜提前评估碳排放核算边界，规避合规风险
- B 研究:发电行业碳配额分配与清缴时间节点（配额预分配4月、核定9月、清缴12月），分析碳成本向电力价格传导路径对自身能源采购成本的影响
- C 趁早:能源贸易与零售企业宜建立碳排放基础数据管理能力，正文明确了月度信息化存证和年度报告要求，具备条件后可对接碳市场信息平台
- D 研究:持续跟踪碳市场行业扩容进展，石化、化工、建材（平板玻璃）、有色（铜冶炼）、造纸、民航已纳入报告管理，未来若纳入交易体系将产生直接影响
didi_impact_one_liner: 碳市场2026年管理通知聚焦发电等四行业直接排放管控，暂未向加油/充电/储能V2G交易延伸，但发电行业碳配额机制可能通过电价间接影响能源采购成本
