影响分析:
  加油: 未直接涉及。本政策聚焦电网调峰、储能和智能化调度能力建设，虽提及适度布局调峰气电项目，但属于一般性能源调峰资源优化，并非针对加油/加油站业务的直接影响。
  充电: 直接涉及。政策明确提出推进需求侧资源常态化参与调峰，支持负荷聚合商、虚拟电厂等主体聚合可调节负荷（含分布式电源）形成规模化调节能力，推动分钟级至小时级需求响应。充电运营商作为可调节负荷资源，可参与需求侧响应并通过聚合商角色获取收益；同时政策目标到2027年需求侧响应能力达最大负荷5%以上，为充电业务参与电力系统调节提供政策框架。
  电力_储能_V2G_交易: 直接涉及多个层面。（1）储能：政策明确推进抽水蓄能电站规划建设，目标到2027年投运规模达8000万千瓦以上；提出保障新型储能市场化发展的政策体系基本建成。（2）虚拟电厂/负荷聚合商：政策明确支持负荷聚合商、虚拟电厂等主体聚合形成规模化调节能力。（3）智能化调度：政策提出建设适应新型电力系统的智能化调度体系。（4）V2G/电力交易：正文未明确出现V2G机制或电力交易相关内容。
行动建议:
- A 趁早:充电业务趁早研究将充电设施接入需求响应体系，探索作为负荷聚合商参与电网调节的商业模式
- B 研究:充电业务研究充电负荷参与分钟级/小时级需求响应的技术可行性和收益模式
- C 趁早:储能业务趁早对接抽水蓄能规划布局，关注区域优化配置窗口期
- D 研究:储能业务研究新型储能市场化发展政策走向，提前布局适应智能化调度要求的技术方案
- E 趁早:虚拟电厂/负荷聚合商趁早研究聚合可调节负荷资源的运营模式，匹配政策5%需求侧响应能力目标
- F 研究:密切跟踪政策配套细则出台动态，及时调整储能项目开发和负荷聚合业务拓展策略
