影响分析:
  加油: 未直接涉及。该政策聚焦电力系统调峰、储能和智能化调度，未涉及燃油供应、加油站网络或其他油气业务领域。
  充电: 未直接涉及。正文虽提到“深入挖掘可调节负荷、分布式电源等资源潜力”“推动分钟级、小时级需求响应”，但未明确提及充电桩、充换电基础设施或新能源汽车充电参与调节的具体机制。充电业务作为潜在需求侧资源存在间接联系，但政策正文未作出直接安排。
  电力_储能_V2G_交易: 直接相关且多处涉及。政策第一条总体要求明确提出“推动电源侧、电网侧、负荷侧储能规模化高质量发展，建设灵活智能的电网调度体系”；第三部分专设“推进储能能力建设”部署抽水蓄能电站规划；第四点明确支持“负荷聚合商、虚拟电厂等主体聚合形成规模化调节能力”；第五点强调“保障新型储能市场化发展的政策体系基本建成”。正文还设定到2027年抽水蓄能电站投运规模达8000万千瓦以上、需求侧响应能力达最大负荷5%以上的量化目标。政策直接利好储能资源配置、虚拟电厂参与调度和新型储能市场化发展，但V2G/反向充电未在正文中出现。
行动建议:
- 趁早对接所在省级能源主管部门，摸清本省抽水蓄能站点资源条件和布局规划，寻找与区域电网公司合资开发或提供配套服务的切入点。
- 趁早研究虚拟电厂运营资质和参与电力系统调节的技术要求，提前储备负荷聚合和调度协同能力，为争取参与分钟级/小时级需求响应做好准备。
- 趁早布局用户侧储能项目，利用政策窗口期完成选址论证和可行性研究，为后续市场化发展政策落地做好准备。
- 研究:跟踪国家层面新型储能市场化发展政策体系的出台进展，及时掌握价格机制和准入规则变化。
