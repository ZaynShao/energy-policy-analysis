影响分析:
  加油: 未直接涉及。规则聚焦电力中长期市场交易行为规范，加油业务（燃油零售）不在本规则调整范围内。
  充电: 规则明确规范电力中长期交易行为，充电运营商作为电力用户和潜在市场主体，其购电渠道、合同签订机制和交易行为将遵循统一规则。规则未对充电桩建设或充换电服务作专项规定，属于一般电力用户管理范畴。
  电力_储能_V2G_交易: 规则为电力中长期市场的基础性交易规范，储能（含VPP/V2G）作为电力系统资源参与市场需在后续实施细则中明确。本规则仅提出原则性框架，未直接规定储能参与市场的方式、准入条件或交易机制。
行动建议:
- 'A 趁早: 研究本规则对电力用户参与中长期交易的基本要求，比对现行购电合同结构，评估2026年3月前需调整的购电策略'
- 'B 研究: 跟踪各地电力中长期市场实施细则制定进展，关注储能、VPP等新兴主体参与电力市场的准入条件和技术要求'
- 'C 研究: 分析中长期市场与现货市场的衔接机制，评估对电力交易组合策略的潜在影响'
didi_impact_one_liner: 充电运营作为电力用户将纳入统一中长期交易规则框架，储能等新型主体参与市场需待实施细则进一步明确。
