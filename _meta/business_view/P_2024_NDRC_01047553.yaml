影响分析:
  加油: 未直接涉及。该政策聚焦新能源汽车与电网互动,未涉及传统加油业务场景。
  充电: 直接涉及。政策明确要求新建充电桩统一采用智能有序充电桩,并按需推动既有充电桩智能化改造;鼓励充电运营商因地制宜建设光储充一体化场站;全面实施并持续优化充电峰谷电价机制,目标到2025年低谷时段充电电量占比达60%以上。
  电力_储能_V2G_交易: 直接涉及。政策将车网互动定位为移动式电化学储能资源,明确涵盖双向充放电(V2G)技术攻关、设备研制及综合示范;提出参与虚拟电厂、聚合交易等应用场景;2030年车网互动实现规模化应用;涉及标准体系建设及配套电价与市场机制完善。
行动建议:
- A 趁早:对接政策试点城市名单,提前布局智能有序充电桩改造和光储充一体化场站建设,抓住低谷时段电价套利窗口。
- B 研究:深度研究双向充放电(V2G)技术标准进展和试点示范申报要求,评估V2G车桩改造及运营模式可行性。
- C 研究:跟踪车网互动标准体系建设动态,研究参与虚拟电厂聚合交易需具备的技术平台和资质条件。
- D 趁早:对接电网企业支撑保障能力建设需求,评估车网互动系统架构、双向充放电设备等领域的合作切入点。
didi_impact_one_liner: 政策系统性推动车网互动从技术标准到市场机制的全面落地,智能充电桩改造、V2G场站建设及聚合交易参与是充电业务和中长期储能/电力交易布局的核心机遇窗口。
