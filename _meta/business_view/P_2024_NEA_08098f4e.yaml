影响分析:
  加油: 未直接涉及。该政策聚焦电力系统调节能力优化和新型储能发展,核心内容为电力系统内部调节资源配置,未涉及油气领域或加油业务。
  充电: 未直接涉及。正文虽提及新能源快速发展,但未明确写到充电桩、充换电基础设施或新能源汽车充换电服务。共享储能部署可能形成对充电网络的供电支撑,但属间接关联,正文未明确阐述。
  电力_储能_V2G_交易: 直接涉及。明确提出充分发挥新型储能调节能力,将其作为电力规划重要组成部分;部署建设共享储能电站,发挥规模化储能综合效益;提出需求侧响应与常规电源、储能等调节资源协调配置;强调提升电力系统灵活调节水平,服务于新能源高效消纳。V2G、电力交易具体机制未在正文明确阐述。
行动建议:
- 趁早布局共享储能项目选址与资源储备,跟踪《行动方案》落地细则,争取纳入区域共享储能电站建设方案
- 趁早对接省级电力规划编制工作,研究将储能资源纳入系统调节能力建设方案的政策路径
- 趁早开展储能联合新能源场站的商业模式设计,探索共享储能服务新能源配储需求的合作机制
