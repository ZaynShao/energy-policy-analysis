影响分析:
  加油: 未直接涉及。本方案聚焦电动汽车充电设施，未涉及燃油车、加油站或成品油相关业务。
  充电: '直接利好。（1）规模目标明确：2027年建成2800万个充电设施（含160万城市直流枪+4万高速充电枪+1.4万农村直流枪），较当前实现倍增；（2）居住区充电加速推进：新建居住区固定车位全部配建或预留充电设施，既有居住区推进"统建统服"试点（目标1000个小区）；

    （3）大功率充电成重点：10万个大功率充电枪建设任务明确，800伏以下平台老旧设施列入更新改造；（4）农村充电空白填补：要求农村地区公共充电设施全面覆盖。'
  电力_储能_V2G_交易: V2G获实质性推进。（1）量化目标：新增双向充放电（V2G）设施超5000个，反向放电量超2000万千瓦时；（2）市场机制明确：推动车网互动资源聚合参与电力市场交易，完善充换电场站对电网放电价格机制；（3）试点范围扩大：组织电网企业、虚拟电厂（负荷聚合商）开展区域级、省级、城市级车网互动实测；（4）配电网升级配套：充电设施接入需求纳入配电网规划，推广智能有序充电提升电网承载调节能力。
行动建议:
- A 趁早布局居住区充电运营：研究参与"统建统服"模式试点，锁定1000个目标小区中的先发机会，同步对接老旧小区改造和完整社区建设配套资源
- B 趁早对接V2G试点机制：研究车网互动资源聚合参与电力市场的路径，储备双向充放电（V2G）设施建设和运营能力，关注放电价格机制和区域级实测机会
- C 趁早参与大功率充电赛道：研究高速公路服务区和城市核心区大功率充电枪项目招投标，储备800伏以上平台充电技术能力
- D 趁早布局农村充电空白市场：跟踪1.4万个农村直流充电枪建设任务，探索与配电网升级改造协同的场址布局机会
didi_impact_one_liner: 充电业务迎来规模化建设机遇，V2G从试点走向规模应用，配电网改造为充电接入提供支撑，但需关注农村布点经济性和大功率充电投资回报周期。
