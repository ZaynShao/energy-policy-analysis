影响分析:
  加油: 未直接涉及。该政策聚焦电动汽车充电设施建设，加油业务不在正文覆盖范围内。但作为交通能源替代性政策，充电设施三年倍增将对加油站形成间接竞争压力——充电便利性提升可能分流燃油车消费场景。
  充电: 直接影响。充电业务是该政策核心受益领域：(1)城市快充网络提质：2027年前新增160万个直流充电枪，含10万个大功率充电枪，直辖市/省会城市打造大功率充电示范；(2)城际充电加密：高速公路服务区新建改建4万个60kW以上充电枪，高寒高海拔外实现全覆盖；(3)农村充电下沉：新增至少1.4万个直流充电枪，实现农村公共充电全面覆盖；(4)居住区充电放量：新建居住区固定车位全配充电桩，既有小区改造增配，2027年打造1000个统建统服试点；(5)V2G规模化：新增V2G设施超5000个，反向放电量超2000万千瓦时。
  电力_储能_V2G_交易: 直接影响。正文明确推进车网互动规模化应用：(1)V2G机制落地：新增双向充放电(V2G)设施超5000个，反向放电量超2000万千瓦时；(2)虚拟电厂参与：明确组织电网企业、虚拟电厂(负荷聚合商)开展区域/省级/城市级车网互动实测；(3)电力市场交易：推动车网互动资源聚合参与电力市场交易，完善放电价格机制；(4)配电网改造：将充电接入需求纳入配电网规划，推广智能有序充电提升承载调节能力。
行动建议:
- A 趁早布局大功率充电网络：直辖市/省会城市明确打造大功率充电示范的政策信号已释放，建议利用先发优势抢占核心区位快充站点，在政策窗口期完成布点；
- B 研究高速公路服务区充电运营机会：4万个60kW以上充电枪改建目标明确，服务区充电将成为高频场景，建议提前介入运营或设备供应合作；
- C 趁早对接农村充电基础建设：农村地区充电设施全面覆盖目标确定，结合春节返乡需求保障，建议布局县域及以下充电网络；
- D 趁早参与车网互动试点：政策明确扩大车网互动试点、V2G设施超5000个目标，虚拟电厂/负荷聚合商参与路径已明确，建议接入区域电网协同平台；
- E 研究居住区统建统服商业模式：1000个统建统服试点小区目标确立，该模式实现有人建有人管可持续，建议与物业/运营商联合试点；
- F 趁早布局配电网改造和智能有序充电：配电网升级和智能有序充电推广应用已明确，充电运营商应同步规划电网接入和负荷管理方案。
didi_impact_one_liner: 充电业务获历史性政策红利，2800万充电设施目标催生城市快充、高速全覆盖、农村下沉、V2G规模化四大赛道，电力交易侧同步开放车网互动资源聚合参与通道。
