  加油: 政策未直接涉及加油站或燃油零售业务。正文虽提到非化石能源占比目标(25%)和公交出租车电动化目标(55%)，但属于能源结构转型的宏观方向性指标，不构成对加油业务的直接准入、监管或运营影响。
  充电: 直接涉及。政策明确提出'加快建设便捷超充之城'，作为智能网联新能源汽车'协同跨越'行动的重要组成部分，为超充基础设施建设提供政策依据和发展导向。
  电力_储能_V2G_交易: 未直接涉及。正文未出现储能、虚拟电厂(VPP)、V2G、电力交易、反向充电或双向充电桩等具体机制或项目要求。非化石能源占比目标为方向性指标，不等同于具体的储能建设或电力交易机会。
