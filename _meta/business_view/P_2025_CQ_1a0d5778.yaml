- 趁早研究:密切跟踪'便捷超充之城'实施方案及超充桩建设标准,提前布局超充网络选址与投资测算
- 趁早对接:主动对接重庆市新能源汽车产业集群(长安、赛力斯等),建立充电服务合作意向
