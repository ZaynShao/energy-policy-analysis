影响分析:
  加油: 未直接涉及。该政策核心聚焦于设备更新、消费品以旧换新、回收循环利用和标准提升四大行动，加油业务不属于政策明确覆盖的领域，加油站设备更新属于一般性工业/商业设备更新范畴，正文未就此作出专项部署。
  充电: 动力电池更新换代的直接受益领域。政策明确'支持老旧新能源公交车和动力电池更新换代'，并设定报废汽车回收量较2023年增长约一倍的目标，将直接带动公交车辆更新及配套充电设施建设需求；城市公交电动化替代持续推进为充电运营市场提供增量空间。
  电力_储能_V2G_交易: 发输配电设备更新受益。政策将'发输配电设备等更新和技术改造'列为重点行业设备更新重点方向，聚焦电力等行业'大力推动'相关更新，电力系统基础设施升级需求明确。但储能、V2G、电力交易、虚拟电厂等机制未在正文中出现，不宜扩展解读。
行动建议:
- 'A 趁早: 摸排旗下充电场站中服务于公共交通的站点规模，研判老旧公交更新换代带来的充电服务增量机会，提前锁定合作关系或优化站点布局'
- 'B 趁早: 梳理发输配电设备资产状况，关注节能降碳改造政策配套细则，跟踪重点行业设备更新带来的配网改造需求，提前储备相关业务能力'
- 'C 趁早: 调研老旧动力电池回收循环利用市场，了解政策对''报废汽车回收量增长约一倍''''再生材料占比提升''等目标的配套措施，探索电池梯次利用或回收合作模式'
- 'D 研究: 深入分析公交领域''以旧换新''补贴或财税支持政策落地节奏，评估对充电运营收益结构的潜在影响'
didi_impact_one_liner: 公交电动化更新与动力电池换代为充电业务带来增量空间，发输配电设备更新利好电网侧业务，但加油及储能/V2G/电力交易领域暂未被政策直接覆盖。
