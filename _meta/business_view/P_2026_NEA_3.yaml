影响分析:
  加油: 未直接涉及。正文只批准内蒙古电力交易中心开展绿证交易试点，未涉及成品油批发价、炼厂装车价、商户合规成本、KA 支付接口或下沉城市展业，不改变加油业务任何决策变量。
  充电: 未直接涉及。正文未提及充电桩建设、服务费定价、场站电价结构或超充标准；绿证与绿电交易的衔接机制，只是间接可能与场站绿电采购的环境属性认定有关，但正文没有对充电运营提出任何要求或机会。
  电力_储能_V2G_交易: 间接、有限。正文同意内蒙古电力交易中心组织开展绿证交易试点，并要求完善实施细则、升级技术平台、做好绿色电力交易与绿证交易的机制衔接，同时由华北能源监管局监管。但正文未涉及现货规则与结算机制、中长期与现货比例、偏差或反向考核上限、售电公司利润上限与让利退还、火电长协签约履约、分布式新能源入市与聚合商准入，也未提及储能、V2G、虚拟电厂，因此不改变上述任何决策变量。另：公司是否具备内蒙古绿证交易主体资格属于画像空白，需人工裁定，不能据此判定为低相关。
行动建议:
- A 趁早:核实公司在内蒙古的售电、交易主体归属与绿证交易参与口径；是否持牌属于画像空白，须由人工裁定后再定是否跟进该试点。
- B 研究:跟踪内蒙古绿证交易实施细则、技术平台上线节点以及绿电交易与绿证交易的衔接安排，评估对现有绿电采购合同、售电合同中环境属性条款的间接影响，不预设新增业务。
