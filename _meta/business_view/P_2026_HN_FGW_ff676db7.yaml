影响分析:
  加油: 直接涉及：汽油、柴油最高零售价每吨分别上调345元和335元，最高批发价等额调整；对零售企业按最高零售价每吨扣减300元、对符合资质的民营批发企业扣减400元；未约定配送的运杂费由供需双方协商。该通知直接改变湖南区域加油业务的零售价上限、批发结算基准以及批零价差和折扣空间的测算；正文未涉及炼厂装车价、商户合规成本、KA支付接口或下沉展业。
  充电: 未直接涉及；正文只调整成品油价格，未出现充电、建桩、服务费或场站电价条款。间接来看，油价上调可能影响燃油车使用成本，但这不构成本文对充电业务决策变量的直接改变。
  电力_储能_V2G_交易: 未直接涉及；正文未出现电力、储能、V2G、虚拟电厂或电力交易条款，不改变相关决策变量。
行动建议:
- A 趁早：按湖南2026年10月29日24时生效的最高零售价和等额调整后的最高批发价，逐站更新挂牌价上限与批发结算基准，并按零售企业300元/吨、符合资质民营批发企业400元/吨的扣减口径，重新计算批零价差和折扣空间。
- B 研究：梳理与中石化、中石油湖南公司及民营批发商的配送或未配送合同条款，测算运杂费协商区间；跟踪后续国家调控和省内价格监测要求，形成调价应对模板。
didi_impact_one_liner: 湖南成品油最高零售价和最高批发价同步上调，批零扣减固定，直接改变加油业务价差基准；充电和电力交易未直接涉及。
