影响分析:
  加油: 未直接涉及。本文件聚焦电力体制改革,针对输配电价改革试点、电网运营模式变革和电力市场建设,加油业务属于传统石油能源零售范畴,不在本轮电改覆盖范围。
  充电: 直接涉及。售电侧改革允许社会资本进入售电市场,充电设施运营作为电力消费侧的重要场景,可能获得参与电力直接交易或通过售电公司购电的机会,降低充电用电成本。但需等待附件5《关于推进售电侧改革的实施意见》的具体规定。
  电力_储能_V2G_交易: 未直接涉及。本文件核心是输配电价改革,主要规范电网企业准许收入和输配电价形成机制,未明确涉及储能调度、V2G机制设计或电力交易规则,相关市场机会需参照附件2《关于推进电力市场建设的实施意见》和附件3《关于电力交易机构组建和规范运行的实施意见》的具体内容。
行动建议:
- A 趁早研判充电业务接入售电市场的条件,跟踪附件5售电侧改革实施细则,评估通过售电公司代理购电或直接参与交易的可行性。
- B 研究输配电价改革对充电运营成本的传导机制,关注各试点省份分电压等级输配电价核定结果,优化充电设施选址和定价策略。
- C 持续跟踪附件2、附件3中电力市场交易规则和交易机构设置,储备参与电力批发市场的能力,等待储能等新兴业务政策明确。
- D 建立电力体制改革动态监测机制,重点关注交叉补贴改革对工商业电价的影响,预判充电定价环境变化。
didi_impact_one_liner: 充电业务迎来售电侧开放机遇,可通过售电市场交易降低用电成本,但需等待售电侧改革具体实施细则出台。
