影响分析:
  加油: 未直接涉及。本办法聚焦新型储能电站规划建设运行，与加油站业务无关联。
  充电: 未直接涉及。本办法规范的是接入公用电网的储能电站，未直接涉及充电设施建设运营。储能虽可间接支撑充电负荷侧电力调节，但正文未明确充电相关条款。
  电力_储能_V2G_交易: '【直接影响】本办法系统规范广东省新型储能电站规划、建设和运行，直接影响储能业务：

    1. 规划体系建立：省发展改革委组织省级电网企业、电力规划设计机构研究全省储能发展规模需求，编制发布独立储能电站建设布局指引，明确全省年度发展方案，滚动调整机制为项目准入提供窗口期。

    2. 项目选址前置论证：要求业主（项目法人）重点论证项目选址、市场需求、建设规模、并网接入条件、安全设施等，形成规范化选址流程。

    3. 多部门协同监管：明确省发展改革委统筹、属地部门监督、电网企业负责并网接入和调度运行的职责体系，为储能项目落地提供审批路径。

    4. 安全标准收紧：电化学储能电站选址需遵守法律法规和国家行业标准，对锂离子电池厂房明确禁止建设在地下半地下高层，明确安全底线。

    5. 适用边界清晰：以输出电力为主要形式、接入10（6）千伏及以上电压等级公用电网并对外提供服务的储能电站适用本办法，明确市场准入门槛。

    【未直接涉及】V2G、电力交易、反向充电等机制未在正文中出现。'
行动建议:
- A 趁早研判:趁早研究省级独立储能电站建设布局指引和年度发展方案，识别政策窗口期，锁定符合布局方向的项目机会
- B 趁早对接:趁早与属地发展改革（能源电力）部门和电网企业建立沟通渠道，获取属地年度发展方案和并网接入条件的第一手信息
- C 趁早准备:趁早启动项目选址论证工作，对照本办法安全选址要求（避开易燃易爆场所、重要架空电力线路保护区等），形成合规选址报告
- D 研究:研究独立储能电站作为电网调节资源的商业模式，对接省级电网调度运行要求
- E 研究:研究本办法与广东省新型储能产业高质量发展指导意见的衔接，在政策组合中寻找协同发展路径
didi_impact_one_liner: 广东储能政策体系化，独立储能项目迎规划窗口，需趁早布局选址论证和属地对接
