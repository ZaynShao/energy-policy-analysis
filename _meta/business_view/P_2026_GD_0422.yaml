影响分析:
  加油: 未直接涉及。本办法规范对象为接入公用电网并对外提供服务的新型储能电站，是电力系统调节设施，与加油站业务无直接关联。
  充电: 未直接涉及。本办法聚焦于储能电站的规划、建设和运行管理，虽与充电基础设施同属能源补给领域，但本办法未直接涉及充换电站、充电桩或新能源汽车充电服务业务。间接影响方面，储能电站可作为充电场站的配套供电保障，但正文未明确表述此关联机制。
  电力_储能_V2G_交易: 直接涉及。本办法全面规范广东省新型储能电站的规划布局（省级独立储能电站建设布局指引）、建设运行（含选址安全要求、并网接入条件）、监督管理（省-市两级职能部门分工、业主责任主体）。明确储能电站接入10（6）千伏及以上电压等级公用电网，由电网企业负责并网接入和调度运行，为储能参与电力系统调节提供制度框架。V2G和电力交易未在正文中出现具体机制描述。
行动建议:
- A 趁早:在省级独立储能电站建设布局指引正式发布后30日内，结合公司储能业务布局，对照指引选址条件完成自有项目的合规性预评估。
- B 研究:组织专项小组研读本办法关于电网企业调度运行、储能参与电力市场交易的框架性规定，梳理公司储能资产接入和交易参与的业务路径。
- C 趁早:对接属地市发展改革（能源电力）部门，了解本市独立新型储能电站年度发展方案编制进展，提前储备项目资源。
- D 研究:重点关注电化学储能电站选址安全要求（第七条），排查公司在建和拟建储能项目选址合规性。
didi_impact_one_liner: 广东省储能电站管理办法为全省新型储能项目提供规划布局指引和建设运行规范，公司需趁早对接省级布局指引和属地年度发展方案，锁定合规项目选址，并研判储能资产接入电网调度和参与市场交易的业务路径。
