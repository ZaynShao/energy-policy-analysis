影响分析:
  加油: 直接涉及。本通知转发国家发改委降价文件，明确北京市汽柴油最高零售价格下调（92号汽油从约6.15元/升降至6.11元/升），同时规定批发价按零售价扣减300元/吨确定，要求各加油站明码标价并严格执行，违者由价格主管部门查处。加油站须在不超过最高限价范围内自主定价，并承担价格公示义务。
  充电: 未直接涉及。本通知系针对汽柴油零售价格调整，未涉及新能源汽车充电服务定价或收费标准。
  电力_储能_V2G_交易: 未直接涉及。文件内容限于成品油（汽油、柴油）的零售与批发价格管理，不涉及电力交易、储能设施、虚拟电厂、V2G或充电桩等电力系统业务。
行动建议:
- 趁早梳理加油站定价合规流程，确保自主定价不超过最高零售价且已完成明码标价公示，防范价格违法风险
- 趁早建立汽柴油批发成本核算机制，依据文件明确的扣减规则（配送每吨扣300元+1%运杂费）优化采购定价
- 趁早安排价格监测跟踪，文件要求主管部门加强价格监测和监督检查，经营者应主动留存价格执行台账备查
- 研究：因政策已于2015年8月18日失效，若仅为历史合规复盘，可梳理当时降价执行的合规档案；若为当前业务参考，需确认现行北京市汽柴油定价机制及有效文件。
didi_impact_one_liner: 仅影响北京市汽柴油零售定价与批发价差合规，加油站须执行降价后的最高限价并完成明码标价，充电与电力业务未涉及。
