影响分析:
  加油: 未直接涉及。本规则规范的是电力市场交易,加油业务(燃油零售)不属于电力市场范畴。
  充电: 未直接涉及。正文未提及充电桩、充换电或新能源汽车充电相关内容,仅有发电企业、电力用户、售电公司等一般市场主体。充电运营商作为电力用户参与市场的具体机制在正文节选中无明确体现。
  电力_储能_V2G_交易: 未直接涉及。正文为通知印发修订后的电力市场运营规则,仅提及发电企业/电力用户/售电公司等一般市场主体,未明确涉及储能、虚拟电厂(VPP)、V2G或电力交易中的具体新型主体和机制。
行动建议:
- A 趁早:研究本次2.1版相对2.0版的具体修订内容,评估规则变化对现有市场主体的潜在影响;可查阅完整细则原文判断是否有新增储能/VPP相关条款
