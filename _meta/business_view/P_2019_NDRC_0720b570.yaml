影响分析:
  加油: 未直接涉及。该政策聚焦于可再生能源电力消纳责任权重的设定与落实，面向电网企业、售电公司、电力用户等电力市场主体，未涉及成品油销售或加油站业务。
  充电: 未直接涉及。政策明确充电桩用电属于电力消费，但仅规定电力用户作为消纳责任主体须完成分配的消纳量，未对充电业务主体设定专项消纳义务或激励措施。充电桩运营主体作为一般电力用户承担相应消纳责任，属通用性规定而非针对充电业务的专项机制。
  电力_储能_V2G_交易: 未直接涉及。政策虽提及各承担消纳责任的市场主体可通过电力交易完成消纳量，但正文未明确出现储能、V2G、虚拟电厂或电力交易机制的具体设计条款，消纳量可通过多种方式（含未明确列举的方式）完成，故不构成对上述具体业务的直接业务影响。
行动建议:
- A 趁早:将充电服务纳入企业绿电消纳规划，在充电场站选址和运营中优先配置可再生能源供电方案，以应对未来可能的消纳责任考核延伸。
- B 研究:跟踪各省级能源主管部门制定的消纳实施方案，关注充电运营商是否被纳入消纳责任主体范围及其对应的消纳量分配机制。
didi_impact_one_liner: 政策聚焦可再生能源电力消纳责任权重分配，充电业务作为一般电力消费主体面临潜在消纳责任延伸，但储能/V2G/电力交易未获直接机制安排。
