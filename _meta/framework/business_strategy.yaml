# 材料覆盖不到、需要人工裁定的地方。**消费方遇到这些维度不得自动判低相关。**
open_questions:
  - id: Q1
    topic: 油品品种与车型(汽油/柴油/重卡/商用车)
    status: 材料空白(四段合计 0 次)
    note: |
      现行「汽油为主,柴油/重卡只作宏观背景」的口径出处不在本材料。
      在找到出处或由业务方重新确认之前,柴油/重卡类政策应标「需人工裁定」,
      **不得自动降权**——证据为空不等于业务无关。
  - id: Q2
    topic: 县域/农村场景在充电业务中的位置
    status: 材料空白(四段合计 0 次);充电的组织单位是城市
    note: |
      既有兜底规则是「涉该场景的充电政策影响并入充电」。本材料既不支持也不证伪。
      提示反向风险:既然该维度在 2026 战略里零权重,把这类政策并入充电打分
      可能**系统性高估**其相关度。建议保留兜底但不声称有业务材料支撑。
  - id: Q3
    topic: 高速/服务区充电
    status: 材料空白(0 次)
    note: 2026 打法以城市为单位组织,高速场景未出现。属口径盲区,建议人工复核而非自动降权。
  - id: Q4
    topic: 电力业务是否自己持牌
    status: 未明说(牌照/持牌/资质 0 次)
    note: 通篇第一人称售电公司口径且它代理别人入市,推断为自营按省展业,但无直接确认。
  - id: Q5
    topic: V2G / 车网互动
    status: 电力段 0 次、充电段 0 次
    note: |
      现行口径把 V2G 列进电力业务线。本课程四段无任何依据。
      若公司确有 V2G 布局,证据须另找,不能引本材料背书。

