# 与其它框架文件的关系(供加载器与人工审阅核对)
consistency:
  impact_keys:                      # 必须与 l2_themescore/program_gate.py IMPACT_KEYS 一致
    fuel: 加油
    charging: 充电
    power: 电力_储能_V2G_交易
  known_conflicts:
    - with: _meta/framework/scoring.yaml
      issue: |
        scoring.yaml 的 business_blocks 是四个并列版块
        (fuel / charging / storage_vpp / power_trading),把电力拆成储能VPP 与电力交易两块。
        本文件依逐字稿判定电力是**一条**业务线,储能与虚拟电厂是其抓手且储能处于 hold。
        照四版块给权重会系统性高估储能类政策。**尚未裁决,以人工确认为准。**
    - with: _meta/framework/decision_framework.yaml
      issue: |
        decision_framework 源自 2026-04-10 的「滴滴能源-政策分析背景」,businesses 为三条,
        与本文件一致;但它**全仓无代码引用**,是死文件。若本文件上线,
        应明确二者主从:decision_framework 记业务定义,本文件记战略与相关性判据。
