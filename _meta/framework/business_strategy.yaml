# business_strategy.yaml — 公司业务战略画像(agent 可 load;**可替换**)
#
# 用途:政策链路各环节判断「这条政策与公司业务是否相关、有多相关」的依据。
#      L2 打分、L3 月刊、policy-qa 问答,凡涉及业务符合度,都应 load 本文件,
#      而不是各自在提示词里手写一份业务口径——手写副本走散的代价见 index.yaml
#      retired_tainted(2026-08-31 那次:四份手写口径三套词表,枚举里还留着退役类目)。
#
# **这是一个可配置项。** 战略会变;换战略 = 换本文件,不改代码:
#   1. 新画像写成同 schema 的新文件,profile_id 用新的,supersedes 指向被替换者
#   2. 旧文件 status 改 superseded,留在库里(可追溯历史打分是按哪版战略打的)
#   3. 消费方按 status: active 取件;同时 active 多于一份 = 配置错误,加载器应报错
#   见 services/policy-pipeline/docs/ 与 services/policy-qa/docs/ 的加载器说明。

schema_version: 1
profile_id: 2026-energy-strategy
status: active                    # active | superseded | draft
effective_from: 2026-08-31
supersedes: null                  # 首版
generated_at: 2026-08-31

source:
  kind: internal_course_transcript
  title: 桔子学苑【能源直播间】2026年能源战略解码
  captured_at: 2026-08-31
  doc: 00 背景资料/2026能源战略解码/          # 四份提要,每条结论带 [mm:ss]
  segments: [总解码 18.6min, 加油业务 24.6min, 充电业务 24.5min, 电力业务 20.7min]
  caveat: |
    ASR 本地转写。数字、人名、内部项目名不可直信,凡进入成品必须回原片核对。
    提要里的「0 次提及」是**证据为空**,不是**否定证据**——本文件用
    evidence: absent 与 low 区分这两件事,消费方不得把 absent 当 low 用。

# ── 证据强度约定 ──────────────────────────────────────────────────
# stated   逐字稿直接讲到该事项
# inferred 由讲明的业务动作反推,该事项本身逐字稿未点名 —— 采信时应降权
# absent   逐字稿完全未提及 —— **不构成"不相关"的依据**,只说明本材料无从判断
evidence_levels: [stated, inferred, absent]

# ══════════════════════════════════════════════════════════════════
businesses:

  - id: fuel
    zh: 加油
    weight_2026: 守成                # 全篇仅约 2.5 分钟,主讲人自称"high level"
    headline: 一安全,两增长          # 安全合规 + 流量拓展 + 下沉市场
    quantitative_targets: []          # 明确无定量目标
    model: |
      轻资产平台/聚合:平台不持有、不建设、不运营加油站,对接的全是既有商户
      (KA 大型连锁 + 民营油站,存量以民营为主)。准入方式多种,接入与结算形态
      有拉单、推单、B扫C、扫码、第三方渠道准入;KA 侧有代保管卡、挂账、
      第三方合作+支付接口、电子券。
    decision_variables:               # 改这些数,就改这条线的决策
      - 批发价 / 炼厂装车价(利润来自折扣空间,不是零售挂牌价)
      - 商户合规成本(安全、财税法)
      - KA 总部的对外合作与支付接口开放口径
      - 下沉城市的展业可行性
    scope_stated:
      - 客群描述为「路上行驶的车辆」「拐入油站的过路车」;存量燃油车向三四线迁移
      - 增长点二为下沉市场,主讲人承认是历史欠账(过往试过没坚持)
    scope_absent:                     # ⚠️ 材料空白,不是业务边界
      - 油品品种(汽油/柴油):四段合计 0 次。**现行「汽油为主」口径的出处不在本材料**
      - 车型(乘用车/重卡/商用车/货车):四段合计 0 次
      - 牌照与经营资质、危化品、环保、油库储运、建站用地:均 0 次

  - id: charging
    zh: 充电
    weight_2026: 战略重心            # 全篇权重最高,唯一给出双定量目标的业务
    headline: 直连增长 + 私家车(2C)运营升级
    quantitative_targets:
      - {metric: 年对年增长, value: ">40%", confidence: 数字待核, cite: "[08:19]"}
      - {metric: 份额, value: "35%", confidence: 数字待核, cite: "[08:22]"}
      - {metric: 供给侧转移窗口期, value: "2-3 年", confidence: 数字待核, cite: "[09:09]"}
    model: |
      连接/运营第三方商户场站的平台模式 + 特许模式为主(中等置信,依商户语言推断:
      平衡商户收益、联合商户治理、定点招商、按标准做流量分发)。另有「重资产」分支,
      2025 年中已出清,2026 打法里未出现。业务的组织单位是**城市**。
    decision_variables:
      - 建桩节奏与选址(城市级网络覆盖)
      - 充电服务费定价空间(各城市价格比;商户收益 vs 用户价格的平衡)
      - 场站侧电价结构(峰谷、需量、大工业电价适用)
      - 大功率/超充升级的成本与合规门槛
      - 行业标准与评级话语权(内部标准与外部国标/地标/团标竞合)
    scope_stated:
      - 车辆类型只有三类,全是乘用车:网约车(历史基本盘)、营运车、私家车(2026 重心)
      - 私家车 2C 运营被排为「今年最重要的战略,也没有之一」
      - 讲的全是**公共充电场站**;「快」作为体验维度被重点讲,对标闪充做大功率升级
    scope_absent:
      - 重卡/商用车/货车/干线/港口:四段合计 0 次(不是「占比小」,是未提及)
      - 目的地充电业态、私桩/居住区/随车配桩:0 次
      - 高速/服务区:0 次
      - 县域/农村场景:四段合计 0 次
      - 光储充放 / V2G / 换电:0 次,归电力线(见 not_business_lines)

  - id: power
    zh: 电力
    weight_2026: 建能力               # 长赛道、早期;主题是建能力不是要规模,明确要"给予耐心"
    headline: 售电与电力交易,现货是主战场
    quantitative_targets: []          # 无定量目标;仅定性"上一个台阶"
    model: |
      自营售电主体、按省逐省展业(推断:通篇第一人称售电公司口径,且方向是它代理别人
      入市;牌照/持牌/资质三词 0 次,未直接确认)。一级切分是**能力**——
      交易与算法 / 供应链 / 销售 / 团队。虚拟电厂与储能是「供应链」项下的抓手,
      **不是与电力交易并列的版块**。
    internal_split:                   # 若必须二分,逐字稿支持的是按客户场景
      by: 客户场景
      values: [充电场景, 工商业场景]
      not_by: 品种(储能/虚拟电厂 vs 电力交易)—— 与逐字稿不符,会系统性高估储能类政策
    decision_variables:
      - 目标省的现货规则与结算机制(决定"这个省进不进")
      - 中长期与现货的比例及偏差/反向考核上限(决定持仓结构)
      - 售电公司利润上限 / 收益分成 / 让利退还规定
      - 火电长协的签约与履约规则(供应链第一块,控风险最重要的能力)
      - 分布式新能源入市与聚合商准入门槛
    province_filter:                  # 同一份文件落在这些省,相关性显著更高
      entered: [湖南, 陕西]
      target_2026: [江苏, 浙江, 福建, 四川, 重庆, 湖北, 湖南, 陕西, 南网五省]
      confidence: 数字待核
    portfolio_status:
      电力现货: {status: 主战场, note: 自称"最核心的一个主战场"}
      中长期长协: {status: 在做}
      虚拟电厂聚合入市: {status: 在建能力, note: 约 40 秒篇幅,从属于供应链}
      储能: {status: hold, note: "因政策性峰谷价差要停而暂停,仅存量项目试点"}
      省间/输电权/电力期货: {status: 在看}
      居民侧售电: {status: 在看}
      海外: {status: 初步调研}
    scope_stated:
      - 充电是这条线的**负荷底盘、上游议价筹码与消纳出口**(基础量 200 亿度电/年,数字待核)
      - 电力现货市场的成长被当作这条业务成立的**唯一外部前提**
    scope_absent:
      - V2G / 车网互动:0 次
      - 绿电 / 绿证 / 碳交易:0 次
      - 需求响应 / 辅助服务 / 容量市场:0 次
      - 「充电站/充电桩」二词 0 次 —— 原文一律说「充电场景」「负荷」「商户」

# ══════════════════════════════════════════════════════════════════
# 明确不是业务线的东西。列在这里是为了**不必在提示词里写禁令**——
# 消费方渲染提示词时只渲染 businesses,本节只用于人工审阅与加载器校验。
not_business_lines:
  - id: intl
    zh: 国际化(墨西哥充电)
    why: 是充电业务的地理延伸,不是独立类目;且国内政策库对墨西哥本地法规无覆盖能力
  - id: swap
    zh: 换电
    why: 2025 回顾中出现一次(大湾区 200+ 站,数字待核),2026 章节完全未再提;存量相关、增量不相关

# ══════════════════════════════════════════════════════════════════
# 通用判据。这几条比下面的信号清单更耐用——信号会过时,判据不会。
relevance_rules:
  core_test: |
    一条政策是否「业务相关」,取决于它**是否改变本文件 decision_variables 里的任何一个数**。
    改变了 = 相关;只是与公司的判断同向、不改变任何在做的动作 = 不相关。
  high_form: |
    带**具体省份/城市** + 带**可代入模型的数值**(价格上限、分成比例、考核比例、补偿标准、
    准入门槛、生效日期)的**实施细则**。
  low_form: |
    全国性宏观框架、目标宣示、规划纲要、行业发展意见——不改变任何在做的动作。
  early_signal: |
    征求意见稿、规则修订预告、前置吹风**不因未生效而降权**。电力线明确把
    「至少希望能提前知道」写进交易团队职责,「早」本身就是价值。
  absent_is_not_low: |
    本文件 scope_absent 记的是**材料空白**。遇到落在空白维度上的政策,
    应标为「需人工裁定」,**不得自动判低相关**。

