# scoring.yaml — 政策重要性打分体系(agent 可 load)
# 来源: 00 背景资料/政策重要性打分体系.md (2026-04-14)
# 用途: ④消费层 LLM 给政策打分时 load 此文件;六维 + 公式 + 分级 + 行动分类
# 注: 行动分类(action_class)此处为打分体系原版(紧迫×实操 2×2)。
#     L3 月报另有一套 ⭐-based 显示版(见 report_blueprint.yaml action_display),
#     二者用同样 A/B/C/D 字母但定义不同 —— 见 index.yaml known_discrepancies。
schema_version: 1.0
source_doc: "00 背景资料/政策重要性打分体系.md"
generated_at: 2026-05-31

business_blocks:           # 四个核心业务版块,权重并列
  - {id: fuel, zh: 加油/油品, desc: 加油站油品零售}
  - {id: charging, zh: 充电/充换电, desc: 充电桩/充换电站建设运营}
  - {id: storage_vpp, zh: 储能/虚拟电厂, desc: 负荷侧储能资源聚合(调峰调频/容量市场/需求响应)}
  - {id: power_trading, zh: 电力交易, desc: 充电站作为市场主体(峰谷套利/V2G/绿电/现货)}
core_premise: "充电站不只是用电户,而是电力市场参与者;电力交易/储能/VPP 政策与充电建设同等核心"

quick_decision_tree:       # 第一层:30 秒判断要不要跟进
  - q: 是否影响四个核心业务版块?
    no: {score: "1-2", action: 了解, note: 趋势/合规类}
    yes_next: 是否强制执行(补贴/准入/处罚/电价调整)?
  - q: 是否强制执行?
    yes: {score: "4-5", action: 立即行动}
    no_next: 是否有硬性时间节点?
  - q: 是否有硬性时间节点?
    yes: {score: 4, action: 优先研究, note: 年内/近期}
    no: {score: 3, action: 深度评估, note: 长期方向}

dimensions:                # 第二层:六维打分
  D1:
    name: 业务关联度
    weight: 0.40
    scale:
      5: 直接针对核心业务(充电建设/运营补贴·加油站转型·油品流通·储能建设·V2G/车网互动·分时电价·电力现货·需求响应)
      4: 明确影响业务方向(设备更新·以旧换新·储能参与市场·碳价影响电价)
      3: 影响经营环境(能源转型·碳达峰·新型电力系统框架)
      2: 技术标准/规范(建设标准·设计规范·资质)
      1: 弱相关(光伏·建筑·宏观)
      0: 基本无关
  D2:
    name: 直接影响度
    weight: 0.40
    scale:
      5: 强制执行,不跟随违规/被罚/失补贴,直接影响充电成本或收入
      4: 明确指引,直接影响经营策略(电价调整·准入门槛)
      3: 规范约束,需调整流程或投入资源
      2: 参考价值
      1: 象征文件,无实质影响
  D3:
    name: 发布主体层级
    weight: 0.20
    scale:
      5: 两办·国务院
      4: 国家发改委·国家能源局·商务部·工信部
      3: 其他国务院组成部门(生态·财政·住建·金融监管总局)
      2: 国务院直属机构/地方省级政府
      1: 地方政府局部·行业协会
  D4:
    name: 紧迫性
    weight: 0           # 不进综合公式,用于行动分类
    scale: {5: 已生效或年内截止, 4: deadline 1-2 年内, 3: 有框架时间表近年落地, 2: 长期方向无硬节点, 1: 无时间约束}
  D5:
    name: 实操性
    weight: 0
    scale: {5: 有具体标准/金额/流程可直接操作, 4: 方向明确有配套细则, 3: 有框架需结合地方/企业细化, 2: 方向性缺执行细节, 1: 目标/愿景式无操作性}
  D6:
    name: 机会窗口
    weight: 0
    scale: {5: 早期布局先动有先发优势, 4: 政策窗口期仍可进入, 3: 已有先行者差异化仍有机会, 2: 市场接近饱和, 1: 窗口关闭}

importance_formula: "round(D1*0.40 + D2*0.40 + D3*0.20)"   # 范围 0-5
importance_levels:
  5: {zh: 核心政策, action: 一把手工程,全力督办}
  4: {zh: 重要政策, action: 分管领导主抓,制定行动方案}
  3: {zh: 参考政策, action: 部门研究,确定是否跟进}
  2: {zh: 边缘政策, action: 存档了解}
  1: {zh: 弱相关, action: 背景参考}

action_class:              # 行动分类(打分体系原版):D4紧迫 × D5实操 2×2
  matrix:
    紧迫_实操高: {code: A, zh: 立即行动}
    紧迫_实操低: {code: B, zh: 优先研究}
    不紧迫_实操高: {code: C, zh: 计划跟进}
    不紧迫_实操低: {code: D, zh: 持续跟踪}
  opportunity_modifier:    # D6 机会窗口修正
    "5-4": 行动分类向前跳一档(B→A)
    "2-1": 行动分类向后降一档(B→C)

value_tags:
  合规: 不跟随会违规/处罚/失资质
  机会: 存在新收入来源或新市场模式
  壁垒: 抢先行动可建竞争护城河
  趋势: 反映行业长期方向,战略布局参考

frontmatter_writeback:     # 政策元信息写法(供参考,LLM 输出落派生层非 raw)
  example: |
    重要性: 4
    行动分类: A
    价值标签: [合规, 机会]
    维度: {D1: 5, D2: 4, D3: 4, D4: 4, D5: 4, D6: 4}
